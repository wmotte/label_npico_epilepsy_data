t for 'A novel human Cdh1 mutation impairs anaphase-promoting complex/cyclosome (APC/C) activity resulting in microcephaly, psychomotor retardation, and epilepsy' on page 103.", "abstract": "This editorial highlights a study by Rodriguez, Sanchez-Moran et al. (2019) in the current issue of the Journal of Neurochemistry, in which the authors describe a microcephalic boy carrying the novel heterozygous de novo missense mutation c.560A> G; p.Asp187Gly in Cdh1/Fzr1 encoding the APC/C E3-ubiquitin ligase cofactor CDH1. A functional characterization of mutant APC/C<sup>CDH1</sup> confirms an aberrant division of neural progenitor cells, a condition known to determine the mouse brain cortex size. These data suggest that APC/C<sup>CDH1</sup> may contribute to the regulation of the human brain size.", "year": "2019", "journal": "Journal of neurochemistry", "label": "editorial_letter_commentary"}, {"pmid": "25254262", "title": "Reflections: Neurology and The Humanities. The case of the locked house. The finished mystery.", "abstract": "After the death in 2012 of Dr. Robert Joynt, who served Neurology® as CPC Section Editor, an unfinished manuscript was found on his computer. It would have been his sixth Sherlock Holmes pastiche. Intrigued by the story but deflated at the lack of an ending, the editors published the case in the September 10, 2013, issue of Neurology and requested that readers finish it. A panel of editors reviewed over 30 submissions and the top 4 were posted online and on the iPad. Readers voted online, on the iPad, and during the 2014 American Academy of Neurology Annual Meeting in Philadelphia. The winning coauthors are Peter A. Kempster, from Melbourne, and Andrew J. Lees, from London. The runners-up are Anonymous (ending 1), Gerald Honch (ending 2), and Clifton Gooch (ending 4). The editors thank all participants and voters. The rule on page 662 indicates where the winning ending begins.", "year": "2014", "journal": "Neurology", "label": "editorial_letter_commentary"}, {"pmid": "41067118", "title": "Preclinical common data elements: a practical guide for use in epilepsy research.", "abstract": "Although advancements in epilepsy research have yielded new insights into pathophysiology and therapeutic targets, there is an ongoing need for new treatments to combat ongoing pharmacoresistance or offer disease-modifying effects. Variation between preclinical epilepsy research laboratories in methods of data capture, endpoint characterization, and experimental procedures may represent a significant challenge to finding consensus for new information important to the field. Harmonization of data collection approaches by using common data elements (CDEs) within case report forms (CRFs) may aid in reproducibility of preclinical research. Ongoing efforts have expanded the availability of CDEs and CRFs across several research areas. However, establishing such data capture approaches may represent a significant logistical challenge, particularly for new investigators. This commentary provides guidance to implement these approaches, including key points for consideration and providing examples of CDEs and data collection best practices. Our goal is to aid investigators in establishing and utilizing CDEs as part of a developing research program. This guidance may also prove beneficial to established laboratories seeking to harmonize standard operating procedures with other laboratories. Finally, as much of the field of epilepsy research increasingly involves large data sets and multiple study sites, this review may shed light on key points of consideration and alignment across collaborating laboratories.", "year": "2025", "journal": "Epilepsy & behavior : E&B", "label": "editorial_letter_commentary"}, {"pmid": "19022349", "title": "Attenuation of epilepsy-induced brain damage in the temporal cortices of rats by exposure to LTP-patterned magnetic fields.", "abstract": "To test the feasibility that whole body exposure to structurally matched, physiologically patterned magnetic fields could reduce cellular injury within specific regions of the brain, young rats were seized with lithium and pilocarpine and then exposed to a sham field or to one of three computer-generated magnetic field patterns. They were digitized equivalents of the pulsed patterns of electric current known to produce long-term potential (LTP) in slices of hippocampus or entorhinal cortices. Histological analyses of their brains as adults indicated the earlier exposure to the LTP-patterned fields produced a robust reduction of damage within the primary and association areas of the right temporal cortices and the CA1/CA2 hippocampal fields. The results suggest physiologically patterned magnetic fields could be employed to target specific nuclei anywhere within the brain by matching intrinsic activity.", "year": "2009", "journal": "Neuroscience letters", "label": "animal_experimental_study"}, {"pmid": "38430092", "title": "Cardiac-Specific Deletion of Scn8a Mitigates Dravet Syndrome-Associated Sudden Death in Adults.", "abstract": "BACKGROUND: Sudden unexpected death in epilepsy (SUDEP) is a fatal complication experienced by otherwise healthy epilepsy patients. Dravet syndrome (DS) is an inherited epileptic disorder resulting from loss of function of the voltage-gated sodium channel, Na<sub>V</sub> 1.1, and is associated with particularly high SUDEP risk. Evidence is mounting that Na<sub>V</sub>s abundant in the brain also occur in the heart, suggesting that the very molecular mechanisms underlying epilepsy could also precipitate cardiac arrhythmias and sudden death. Despite marked reduction of Na<sub>V</sub> 1.1 functional expression in DS, pathogenic late sodium current (I<sub>Na,L</sub>) is paradoxically increased in DS hearts. However, the mechanisms by which DS directly impacts the heart to promote sudden death remain unclear. OBJECTIVES: In this study, the authors sought to provide evidence implicating remodeling of Na<sup>+</sup> - and Ca<sup>2+</sup> -handling machinery, including Na<sub>V</sub> 1.6 and Na<sup>+</sup>/Ca<sup>2+</sup>exchanger (NCX) within transverse (T)-tubules in DS-associated arrhythmias. METHODS: The authors undertook scanning ion conductance microscopy (SICM)-guided patch clamp, super-resolution microscopy, confocal Ca<sup>2+</sup> imaging, and in vivo electrocardiography studies in Scn1a haploinsufficient murine model of DS. RESULTS: DS promotes I<sub>Na,L</sub> in T-tubular nanodomains, but not in other subcellular regions. Consistent with increased Na<sub>V</sub> activity in these regions, super-resolution microscopy revealed increased Na<sub>V</sub> 1.6 density near Ca<sup>2+</sup>release channels, the ryanodine receptors (RyR2) and NCX in DS relative to WT hearts. The resulting I<sub>Na,L</sub> in these regions promoted aberrant Ca<sup>2+</sup> release, leading to ventricular arrhythmias in vivo. Cardiac-specific deletion of Na<sub>V</sub> 1.6 protects adult DS mice from increased T-tubular late Na<sub>V</sub> activity and the resulting arrhythmias, as well as sudden death. CONCLUSIONS: These data demonstrate that Na<sub>V</sub> 1.6 undergoes remodeling within T-tubules of adult DS hearts serving as a substrate for Ca<sup>2+</sup> -mediated cardiac arrhythmias and may be a druggable target for the prevention of SUDEP in adult DS subjects.", "year": "2024", "journal": "JACC. Clinical electrophysiology", "label": "animal_experimental_study"}, {"pmid": "23086472", "title": "Evaluation of the possible epileptogenic activity of ciprofloxacin: the role of Nigella sativa on amino acids neurotransmitters.", "abstract": "The neuroprotective effect of Nigella sativa (NS) on amino acid neurotransmitters alteration in pentylenetetrazole (PTZ) and ciprofloxacin (CFX) treated rats in different brain regions was examined. The oral administration of NS induced an elevation in aspartate and glutamate contents, whereas the levels of GABA and glycine were decreased. Furthermore, the treated groups with PTZ and CFX caused a decrease in aspartate, glutamate and total antioxidant capacity levels, while the concentrations of GABA and glycine were increased after 14 days. Moreover, the pre- and post-treatment with NS in PTZ and CFX treated rats return the levels of these parameters near control values. So, it could be concluded that the treatment with CFX induced imbalance between the excitatory and the inhibitory amino acids which may lead to the initiation of epileptic seizures and the treatment with NS was found to ameliorate these neurological defects which reflect its potent antiepileptic activity.", "year": "2013", "journal": "Neurochemical research", "label": "animal_experimental_study"}, {"pmid": "9582260", "title": "A role for the bilateral involvement of perirhinal cortex in generalized kindled seizure expression.", "abstract": "The perirhinal cortex (PRh) has been suggested as a substrate for the expression of generalized clonic seizures in the late stages of kindling development (stages 4-5). Using the induction of Fos as a marker of neuronal activation, the PRh region was investigated after kindling or nonkindling electrical stimulation. Nonkindling electrical stimulation of the PRh elicited stimulus-locked behaviors, without afterdischarge. These behaviors were characterized by rearing and bilateral forelimb clonus which were terminated upon electrical stimulus offset in half of the rats displaying this behavior (with the other half expressing self-sustained seizures). In these animals, Fos immunoreactivity was found throughout neocortical and subcortical structures in the hemisphere ipsilateral to the stimulating electrode. By contrast, Fos-immunoreactivity in the contralateral hemisphere was localized primarily in the PRh and frontal motor cortex. Likewise, similar patterns of Fos immunoreactivity were observed in both hemispheres of rats following kindling to one generalized clonic seizure from several limbic and paleocortical structures. These results suggest that the bilateral involvement of the PRh is critical in producing the bilateral behaviors associated with generalized clonic seizure expression. In support of this interpretation, infusion of 3 M KCl directly into the contralateral PRh of rats kindled to a single stage 4-5 (generalized clonic) seizure from the ipsilateral amygdala reduced seizure manifestations from a generalized clonic seizure (stage 4-5) to a unilateral clonic seizure (stage 3) without affecting measures of focal excitability. Taken together, these data indicate a role for the bilateral involvement of the PRh in generalized clonic seizure expression whether evoked from the naive or kindled state. These results further indicate that bilateral behaviors require the bilateral involvement of the structures necessary for the expression of these behaviors.", "year": "1998", "journal": "Experimental neurology", "label": "animal_experimental_study"}, {"pmid": "6762361", "title": "Conditioning and the kindling model of epilepsy.", "abstract": "Since the development of the kindling preparation there has been much speculation on the contribution of conditioning mechanisms in accounting for the phenomenon. Two recent reports have described attempts to establish conditioned responses utilizing the kindling model. We suggest that the conclusion of uncondition-ability asserted by Wyler & Heavner (1979) is not warranted because of serious misunderstandings relating to the concepts and techniques that are central to both neurophysiological and conditioning theory. We further suggest that the results of their retardation effect can be better interpreted as positive evidence for the successful establishment of conditioning. With respect to the findings by Janowsky et al. (1980), we regard their sample size (2 animals undergoing simultaneous kindling and conditioning and one animal beginning conditioning following kindling) as inadequate for a conclusive demonstration of the success they report. Both studies, however, are seen as substantive contributions, insofar as they introduce this important perspective in kindling research, that can be expected to occupy a major role in the future developments of basic and clinical epileptology.", "year": "1982", "journal": "The International journal of neuroscience", "label": "animal_experimental_study"}, {"pmid": "40465325", "title": "The Construction and Mechanism of SPCE/Cu<sub>2</sub>O@MWCNTs Electrochemical Sensor for Menthone Detection for Epileptic Seizures Prediction.", "abstract": "Prediction of seizures is critical for the effective management and treatment of epileptic disorders. The epileptic patients generates certain biomarker before the occurance of seizure, which are considered as the potential biomarkers for prediction. However, research on the detection of these biomarkers remains limited, and the detection process is still challenging. Herein, an electrochemical sensor for detecting menthone, a biomarker associated with epilepstic seizure is reported. The menthone electrochemical sensor is based on the screen-printed carbon electrode (SPCE) modified with a Cu<sub>2</sub>O@MWCNTs nanomaterial. The electrode exhibits the detection limit of 0.3 mM and the sensitivity of 88.243 µA·mM⁻<sup>1</sup>·cm⁻<sup>2</sup>. Additionally, the SPCE/Cu<sub>2</sub>O@MWCNTs electrode demonstrates a good linearship with menthone concentration in phosphate buffered saline​​ (PBS). Cell assay results further confirm the excellent biocompatibility of the SPCE/Cu<sub>2</sub>O@MWCNTs electrode, highlighting its potential for its utilization in the real biosamples. Through the mechanism study, the reaction mechanism between menthone and the sensing material is proposed. This electrode not only provides a reliable and cost-effective method for predicting epileptic seizures, thus paving the way for advancements in electrochemical biosensing technologies.", "year": "2025", "journal": "Advanced healthcare materials", "label": "in_vitro_study"}, {"pmid": "11128240", "title": "Assessment of drug concentrations in tears in therapeutic drug monitoring: I. Determination of valproic acid in tears by gas chromatography/mass spectrometry with EC/NCI mode.", "abstract": "A rapid and sensitive method for the quantitation of valproic acid in tears has been developed using gas chromatography/electron capture negative chemical ionization/mass spectrometry. Valproic acid was converted directly into its pentafluorobenzyl ester derivative without the need to perform any extraction from the biologic fluid. The concentrations in tears [C]t correlated very well with those of the free form in the plasma [Cf]p and those of the total form in the plasma [Cb+f]p. The ratios between valproic acid concentrations in tears and plasma were as follows: [C]t/[Cb+f]p = 0.10 +/- 0.02; [C]t/[Cf]p = 0.57 +/- 0.11. Ratios of [C]t/[Cb+f]p were in good agreement with previously published data.", "year": "2000", "journal": "Therapeutic drug monitoring", "label": "in_vitro_study"}, {"pmid": "17151229", "title": "Cellular mechanisms underlying antiepileptic effects of low- and high-frequency electrical stimulation in acute epilepsy in neocortical brain slices in vitro.", "abstract": "Approximately 30% of epilepsy patients suffer from drug-resistant epilepsy. Direct electrical stimulation of the epileptogenic zone is a potential new treatment modality for this devastating disease. In this study, we investigated the effect of two electrical stimulation paradigms, sustained low-frequency stimulation and short trains of high-frequency stimulation, on epileptiform discharges in neocortical brain slices treated with either bicuculline or magnesium-free extracellular solution. Sustained low-frequency stimulation (5-30 min of 0.1- to 5-Hz stimulation) prevented both interictal-like discharges and seizure-like events in an intensity-, frequency-, and distance-dependent manner. Short trains of high-frequency stimulation (1-5 s of 25- to 200-Hz stimulation) prematurely terminated seizure-like events in a frequency-, intensity-, and duration-dependent manner. Roughly one half the seizures terminated within the 100-Hz stimulation train (P < 0.01 compared with control), whereas the remaining seizures were significantly shortened by 53 +/- 21% (P < 0.01). Regarding the cellular mechanisms underlying the antiepileptic effects of electrical stimulation, both low- and high-frequency stimulation markedly depressed excitatory postsynaptic potentials (EPSPs). The EPSP amplitude decreased by 75 +/- 3% after 10-min, 1-Hz stimulation and by 86 +/- 6% after 1-s, 100-Hz stimulation. Moreover, partial pharmacological blockade of ionotropic glutamate receptors was sufficient to suppress epileptiform discharges and enhance the antiepileptic effects of stimulation. In conclusion, this study showed that both low- and high-frequency electrical stimulation possessed antiepileptic effects in the neocortex in vitro, established the parameters determining the antiepileptic efficacy of both stimulation paradigms, and suggested that the antiepileptic effects of stimulation were mediated mostly by short-term synaptic depression of excitatory neurotransmission.", "year": "2007", "journal": "Journal of neurophysiology", "label": "in_vitro_study"}, {"pmid": "7375936", "title": "Kindling induces long-lasting alterations in response of hippocampal neurons to elevated potassium levels in vitro.", "abstract": "The cellular basis of kindling was studied electrophysiologically with slices of guinea pig hippocampus. Normally, epileptiform activity can be induced in the slices only by combined exposure to elevated potassium levels and a chemical convulsant such as penicillin. In hippocampal slices from pentylenetetrazole-kindled animals, however, elevated potassium alone can induce seizures. These data suggest that kindling elicits long-term changes in neuronal excitability that may involve ionic mechanisms.", "year": "1980", "journal": "Science (New York, N.Y.)", "label": "in_vitro_study"}, {"pmid": "10841977", "title": "Modulation of epileptiform discharges in the rat limbic system in vitro by noradrenergic agents.", "abstract": "Application of bicuculline (20 microm) in a horizontal slice preparation of the rat limbic system induced epileptiform discharges ('bursts') that spread from the hippocampus to the entorhinal cortex (EC) and the basolateral amygdala (BLA). These bursts were time locked, with the CA3-CA2 regions discharging first at a 0.1+/-0. 008Hz (n=30 slices) frequency, followed after 27+/-3 ms by the superficial layers of the EC and after 44.3+/-3 ms by the BLA. Application of 50 microM noradrenaline (NA) for 4 min reduced the burst frequency to 40% of its initial value. Pharmacological study of NA action on burst frequency revealed that it consisted of a beta adrenoreceptor-mediated increase and an alpha(2) adrenoreceptor-mediated decrease of epileptiform bursting frequency.", "year": "2000", "journal": "Neuroscience letters", "label": "in_vitro_study"}, {"pmid": "27742667", "title": "Pathogenic variants in KCTD7 perturb neuronal K+ fluxes and glutamine transport.", "abstract": "Progressive myoclonus epilepsy is a heterogeneous group of disorders characterized by myoclonic and tonic-clonic seizures, ataxia and cognitive decline. We here present two affected brothers. At 9 months of age the elder brother developed ataxia and myoclonic jerks. In his second year he lost the ability to walk and talk, and he developed drug-resistant progressive myoclonus epilepsy. The cerebrospinal fluid level of glutamate was decreased while glutamine was increased. His younger brother manifested similar symptoms from 6 months of age. By exome sequencing of the proband we identified a novel homozygous frameshift variant in the potassium channel tetramerization domain 7 (KCTD7) gene (NM_153033.1:c.696delT: p.F232fs), which results in a truncated protein. The identified F232fs variant is inherited in an autosomal recessive manner, and the healthy consanguineous parents carry the variant in a heterozygous state. Bioinformatic analyses and structure modelling showed that KCTD7 is a highly conserved protein, structurally similar to KCTD5 and several voltage-gated potassium channels, and that it may form homo- or heteromultimers. By heterologous expression in Xenopus laevis oocytes, we demonstrate that wild-type KCTD7 hyperpolarizes cells in a K<sup>+</sup> dependent manner and regulates activity of the neuronal glutamine transporter SAT2 (Slc38a2), while the F232fs variant impairs K<sup>+</sup> fluxes and obliterates SAT2-dependent glutamine transport. Characterization of four additional disease-causing variants (R94W, R184C, N273I, Y276C) bolster these results and reveal the molecular mechanisms involved in the pathophysiology of KCTD7-related progressive myoclonus epilepsy. Thus, our data demonstrate that KCTD7 has an impact on K<sup>+</sup> fluxes, neurotransmitter synthesis and neuronal function, and that malfunction of the encoded protein may lead to progressive myoclonus epilepsy.", "year": "2016", "journal": "Brain : a journal of neurology", "label": "genetic_molecular_study"}, {"pmid": "31633782", "title": "Proteoglycan (Keratan Sulfate) Barrier in Developing Human Forebrain Isolates Cortical Epileptic Networks From Deep Heterotopia, Insulates Axonal Fascicles, and Explains Why Axosomatic Synapses Are Inhibitory.", "abstract": "Axons from deep heterotopia do not extend through U-fibers, except transmantle dysplasias. Keratan sulfate (KS) in fetal spinal cord/brainstem median septum selectively repels glutamatergic axons while enabling GABAergic commissural axons. Immunocytochemical demonstration of KS in neocortical resections and forebrain at autopsy was studied in 12 fetuses and neonates 9-41 weeks gestational age (GA), 9 infants, children, and adolescents and 5 patients with focal cortical dysplasias (FCD1a). From 9 to 15 weeks GA, no KS is seen in the cortical plate; 19-week GA reactivity is detected in the molecular zone. By 28 weeks GA, patchy granulofilamentous reactivity appears in extracellular matrix and adheres to neuronal somata with increasing intensity in deep cortex and U-fibers at term. Perifascicular KS surrounds axonal bundles of both limbs of the internal capsule and within basal ganglia from 9 weeks GA. Thalamus and globus pallidus exhibit intense astrocytic reactivity from 9 weeks GA. In FCD1a, U-fiber reactivity is normal, discontinuous or radial. Ultrastructural correlates were not demonstrated; KS is not electron-dense. Proteoglycan barrier of the U-fiber layer impedes participation of deep heterotopia in cortical epileptic networks. Perifascicular KS prevents aberrant axonal exit from or entry into long and short tracts. KS adhesion to neuronal somatic membranes may explain inhibitory axosomatic synapses.", "year": "2019", "journal": "Journal of neuropathology and experimental neurology", "label": "genetic_molecular_study"}, {"pmid": "25366750", "title": "Genomic analysis of the interleukin-1β-511 and interleukin-6-174 gene polymorphisms in Turkish patients with epilepsy.", "abstract": "In this study, we examined the frequency of polymorphisms in the interleukin (IL) genes IL-1β-511 and IL-6-174 in patients with epilepsy as well as a control group in Kars, Turkey. A total of 100 patients diagnosed with epilepsy and 100 nonepileptic subjects as a control group were examined. Peripheral blood samples were acquired from patients and control subjects for DNA extraction. The target region was amplified using polymerase chain reaction and digested using the restriction enzymes SfaNI and AvaI. Restriction products were extracted from agarose gel electrophoresis and polymorphisms were analyzed using gel images. For IL-1β, the most common genotype among the epilepsy group was the CT genotype with a 62% frequency; the T allele was the most common allele with a frequency of 34%. Among the control group, however, the CT genotype showed a frequency of 25% and the T allele had a 22% frequency. For IL-6-174, among the epilepsy group, the GG genotype prevalence was approximately 42% and G allele prevalence was 46%. The GG genotype was approximately 50% and the G allele was 53% in the control group. Thus, changes in the allele frequency of the T allele of IL-1β-174 may be associated with epilepsy. However, there was no significant difference for the G allele frequency of IL-6-511. A larger sample size should be examined to verify these relationships, which could help to improve the clinical diagnosis and treatment of epilepsy.", "year": "2014", "journal": "Genetics and molecular research : GMR", "label": "genetic_molecular_study"}, {"pmid": "15009221", "title": "Evidence for linkage between juvenile myoclonic epilepsy-related idiopathic generalized epilepsy and 6p11-12 in Dutch families.", "abstract": "PURPOSE: Previous linkage studies provided evidence for juvenile myoclonic epilepsy (JME) susceptibility loci at 6p11-12, HLA-6p21.3 region, 15q14, and 5q34. These results indicate locus heterogeneity or interpopulation differences, thus underlining the importance of replication studies. METHODS: We describe a replication linkage study of the 6p-q13 region in 18 families ascertained from JME probands of Dutch descent. In the presence of heterogeneity, the definition of the disease status may be crucial, and we therefore used two disease phenotypes: narrow [JME/idiopathic generalized epilepsy (IGE)-\"only\"] and broad (JME/IGE-plus-fast EEG background activity). RESULTS: We found evidence of linkage at 6p11-12 in multipoint analyses (p < 0.01 in a replication study) for both these disease definitions. Analysis of this region, assuming heterogeneity and autosomal dominant inheritance with a conservative 60% of penetrance, gave a maximum multipoint parametric lod score of 2.07 at D6S1573 for the narrow phenotype and peaked at 2.53 between D6S1623 and D6S1573 for the broad phenotype. The p value for nonparametric linkage reached 0.0013 for the narrow phenotype and 0.0010 for the broad. Significant exclusion (lod score <or=2) was found for the HLA region and for 10 to 30 cM telomeric to HLA. Our results provide evidence for a susceptibility locus for JME/IGE-plus-fast EEG background activity at 6p11-12. CONCLUSIONS: Additionally, by using a narrow definition, we were able to confirm previous evidence for a JME-IGE locus at this location.", "year": "2004", "journal": "Epilepsia", "label": "genetic_molecular_study"}, {"pmid": "22738016", "title": "Epileptic encephalopathies of the Landau-Kleffner and continuous spike and waves during slow-wave sleep types: genomic dissection makes the link with autism.", "abstract": "PURPOSE: The continuous spike and waves during slow-wave sleep syndrome (CSWSS) and the Landau-Kleffner (LKS) syndrome are two rare epileptic encephalopathies sharing common clinical features including seizures and regression. Both CSWSS and LKS can be associated with the electroencephalography pattern of electrical status epilepticus during slow-wave sleep and are part of a clinical continuum that at its benign end also includes rolandic epilepsy (RE) with centrotemporal spikes. The CSWSS and LKS patients can also have behavioral manifestations that overlap the spectrum of autism disorders (ASD). An impairment of brain development and/or maturation with complex interplay between genetic predisposition and nongenetic factors has been suspected. A role for autoimmunity has been proposed but the pathophysiology of CSWSS and of LKS remains uncharacterized. METHODS: In recent years, the participation of rare genomic alterations in the susceptibility to epileptic and autistic disorders has been demonstrated. The involvement of copy number variations (CNVs) in 61 CSWSS and LKS patients was questioned using comparative genomic hybridization assays coupled with validation by quantitative polymerase chain reaction (PCR). KEY FINDINGS: Whereas the patients showed highly heterogeneous in genomic architecture, several potentially pathogenic alterations were detected. A large number of these corresponded to genomic regions or genes (ATP13A4, CDH9, CDH13, CNTNAP2, CTNNA3, DIAPH3, GRIN2A, MDGA2, SHANK3) that have been either associated with ASD for most of them, or involved in speech or language impairment, or in RE. Particularly, CNVs encoding cell adhesion proteins (cadherins, protocadherins, contactins, catenins) were detected with high frequency (≈20% of the patients) and significant enrichment (cell adhesion: p = 0.027; cell adhesion molecule binding: p = 9.27 × 10(-7)). SIGNIFICANCE: Overall our data bring the first insights into the possible molecular pathophysiology of CSWSS and LKS. The overrepresentation of cell adhesion genes and the strong overlap with the genetic, genomic and molecular ASD networks, provide an exciting and unifying view on the clinical links among CSWSS, LKS, and ASD.", "year": "2012", "journal": "Epilepsia", "label": "genetic_molecular_study"}, {"pmid": "5009769", "title": "Magnetoencephalography: detection of the brain's electrical activity with a superconducting magnetometer.", "abstract": "Measurements of the brain's magnetic field, called magnetoencephalograms (MEG's), have been taken with a superconducting magnetometer in a heavily shielded room. This magnetometer has been adjusted to a much higher sensitivity than was previously attainable, and as a result MEG's can, for the first time, be taken directly, without noise averaging. MEG's are shown, simultaneously with the electroencephalogram (EEG), of the alpha rhythm of a normal subject and of the slow waves from an abnormal subject. The normal MEG shows the alpha rhythm, as does the EEG, when the subject's eyes are closed; however, this MEG also shows that higher detector sensitivity, by a factor of 3, would be necessary in order to clearly show the smaller brain events when the eyes are open. The abnormal MEG, including a measurenment of the direct-current component, suggests that the MEG may yield some information which is new and different from that provided by the EEG.", "year": "1972", "journal": "Science (New York, N.Y.)", "label": "uncertain"}, {"pmid": "23627656", "title": "Automated diagnosis of epilepsy using CWT, HOS and texture parameters.", "abstract": "Epilepsy is a chronic brain disorder which manifests as recurrent seizures. Electroencephalogram (EEG) signals are generally analyzed to study the characteristics of epileptic seizures. In this work, we propose a method for the automated classification of EEG signals into normal, interictal and ictal classes using Continuous Wavelet Transform (CWT), Higher Order Spectra (HOS) and textures. First the CWT plot was obtained for the EEG signals and then the HOS and texture features were extracted from these plots. Then the statistically significant features were fed to four classifiers namely Decision Tree (DT), K-Nearest Neighbor (KNN), Probabilistic Neural Network (PNN) and Support Vector Machine (SVM) to select the best classifier. We observed that the SVM classifier with Radial Basis Function (RBF) kernel function yielded the best results with an average accuracy of 96%, average sensitivity of 96.9% and average specificity of 97% for 23.6 s duration of EEG data. Our proposed technique can be used as an automatic seizure monitoring software. It can also assist the doctors to cross check the efficacy of their prescribed drugs.", "year": "2013", "journal": "International journal of neural systems", "label": "uncertain"}, {"pmid": "18670051", "title": "Impact of metal artefacts due to EEG electrodes in brain PET/CT imaging.", "abstract": "The goal of this study is to investigate the impact of electroencephalogram (EEG) electrodes on the visual quality and quantification of (18)F-FDG PET images in neurological PET/CT examinations. For this purpose, the scans of 20 epilepsy patients with EEG monitoring were used. The CT data were reconstructed with filtered backprojection (FBP) and with a metal artefact reduction (MAR) algorithm. Both data sets were used for CT-based attenuation correction (AC) of the PET data. Also, a calculated AC (CALC) technique was considered. A volume of interest (VOI)-based analysis and a voxel-based quantitative analysis were performed to compare the different AC methods. Images were also evaluated visually by two observers. It was shown with simulations and phantom measurements that from the considered AC methods, the MAR-AC can be used as the reference in this setting. The visual assessment of PET images showed local hot spots outside the brain corresponding to the locations of the electrodes when using FBP-AC. In the brain, no abnormalities were observed. The quantitative analysis showed a very good correlation between PET-FBP-AC and PET-MAR-AC, with a statistically significant positive bias in the PET-FBP-AC images of about 5-7% in most brain voxels. There was also good correlation between PET-CALC-AC and PET-MAR-AC, but in the PET-CALC-AC images, regions with both a significant positive and negative bias were observed. EEG electrodes give rise to local hot spots outside the brain and a positive quantification bias in the brain. However, when diagnosis is made by mere visual assessment, the presence of EEG electrodes does not seem to alter the diagnosis. When quantification is performed, the bias becomes an issue especially when comparing brain images with and without EEG monitoring.", "year": "2008", "journal": "Physics in medicine and biology", "label": "uncertain"}, {"pmid": "873665", "title": "The significance of the simultaneous determination of carbamazepine and its 10,11-epoxide from plasma and human erythrocytes.", "abstract": "The distribution of carbamazepine and its 10,11-epoxide derivative into human erythrocytes was studied in child and adult epileptics on long-term therapy. Firstly, it was found that carbamazepine penetrated into erythrocytes, where the mean concentration of the drug was in rational agreement with the unbound fraction in plasma. Secondly, the relationship between the percentage of carbamazepine concentration in red cell and the drug level in plasma resembled the relationship between the percentage of unbound carbamazepine and the drug level in plasma, which relation has been described in literature recently. This similarity favors this: by determining the ratio of carbamazepine in red cells to the drug in plasma, the unbound fraction can be deduced. Thirdly, carbamazepine-10,11-epoxide was not found in red cells.", "year": "1977", "journal": "International journal of clinical pharmacology and biopharmacy", "label": "uncertain"}, {"pmid": "36821567", "title": "Deep learning for the diagnosis of mesial temporal lobe epilepsy.", "abstract": "OBJECTIVE: This study aimed to enable the automatic detection of the hippocampus and diagnose mesial temporal lobe epilepsy (MTLE) with the hippocampus as the epileptogenic area using artificial intelligence (AI). We compared the diagnostic accuracies of AI and neurosurgical physicians for MTLE with the hippocampus as the epileptogenic area. METHOD: In this study, we used an AI program to diagnose MTLE. The image sets were processed using a code written in Python 3.7.4. and analyzed using Open Computer Vision 4.5.1. The deep learning model, which was a fine-tuned VGG16 model, consisted of several layers. The diagnostic accuracies of AI and board-certified neurosurgeons were compared. RESULTS: AI detected the hippocampi automatically and diagnosed MTLE with the hippocampus as the epileptogenic area on both T2-weighted imaging (T2WI) and fluid-attenuated inversion recovery (FLAIR) images. The diagnostic accuracies of AI based on T2WI and FLAIR data were 99% and 89%, respectively, and those of neurosurgeons based on T2WI and FLAIR data were 94% and 95%, respectively. The diagnostic accuracy of AI was statistically higher than that of board-certified neurosurgeons based on T2WI data (p = 0.00129). CONCLUSION: The deep learning-based AI program is highly accurate and can diagnose MTLE better than some board-certified neurosurgeons. AI can maintain a certain level of output accuracy and can be a reliable assistant to doctors.", "year": "2023", "journal": "PloS one", "label": "uncertain"}];
const PICO_DATA  = [{"pmid": "17049927", "title": "Preventing depression in adolescents with epilepsy.", "abstract": "PURPOSE: The goal of the work described in this article was to test the possibility of preventing depression among adolescents with epilepsy. METHODS: Adolescents with newly diagnosed epilepsy (104 patients) were screened for depression. The risk for depression was increased in 30 (28.8%) patients (mean age 17.4, 60% females) who were randomized into two equal treatment groups: (1) cognitive-behavioral intervention (CBI) group and (2) treatment with counseling as usual (TAU) group. The Beck Depression Inventory (BDI), Center for Epidemiological Study on Depression (CES-D) scale, Hamilton Depression Scale (HAMD), and Quality of Life in Epilepsy Inventory (QOLIE-31) were administered at baseline and during the 9-month follow-up. RESULTS: Initial BDI and HAMD scores for the two groups were comparable. Depression was diagnosed during follow-up in three patients in the TAU group. Subthreshold depressive disorder significantly improved at follow-up in the BCI group compared with the TAU group (P<0.05). QOLIE-31 Total scores significantly correlated with both mood improvement and seizure-free state.", "year": "2006", "journal": "Epilepsy & behavior : E&B", "label": "randomized_controlled_trial", "P": "Adolescents with newly diagnosed epilepsy and increased risk for depression (mean age 17.4, 60% females)", "I": "Cognitive-behavioral intervention (CBI)", "C": "Treatment as usual (TAU) counseling", "O": "Incidence of diagnosed depression, improvement in subthreshold depressive disorder, and Quality of Life in Epilepsy Inventory (QOLIE-31) scores", "N": "30 (CBI=15, TAU=15)"}, {"pmid": "1103552", "title": "A double blind study of the influence of dipropylacetate on behaviour.", "abstract": "The influence of dipropylacetate (D.P.A.) on behaviour was studied in 20 patients using a double blind cross over trial. 5 patients were rated as improved on D.P.A., 6 on placebo, 3 as deteriorated on D.P.A., 3 on placebo, 12 as unchanged on D.P.A. and 11 on placebo. This study gives us no reason to believe that D.P.A. exerts a psychotropic action within 3 weeks which is better than a placebo effect.", "year": "1975", "journal": "Acta neurologica Scandinavica. Supplementum", "label": "randomized_controlled_trial", "P": "20 patients", "I": "Dipropylacetate (D.P.A.)", "C": "Placebo", "O": "Behavioral improvement, deterioration, or unchanged status", "N": "20"}, {"pmid": "26875743", "title": "Generic-to-generic lamotrigine switches in people with epilepsy: the randomised controlled EQUIGEN trial.", "abstract": "BACKGROUND: Patients and clinicians share concerns that generic drug substitution might lead to loss of efficacy or emergence of adverse events. In this trial, we assessed US Food and Drug Administration (FDA) bioequivalence standards by studying the effects of switching between two disparate generic immediate-release lamotrigine products in patients with epilepsy. METHODS: The Equivalence among Generic Antiepileptic Drugs (EQUIGEN) chronic-dose study was a randomised, double-blind, crossover study that enrolled adults (aged ≥18 years) with epilepsy from six epilepsy centres at academic institutions across the USA who were receiving immediate-release lamotrigine dosed at 100 mg, 200 mg, 300 mg, or 400 mg twice daily. Eligible patients were randomly allocated (1:1) to one of two treatment sequences (sequence 1 or sequence 2), comprising four study periods of 14 days each. During each 14-day treatment period, patients received balanced doses of an oral generic lamotrigine product every 12 h (200-800 mg total, identical to lamotrigine dose prior to study enrolment); after each 14-day period, patients were crossed over to receive the other generic product. Computer-based randomisation was done using random permuted blocks of size two or four for each site to prevent sequence predictability. Both patients and study personnel were masked to the generic products selected, their predicted exposure (ie, \"high\" vs \"low\"), and their group allocation. The primary outcome of this trial was bioequivalence between the generic products, which was assessed at the end of the study through a comparison of maximum plasma concentration (Cmax) and area under the concentration-time curve (AUC) for each product in the analysis population (all patients who completed all four treatment periods). Bioequivalence was established if the 90% CIs of the ratios of these two parameters for the two products were within equivalence limits (80-125%) in the analysis population. This study is registered with ClinicalTrials.gov\\, number NCT01713777. FINDINGS: Between April 25, 2013, and Aug 12, 2014, 35 eligible patients were enrolled and randomly assigned to treatment sequence 1 (n=15) or treatment sequence 2 (n=20). 33 patients completed all four treatment periods and were included in the primary outcome analysis. The 90% CIs of the ratios of both Cmax and AUC were within equivalence limits (AUC 90% CI 98-103, Cmax 90% CI 99-105), showing that lamotrigine exposures were equivalent between the generic products. No significant changes in seizure frequency or adverse events were recorded. No deaths, study-related serious adverse events, or changes in clinical laboratory values or vital signs occurred during this study. INTERPRETATION: Disparate generic lamotrigine products in patients with epilepsy showed bioequivalence with no detectable difference in clinical effects, confirming that US Food and Drug Administration bioequivalence standards are appropriate. FUNDING: American Epilepsy Society, Epilepsy Foundation, and US Food and Drug Administration.", "year": "2016", "journal": "The Lancet. Neurology", "label": "randomized_controlled_trial", "P": "Adults (aged ≥18 years) with epilepsy receiving immediate-release lamotrigine dosed at 100 mg, 200 mg, 300 mg, or 400 mg twice daily", "I": "Switching between two disparate generic immediate-release lamotrigine products (balanced doses of oral generic lamotrigine product every 12 h, 200-800 mg total)", "C": "Switching between the other generic product (crossover design)", "O": "Bioequivalence between generic products (comparison of maximum plasma concentration (Cmax) and area under the concentration-time curve (AUC))", "N": "35 (treatment sequence 1=15, treatment sequence 2=20)"}, {"pmid": "25358723", "title": "Impact of a pharmaceutical care programme on health-related quality of life among women with epilepsy: a randomised controlled trial (IPHIWWE study).", "abstract": "BACKGROUND: Epilepsy is a complex chronic disorder which affects health-related quality of life (HRQOL), especially in women. METHODS: This study is a pragmatic randomised controlled trial involving women with epilepsy (WWE) over 18 years of age. RESULTS: One hundred eighty-two WWE entered the study and 144 (79.1%) completed it. The t-test for comparing the final QOLIE-31 scores between groups yielded a t = -2.166 and confidence interval (CI) (95%): -10.125; -0.4625, p-value =0.0319. The change (Δ) in the QOLIE-31 score for the IG was 12.45 points (p-value <0.001) and for the control group it was 2.61 (p-value =0.072). With 10.7 as the minimally important change we found a relative risk of 2.17 (CI: 1.37; 3.43) and a number needed to treat (NNT) of 3.5. CONCLUSIONS: The study demonstrated that the application of a pharmaceutical care programme significantly improves HRQOL in WWE. The NNT we found allows a recommendation to implement the PC programme for the additional benefit that would be obtained in patients' HRQOL. TRIAL REGISTRATION: Current Controlled Trials ISRCTN46864306 IPHIWWE study.", "year": "2014", "journal": "Health and quality of life outcomes", "label": "randomized_controlled_trial", "P": "Women with epilepsy (WWE) over 18 years of age", "I": "Pharmaceutical care programme", "C": "Not specified (implied standard care or no programme)", "O": "Health-related quality of life (HRQOL) measured by QOLIE-31 scores", "N": "182 (completed=144)"}, {"pmid": "2384080", "title": "Suppression of inter-ictal spikes by CM40907. A double-blind placebo-controlled investigation and review of spike counting as a methodology for assessing the antiepileptic effect of drugs.", "abstract": "To assess the efficacy of CM40907--a new antiepileptic drug--in suppressing inter-ictal spikes, 6 patients with severe intractable epilepsy and frequent spikes in their inter-ictal EEGs were entered in a double-blind placebo-controlled trial. The results show that CM40907 is efficacious in reducing spike counts in the first hour after oral administration. The results of the study are presented and inter-ictal spike counting as a method is discussed.", "year": "1990", "journal": "Epilepsy research", "label": "randomized_controlled_trial", "P": "6 patients with severe intractable epilepsy and frequent inter-ictal spikes", "I": "CM40907 oral administration", "C": "Placebo", "O": "Reduction in inter-ictal spike counts in the first hour after administration", "N": "6 (CM40907=3, placebo=3)"}, {"pmid": "18715488", "title": "Teaching doctors how to diagnose paroxysmal events: a comparison of two educational methods.", "abstract": "OBJECTIVES: Two educational methods, facilitated case discussion and a computerised tutorial, were compared for teaching about childhood epilepsy. We used a comprehensive and clinically relevant assessment method to evaluate the hypothesis that a computerised tutorial more effectively increases knowledge acquisition than a facilitated case discussion. METHODS: Paediatric trainees (n = 66) were arbitrarily allocated to facilitated case discussion or computerised tutorial. The analysis of paroxysmal events was taught by the same teacher, using a standardised protocol and principles of active learning. Outcome measures included knowledge acquisition, clinical confidence and usefulness pre- and post-teaching, and at 3 months follow-up. RESULTS: Computerised tutorial participants scored significantly higher on knowledge acquisition post-teaching. There was gain in clinical confidence in both modalities post-teaching which did not differ between the groups. Confidence and knowledge were not related post-teaching. Both groups found the teaching relevant to clinical practice. However, facilitated case discussion participants rated the session as more enjoyable, and more useful in reinforcing and acquiring knowledge, and felt more motivated for further learning. At 3 months follow-up, participants in both modalities showed significant increases in knowledge acquisition, with no difference between modalities. CONCLUSIONS: The computerised tutorial more effectively imparted knowledge immediately post-teaching. However, facilitated case discussion is the preferred modality in terms of participant enjoyment and perceived usefulness.", "year": "2008", "journal": "Medical education", "label": "clinical_trial_non_randomized", "P": "Paediatric trainees", "I": "Computerised tutorial for teaching about childhood epilepsy", "C": "Facilitated case discussion", "O": "Knowledge acquisition, clinical confidence, usefulness, enjoyment, motivation for further learning", "N": "66 (facilitated case discussion=<n>, computerised tutorial=<n>)"}, {"pmid": "16473557", "title": "The impact of levetiracetam on challenging behavior.", "abstract": "An observational longitudinal design was employed to evaluate whether treatment with the antiepileptic drug levetiracetam (LEV) adversely impacts behavior in people with intellectual disabilities and/or acquired brain damage. Thirty-five adults were assessed once off the drug and once when on LEV therapy, with a 2-month interval between assessments. Behaviors were rated using an adaptation of the Yale-Brown Obsessive Compulsive Scale and the Challenging Behaviour Scale. Challenging behaviors were rated as more frequent and severe when individuals were taking LEV. Behavioral worsening was not related to better seizure control or increased levels of engagement in activities. Families and professionals need to be aware of the potential reversible adverse effects of this drug.", "year": "2006", "journal": "Epilepsy & behavior : E&B", "label": "clinical_trial_non_randomized", "P": "Adults with intellectual disabilities and/or acquired brain damage", "I": "Levetiracetam (LEV) therapy", "C": "Off the drug (baseline)", "O": "Frequency and severity of challenging behaviors", "N": "35"}, {"pmid": "8684994", "title": "[Computerized stabilometry in the monitoring of antiepileptic therapy in children].", "abstract": "Computerized stabilometry is an useful test to monitor postural effects of anticonvulsant therapy in adults. Our study was carried out on 65 epileptic children: 51 were treated with CBZ or PHT or VPA or PB in monotherapy, and 14 were not on therapy, in the aim to observe abnormalities of postural control in pediatric population. Computerized stabilometry has to be considered auxiliary monitoring to evaluate toxic effect of anticonvulsant therapy in children.", "year": "1995", "journal": "La Pediatria medica e chirurgica : Medical and surgical pediatrics", "label": "clinical_trial_non_randomized", "P": "Epileptic children", "I": "CBZ, PHT, VPA, or PB monotherapy", "C": "No therapy", "O": "Postural control abnormalities and toxic effects of anticonvulsant therapy", "N": "65 (monotherapy=51, no therapy=14)"}, {"pmid": "15988081", "title": "[Mexidol in treatment of children with generalized epilepsy and febrile seizures].", "abstract": "The aim of our study was to estimate the role of Mexidol in ceasing of epileptic fits and improving electroencephalographic (EEG) pathological patterns in children. 120 patients with generalized epilepsy (from 4 to 16 years old) were investigated. All patients were treated by Depakin chrono 30 mg/kg. Children were divided into 2 groups: 1st--study group consisted of 60 children with combined treatment with Depakin and Mexidol (5 mg/kg). In the control group (60 children) treatment was performed only by Depakin. 100 children with the first episode of febrile seizures (from 6 months to 4 years old) were investigated. 50 children composed the study group with monotheraphy by Mexidol and 50 patients--the control group, without any treatment. The EEG examination was done by computer EEG Topography \"Brain Surveyor Saico\". Using Depakin in combination with Mexidol in the study group of patients with generalized epilepsy, improvement of clinical picture of disease and normalization of EEG patterns in 93% of cases has been observed. In the study group of patients with febrile seizures, normalization of EEG pathological patterns was observed in 82% cases and in 18% its improvement was seen. The relapse of seizures at high temperature was observed in 3 patients. In control group EEG patterns were improved only in 20%, in 48% no positive effect was observed and in 41% the worsening of EEG findings was seen. The relapse of febrile seizures was observed in 26 cases. Mexidol titrated to the target doze of 5mg/kg may be effective in combination with Depakin for treatment of patients with generalized epilepsy and as monotherapy in patients with first episode of febrile seizures.", "year": "2005", "journal": "Georgian medical news", "label": "clinical_trial_non_randomized", "P": "Children with generalized epilepsy (4-16 years old) and children with the first episode of febrile seizures (6 months-4 years old)", "I": "Mexidol (5 mg/kg) combined with Depakin chrono (30 mg/kg) for generalized epilepsy; Mexidol monotherapy for first episode of febrile seizures", "C": "Depakin chrono (30 mg/kg) alone for generalized epilepsy; no treatment for first episode of febrile seizures", "O": "Cessation of epileptic fits, improvement/normalization of EEG pathological patterns, relapse of seizures", "N": "220 (generalized epilepsy study=60, generalized epilepsy control=60, febrile seizures study=50, febrile seizures control=50)"}, {"pmid": "38671370", "title": "An observational time-series study on the behavioral effects of adjunctive artisanal cannabidiol use by adults with treatment resistant epilepsies.", "abstract": "BACKGROUND: For approximately 30% of people with epilepsy, seizures are not well-controlled by anti-seizure medication (ASM). This condition, called treatment resistant epilepsy (TRE), is associated with increased morbidity and mortality, and substantially impacts the quality of life of both the individual and their family. Non-responsiveness to ASMs leads many people with TRE to seek alternative therapies, such as cannabinoid-based medication, particularly cannabidiol (CBD), with or without medical or professional advice. This is due in part to widespread reporting in the media about the benefits of CBD for seizures in some forms of epilepsy. METHODS: Adults with TRE, opting to add CBD to their existing treatment regime, completed this prospective, observational, longitudinal, quasi-experimental, time-series study. We hypothesized that adjunctive CBD use would positively impact participants' quality of life and psychological well-being in comparison to a baseline period without CBD use. Participants were followed for a period of approximately six months - for approximately one month of baseline prior to the initiation of CBD use and approximately five months after the initiation of CBD use. Participants provided urine samples and completed behavioral questionnaires that assessed quality of life, anxiety/depression, and adverse events during baseline and at two times during CBD use. RESULTS: Complete case analyses (n = 10) showed a statistically significant improvement in quality of life, a statistically significant decrease in anxiety symptoms, and a statistically significant decrease in the experience of adverse events over time (p < 0.05). Improvements noted in the experience of depression symptoms did not reach statistical significance. Urinalysis revealed the majority of participants had no CBD/metabolites in their system at the beginning of the study, and confirmed the presence of CBD/metabolites in participants' urine after CBD was added to their treatment regime. Analysis of missing data using multiple imputation supported the findings of the complete case analysis. INTERPRETATION: For a small group of individuals with TRE of varying etiologies, adjunctive use of artisanal CBD was associated with improvements in the behavioral and psychological symptoms of TRE, as well as improved medication tolerability.", "year": "2024", "journal": "BMC neurology", "label": "clinical_trial_non_randomized", "P": "Adults with treatment resistant epilepsy (TRE) of varying etiologies", "I": "Adjunctive artisanal cannabidiol (CBD) use", "C": "Baseline period without CBD use", "O": "Improvement in quality of life, decrease in anxiety symptoms, decrease in adverse events, and improvement in depression symptoms", "N": "10"}, {"pmid": "10964076", "title": "Gabapentin-induced modulation of interictal epileptiform activity related to different vigilance levels.", "abstract": "OBJECTIVES: Gabapentin (GBP) is a novel antiepileptic drug (AED), currently used as add-on therapy in patients with partial seizures. Similar to other AEDs, little is known about its effects on nocturnal sleep, despite the strict relationship between sleep and epileptic discharges. The aim of our study was to evaluate the effects of chronic therapy with GBP on both nocturnal sleep and on interictal epileptiform abnormalities (IEA) in relation to the different sleep stages. METHODS: Eighteen patients affected by partial seizures resistant to common AEDs were submitted to nocturnal polygraphic recordings under baseline conditions and after 4 months of add-on GBP treatment. RESULTS: We observed a significant increase in unilateral/focal IEA during light NREM sleep and a significant reduction in bilateral/diffuse IEA during wakefulness after sleep onset (WASO) with respect to the baseline condition. A significant increase in REM sleep and slow wave sleep (SWS) associated with a reduction in the number of awakenings and Stage 1 was also observed after GBP chronic therapy. CONCLUSIONS: GBP therapy improves the sleep pattern of epileptic patients and it seems to modulate the expression of IEA with different effects in relation to the various vigilance levels.", "year": "2000", "journal": "Clinical neurophysiology : official journal of the International Federation of Clinical Neurophysiology", "label": "open_label_trial", "P": "Eighteen patients with partial seizures resistant to common AEDs", "I": "Add-on Gabapentin (GBP) treatment for 4 months", "C": "Baseline conditions", "O": "Changes in nocturnal sleep patterns (REM sleep, SWS, awakenings, Stage 1) and interictal epileptiform abnormalities (IEA) in relation to vigilance levels (light NREM sleep, WASO, wakefulness)", "N": "18"}, {"pmid": "10868309", "title": "Absence of pharmacokinetic drug interaction of levetiracetam with phenytoin in patients with epilepsy determined by new technique.", "abstract": "Levetiracetam has recently been approved as an adjunctive medication for partial seizures and frequently will be added to phenytoin. The objective of this study was to determine the presence or absence of a pharmacokinetic drug interaction of levetiracetam with phenytoin. A stable isotope tracer technique using deuterium-labeled (D10) phenytoin and high-performance liquid chromatography with ultraviolet detection (rather than mass spectrometric detection) was employed. Tracer doses of D10-phenytoin were administered i.v. before and 12 weeks after adding levetiracetam to the regimen of 6 subjects on phenytoin monotherapy for epilepsy. Blood was collected for 96 hours after each infusion. The following pharmacokinetic parameters were determined for phenytoin: Cmax, Cmin, Cavo, AUC, CL, t 1/2, VD, and free (nonprotein bound) fraction. The ratio and the 90% confidence interval of the ratio of log-transformed mean values for phenytoin pharmacokinetic parameters before (denominator) and after (numerator) adding levetiracetam all fell within the range of 0.85 to 1.17 (two one-sided test). The authors conclude that the addition of levetiracetam did not bring about clinically important changes in phenytoin pharmacokinetic parameters and that it is not necessary to change the phenytoin dosing rate when levetiracetam is added to phenytoin.", "year": "2000", "journal": "Journal of clinical pharmacology", "label": "open_label_trial", "P": "Patients with epilepsy on phenytoin monotherapy", "I": "Levetiracetam added to regimen for 12 weeks", "C": "Phenytoin monotherapy (baseline)", "O": "Pharmacokinetic parameters of phenytoin (Cmax, Cmin, Cavo, AUC, CL, t 1/2, VD, and free fraction)", "N": "6"}, {"pmid": "1306344", "title": "Effects of anticonvulsant drugs on thyroid hormones in epileptic children.", "abstract": "Serum total and free thyroid hormones, reverse T3 (rT3), thyroxin binding globulin (TBG) and thyroid stimulating hormone (TSH) concentrations were measured in 35 epileptic patients receiving anticonvulsants (phenobarbitone, phenytoin). There was a significant reduction found in total thyroxine (TT4), free thyroxine (FT4), total triiodothyronine (TT3), free triiodothyronine (FT3) and rT3 in the group treated with, phenytoin. The thyroid hormone levels were within normal limits in the group receiving phenobarbitone.", "year": "1992", "journal": "The Turkish journal of pediatrics", "label": "open_label_trial", "P": "Epileptic children receiving anticonvulsants (phenobarbitone, phenytoin)", "I": "Phenytoin", "C": "Phenobarbitone", "O": "Serum total and free thyroid hormones, reverse T3 (rT3), thyroxin binding globulin (TBG) and thyroid stimulating hormone (TSH) concentrations", "N": "35"}, {"pmid": "18546904", "title": "[Ambulatory anesthesia for an adult patient with autism and epilepsy: sedation using oral and intravenous dexmedetomidine].", "abstract": "A 22-year-old male patient with autism and epilepsy was scheduled to undergo impacted third molar extractions at an outpatient setting. Oral preanesthetic medication with dexmedetomidine and subsequent midazolam with ketamine was acceptable and effective to place intravenous cannula. General anesthesia was maintained with intravenous propofol and dexmedetomidine and operation was performed uneventfully. Sedation with intravenous dexmedetomidine was continued after operation to attenuate and/or manage postoperative problems, such as emergence agitation, dysphoric reactions, pain, opioid-related nausea/vomiting and seizure. He recovered from postoperative sedation and was discharged home without significant problems. Oral and intravenous dexmedetomidine was useful for anesthetic care in the uncooperative patient.", "year": "2008", "journal": "Masui. The Japanese journal of anesthesiology", "label": "open_label_trial", "P": "Adult male patient with autism and epilepsy scheduled for impacted third molar extractions", "I": "Oral preanesthetic dexmedetomidine, followed by intravenous propofol and dexmedetomidine for general anesthesia, and continued intravenous dexmedetomidine for postoperative sedation", "C": "Midazolam and ketamine (for IV cannula placement)", "O": "Successful anesthetic care, management of postoperative problems (emergence agitation, dysphoria, pain, nausea/vomiting, seizure), and discharge without significant problems", "N": "1"}, {"pmid": "19163112", "title": "Antiepileptic drug intervention decouples electroencephalogram (EEG) signals: a case study in Unverricht-Lundborg Disease.", "abstract": "Change in severity of myoclonus as an outcome measure of antiepileptic drug (AED) treatment in patients with Unverricht-Lundborg Disease (ULD) has been estimated by utilizing the Unified Myoclonus Rating Scale (UMRS). In this study, we measure treatment effects through EEG analysis using mutual information approach to quantify interdependence/coupling strength among different electrode sites. Mutual information is known to have the ability to capture linear and non-linear dependencies between EEG time series with superior performance over the traditional linear measures. One subject with ULD participated in this study and 1-hour EEG recordings were acquired before and after treatment of AED. Our results indicate that the mutual information is significantly lower after taking the add-on AED for four weeks at least. This finding could lead to a new insight for developing a new outcome measure for patient with ULD, when UMRS could potentially fail to detect a significant difference.", "year": "2008", "journal": "Annual International Conference of the IEEE Engineering in Medicine and Biology Society. IEEE Engineering in Medicine and Biology Society. Annual International Conference", "label": "open_label_trial", "P": "One subject with Unverricht-Lundborg Disease (ULD)", "I": "Add-on antiepileptic drug (AED) treatment for four weeks", "C": "Before treatment (baseline)", "O": "Mutual information (MI) of EEG signals", "N": "1"}, {"pmid": "37303192", "title": "Surgical outcomes of open and laser interstitial thermal therapy approaches for corpus callosotomy in pediatric epilepsy.", "abstract": "OBJECTIVE: Corpus callosotomy (CC) is a palliative surgical intervention for patients with medically refractory epilepsy that has evolved in recent years to include a less-invasive alternative with the use of laser interstitial thermal therapy (LITT). LITT works by heating a stereotactically placed laser fiber to ablative temperatures under real-time magnetic resonance imaging (MRI) thermometry. This study aims to (1) describe the surgical outcomes of CC in a large cohort of children with medically refractory epilepsy, (2) compare anterior and complete CC, and (3) review LITT as a surgical alternative to open craniotomy for CC. METHODS: This retrospective cohort study included 103 patients <21 years of age with at least 1 year follow-up at a single institution between 2003 and 2021. Surgical outcomes and the comparative effectiveness of anterior vs complete and open versus LITT surgical approaches were assessed. RESULTS: CC was the most common surgical disconnection (65%, n = 67) followed by anterior two-thirds (35%, n = 36), with a portion proceeding to posterior completion (28%, n = 10). The overall surgical complication rate was 6% (n = 6/103). Open craniotomy was the most common approach (87%, n = 90), with LITT used increasingly in recent years (13%, n = 13). Compared to open, LITT had shorter hospital stay (3 days [interquartile range (IQR) 2-5] vs 5 days [IQR 3-7]; p < .05). Modified Engel class I, II, III, and IV outcomes at last follow-up were 19.8% (n = 17/86), 19.8% (n = 17/86), 40.2% (n = 35/86), and 19.8% (n = 17/86). Of the 70 patients with preoperative drop seizures, 75% resolved postoperatively (n = 52/69). SIGNIFICANCE: No significant differences in seizure outcome between patients who underwent only anterior CC and complete CC were observed. LITT is a less-invasive surgical alternative to open craniotomy for CC, associated with similar seizure outcomes, lower blood loss, shorter hospital stays, and lower complication rates, but with longer operative times, when compared with the open craniotomy approach.", "year": "2023", "journal": "Epilepsia", "label": "surgical_outcomes_study", "P": "Pediatric patients (<21 years of age) with medically refractory epilepsy", "I": "Corpus callosotomy (CC) using either open craniotomy or laser interstitial thermal therapy (LITT)", "C": "Open craniotomy approach for CC", "O": "Surgical complication rate, hospital stay, seizure outcomes (Modified Engel class, resolution of drop seizures)", "N": "103 (open craniotomy=90, LITT=13)"}, {"pmid": "8452595", "title": "Hemimegalencephaly: evaluation with positron emission tomography.", "abstract": "We performed positron emission tomographic (PET) studies with 2-deoxy-2[18F]fluoro-D-glucose in 8 children with hemimegalencephaly (HME). HME is a developmental brain malformation associated with epilepsy, hemianopsia, and varying degrees of developmental delay. We hypothesized that the relatively poor overall developmental outcome of surgically hemispherectomized HME patients as a group, compared to children undergoing hemispherectomy for Sturge-Weber syndrome or chronic focal encephalitis, is related to dysfunction of the structurally \"normal\" non-HME side and that PET would be helpful in the pre-surgical evaluation of HME patients with intractable epilepsy. Visual analysis of the non-HME side on PET clearly revealed evidence of cortical hypometabolism in 4 patients compared to controls. Seven children underwent epilepsy surgery. One child had a glucose metabolic pattern suggesting a cortical lamination defect in the non-HME hemisphere, bilateral independent seizure onset, and was not considered to be a surgical candidate. We found a general correlation between the pattern of glucose utilization in the less affected hemisphere and prognosis. Although the follow-up periods are short, it is recommended that HME children with intractable epilepsy undergo hemispherectomy in the first year of life in order to allow maximal brain plasticity to occur; however, preoperative evaluation should also include an assessment of the integrity of the non-HME hemisphere.", "year": "1993", "journal": "Pediatric neurology", "label": "surgical_outcomes_study", "P": "Children with hemimegalencephaly (HME) and intractable epilepsy", "I": "Positron emission tomographic (PET) studies with 2-deoxy-2[18F]fluoro-D-glucose", "C": "Controls", "O": "Cortical hypometabolism in the non-HME side, correlation between glucose utilization in the less affected hemisphere and prognosis", "N": "8"}, {"pmid": "10996451", "title": "Cortical reorganization following multiple subpial transection in human brain - a study with positron emission tomography.", "abstract": "We investigated the cortical activation pattern in a 30-year-old woman 4 years after multiple subpial transection (MST) of the right fronto-parietal cortex and six healthy controls using positron emission tomography. Sequential finger-to-thumb opposition at the frequency of 1.5 Hertz contralateral to the operated hemisphere was used as the activation paradigm. We found preserved cortical activation in the transected fronto-parietal cortex and additional activation of the prefrontal cortex bilaterally and the inferior parietal cortex contralaterally when compared with the control group. This activation pattern indicates that MST induces a rather selective lesion leaving the cortical structures functionally intact. However, it necessitates the recruitment of additional motor areas.", "year": "2000", "journal": "Neuroscience letters", "label": "surgical_outcomes_study", "P": "30-year-old woman 4 years after multiple subpial transection (MST) of the right fronto-parietal cortex", "I": "Multiple subpial transection (MST) of the right fronto-parietal cortex", "C": "Six healthy controls", "O": "Cortical activation pattern during sequential finger-to-thumb opposition (preserved activation in transected cortex, additional activation of prefrontal and inferior parietal cortex)", "N": "7 (patient=1, controls=6)"}, {"pmid": "40763060", "title": "Integration of Spatiotemporal Dynamics and Structural Connectivity for Automated Epileptogenic Zone Localization in Temporal Lobe Epilepsy.", "abstract": "Accurate localization of the epileptogenic zone (EZ) is essential for surgical success in temporal lobe epilepsy. While stereoelectroencephalography (SEEG) and structural magnetic resonance imaging (MRI) provide complementary insights, existing unimodal methods fail to fully capture epileptogenic brain activity, and multimodal fusion remains challenging due to data complexity and surgeon-dependent interpretations. To address these issues, we proposed a novel multimodal framework to improve EZ localization with SEEG-drived electrophysiology with structural connectivity in temporal lobe epilepsy. By retrospectively analyzing SEEG, post-implant Computed Tomography (CT) and MRI (T1 & Diffusion Tensor Imaging (DTI)) data from 15 patients, we reconstructed SEEG electrode positions and obtained the SEEG and structural connectivity fusion features. We then proposed a spatiotemporal co-attention deep neural network (ST-CANet) to identify the fusion features, categorizing electrodes into seizure onset zone (SOZ), propagation zone (PZ), and non-involved zone (NIZ). Anatomical EZ boundaries were delineated by fusing the electrode position and classification information on brain atlas. The proposed method was evaluated based on the identification and localization performance of three epilepsy-related zones. The experiment results demonstrate that our method achieves 98.08% average accuracy and outperforms other identification methods, and improves the localization with Dice similarity coefficients (DSC) of 95.65% (SOZ), 92.13% (PZ), and 99.61% (NIZ), aligning with clinically validated surgical resection areas. This multimodal fusion strategy based on electrophysiological and structural connectivity information promises to assist neurosurgeons in accurately localizing EZ and may find broader applications in preoperative planning for epilepsy surgeries.", "year": "2025", "journal": "IEEE transactions on neural systems and rehabilitation engineering : a publication of the IEEE Engineering in Medicine and Biology Society", "label": "surgical_outcomes_study", "P": "Patients with temporal lobe epilepsy undergoing SEEG", "I": "Spatiotemporal co-attention deep neural network (ST-CANet) integrating SEEG-derived electrophysiology with structural connectivity", "C": "Other identification methods", "O": "Accuracy of identifying seizure onset zone (SOZ), propagation zone (PZ), and non-involved zone (NIZ); Dice similarity coefficients (DSC) for SOZ, PZ, and NIZ localization", "N": "15"}, {"pmid": "20466009", "title": "Double dissociation of selective recollection and familiarity impairments following two different surgical treatments for temporal-lobe epilepsy.", "abstract": "Research has firmly established that the integrity of the medial temporal lobe (MTL) is critical for recognition memory. This ability is supported by recollection, which involves recovery of contextual details of a past stimulus encounter, and familiarity assessment, which leads to awareness of prior occurrence without such recovery. Dual-process models of MTL organization posit that recollection and familiarity are supported by the hippocampus and perirhinal cortex, respectively. Alternatively, it has been argued that both structures support these recognition processes similarly as part of a more integrated declarative memory system; from this perspective, reported selective recollection impairments with circumscribed hippocampal lesions may reflect differential sensitivity to overall memory strength, rather than a deficit in a distinct recognition process. Findings from past neuropsychological research remain inconsistent and controversial, in part due to biases in patient selection, variability in clinical etiology, and limited lesion documentation. Here, we administered a verbal recognition-memory task in combination with remember-know judgements to 10 individuals who had undergone left- or right-sided stereotactic amygdalo-hippocampotomy as a surgical treatment for intractable temporal-lobe epilepsy. Comparisons with healthy control participants revealed isolated impairments in recollection with preserved familiarity, regardless of hemispheric site of lesion. In addition, we show that this impairment can be observed at a comparable level of memory strength (i.e., overall recognition performance) as the selective familiarity impairment we previously described in N.B.--an individual who underwent a tailored surgical resection of the left anterior temporal lobe with hippocampal sparing for treatment of temporal-lobe epilepsy. By revealing a double dissociation concerning temporal-lobe mechanisms for recollection and familiarity, this evidence argues against a unitary, strength-based account of MTL organization.", "year": "2010", "journal": "Neuropsychologia", "label": "surgical_outcomes_study", "P": "Individuals who had undergone left- or right-sided stereotactic amygdalo-hippocampotomy for intractable temporal-lobe epilepsy", "I": "Stereotactic amygdalo-hippocampotomy", "C": "Healthy control participants", "O": "Selective impairments in recollection with preserved familiarity", "N": "10 (patients)"}, {"pmid": "34762158", "title": "Vagus nerve stimulation for super-refractory status epilepticus in febrile infection-related epilepsy syndrome: a pediatric case report and literature review.", "abstract": "Febrile infection-related epilepsy syndrome (FIRES) is a devastating epileptic encephalopathy with limited treatment options and unclear etiology. Vagus nerve stimulation (VNS) is an FDA-approved therapy for refractory epilepsy that has been shown to decrease the frequency and severity of seizures. There is a growing interest in alternate non-pharmaceutical therapies for managing super-refractory status epilepticus (SRSE). We present a 29-month-old case, diagnosed with FIRES, whose seizures were successfully controlled by utilization of VNS after ineffective response to intensive pharmacotherapy and ketogenic diet treatment. The VNS was planted after 14 days of refractory seizure activity with a following rapid parameter titration for 42 days without evident side effect, which finally controlled the seizure in the acute phase. VNS may be a potential candidate for the treatment of SRSE in FIRES.", "year": "2022", "journal": "Child's nervous system : ChNS : official journal of the International Society for Pediatric Neurosurgery", "label": "neuromodulation_study", "P": "29-month-old child diagnosed with Febrile Infection-Related Epilepsy Syndrome (FIRES) and super-refractory status epilepticus (SRSE)", "I": "Vagus nerve stimulation (VNS) with rapid parameter titration for 42 days", "C": "Intensive pharmacotherapy and ketogenic diet treatment", "O": "Seizure control in the acute phase of SRSE", "N": "1"}, {"pmid": "32709064", "title": "Wearable Epileptic Seizure Prediction System with Machine-Learning-Based Anomaly Detection of Heart Rate Variability.", "abstract": "A warning prior to seizure onset can help improve the quality of life for epilepsy patients. The feasibility of a wearable system for predicting epileptic seizures using anomaly detection based on machine learning is evaluated. An original telemeter is developed for continuous measurement of R-R intervals derived from an electrocardiogram. A bespoke smartphone app calculates the indices of heart rate variability in real time from the R-R intervals, and the indices are monitored using multivariate statistical process control by the smartphone app. The proposed system was evaluated on seven epilepsy patients. The accuracy and reliability of the R-R interval measurement, which was examined in comparison with the reference electrocardiogram, showed sufficient performance for heart rate variability analysis. The results obtained using the proposed system were compared with those obtained using the existing video and electroencephalogram assessments; it was noted that the proposed method has a sensitivity of 85.7% in detecting heart rate variability change prior to seizures. The false positive rate of 0.62 times/h was not significantly different from the healthy controls. The prediction performance and practical advantages of portability and real-time operation are demonstrated in this study.", "year": "2020", "journal": "Sensors (Basel, Switzerland)", "label": "neuromodulation_study", "P": "Epilepsy patients", "I": "Wearable system for continuous measurement of R-R intervals and real-time calculation of heart rate variability indices using a smartphone app and multivar
