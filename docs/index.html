e of psychiatric co-morbidity (total score, seizure worry, emotional well-being, energy/fatigue, social function and cognitive function) and a greater seizure frequency (total score, cognitive function and energy/fatigue) as predictive factors for lower scores in the total QOLIE-31 score and in various dimensions. Abnormalities in the neurological exam and poly-therapy with anti-epileptic drugs were negative factors limited to one of the dimensions cognitive function and social function, respectively. Conclusion The presence of psychiatric co-morbidity and a greater seizure frequency were the main factors influencing the quality of life in epileptic patients as evaluated by QOLIE-31.", "year": "2013", "journal": "Arquivos de neuro-psiquiatria", "label": "cross_sectional_study"}, {"pmid": "20654035", "title": "[Comorbidities in patients with cerebral palsy and their relationship with neurologic subtypes and Gross Motor Function Classification System levels].", "abstract": "OBJECTIVE: To analyze the comorbidities in patients with cerebral palsy (CP) from two perspectives as neurologic subtype and gross motor functions, and find their correlations. METHODS: Children with cerebral palsy treated in the rehabilitation center from January 2007 to June 2009 received the following examinations: intelligence capacity test, ophthalmologic consultation, language-speech test, brainstem auditory evoked potential and electroencephalogram. They were stratified according to both neurologic subtype and gross motor functions to detect the occurrence of comorbidities. RESULTS: Of all the 354 cases, 166 (46.89%) had mental retardation, 15 (4.24%) auditory limitations, 138 (38.98%) visual disorder, 216 (61.02%) language-speech disorder and 82 (23.16%) epilepsy. The frequency of individual comorbidities were distributed disproportionately between the different neurologic subtypes. Correlation analysis showed that there was a significant correlation between the spastic diplegia and the visual disorder (correlation coefficient = 0.26), between spastic hemiplegia and epilepsy (correlation coefficient = 0.17), between spastic quadriplegia and epilepsy and mental retardation (the correlation coefficient was 0.38 and 0.11, respectively) and between both dyskinetic and mixed children and language-speech disorder (the correlation coefficient was 0.24 and 0.27, respectively). The frequency of individual comorbidities was distributed disproportionately between the different neurologic subtypes and between the different GMFCS levels (P < 0.05), except for the frequency of visual disorders (chi(2) = 1.90, P > 0.05); and with the increase of the GMFCS levels, the burden of the comorbidities were more heavy and the incidence of the comorbidities was higher. Multi-comorbidities were relatively infrequently encountered in those with spastic hemiplegic or spastic diplegic children or patients whose GMFCS levels were I-III, while these entities occurred at a frequent level for those with spastic quadriplegic, dyskinetic, or mixed or children whose GMFCS levels were IV and V, and the differences were significant (P < 0.05). The mean GMFCS levels of children with spastic quadriplegic, dyskinetic or mixed CP were higher than level III, most of them had no ability of ambulation;while the mean GMFCS levels of spastic hemiplegic or spastic diplegic children were below level III, most of them could walk independently. CONCLUSIONS: There are correlations between the occurrence of the comorbidities such as mental retardation, auditory or visual impairments, language-speech disorders, epilepsy and the cerebral palsy subtype and the gross motor function levels. Clinicians should have a full recognition of these comorbidities, and we should have a cooperation between the different subjects to have an overall evaluation and rehabilitation and to improve the prognosis.", "year": "2010", "journal": "Zhonghua er ke za zhi = Chinese journal of pediatrics", "label": "epidemiological_study"}, {"pmid": "9190480", "title": "[Epidemiology in epilepsy. Epilepsy primarily affects small children and the elderly].", "abstract": "Epilepsy is one of the commonest neurological/disorders, with peak incidences among the elderly and among children in the first year of life. Approximately 60,000 (0.7 per cent) of the Swedish population, 50,000 adults and 10,000 children, have active epilepsy. Stroke is the aetiology most commonly identified. The majority of those with a first-ever unproven seizure suffer no further seizures. Of those who do have further seizures (i.e., who develop epilepsy), 65-85 per cent eventually become free from seizures, and many of them are able to cease antiepileptic medication. Epilepsy is a heterogeneous disorder. The larger proportion of patients who are otherwise healthy, and who respond readily to antiepileptic treatment and manifest no side effects or only mild ones, are characterised by the best prognosis and are able to terminate treatment within 2-5 years without recurrence. At the other extreme is the smaller group of patients with onset of epilepsy very early in life, and characterised by multiple severe neurological defects, severe daily seizures, resistance (more or less) to all available treatment, and high mortality. In many cases of epilepsy, however, severity and prognosis lie somewhere between these two extremes.", "year": "1997", "journal": "Lakartidningen", "label": "epidemiological_study"}, {"pmid": "25689886", "title": "Epidemiology of epilepsy and its burden in Kolkata, India.", "abstract": "BACKGROUND: Disability-adjusted life year (DALY) is a time-based measure of disease burden incorporating both disability and mortality. Our study aimed to determine the DALY lost from epilepsy in an Indian metropolis. METHODS: A population-based prospective study on epilepsy was conducted over 5 years (2003-8) in Kolkata, India, on randomly selected 100,802 subjects (males 53,209, females 47,593) to assess prevalence as well as to capture incident cases of epilepsy and those incident cases that died. Standard case definitions were used. The data were used to estimate years of life lost (YLL) due to premature mortality, years of life lived with disability (YLD), and DALY, utilizing the prevalence-based Global Burden of Disease (GBD) 2010 approach. Age- and gender-specific figures were computed. RESULTS: During 2003-2004, a total of 476 subjects with active epilepsy were detected and the age-adjusted prevalence rate was 4.71 per 1000. Over 5 years, there were 197 incident cases of epilepsy of whom 26 died. The age-adjusted annual incidence rate of epilepsy was 38.3 per 100,000. The all-cause standardized mortality rate (SMR) of epilepsy was 2.4. The burden of epilepsy in the year 2007-8 revealed the overall YLL was 755 per 100,000, and the overall YLD ranged from 14.45 to 31.0 per 100,000 persons depending on the clinical severity of the epilepsy. Both YLL and YLD values were higher in males than in females. The overall DALY lost due to epilepsy in 2007-8 was found to be 846.96 (males 1183.04, females 463.81) per 100,000. CONCLUSIONS: This is the first study in India to determine the DALY of epilepsy using GBD 2010. The results reveal a substantial burden of epilepsy in our setting. Similar such studies are needed in other parts of India in both urban and rural settings.", "year": "2015", "journal": "Acta neurologica Scandinavica", "label": "epidemiological_study"}, {"pmid": "15705457", "title": "Selective serotonin reuptake inhibitors in pregnant women and neonatal withdrawal syndrome: a database analysis.", "abstract": "BACKGROUND: Selective serotonin reuptake inhibitors (SSRIs) have been associated with withdrawal symptoms. We investigated whether use of these drugs in pregnant women might cause neonatal withdrawal syndrome. METHODS: An association between paroxetine and neonatal convulsions was identified in December, 2001, by the data mining method routinely used to screen the WHO database of adverse drug reactions. An information component (IC) measure was used to screen for unexpected adverse reactions relative to the information in the database. We then assessed cases of neonatal convulsions and neonatal withdrawal syndrome associated with drugs included in the anatomical therapeutic chemical groups N06AB and N06AX. FINDINGS: By November, 2003, a total of 93 suspected cases of SSRI-induced neonatal withdrawal syndrome had been reported, and were regarded as enough information to confirm a possible causal relation. 64 of the cases were associated with paroxetine, 14 with fluoxetine, nine with sertraline, and seven with citalopram. The IC-2 SD for the group became greater than 0 in the first quarter of 1991, and the IC increased to 2.68 (IC-2 SD 0.32) by the second quarter of 2003. For each individual compound, the IC-2 SD was greater than 0. INTERPRETATION: SSRIs, especially paroxetine, should be cautiously managed in the treatment of pregnant women with a psychiatric disorder.", "year": "N/A", "journal": "Lancet (London, England)", "label": "epidemiological_study"}, {"pmid": "1531017", "title": "[Prevalence rate of severely mentally and physically handicapped children in school age in Yokohama].", "abstract": "Prevalence rate and pattern of disabilities were studied in severely mentally and physically handicapped children in school age in Yokohama. We visited institutions and schools for retarded children in Yokohama and its neighborhood or made contact with them by telephone. The study disclosed a total of 192 children on May 1, 1988. Prevalence rate was 0.51 per 1,000. Patterns of disabilities were: 1) most of the children (94.8%) lived with their families. 2) eighty-eight percent of the children attended school for retarded children. 3) about twenty percent of the children who attended school needed tube feeding.", "year": "1992", "journal": "No to hattatsu = Brain and development", "label": "epidemiological_study"}, {"pmid": "27861320", "title": "Laser Interstitial Thermal Therapy: Lighting the Way to a New Treatment Option in Neurosurgery.", "abstract": "LITT, laser interstitial therapyNd:YAG, neodymium-doped yttrium aluminum.", "year": "2016", "journal": "Neurosurgery", "label": "surgical_outcomes_study"}, {"pmid": "15021283", "title": "Use of cuffed oropharyngeal airway (COPA) for awake intracranial surgery.", "abstract": "A comprehensive anesthetic plan for managing patients undergoing \"awake: intracranial surgery (AICS) must include a means of rescuing the patient if the airway becomes obstructed. Since access to the patient's airway is limited, mask ventilation can be challenging and laryngoscopy and tracheal intubation, impossible. The need exists for an alternative airway device that is easy to insert, would allow controlled ventilation, and would facilitate a smooth emergence with minimal coughing. The cuffed oropharyngeal airway (COPA) was introduced as a supraglottic airway device in spontaneously breathing patients. The authors report their preliminary experience of its use in AICS. The COPA was inserted in 20 patients on 31 occasions. Insertion of the COPA was accomplished easily at the first attempt in all cases irrespective of patient position. Airway maneuvers were required when patients were supine but not lateral. The COPA is a useful device to instrument the airway in patients undergoing AICS using the asleep-awake-asleep technique in the lateral position.", "year": "2004", "journal": "Journal of neurosurgical anesthesiology", "label": "surgical_outcomes_study"}, {"pmid": "26654176", "title": "Neuropsychological outcomes of subtemporal selective amygdalohippocampectomy via a small craniotomy.", "abstract": "OBJECT The objectives of this study were to describe a novel minimal-access subtemporal approach for selective resection of the amygdala and hippocampus in patients with medically refractory mesial temporal lobe epilepsy (MTLE) due to hippocampal sclerosis, and to analyze the related outcomes. METHODS The authors analyzed data from all cases involving patients with unilateral MTLE due to hippocampal sclerosis who were treated with selective amygdalohippocampectomy via the posterior subtemporal approach through a relatively small craniotomy, without a neuronavigation system, at their institution during the period from September 2010 to September 2012. Data were obtained on baseline characteristics, preoperative evaluations of unilateral mesial temporal sclerosis, surgical complications, and Engel class seizure outcomes. All patients underwent memory testing, IQ testing, and language testing. RESULTS The mean duration of follow-up was 33.6 months (range 24-48 months). There were no deaths and no cases of significant postoperative morbidity. One patient had a mild complication. At 2-year follow-up, 19 patients were seizure free (Engel Class I outcome). Verbal memory scores obtained at 3 months and at 2 years after surgery were significantly lower than preoperative scores for patients who underwent surgery on the left side of the brain (p < 0.05). Pictorial memory scores were higher following surgery compared with before surgery regardless of whether patients underwent left- or right-sided brain surgery. There was also improvement in performance IQ and total IQ following surgery in both groups. For patients who underwent right-sided brain surgery, verbal comprehension and semantic fluency testing scores were significantly higher at both 3 months and 2 years after surgery than before surgery. For patients who underwent left-sided brain surgery, scores on all language tests were significantly lower at 3 months after surgery than before surgery. Verbal comprehension testing scores returned to the preoperative level at 2 years after surgery. CONCLUSIONS The posterior subtemporal approach through a relatively small craniotomy allows adequate exposure and safe resection of mesial temporal structures and effectively reduces medically intractable MTLE. It preserves IQ but may have a detrimental effect on verbal memory and language ability.", "year": "2016", "journal": "Journal of neurosurgery", "label": "surgical_outcomes_study"}, {"pmid": "25891932", "title": "Dentate gyrus expression of nestin-immunoreactivity in patients with drug-resistant temporal lobe epilepsy and hippocampal sclerosis.", "abstract": "PURPOSE: Granule cells pathology in dentate gyrus, have received considerable attention in terms of understanding the pathophysiology of temporal lobe epilepsy with hippocampal sclerosis. The aim of this study was to determine the nestin (an intermediate filament protein expressed by newly formed cells), immunoreactivity (IR) in granular cells layers of hippocampal tissue extirpated during epilepsy surgical procedure, in patients with drug-resistant epilepsy. METHODS: Hippocampal sections of 16 patients with hippocampal sclerosis and drug-resistant temporal lobe epilepsy were processed using immunoperoxidase with antibody to nestin. Archival material from 8 normal post-mortem hippocampus, were simultaneously processed. Reactive area for nestin-IR, the total number of positive nestin cells per field (20×), and the MGV (mean gray value) was determined by computerized image analysis (ImageJ), and compared between groups. Student's t test was used for statistical analysis. RESULTS: Nestin-IR cells were found in granule cells layers of both controls and patients. Larger reactive somas (p < 0.01) were found in epileptic's sections but a significant reduction in the total number of nestin-IR cells per field and in the MGV was found in granular cells layers of patients with hippocampal sclerosis (p < 0.01). CONCLUSION: Reduced expression of nestin-IR in granular cells layers of epileptic's dentate gyrus may reflect changes in dentate gyrus neuroplasticity associated to chronic temporal epilepsy with hippocampal sclerosis. Further studies are required to determine the clinical implications on memory an emotional alterations such as depression.", "year": "2015", "journal": "Seizure", "label": "surgical_outcomes_study"}, {"pmid": "6568922", "title": "Embolisation of cerebral arteriovenous malformations.", "abstract": "Seven patients with inoperable cerebral arteriovenous malformations have been treated with embolisation using Silastic spheres and plugs. Indications for using this technique were intractable migraine, episodes of cerebral ischaemia ('steal' syndromes), intracranial haemorrhage, and partial or generalised epilepsy. All 7 patients had been treated medically for between 5 and 25 years with unsatisfactory control of symptoms. Four of the 7 patients obtained some improvement which appeared related to the reduction in flow through the malformation. Although there are risks associated with embolisation, it would seem to be a worthwhile procedure in selected cases.", "year": "1983", "journal": "Clinical and experimental neurology", "label": "surgical_outcomes_study"}, {"pmid": "20825290", "title": "Refined analysis of complex language representations by non-invasive neuroimaging techniques.", "abstract": "OBJECTIVE: The determination of language lateralisation is important for patients with medically intractable epilepsy or a brain tumour near the language areas to avoid the risk of post-surgical language deficits. The aim of this study was to evaluate the clinical usefulness of near-infrared spectroscopy (NIRS) to identify language lateralisation compared with functional MRI (fMRI) and magnetoencephalography (MEG) in multiple language tasks. METHODS: We investigated 28 patients whose language dominance was evaluated by the Wada test. fMRI, MEG and NIRS were performed to investigate language representation. All patients were asked to read three-letter words silently for fMRI and MEG (Kana reading) and to write words beginning with a visually presented letter (word generation) for NIRS. The laterality index was calculated to assess language lateralisation in each investigation. RESULTS: In 24 cases (85.7%), of which two investigations showed the same laterality, the results had perfect concordance with the Wada test. In patients with left dominance, the sensitivity and specificity of fMRI, MEG and NIRS was 95.0% and 62.5%, 100% and 87.5%, 75.0% and 87.5%, respectively. In three patients with right lateralization, only NIRS showed a significant increase of oxygenated-haemoglobin in the right inferior frontal region, indicating right dominance. CONCLUSION: We established a method to determine language lateralisation by co-utilising fMRI, MEG and NIRS with high reliability. NIRS recognised atypical language representation, in addition to fMRI and MEG. While fMRI, MEG and NIRS are not currently as accurate as the Wada test in determining language lateralisation, this non-invasive and repeatable method has great potential as an alternative to the Wada test in time following further research and refinement of these techniques.", "year": "2011", "journal": "British journal of neurosurgery", "label": "neuromodulation_study"}, {"pmid": "40892676", "title": "Long-Term Ambulatory Intracranial EEG.", "abstract": "BACKGROUND: Long-term ambulatory intracranial EEG is beginning to transform epilepsy care by revealing new insights into seizure patterns and treatment responses over the course of months to years. The feasibility of such monitoring was initially demonstrated through a dedicated recording system. Subsequently, brain-implanted neurostimulators became available with integrated recording functionality, revealing numerous clinically useful applications. SUMMARY: Chronic intracranial EEG allows long-term characterization of patient events, which can clarify which are epileptic, and also help identify unrecognized or subclinical seizures, which can vastly outnumber reported ones. Longitudinal recordings allow monitoring of epilepsy burden over the course of months to years, including responses to treatments such as neuromodulation and anti-seizure medications. Medication efficacy can be assessed in a matter of weeks rather than months. In patients with more than one potential localization, the predominant seizure focus can be identified, enabling further surgical options such as resection. Temporal patterns including circadian and multiday cycles may be revealed with the potential to enable temporal-specific treatments, seizure forecasts, and seizure warnings. Beyond direct clinical applications, ambulatory intracranial EEG has also opened up a new field of neuroscience in naturalistic environments. KEY MESSAGES: Long-term intracranial recordings have led to new discoveries about the individualized course of epilepsy and how it responds to treatment. They are clinically useful but are currently limited to patients with specific neurostimulators which are not available worldwide. Current systems allow long-term monitoring with intermittent EEG and/or hourly summary data but do not have continuous EEG availability. Expansion to patients without neurostimulators could provide broader clinical benefit. Scalp and implanted subscalp monitoring systems are now entering clinical care and may offer some of the same advantages as intracranial recording systems, although comparisons have not been made.", "year": "2025", "journal": "Stereotactic and functional neurosurgery", "label": "neuromodulation_study"}, {"pmid": "11528301", "title": "Activation of interictal spiking in mesiotemporal lobe epilepsy by propofol-induced sleep.", "abstract": "The objective of this study was to test whether low-dose propofol increases the number of interictal spikes in patients with mesiotemporal lobe epilepsy, and to determine whether this is the result of intrinsic properties and is restricted to the primary epileptogenic focus. Controlled infusion of propofol in step-up/-down target concentrations of 0, 0.3, 0.6, and 0.8 mg/L was administered to 10 patients during a 3.5-hour daytime EEG registration. The number of spikes were counted and related to propofol concentration and sleep level. Results were compared with a spontaneous, nocturnal first sleep cycle in 9 of 10 patients. All patients entered nonrapid eye movement 1 sleep during propofol administration, and 8 reached nonrapid eye movement 2 sleep. In 7 patients who showed spikes, spikes were related to sleep (P < 0.05) and not to increasing (P = 0.1) or decreasing (P = 0.5) propofol concentration. Six of nine patients showed more spikes during spontaneous (nocturnal) sleep than during propofol-induced sleep. Contralateral spiking was not suppressed selectively. Low-dose propofol is a safe means of increasing spiking in these patients because it induces sleep. There were no signs of an intrinsic epileptogenicity of propofol or a selective effect on ipsilateral spikes. Controlled sleep induction will increase the yield of interictal spikes during short interictal recordings such as in magnetoencephalography.", "year": "2001", "journal": "Journal of clinical neurophysiology : official publication of the American Electroencephalographic Society", "label": "neuromodulation_study"}, {"pmid": "37948913", "title": "The effects of Vagal Nerve Stimulation on time perception in epilepsy patients.", "abstract": "In this study, it was aimed to investigate the effects of switching off stimulation on time perception in patients with drug-resistant epilepsy who underwent Vagal Nerve Stimulation (VNS). In accordance with the literature, a cognitive battery of tests for motor timing and perceptual timing was utilized. Computerized time perception tests; Paced Motor Timing Test, Duration Discrimination Test, Temporal Reproduction Test, and Time Estimation Test were administered to the patients while VNS was on and off. A total of 14 patients who met the inclusion criteria of 23 VNS patients followed in the Epilepsy Outpatient Clinic were included in the study. In the Temporal Reproduction Test, for time durations of 1000 ms (ms), 2000 ms, 3000 ms, 4000 ms, and 5000 ms the comparison of reported time values between VNS on and VNS off yielded respective p values; p = 0.73, p = 0.03, p = 0.176, p = 0.418, p = 0,873. The reported time is thus significantly shorter only for 2000 ms when the VNS was on. Positive effect of VNS on attention, alertness and focusing are expected to cause acceleration of the internal clock resulting in perceiving time running slower than actual. In our study, it was concluded that the internal clock runs faster when the VNS is on, and time is perceived as running slower than it actually is. This result can also be accepted as an indirect indicator of increased attention in the period when VNS is on.", "year": "2023", "journal": "Journal of clinical neuroscience : official journal of the Neurosurgical Society of Australasia", "label": "neuromodulation_study"}, {"pmid": "2773684", "title": "Some basic features of the pathological and normal motor system studied by chronic deep electrodes.", "abstract": "Our stereotactic experiences in agreement with the literature showed, that different target points could influence the same motor disturbance. To choose the best target point or target point combinations we generally implant the electrodes into VL, Vim, CM, P, dentate nucleus and motor cortex. To ensure the correct sequence of therapeutic lesions we developed an investigation system, taking into consideration the resting and the working state of the motor system. We elicited events centrally (stimulation of the different target points) and peripherally (reflexes) and recorded the evoked potentials at the non-stimulated sites along with the motor and motor modulation effects in the appropriate muscles. The elicited events depend on the site of stimulation and registration and on the state of muscle activity. The centrally and peripherally elicited events influence each other. With our technique the elicited events and their functional dependency is most explicit within the motor system. The results help to explain some basic motor functions and help to answer some of our therapeutic questions.", "year": "1989", "journal": "Acta neurochirurgica. Supplementum", "label": "neuromodulation_study"}, {"pmid": "27498453", "title": "A series of drawings of a patient with schizophrenia-like psychosis associated with epilepsy: captured illustration of multifaced self- expression.", "abstract": "INTRODUCTION: Drawings may give an insight into the complex mental process, however they have been underutilized in patients with psychosis associated with epilepsy. CASE REPORT: A 33-year-old, right handed female, diagnosed with schizophrenia-like psychosis associated with epilepsy, was treated in the Day Unit due to psychosocial rehabilitation. Besides other treatments, the patient underwent group analysis of drawings once a week. Qualitative analysis of the form and content of drawings made by free associations were performed. The varying of size and motives with vivid colours and the curve of perspective were documentated in three figures, followed by the last drawing which was without such elements. CONCLUSION: A series of drawings of patients with psychosis associated with epilepsy is needed to record a possible variations and disturbance of the immediate mental process. Group sessions may additionally contribute to diminish stigma and enhance psychosocial reintegration.", "year": "2016", "journal": "Vojnosanitetski pregled", "label": "case_report"}, {"pmid": "1296050", "title": "[Aicardi syndrome: a case report].", "abstract": "A 5-year-old girl had suffered from infantile spasms since 3 months of age. Cranial computerized tomography revealed agenesis of the corpus callosum. Abnormal ocular fundus features consisted of bilateral disc colobomas and lacunar pigment change in her right eye. The clinical presentations were consistent with Aicardi syndrome. The ophthalmologic manifestations of Aicardi syndrome will be discussed in this paper.", "year": "1992", "journal": "Gaoxiong yi xue ke xue za zhi = The Kaohsiung journal of medical sciences", "label": "case_report"}, {"pmid": "9660011", "title": "Reversible hypercalcemic cerebral vasoconstriction with seizures and blindness: a paradigm for eclampsia?", "abstract": "Although hypercalcemia may cause drowsiness, lethargy, weakness, confusion and coma it rarely causes seizures or cerebral infarction. The patient presented had a clinical evolution from hallucinosis to a generalized tonic-clonic seizure, and subsequent cortical blindness with occipital cerebral ischemia as evidenced by SPECT and MRI scans. EEG revealed occipital PLEDs. With reversal of hypercalcemia, there was a return of vision, resolution of EEG epileptiform activity, although with some residual occipital infarction. This case, in concert with a literature review of hypercalcemia, reveals examples of occipital and watershed ischemia, blindness, seizures and hypertension, a pattern markedly similar to that of eclampsia. Furthermore, medications such as magnesium sulfate, believed to reverse cerebrovasospasm responsible for the eclamptic neurologic findings, may counter the effects of hypercalcemia at a cellular level, lending support to a calcium-mediated injury in eclampsia.", "year": "1998", "journal": "Clinical EEG (electroencephalography)", "label": "case_report"}, {"pmid": "21534350", "title": "A challenging review of childhood incontinence: rare complications of dysfunctional elimination syndrome in an epileptic boy.", "abstract": "A multidisciplinary approach is mandatory in defining the cause and directing the treatment of childhood urinary incontinence. Both pediatricians and pediatric urologists should carefully evaluate a child with incontinence for possible overlapping etiologies, before labeling him or her as a refractory case. We report an epileptic boy with dysfunctional elimination syndrome (DES) with associated rare complications of giggle incontinence and idiopathic urethritis, proving the need for a good voiding diary, patient history and structured symptom scores.", "year": "2011", "journal": "The Turkish journal of pediatrics", "label": "case_report"}, {"pmid": "11843701", "title": "Corneal endothelial degeneration in dentatorubral-pallidoluysian atrophy.", "abstract": "BACKGROUND: Dentatorubral-pallidoluysian atrophy (DRPLA) is an autosomal dominant spinocerebellar degeneration that exhibits a variety of neurologic manifestations. However, only a few reports have studied disturbances outside the central nervous system. We described 2 unrelated patients with DRPLA accompanied by corneal endothelial degeneration. PATIENTS AND METHODS: A 52-year-old man presented with cerebellar ataxia and dementia. Magnetic resonance imaging of the brain showed cerebellar atrophy. Dentatorubral-pallidoluysian atrophy was diagnosed because of the detection of expansion of CAG repeats at the DRPLA locus. On admission, his visual acuity was severely impaired. Specular microscopy showed decreased endothelial cell density (500 cells/mm(2)) compared with that of healthy subjects. The second patient was a 69-year-old man with cerebellar ataxia. Magnetic resonance imaging of the brain showed cerebellar and brainstem atrophy. The diagnosis of DRPLA was based on expanded CAG repeats of the DRPLA gene. Specular microscopy showed significant decrease of endothelial cell density (1506 cells/mm(2)). Reverse transcriptase-polymerase chain reaction analysis showed DRPLA gene expression in corneal endothelial cells. CONCLUSIONS: Mutant DRPLA protein may be directly associated with corneal endothelial degeneration. Corneal endothelial cell loss is an important sign of DRPLA, and the corneas of patients with DRPLA should be examined.", "year": "2002", "journal": "Archives of neurology", "label": "case_report"}, {"pmid": "8879645", "title": "Neuronal migrational disorders in children with epilepsy: MRI, interictal SPECT and EEG comparisons.", "abstract": "Single-photon emission computed tomography (SPECT) is being increasingly used in the investigation of children with epilepsy and may provide insights into congenital malformations. We analyzed the interictal 99Tc-HMPAO-SPECT in a series of seven children with developmental disorders of the neocortex, each of them representing a prototype of cerebral dysgenesis, such as lissencephaly, pachygyria, opercular dysplasia, polymicrogyria, nodular heterotopia and band heterotopia. The patients studied were selected among 22 epileptic children with neuronal migrational disorders (NMDs). Interictal SPECT hypoperfusion was observed in the area homologous to MRI findings in all the examined children. In three patients low perfusion was also present in the opposite hemisphere, probably due to functional involvement or related to an underlying microdysgenesis, not revealed by structural imaging. EEG features were in agreement with low perfusion areas, both anatomically and functionally, in all children. In one patient hypoperfusion area differed from that revealed by MRI and EEG. Ictal SPECT has been considered a useful tool for accurately locating the epileptic focus. Nevertheless, interictal brain perfusion studies, together with proton magnetic resonance spectroscopy, may play an important role in detecting anatomic substrate in developmental disorders of the neocortex.", "year": "1996", "journal": "Brain & development", "label": "case_series"}, {"pmid": "28612063", "title": "Bioelements in hair of children with selected neurological disorders.", "abstract": "We have analyzed concentrations of magnesium (Mg), calcium (Ca), copper (Cu), zinc (Zn) and iron (Fe) in hair of a group of 82 children with mental retardation, in which 9 patients suffered from epilepsy, 18 from the Down's syndrome and 55 from cerebral palsy. Girls comprised little over 50% of the patients. In the group of boys with epilepsy, we found Mg, Ca, Cu and Fe deficiency, and normal level of Zn. In the group of girls with epilepsy, apart from low Fe concentration, a high level of Ca, Mg, Zn, and Cu was noted. For girls with the Down's syndrome, a high or normal level of Ca, Mg, Zn and Cu was found, whereas the Fe concentration varied and presented itself in a non-characteristic way. Both groups of children with cerebral palsy, i.e. boys and girls, displayed low Fe concentration in their hair; low Cu level was found in older patients as well. In this group of patients, we also noted high concentrations of Ca, Mg and Zn in girls and normal in boys. A high concentration of Ca in girls with cerebral palsy requires separate analysis. The obtained results could be useful as guidance in the direction and determination of the amount of possible patient nutritional supplementation.", "year": "2017", "journal": "Acta biochimica Polonica", "label": "case_series"}, {"pmid": "34033167", "title": "Psychogenic non-epileptic seizure-status in patients admitted to the intensive care unit.", "abstract": "BACKGROUND: Psychogenic non-epileptic seizure-status (PNES-status), defined by psychogenic non-epileptic seizures (PNES) over 30 min, are often misdiagnosed as status epilepticus. We aimed to describe the features of patients who experienced PNES-status, admitted to an intensive care unit (ICU). METHODS: We screened the patients hospitalized in our epilepsy unit during a 4-year period, with a diagnosis of PNES-status and ICU admission. RESULTS: Among 171 patients with PNES, we identified 25 patients (15%) who presented 39 episodes of PNES-status leading to ICU admission. Some 76% of the patients were women. The median age at the time of the PNES-status episode was 35 years. Half (48%) alleged a history of epilepsy, but epilepsy was confirmed in only 12%. A history of psychiatric disease was found in 68%. PNES were present in 85% of patients before PNES-status, and semiology of PNES and PNES-status was similar for 79% of the patients, including hyperkinetic movements in 95% of the episodes and suspected loss of consciousness in 87%. Benzodiazepines were administrated in 77% of the episodes, antiepileptic drugs in 87%, and antibiotherapy for a ICU-related infection in 15% of the episodes. Oral intubation was performed in 41% of the episodes. Blood tests showed normal levels of creatine phosphokinase and leucocytes in 90% and 95% of the episodes, respectively. No epileptic activity was found during per-event electroencephalography but interictal epileptic activity was found in 10% of the episodes. CONCLUSION: Hyperkinetic PNES-status should always be considered as a differential diagnosis of status epilepticus, with a high risk of iatrogenic consequences.", "year": "2021", "journal": "European journal of neurology", "label": "case_series"}, {"pmid": "9698058", "title": "Autism and autistic epileptiform regression with occipital spikes.", "abstract": "The electroencephalographic abnormalities seen in Landau-Kleffner syndrome (LKS) (language deterioration) are non-specific, and consist of a variety of epileptiform discharge patterns including continuous slow spike-wave discharges during sleep, focal sharp waves with spikes, and centrotemporal (rolandic) spikes. Similarly, the EEG abnormalities seen in autistic epileptiform regression (language and social/behavioral deterioration) are non-specific and overlap with those seen in LKS. By contrast, distinct epilepsy syndromes in otherwise normal children occur in the EEG-defined benign focal epilepsies of childhood. Occipital spikes or spike-wave present either in the older child with visual symptoms and headache or in the younger child with autonomic symptoms followed by brief or prolonged partial motor seizures. Seven young children (five from a consecutive series of 42) presenting clinically with autism or autistic regression and possible or definite seizures, whose EEGs revealed occipital spikes or spike-wave characteristic of the benign epilepsies, are reported. Although occipital spikes are commonly seen in young children as an age-dependent EEG-defined benign focal epilepsy, their high frequency in this population with cognitive difficulties suggests a possible causal relation. The effects of the epileptiform discharge on cognitive functioning presumably reflect extension into temporal and parietal lobes, rather than occipital disturbances per se.", "year": "1998", "journal": "Developmental medicine and child neurology", "label": "case_series"}, {"pmid": "2107576", "title": "[Depressed fracture of the calvaria].", "abstract": "This study is based on 147 depressed fractures of the calvaria. 60% of the diagnosed and treated cases were compound depressed fractures. Of the 147 patients 12 developed intracerebral, epidural and subdural hematomas. 3 persons developed infections. Of course the decision to institute prophylactic anticonvulsive therapy we only found 7 cases of posttraumatic epilepsy. Because of our experience in treatment of the depressed fracture we divide a consequent and rapid diagnosis by X-rays in combination with modern computer-tomography.", "year": "1990", "journal": "Der Unfallchirurg", "label": "case_series"}, {"pmid": "22419282", "title": "Ketogenic diet and other dietary treatments for epilepsy.", "abstract": "BACKGROUND: The ketogenic diet, being high in fat and low in carbohydrates, has been suggested to reduce seizure frequency. It is currently used mainly for children who continue to have seizures despite treatment with antiepileptic drugs. Recently there has been interest in less restrictive ketogenic diets including the Atkins diet and the use of these diets has extended into adult practice. OBJECTIVES: To review the evidence from randomised controlled trials regarding the effects of ketogenic and similar diets. SEARCH METHODS: We searched the Cochrane Epilepsy Group's Specialised Register (June 2011), the Cochrane Central Register of Controlled Trials (CENTRAL 2011, Issue 2 of 4), MEDLINE (1948 to May week 4, 2011) and EMBASE (1980 to March 2003). No language restrictions were imposed. We checked the reference lists of retrieved studies for additional reports of relevant studies. SELECTION CRITERIA: Studies of ketogenic diets and similar diets for people with epilepsy. DATA COLLECTION AND ANALYSIS: Three review authors independently applied pre-defined criteria to extract data and also assessed study quality. MAIN RESULTS: We identified four randomised controlled trials which generated five publications.These included Kossoff 2007, Bergqvist 2005, Seo 2007, Neal 2008 and Neal 2009. All trials applied the intention-to-treat analysis with varied randomisation method. The four studies recruited a total of 289 children and adolescents and no adults. Meta-analysis could not be conducted due to heterogeneity of the studies. Seven prospective studies and four retrospective studies were also identified. AUTHORS' CONCLUSIONS: Our review update included data from four new randomised studies of the ketogenic diet. Although none were blinded, some were of good quality. These studies suggest that in children, the ketogenic diet results in short to medium term benefits in seizure control, the effects of which are comparable to modern antiepileptic drugs. However, one study of long term outcome reports a high attrition rate for the diet. This would suggest that many children find the diet difficult to tolerate. The main reasons for drop-outs in the included studies included gastrointestinal side effects and dislike for the diet.We found just three studies on the use of the diet in adults and none of these were randomised. There has been less research involving other diets. We found one randomised study of reasonable quality of the Atkins diet. This study showed similar benefits in seizure control with a less restrictive diet.For those with medically intractable epilepsy or those in whom surgery is unsuitable, a ketogenic diet could improve seizure control, but tolerability is poor. One observational study suggested that the Atkins diet may have a similar effect on seizure control, but this requires more investigation.", "year": "2012", "journal": "The Cochrane database of systematic reviews", "label": "systematic_review"}, {"pmid": "20431789", "title": "Global disparities in the epilepsy treatment gap: a systematic review.", "abstract": "OBJECTIVE: To describe the magnitude and variation of the epilepsy treatment gap worldwide. METHODS: We conducted a systematic review of the peer-reviewed literature published from 1 January 1987 to 1 September 2007 in all languages using PubMed and EMBASE. The purpose was to identify population-based studies of epilepsy prevalence that reported the epilepsy treatment gap, defined as the proportion of people with epilepsy who require but do not receive treatment. Negative binomial regression models were used to assess trends and associations. FINDINGS: The treatment gap was over 75% in low-income countries and over 50% in most lower middle- and upper middle-income countries, while many high-income countries had gaps of less than 10%. However, treatment gaps varied widely both between and within countries. They were significantly higher in rural areas (rate ratio, RR: 2.01; 95% confidence interval, CI: 1.40-2.89) and countries with lower World Bank income classification (RR: 1.55; 95% CI: 1.32-1.82). There was no significant trend in treatment gap over time (RR: 0.92; 95% CI: 0.79-1.07). CONCLUSION: There is dramatic global disparity in the care for epilepsy between high- and low- income countries, and between rural and urban settings. Our understanding of the factors affecting the treatment gap is limited; future investigations should explore other potential explanations of the gap.", "year": "2010", "journal": "Bulletin of the World Health Organization", "label": "systematic_review"}, {"pmid": "31150997", "title": "The effect of antiepileptic drugs on epileptiform discharges in genetic generalized epilepsy: A systematic review.", "abstract": "OBJECTIVE: The objective of this study was to evaluate the current evidence regarding the effect of antiepileptic drugs (AEDs) on epileptiform discharge (ED) burden in genetic generalized epilepsy (GGE). METHODS: We conducted a comprehensive literature search of PubMed, Embase, PsycINFO, and the Web of Science Core Collection databases using the keywords 'genetic generalized epilepsy', 'antiepileptic drugs' and 'epileptiform discharge'. Primary human studies published in English that reported the effect of AEDs on EDs captured on electroencephalogram (EEG) recordings of at least 24 h in duration in patients with GGE were included. RESULTS: Six studies published between 1984 and 2017, which reported the effect of AEDs on EDs, involving a total of 116 patients with GGE, were analyzed. Our systematic review found a tendency for AEDs to reduce ED density, frequency, cumulative duration, and burst duration in GGE. Furthermore, we found evidence that the AED-mediated reduction in ED burden was associated with improved seizure control and cognitive outcomes. CONCLUSIONS: Antiepileptic drugs tend to reduce ED burden in GGE, but the significance of this association remains uncertain.", "year": "2019", "journal": "Epilepsy & behavior : E&B", "label": "systematic_review"}, {"pmid": "33631435", "title": "Community pharmacists' role in caring for people living with epilepsy: A scoping review.", "abstract": "OBJECTIVE: To identify and describe studies about pharmacist-provided services for people with epilepsy and their caregivers. METHODS: PubMed/MEDLINE and EMBASE were searched for articles that were: (1) written in English, (2) published in 1985 or later, (3) a peer-reviewed empirical study or practice report, and (4) describing an intervention provided by a pharmacist for people with epilepsy and/or their caregivers in an outpatient pharmacy setting. The abstracts and full text, when necessary, were reviewed by two investigators to assess eligibility. Data were extracted from each article by two investigators using a standardized abstraction form based on the Pharmacist Patient Care Services Intervention Reporting (PaCIR) checklist. Data elements of interest included components of service, mode of service delivery, frequency, number and duration of sessions for the service, roles and responsibilities of the community pharmacist, type of community pharmacy, outcomes and measures evaluated along with data sources, and findings and results. Risk of bias was not assessed due to the descriptive nature of the review. RESULTS: Twelve articles were included, seven of which reported services conducted in the United States. The most common service reported was medication management (n = 7) followed by education and counseling (n = 4). One article described a care coordination documentation tool that could be used by pharmacists and physicians in epilepsy care. Most interventions were evaluated using observational designs (n = 5) or did not have an evaluation component (n = 4). SIGNIFICANCE: This review provides examples of community pharmacists providing care to people living with epilepsy that extend beyond dispensing medications. Findings demonstrate that there is little published evidence on community pharmacists' contributions to epilepsy care and suggest opportunities for further exploration and innovation. This review serves as the first step in a project that seeks to develop a stakeholder-driven community pharmacist integrated population health intervention for people living with epilepsy.", "year": "2021", "journal": "Epilepsy & behavior : E&B", "label": "systematic_review"}, {"pmid": "23247022", "title": "Strawberries on the brain--intracranial capillary hemangioma: two case reports and systematic literature review in children and adults.", "abstract": "BACKGROUND: Capillary hemangioma in the cranial cavity is rare. This report describes 2 additional cases presenting shortly after pregnancy and provides a systematic review summarizing clinical experience to date. METHODS: Case reports were compiled retrospectively. Patient 1 was a 28-year-old woman who presented with a simple partial seizure associated with left-sided visual distortions that progressed to a secondary generalized tonic-clonic seizure. Imaging revealed a contrast-enhancing lesion in the right temporal region adjacent to the transverse sinus, with vasogenic edema and scalloping of the inner table. The angiographic appearance suggested the correct diagnosis. Patient 2 was a 41-year-old woman who presented with progressive visual disturbance 6 months after giving birth to her second child. Subtle symptoms of headache and visual disturbance had commenced during pregnancy. Noncontrasted imaging displayed a homogenous tumor with surrounding vasogenic edema in the occipital region. PubMed and Science Citation Index were reviewed systematically for prior publications. RESULTS: Complete surgical excision was performed in both patients. Neuropathological examination confirmed benign capillary hemangioma consisting of a meshwork of capillary-sized and larger feeder vessels in both instances. Systematic review was based on 20 publications and a total of 24 patients; their clinical, radiological, and surgical features as well as management are summarized. CONCLUSIONS: At follow-up, symptoms had resolved and magnetic resonance imaging confirmed complete removal in both patients. Intracranial capillary hemangioma is rare, and treatment is empirical. Review of limited published reports suggests that surgery is the most commonly used treatment and that complete excision seems most likely to prevent further recurrence.", "year": "2013", "journal": "World neurosurgery", "label": "systematic_review"}, {"pmid": "30345535", "title": "Stereo-electroencephalography-guided radiofrequency thermocoagulation in patients with focal epilepsy: A systematic review and meta-analysis.", "abstract": "OBJECTIVE: Despite the increasing number of studies reporting results of stereo-electroencephalography (SEEG)-guided radiofrequency-thermocoagulation (SEEG-guided RF-TC) in the treatment of patients with drug-resistant focal epilepsy, the exact efficacy of this approach remains unclear. The seizure-freedom rate varies greatly across studies and the factors associated with efficacy have not been formally investigated. METHODS: All prospective or retrospective studies reporting efficacy and/or safety of SEEG-guided RF-TC in patients with drug-resistant focal epilepsy were included. The primary outcome was the seizure-free rate 1 year after the procedure. Secondary outcomes were (1) the responder rate 1 year after the procedure and (2) the proportion of patients with permanent neurologic deficit 1 year after the procedure. Each outcome was assessed in all patients and in 4 groups of patients defined by the etiology of epilepsy. Each outcome was pooled using inverse variance weighting, logit transformation of proportion, and a random-effects model. RESULTS: No prospective study was identified and a total of 6 retrospective studies, reporting efficacy and safety data of 296 patients, were included. The pooled rate of permanent neurologic deficit was 2.5% (95% confidence interval [CI] 1.2%-5.3%), without heterogeneity across studies. In contrast, both the seizure-free and responder rates varied greatly across studies, and statistical heterogeneity was high. The pooled seizure-free and responder rates were 23% (95% CI 8%-50%) and 58% (95% CI 36%-77%), respectively. Both for the seizure-free and responder rates, the greatest efficacy was observed in patients with periventricular nodular heterotopia and the lowest in patients with normal magnetic resonance imaging (MRI) findings. SIGNIFICANCE: SEEG-guided RF-TC is a safe procedure with low risk of complications. In contrast, the level of evidence regarding its efficacy remains low. Better identification of factors associated with seizure outcome are needed.", "year": "2018", "journal": "Epilepsia", "label": "meta_analysis"}, {"pmid": "23740534", "title": "Treatment of infantile spasms.", "abstract": "BACKGROUND: Infantile spasms (West's Syndrome) is a syndrome that includes a peculiar type of epileptic seizure-the spasms-and an electroencephalographic (EEG) abnormality often called hypsarrhythmia. Psychomotor retardation is frequently found at follow-up. Approximately two-thirds of affected infants will have a detectable underlying neurological abnormality, but still little is known about the pathophysiological basis for infantile spasms, and treatment remains problematic. OBJECTIVES: To compare the effects of single pharmaceutical therapies used to treat infantile spasms in terms of control of the spasms, resolution of the EEG, relapse rates, psychomotor development, subsequent epilepsy, side effects, and mortality. SEARCH METHODS: To identify published data, we searched the Cochrane Epilepsy Group Specialised Register (October 2012), CENTRAL (The Cochrane Library 2012, Issue 9), MEDLINE (1946 to September Week 4, 2012), EMBASE (1980 to March 2003), and the reference lists of all retrieved articles.To identify unpublished data, we searched the ISRCTN Register (www.controlled-trials.com), corresponded with colleagues and drug companies, and made requests at international conferences. SELECTION CRITERIA: All randomised controlled trials (RCTs) of the administration of drug therapy to patients with infantile spasms. DATA COLLECTION AND ANALYSIS: Data collection from all relevant publications was independently undertaken by three review authors (before 2010) or by two review authors using a standard proforma. Analysis included assessment of study quality and a search for sources of heterogeneity. MAIN RESULTS: We found 16 small RCTs (fewer than 100 patients enrolled) and 2 larger RCTs (more than 100 patients enrolled). These 18 studies looked at a total of 916 patients treated with a total of 12 different pharmaceutical agents. Overall methodology of the studies was poor, in part because of ethical dilemmas such as giving placebo injections to children. Two studies showed that placebo was not as good as active treatment in resolving the spasms. The strongest evidence suggested that hormonal treatment (prednisolone or tetracosactide depot) leads to resolution of spasms faster and in more infants than does vigabatrin. Responses without subsequent relapse may be no different. The same study suggests that hormonal treatments might improve the long-term developmental outcome compared with vigabatrin in infants not found to have an underlying cause for their infantile spasms. AUTHORS' CONCLUSIONS: To date, few well-designed RCTs have considered the treatment of infantile spasms, and the numbers of patients enrolled have been small. In the majority, methodology has been poor, hence it is not clear which treatment is optimal in the treatment of this epilepsy syndrome. Hormonal treatment resolves spasms in more infants than vigabatrin, but this may or may not translate into better long-term outcomes. If prednisolone or vigabatrin is used, high dosage is recommended. Vigabatrin may be the treatment of choice in tuberous sclerosis. Resolution of the EEG features may be important, but this has not been proven. Further research using large studies with robust methodology is required.", "year": "2013", "journal": "The Cochrane database of systematic reviews", "label": "meta_analysis"}, {"pmid": "35644830", "title": "Side effects of long-term oral anti-seizure drugs on thyroid hormones in patients with epilepsy: a systematic review and network meta-analysis.", "abstract": "INTRODUCTION: Anti-seizure drugs have long been known to affect thyroid hormone levels in epilepsy patients. The current study is a network meta-analysis designed to produce a systematic review and comprehensive evaluation of thyroid hormone changes to inform future research and clinical treatment. METHOD: A systematic search of databases, PubMed, EMBASE, Web of Science, and the Cochrane Library, was conducted and all observational studies reporting thyroid hormone levels in epilepsy patients receiving monotherapy and controls were included. Stata MP.14 was used for analysis. RESULTS: A total of 35 studies, including 4135 participants and 8 anti-seizure drugs, were analyzed. TSH levels were elevated following use of topiramate [mean = 1.86; 95%CI: 0.83 to 2.90], levetiracetam [mean = 1.08; 95%CI: 0.07 to 2.09], and valproic acid [mean = 1.54; 95%CI: 0.58 to 2.50]. FT4 levels may be lowered by oxcarbazepine [mean =  - 6.13; 95%CI: - 8.25 to - 4.02] and T4 was lowered by carbamazepine [mean =  - 1.55; 95%CI: - 2.05 to - 1.05] and phenytoin [mean =  - 1.33; 95%CI: - 1.80 to - 0.85]. No significant changes were reported for FT3, although use of phenobarbital resulted in a non-significant decrease [mean =  - 0.31; 95%CI: - 0.99 to 0.37]. T3 levels were lowered by carbamazepine [mean =  - 0.52; 95%CI: - 0.81 to - 0.24]. Lamotrigine had no significant effect on thyroid hormone levels. CONCLUSION: Carbamazepine and phenytoin were the drugs most strongly associated with decreases in T4 and T3 levels while topiramate had the greatest elevating effect on TSH. Oxcarbazepine may lead to decreased serum FT4 and FT3, an effect relevant to central hypothyroidism. Phenobarbital appeared to significantly lower FT3. Use of levetiracetam and valproic acid may result in subclinical hypothyroidism. The anti-seizure drug with the least disruptive effect on thyroid hormone levels was found to be lamotrigine.", "year": "2022", "journal": "Neurological sciences : official journal of the Italian Neurological Society and of the Italian Society of Clinical Neurophysiology", "label": "meta_analysis"}, {"pmid": "31996452", "title": "Seizure outcome of pediatric epilepsy surgery: Systematic review and meta-analyses.", "abstract": "OBJECTIVE: This systematic review and meta-analyses assessed seizure outcome following pediatric epilepsy surgery. METHODS: MEDLINE, EMBASE, and Cochrane were searched for pediatric epilepsy surgery original research from 1990 to 2017. The outcome was seizure freedom at 12 months or longer follow-up. Using random-effects models, the effect sizes for controlled studies, uncontrolled studies on surgery locations (temporal lobe [TL], extratemporal lobe [ETL], or hemispheric surgery), pathologies, nonlesional epilepsy, and incomplete resection were estimated. Meta-regression assessed the relationship between age at surgery, age at seizure onset, and seizure outcome. Random-effects network meta-analysis was conducted for surgery locations. RESULTS: Two hundred fifty-eight studies were included. Surgery achieved higher seizure freedom than medical therapy (odds ratio [OR] = 6.49 [95% confidence interval [CI]: 2.87-14.70], <i>p</i> < 0.001). Seizure freedom declined over time after surgery, from 64.8% (95% CI: 51.2%-76.4%; <i>p</i> = 0.034) at 1 year, to 60.3% (95% CI: 52.9%-67.4%; <i>p</i> = 0.007) at 5 years, and to 39.7% (95% CI: 28.4%-52.2%, <i>p</i> = 0.106) at 10 years. Seizure freedom was (1) highest for hemispheric surgery, followed by TL and ETL surgery, and (2) highest for tumor and lower for malformations of cortical development. Seizure freedom was lower for nonlesional than lesional epilepsy (OR = 0.54 [95% CI: 0.34, 0.88], <i>p</i> = 0.013) and incomplete than complete resection (OR = 0.13 [95% CI: 0.08, 0.21], <i>p</i> < 0.001). Age at surgery and age at seizure onset were associated with seizure freedom for mixed pathologies and surgery locations and TL surgery. CONCLUSION: Epilepsy surgery was more effective than medical therapy to control seizures. Understanding seizure outcomes of different surgery locations, pathologies, nonlesional epilepsy, and incomplete resection will assist with presurgical counseling.", "year": "2020", "journal": "Neurology", "label": "meta_analysis"}, {"pmid": "38031640", "title": "Long-term intellectual and developmental outcomes after pediatric epilepsy surgery: A systematic review and meta-analysis.", "abstract": "In addition to the primary aim of seizure freedom, a key secondary aim of pediatric epilepsy surgery is to stabilize and, potentially, optimize cognitive development. Although the efficacy of surgical treatment for seizure control has been established, the long-term intellectual and developmental trajectories are yet to be delineated. We conducted a systematic review and meta-analysis of studies reporting pre- and postsurgical intelligence or developmental quotients (IQ/DQ) of children with focal lesional epilepsy aged ≤18 years at epilepsy surgery and assessed at >2 years after surgery. We determined the IQ/DQ change and conducted a random-effects meta-analysis and meta-regression to assess its determinants. We included 15 studies reporting on 341 patients. The weighted mean age at surgery was 7.1 years (range = .3-13.8). The weighted mean postsurgical follow-up duration was 5.6 years (range = 2.7-12.8). The overall estimate of the mean presurgical IQ/DQ was 60 (95% confidence interval [CI] = 47-73), the postsurgical IQ/DQ was 61 (95% CI = 48-73), and the change was +.94 IQ/DQ (95% CI = -1.70 to 3.58, p = .486). Children with presurgical IQ/DQ ≥ 70 showed a tendency for higher gains than those with presurgical IQ/DQ < 70 (p = .059). Higher gains were determined by cessation of antiseizure medication (ASM; p = .041), not just seizure freedom. Our findings indicate, on average, stabilization of intellectual and developmental functioning at long-term follow-up after epilepsy surgery. Once seizure freedom has been achieved, ASM cessation enables the optimization of intellectual and developmental trajectories in affected children.", "year": "2024", "journal": "Epilepsia", "label": "meta_analysis"}, {"pmid": "38334331", "title": "Myoclonus: Differential diagnosis and current management.", "abstract": "Myoclonus classically presents as a brief (10-50 ms duration), non-rhythmic jerk movement. The etiology could vary considerably ranging from self-limited to chronic or even progressive disorders, the latter falling into encephalopathic pictures that need a prompt diagnosis. Beyond the etiological classification, others evaluate myoclonus' body distribution (i.e., clinical classification) or the location of the generator (i.e., neurophysiological classification); particularly, knowing the anatomical source of myoclonus gives inputs on the observable clinical patterns, such as EMG bursts duration or EEG correlate, and guides the therapeutic choices. Among all the chronic disorders, myoclonus often presents itself as a manifestation of epilepsy. In this context, myoclonus has many facets. Myoclonus occurs as one, or the only, seizure manifestation while it can also present as a peculiar type of movement disorder; moreover, its electroclinical features within specific genetically determined epileptic syndromes have seldom been investigated. In this review, following a meeting of recognized experts, we provide an up-to-date overview of the neurophysiology and nosology surrounding myoclonus. Through the dedicated exploration of epileptic syndromes, coupled with pragmatic guidance, we aim to furnish clinicians and researchers alike with practical advice for heightened diagnostic management and refined treatment strategies. PLAIN LANGUAGE SUMMARY: In this work, we described myoclonus, a movement characterized by brief, shock-like jerks. Myoclonus could be present in different diseases and its correct diagnosis helps treatment.", "year": "2024", "journal": "Epilepsia open", "label": "narrative_review"}, {"pmid": "25127370", "title": "Clinical correlates of graph theory findings in temporal lobe epilepsy.", "abstract": "PURPOSE: Temporal lobe epilepsy (TLE) is considered a brain network disorder, additionally representing the most common form of pharmaco-resistant epilepsy in adults. There is increasing evidence that seizures in TLE arise from abnormal epileptogenic networks, which extend beyond the clinico-radiologically determined epileptogenic zone and may contribute to the failure rate of 30-50% following epilepsy surgery. Graph theory allows for a network-based representation of TLE brain networks using several neuroimaging and electrophysiologic modalities, and has potential to provide clinicians with clinically useful biomarkers for diagnostic and prognostic purposes. METHODS: We performed a review of the current state of graph theory findings in TLE as they pertain to localization of the epileptogenic zone, prediction of pre- and post-surgical seizure frequency and cognitive performance, and monitoring cognitive decline in TLE. RESULTS: Although different neuroimaging and electrophysiologic modalities have yielded occasionally conflicting results, several potential biomarkers have been characterized for identifying the epileptogenic zone, pre-/post-surgical seizure prediction, and assessing cognitive performance. For localization, graph theory measures of centrality have shown the most potential, including betweenness centrality, outdegree, and graph index complexity, whereas for prediction of seizure frequency, measures of synchronizability have shown the most potential. The utility of clustering coefficient and characteristic path length for assessing cognitive performance in TLE is also discussed. CONCLUSIONS: Future studies integrating data from multiple modalities and testing predictive models are needed to clarify findings and develop graph theory for its clinical utility.", "year": "2014", "journal": "Seizure", "label": "narrative_review"}, {"pmid": "17241205", "title": "The epileptology of John Thompson Dickson (1841-1874).", "abstract": "PURPOSE: To document John Thompson Dickson's interpretation of epileptogenesis, published between 1869 and 1874, and to compare it with John Hughlings Jackson's contemporaneous thought. METHOD: Examination of the relevant contemporary English language medical literature. RESULTS: Dickson probably built on Samuel Wilks's interpretation of epileptic seizure mechanisms to develop a reasonably comprehensive hypothesis of epileptogenesis that was in advance of Jackson's thought on the matter, and was in many respects consistent with present-day concepts, at least in relation to the focal epilepsies. CONCLUSION: Dickson's untimely death probably prevented his concept of epileptogenesis from being more widely appreciated.", "year": "2007", "journal": "Epilepsia", "label": "narrative_review"}, {"pmid": "2538796", "title": "Infantile spasms.", "abstract": "Infantile spasms constitute a relatively rare disorder of infancy and early childhood; their onset is usually within the first 6 to 8 months of life. A large percentage of patients with this disorder (85-90 per cent) show various degrees of retardation. Infantile spasms typically occur in clusters immediately on arousal, or soon thereafter, but rarely occur while the infant is actually asleep. The usual interictal EEG pattern associated with infantile spasms is hypsarrhythmia, but infantile spasms may occur in the absence of this EEG pattern. The pathophysiology of infantile spasms is not known, but recent evidence suggests that certain regions in the brain stem that are associated with sleep cycling may be responsible for the clinical and EEG manifestations of this disorder. At present, the only known effective treatment for infantile spasms is ACTH or corticosteroids. The therapeutic efficacy of these two agents is relatively equal, and one drug may be effective if the other drug fails. The effectiveness of certain traditional anticonvulsants (valproic acid and the benzodiazepines) and pyridoxine in the treatment of infantile spasms has not been adequately assessed. The long-term mental and developmental outcome of patients with infantile spasms is poor. The only factor that appears to be important in terms of long-term outcome is whether the patient is initially classified as cryptogenic or symptomatic, with the cryptogenic patients having the better outcomes. Approximately half of the infantile spasm patients will continue to have other types of seizures after their spasms stop.", "year": "1989", "journal": "Pediatric clinics of North America", "label": "narrative_review"}, {"pmid": "24798409", "title": "The societal integration of individuals with epilepsy: perspectives for the 21st century.", "abstract": "Epilepsy is a common neurologic disorder seen throughout the world. Advances in therapy have made it possible for persons with epilepsy (PWEs) to have improved seizure control and a better quality of life. However, it is not entirely clear whether this has resulted in their successful integration into society. This review examines the societal integration of PWEs, identifying both the progress made and the challenges that continue to hamper further advances. In general, PWEs are more integrated in western-oriented cultures. However, there continue to be ongoing difficulties due to poor education and intellectual functioning, poor social and family support, the undertreatment of coexisting psychiatric conditions, transportation and mobility limitations, and problems obtaining employment. This review also discusses the effects of low socioeconomic status on integration and the persisting prejudices that affect certain racial groups. Most importantly, this review underscores the fact that societal stigma towards PWEs is still very much alive. At the beginning of the 21st century, PWEs still encounter difficulties in their quest for full societal integration. Along with medical advances being made to improve seizure control, much still has to be done to bring about the reforms necessary to help PWEs live more meaningful and productive lives.", "year": "2014", "journal": "Epilepsy & behavior : E&B", "label": "narrative_review"}, {"pmid": "25637362", "title": "French recommendations on electroencephalography.", "abstract": "Electroencephalography allows the functional analysis of electrical brain cortical activity and is the gold standard for analyzing electrophysiological processes involved in epilepsy but also in several other dysfunctions of the central nervous system. Morphological imaging yields complementary data, yet it cannot replace the essential functional analysis tool that is EEG. Furthermore, EEG has the great advantage of being non-invasive, easy to perform and allows repeat testing when follow-up is necessary, even at the patient's bedside. Faced with advances in knowledge, techniques and indications, the Société de neurophysiologie clinique de langue française (SNCLF) and the Ligue française contre l'épilepsie (LFCE) found it necessary to provide an update on EEG recommendations. This article will review the methodology applied to this work, refine the various topics detailed in the following chapters. It will go over the summary of recommendations for each of these chapters and highlight proposals for writing an EEG report. Some questions could not be answered by review of the literature; in such cases, in addition to the guidelines the working and reading groups provided their expert opinion.", "year": "2015", "journal": "Neurophysiologie clinique = Clinical neurophysiology", "label": "guidelines_consensus"}, {"pmid": "29319369", "title": "The ILAE classification of seizures and epilepsies: implications for the clinic.", "abstract": "The classification of epileptic seizures and the epilepsies has recently been revised by the International League Against Epilepsy (ILAE) and a new classification scheme issued. Areas covered: The new classification scheme has been critically appraised in the light of the previous classifications and subsequent revisions. The purposes of the classification and its potential use have been extensively discussed. Expert commentary: This ILAE classification scheme, the latest of a series of proposals published in the last 30 years, has made progress as it has a multi-level structure (seizure types, epilepsy types, epilepsy syndromes) allowing for differing uses and combines the previously separate seizure types and epilepsies schemes into a single instrument. Seizures and epilepsies can also be classified based on the available diagnostic aids, which may differ substantially between counties with mature economies and resource-poor countries. An intrinsic limitation of the classification, however, is the attempt to box cases as seen in clinical practice into schematic categories, leaving no room for variants and atypical clinical presentations. Another limitation is the lack of flexibility which hampers the ability to link the instrument to the preceding classifications in order to preserve continuity and monitor disease trends in time and space.", "year": "2018", "journal": "Expert review of neurotherapeutics", "label": "guidelines_consensus"}, {"pmid": "16776494", "title": "Role of valproate across the ages. Treatment of epilepsy in the elderly.", "abstract": "In June 2005, a team of experts participated in a workshop with the objective of reaching agreement on several important aspects of valproate in the treatment of elderly patients with epilepsy. Epilepsy in the elderly is relatively common and its incidence increases for each decade after age 60. The aetiology and manifestations of epilepsies in the elderly are complex because of comorbidity and other underlying risk factors. A consensus was reached that elderly patients who present with a seizure disorder should be referred rapidly to a specialist and that diagnosis should be improved by using a multidisciplinary team of cardiologists, neurologists and epilepsy experts (syncope, falls and seizure specialists). This is especially important to avoid mistreatment with antiepileptic drugs (AEDs). There was consensus that the elderly are generally more susceptible to the adverse effects of AEDs than younger adults. For these reasons, in older persons AEDs should be started at low dosages, and titrated slowly according to clinical response. Some of the most troublesome side effects of AEDs in the elderly include sedation and cognitive side effects, as well as osteoporosis. Drug-drug interactions should be given special consideration. There was consensus that the pharmacokinetics of all AEDs are altered in the elderly, and that the most significant change common to all AEDs is a moderate reduction in renal and metabolic clearance. Predicting pharmacokinetic changes in the individual, however, can be very difficult because multiple factors contribute to a high inter-patient variability. There was agreement on the advantages and disadvantages of the use of valproate in the elderly, and consensus that valproate is a useful option in this population. There was no consensus, however, on whether valproate should be considered among the preferred first-line treatments in the elderly.", "year": "2006", "journal": "Acta neurologica Scandinavica. Supplementum", "label": "guidelines_consensus"}, {"pmid": "23342767", "title": "Recommendations for rescue of a submerged unresponsive compressed-gas diver.", "abstract": "The Diving Committee of the Undersea and Hyperbaric Medical Society has reviewed available evidence in relation to the medical aspects of rescuing a submerged unresponsive compressed-gas diver. The rescue process has been subdivided into three phases, and relevant questions have been addressed as follows. Phase 1, preparation for ascent: If the regulator is out of the mouth, should it be replaced? If the diver is in the tonic or clonic phase of a seizure, should the ascent be delayed until the clonic phase has subsided? Are there any special considerations for rescuing rebreather divers? Phase 2, retrieval to the surface: What is a \"safe\" ascent rate? If the rescuer has a decompression obligation, should they take the victim to the surface? If the regulator is in the mouth and the victim is breathing, does this change the ascent procedures? If the regulator is in the mouth, the victim is breathing, and the victim has a decompression obligation, does this change the ascent procedures? Is it necessary to hold the victim's head in a particular position? Is it necessary to press on the victim's chest to ensure exhalation? Are there any special considerations for rescuing rebreather divers? Phase 3, procedure at the surface: Is it possible to make an assessment of breathing in the water? Can effective rescue breaths be delivered in the water? What is the likelihood of persistent circulation after respiratory arrest? Does the recent advocacy for \"compression-only resuscitation\" suggest that rescue breaths should not be administered to a non-breathing diver? What rules should guide the relative priority of in-water rescue breaths over accessing surface support where definitive CPR can be started? A \"best practice\" decision tree for submerged diver rescue has been proposed.", "year": "2012", "journal": "Undersea & hyperbaric medicine : journal of the Undersea and Hyperbaric Medical Society, Inc", "label": "guidelines_consensus"}, {"pmid": "28077494", "title": "Practice guideline summary: Use of fMRI in the presurgical evaluation of patients with epilepsy: Report of the Guideline Development, Dissemination, and Implementation Subcommittee of the American Academy of Neurology.", "abstract": "OBJECTIVE: To assess the diagnostic accuracy and prognostic value of functional MRI (fMRI) in determining lateralization and predicting postsurgical language and memory outcomes. METHODS: An 11-member panel evaluated and rated available evidence according to the 2004 American Academy of Neurology process. At least 2 panelists reviewed the full text of 172 articles and selected 37 for data extraction. Case reports, reports with <15 cases, meta-analyses, and editorials were excluded. RESULTS AND RECOMMENDATIONS: The use of fMRI may be considered an option for lateralizing language functions in place of intracarotid amobarbital procedure (IAP) in patients with medial temporal lobe epilepsy (MTLE; Level C), temporal epilepsy in general (Level C), or extratemporal epilepsy (Level C). For patients with temporal neocortical epilepsy or temporal tumors, the evidence is insufficient (Level U). fMRI may be considered to predict postsurgical language deficits after anterior temporal lobe resection (Level C). The use of fMRI may be considered for lateralizing memory functions in place of IAP in patients with MTLE (Level C) but is of unclear utility in other epilepsy types (Level U). fMRI of verbal memory or language encoding should be considered for predicting verbal memory outcome (Level B). fMRI using nonverbal memory encoding may be considered for predicting visuospatial memory outcomes (Level C). Presurgical fMRI could be an adequate alternative to IAP memory testing for predicting verbal memory outcome (Level C). Clinicians should carefully advise patients of the risks and benefits of fMRI vs IAP during discussions concerning choice of specific modality in each case.", "year": "2017", "journal": "Neurology", "label": "guidelines_consensus"}, {"pmid": "20603487", "title": "Psychogenic nonepileptic \"seizures\" or \"attacks\"? It's not just semantics: attacks.", "abstract": "Since the phrase \"psychogenic nonepileptic seizures\" has been the term of choice, it has become clear that the word \"seizure\" here creates confusion. Beyond theoretical arguments, the confusion it creates is detrimental to patients' and families' understanding of the diagnosis, which in turn has a negative impact on treatment.", "year": "2010", "journal": "Neurology", "label": "editorial_letter_commentary"}, {"pmid": "36876373", "title": "Predictors of response to vagus nerve stimulation in drug resistant epilepsy.", "abstract": "LETTER TO EDITOR Keywords.", "year": "2023", "journal": "Bratislavske lekarske listy", "label": "editorial_letter_commentary"}, {"pmid": "31441503", "title": "Does APC/C<sup>CDH1</sup> control the human brain size?: An Editorial Highligh
