<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Output Validation — Epilepsy PubMed Study</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-light: #eef2ff;
    --approve: #22c55e;
    --approve-bg: #f0fdf4;
    --reject: #ef4444;
    --reject-bg: #fef2f2;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.12);
  }
  .dark {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #818cf8;
    --accent-light: #1e1b4b;
    --approve: #4ade80;
    --approve-bg: #052e16;
    --reject: #f87171;
    --reject-bg: #450a0a;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header-top h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .header-top span.subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-left: 10px;
  }

  /* ── Progress ── */
  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-row-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
  }
  .progress-bar-bg {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .3s ease;
  }
  .progress-bar-fill.pico-fill { background: #22c55e; }
  .progress-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
    border: 1px solid var(--border);
    width: fit-content;
  }
  .tab-btn {
    padding: 7px 18px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: var(--shadow);
  }
  .tab-btn .count {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    border-radius: 99px;
    font-size: 11px;
    padding: 1px 6px;
    margin-left: 4px;
    font-weight: 600;
  }
  .tab-btn.active .count { background: var(--accent-light); color: var(--accent); }

  /* ── Main layout ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 120px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    display: none;
  }
  .card.visible { display: block; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .label-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-trial   { background: #dcfce7; color: #166534; }
  .badge-review  { background: #dbeafe; color: #1e40af; }
  .badge-other   { background: #f1f5f9; color: #475569; }

  .card-meta {
    font-size: 13px;
    color: var(--muted);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 12px;
  }
  .pmid-tag {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── Abstract ── */
  .abstract-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .abstract-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
  }

  /* ── PICO chips ── */
  .pico-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .pico-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .pico-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pico-P .pico-key { background: #dbeafe; color: #1e40af; }
  .pico-I .pico-key { background: #dcfce7; color: #166534; }
  .pico-C .pico-key { background: #fef9c3; color: #854d0e; }
  .pico-O .pico-key { background: #ede9fe; color: #5b21b6; }
  .pico-N .pico-key { background: #ffedd5; color: #9a3412; }
  .pico-val {
    font-size: 14px;
    line-height: 1.5;
    padding: 3px 10px;
    border-radius: 8px;
    flex: 1;
  }
  .pico-P .pico-val { background: #dbeafe22; }
  .pico-I .pico-val { background: #dcfce722; }
  .pico-C .pico-val { background: #fef9c322; }
  .pico-O .pico-val { background: #ede9fe22; }
  .pico-N .pico-val { background: #ffedd522; }
  .pico-val.na { color: var(--muted); font-style: italic; }

  /* Dark mode: PICO badges */
  .dark .badge-trial  { background: #14532d; color: #86efac; }
  .dark .badge-review { background: #1e3a5f; color: #93c5fd; }
  .dark .badge-other  { background: #1e293b; color: #94a3b8; }
  /* Dark mode: PICO key badges */
  .dark .pico-P .pico-key { background: #1e3a5f; color: #93c5fd; }
  .dark .pico-I .pico-key { background: #14532d; color: #86efac; }
  .dark .pico-C .pico-key { background: #422006; color: #fde047; }
  .dark .pico-O .pico-key { background: #2e1065; color: #c4b5fd; }
  .dark .pico-N .pico-key { background: #431407; color: #fdba74; }
  /* Dark mode: PICO val tints */
  .dark .pico-P .pico-val { background: #1e3a5f44; }
  .dark .pico-I .pico-val { background: #14532d44; }
  .dark .pico-C .pico-val { background: #42200644; }
  .dark .pico-O .pico-val { background: #2e106544; }
  .dark .pico-N .pico-val { background: #43140744; }

  /* ── Abstract highlights (mark) ── */
  mark.pico-P { background: #dbeafe; border-radius: 3px; padding: 1px 2px; outline: 1px solid #93c5fd; color: inherit; }
  mark.pico-I { background: #dcfce7; border-radius: 3px; padding: 1px 2px; outline: 1px solid #86efac; color: inherit; }
  mark.pico-C { background: #fef9c3; border-radius: 3px; padding: 1px 2px; outline: 1px solid #fde047; color: inherit; }
  mark.pico-O { background: #ede9fe; border-radius: 3px; padding: 1px 2px; outline: 1px solid #c4b5fd; color: inherit; }
  mark.pico-N { background: #ffedd5; border-radius: 3px; padding: 1px 2px; outline: 1px solid #fdba74; color: inherit; }
  .dark mark.pico-P { background: #1e3a5f; outline-color: #3b82f6; }
  .dark mark.pico-I { background: #14532d; outline-color: #22c55e; }
  .dark mark.pico-C { background: #422006; outline-color: #ca8a04; }
  .dark mark.pico-O { background: #2e1065; outline-color: #7c3aed; }
  .dark mark.pico-N { background: #431407; outline-color: #ea580c; }

  /* ── Dark mode toggle button ── */
  .dm-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    transition: background .15s;
    flex-shrink: 0;
  }
  .dm-btn:hover { background: var(--bg); }

  /* ── Rating buttons ── */
  .rating-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  .rate-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    color: var(--muted);
    position: relative;
  }
  .key-hint {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    opacity: 0.45;
    font-family: monospace;
  }
  .rate-btn:hover { border-color: var(--muted); }
  .rate-btn.approve.selected {
    border-color: var(--approve);
    background: var(--approve-bg);
    color: var(--approve);
  }
  .rate-btn.reject.selected {
    border-color: var(--reject);
    background: var(--reject-bg);
    color: var(--reject);
  }
  .rate-label { font-size: 13px; }

  .pico-row.na-row { opacity: 0.45; }
  .rate-btn.sm {
    padding: 5px 11px;
    font-size: 14px;
    flex-shrink: 0;
  }

  /* ── Navigation ── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: all .15s;
    box-shadow: var(--shadow);
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .card-counter {
    font-size: 13px;
    color: var(--muted);
  }

  /* ── Download button ── */
  .download-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .dl-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    transition: all .15s;
  }
  .dl-btn.primary {
    background: var(--accent);
    color: #fff;
  }
  .dl-btn.primary:hover { background: #4f46e5; }
  .dl-btn.primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .dl-btn.secondary {
    background: var(--surface);
    color: var(--accent);
    border: 1.5px solid var(--accent);
    font-size: 13px;
    padding: 9px 16px;
  }
  .dl-btn.secondary:hover { background: var(--accent-light); }
  .dl-complete-note {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-right: 4px;
  }

  /* ── Empty / section headers ── */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>LLM Output Validation</h1>
      <span class="subtitle">Epilepsy PubMed study · seed=42</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cls')" id="tab-cls">
          Classification <span class="count" id="cls-count">0/105</span>
        </button>
        <button class="tab-btn" onclick="switchTab('pico')" id="tab-pico">
          PICO Extraction <span class="count" id="pico-count">0/25</span>
        </button>
      </div>
      <button class="dm-btn" id="dm-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-row-label">Classification</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="cls-progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="cls-progress-label">0 / 105</span>
    </div>
    <div class="progress-row">
      <span class="progress-row-label">PICO</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill pico-fill" id="pico-progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="pico-progress-label">0 / 25</span>
    </div>
  </div>
</header>

<main>
  <div id="cls-section">
    <div class="section-title">Classification validation</div>
    <div id="cls-cards"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="cls-prev" onclick="navigate('cls',-1)">&#8592; Prev</button>
      <span class="card-counter" id="cls-counter"></span>
      <button class="nav-btn" id="cls-next" onclick="navigate('cls',1)">Next &#8594;</button>
    </div>
  </div>

  <div id="pico-section" style="display:none">
    <div class="section-title">PICO+N validation (highlighted text in abstract just for help with screening!)</div>
    <div id="pico-cards"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="pico-prev" onclick="navigate('pico',-1)">&#8592; Prev</button>
      <span class="card-counter" id="pico-counter"></span>
      <button class="nav-btn" id="pico-next" onclick="navigate('pico',1)">Next &#8594;</button>
    </div>
  </div>
</main>

<input type="file" id="upload-input" accept=".json" style="display:none" onchange="handleUpload(event)">
<div class="download-fab">
  <div class="dl-complete-note" id="dl-note"></div>
  <button class="dl-btn secondary" onclick="document.getElementById('upload-input').click()">&#11014; Load saved ratings</button>
  <button class="dl-btn secondary" onclick="downloadJSON(true)">Download partial JSON</button>
  <button class="dl-btn primary" id="dl-full" onclick="downloadJSON(false)">&#11015; Download ratings (JSON)</button>
</div>

<script>
// ── Embedded data ──────────────────────────────────────────────────────────────
const CLS_DATA   = [{"pmid": "6382068", "title": "Progabide as an add-on drug for epilepsy refractory to high dose antiepileptic drug therapy.", "abstract": "In a double-blind cross-over add-on trial an average daily dose of 2100 mg progabide or placebo were given for 3 months each as adjunctive therapy to 11 patients with intractable complex partial seizures uncontrolled by a high-dose regimen of either carbamazepine, phenobarbital, phenytoin or primidone. A reduction or an increase in seizure frequency by more than 50% was seen in one patient each. Mild transient sedative side effects were observed in two patients. The plasma concentrations of the concomitant antiepileptic drugs remained unchanged. Progabide appears to be as effective as primary antiepileptic drug for adjunctive therapy in partial epilepsy refractory to previous high-dose therapy. Progabide does not seem to be the drug urgently needed for failures of standard therapy despite its few side effects.", "year": "1984", "journal": "Neuroscience letters", "label": "randomized_controlled_trial"}, {"pmid": "16053475", "title": "The long-term safety and tolerability of high-dose interferon beta-1a in relapsing-remitting multiple sclerosis: 4-year data from the PRISMS study.", "abstract": "In the prevention of relapses and disability by interferon subcutaneously in multiple sclerosis (PRISMS) study, 560 patients with relapsing-remitting multiple sclerosis were randomized to receive subcutaneous interferon (IFN) beta-1a, 22 or 44 mug three times weekly, or placebo, for 2 years. Patients receiving placebo were then re-randomized to one of the two doses of IFN beta-1a for a further 2 years, whilst patients receiving active treatment continued their original treatment. Safety assessments were performed throughout the study. The most common adverse events for patients originally randomized to active treatment were injection-site inflammation (72% of patients had at least one event), headache (71%) and influenza-like symptoms (69%). These were generally mild in nature and most frequent during the first month of treatment. The 4-year adverse event profiles for the two IFN beta-1a doses were comparable with those observed during the initial phase of the study and, for the most part, with each other. There was no association between IFN beta-1a and depression or suicide/attempted suicide. The most common laboratory abnormalities were asymptomatic lymphopenia and elevated serum liver transaminase levels. These were generally mild and resolved spontaneously. Therapy with subcutaneous IFN beta-1a three times weekly for up to 4 years was well tolerated without dose-limiting safety concerns.", "year": "2005", "journal": "European journal of neurology", "label": "randomized_controlled_trial"}, {"pmid": "10985231", "title": "Unit-treatment interaction and its practical consequences.", "abstract": "Most statistical characterizations of a treatment effect focus on the average effect of the treatment over an entire population. However, average effects may provide inadequate information, sometimes misleading information, when a substantial unit-treatment interaction is present in the population. It is even possible that a nonnegligible proportion of the individuals in the population experience an unfavorable treatment effect even though the treatment might appear to be beneficial when considering population averages. This paper examines the extent to which information about unit-treatment interaction can be extracted using observed data from a two-treatment completely randomized experiment. A method for utilizing the information from an available covariate is proposed. Although unit-treatment interaction is a nonidentifiable quantity, we show that mathematical bounds for it can be estimated from observed data. These bounds lead to estimated bounds for the probability of an unfavorable treatment effect. Maximum likelihood estimators of the bounds and their corresponding large-sample distributions are given. The use of the estimated bounds is illustrated in a clinical trials data example.", "year": "2000", "journal": "Biometrics", "label": "randomized_controlled_trial"}, {"pmid": "23648518", "title": "Different propofol-remifentanil or sevoflurane-remifentanil bispectral index levels for electrocorticographic spike identification during epilepsy surgery.", "abstract": "BACKGROUND: Medical therapy, the cornerstone of managing epilepsy, still fails a substantial portion of patients. Little information is available regarding the potential impact of different bispectral index (BIS) levels on electrocorticographic spike identification for surgical epileptic foci resection. METHODS: Twenty-two intractable epilepsy subjects were randomly allocated to the propofol-remifentanil or sevoflurane-remifentanil groups, and were further randomized to four BIS85 (BIS 71-85), BIS70 (BIS 56-70), BIS55 (BIS 41-55), and BIS40 (BIS ≤40) sequence order. RESULTS: Two-way ANOVA revealed no differences between groups in spike frequency (P = 0.720), spike amplitude (P = 0.647), or number of spiking leads (P = 0.653). In the propofol and sevoflurane groups, decreasing BIS levels increased mean ± SD spike/min frequency (P < 0.001 and P < 0.001) at BIS85 (10 ± 12 and 10 ± 8), BIS70 (19 ± 17 and 17 ± 15), BIS55 (22 ± 17 and 18 ± 8), and BIS40 (25 ± 15 and 23 ± 17). Furthermore, in the propofol and sevoflurane groups, decreasing BIS levels increased spike microvolt amplitude (P = 0.006 and P = 0.009) at BIS85 (1,100 ± 400 and 750 ± 400), BIS70 (1,200 ± 460 and 850 ± 490), BIS55 (1,300 ± 560 and 940 ± 700), and BIS40 (1,400 ± 570 and 1,300 ± 700). Whereas, in the propofol and sevoflurane groups, there was no difference in the location or number of spiking leads (P = 0.057 and P = 0.109) at the four BIS levels. Compared with BIS85, spike frequency in the propofol and sevoflurane groups increased 100 and 170% at BIS70, 116 and 180% at BIS55, and 132 and 230% at BIS40. Compared with BIS85, spike amplitude increased 108 and 113% at BIS70, 121 and 125% at BIS55, and 128 and 170% at BIS40. CONCLUSION: Decreasing BIS levels in the propofol and sevoflurane groups enhanced epileptogenic spike frequency and amplitude with the same location and number of spiking leads.", "year": "2013", "journal": "Anesthesiology", "label": "randomized_controlled_trial"}, {"pmid": "22396514", "title": "Early surgical therapy for drug-resistant temporal lobe epilepsy: a randomized trial.", "abstract": "CONTEXT: Despite reported success, surgery for pharmacoresistant seizures is often seen as a last resort. Patients are typically referred for surgery after 20 years of seizures, often too late to avoid significant disability and premature death. OBJECTIVE: We sought to determine whether surgery soon after failure of 2 antiepileptic drug (AED) trials is superior to continued medical management in controlling seizures and improving quality of life (QOL). DESIGN, SETTING, AND PARTICIPANTS: The Early Randomized Surgical Epilepsy Trial (ERSET) is a multicenter, controlled, parallel-group clinical trial performed at 16 US epilepsy surgery centers. The 38 participants (18 men and 20 women; aged ≥12 years) had mesial temporal lobe epilepsy (MTLE) and disabling seizues for no more than 2 consecutive years following adequate trials of 2 brand-name AEDs. Eligibility for anteromesial temporal resection (AMTR) was based on a standardized presurgical evaluation protocol. Participants were randomized to continued AED treatment or AMTR 2003-2007, and observed for 2 years. Planned enrollment was 200, but the trial was halted prematurely due to slow accrual. INTERVENTION: Receipt of continued AED treatment (n = 23) or a standardized AMTR plus AED treatment (n = 15). In the medical group, 7 participants underwent AMTR prior to the end of follow-up and 1 participant in the surgical group never received surgery. MAIN OUTCOME MEASURES: The primary outcome variable was freedom from disabling seizures during year 2 of follow-up. Secondary outcome variables were health-related QOL (measured primarily by the 2-year change in the Quality of Life in Epilepsy 89 [QOLIE-89] overall T-score), cognitive function, and social adaptation. RESULTS: Zero of 23 participants in the medical group and 11 of 15 in the surgical group were seizure free during year 2 of follow-up (odds ratio = ∞; 95% CI, 11.8 to ∞; P < .001). In an intention-to-treat analysis, the mean improvement in QOLIE-89 overall T-score was higher in the surgical group than in the medical group but this difference was not statistically significant (12.6 vs 4.0 points; treatment effect = 8.5; 95% CI, -1.0 to 18.1; P = .08). When data obtained after surgery from participants in the medical group were excluded, the effect of surgery on QOL was significant (12.8 vs 2.8 points; treatment effect = 9.9; 95% CI, 2.2 to 17.7; P = .01). Memory decline (assessed using the Rey Auditory Verbal Learning Test) occurred in 4 participants (36%) after surgery, consistent with rates seen in the literature; but the sample was too small to permit definitive conclusions about treatment group differences in cognitive outcomes. Adverse events included a transient neurologic deficit attributed to a magnetic resonance imaging-identified postoperative stroke in a participant who had surgery and 3 cases of status epilepticus in the medical group. CONCLUSIONS: Among patients with newly intractable disabling MTLE, resective surgery plus AED treatment resulted in a lower probability of seizures during year 2 of follow-up than continued AED treatment alone. Given the premature termination of the trial, the results should be interpreted with appropriate caution. TRIAL REGISTRATION: clinicaltrials.gov Identifier: NCT00040326.", "year": "2012", "journal": "JAMA", "label": "randomized_controlled_trial"}, {"pmid": "18513353", "title": "Sleep staging and respiratory events in refractory epilepsy patients: Is there a first night effect?", "abstract": "PURPOSE: We performed this analysis of possible first night effects (FNEs) on sleep and respiratory parameters in order to evaluate the need for two serial night polysomnograms (PSGs) to diagnose obstructive sleep apnea (OSA) in epilepsy patients. METHODS: As part of a pilot multicenter clinical trial investigating the effects of treating sleep apnea in epilepsy, two nights of PSG recording were performed for 40 patients with refractory epilepsy and OSA symptoms. Sleep architecture was examined in detail, along with respiratory parameters including apnea/hypopnea index (AHI) and minimum oxygen saturation. Analysis included two-tailed t-tests, Wilcox sign rank analysis, and Bland Altman measures of agreement. RESULTS: Total sleep time differed between the two nights (night 1,363.8 min + 59.4 vs. 386.3 min + 68.6, p = 0.05). Rapid eye movement (REM) sleep and percentage of REM sleep were increased during night two (night 1: 12.3% + 5.9 vs. night 2: 15.5% + 6.2, p = 0.007), and the total minutes of slow-wave sleep (SWS) were increased (night 1: 35.6 + 60.7 vs. night 2: 46.4 + 68.1, p = 0.01). No other sleep or respiratory variables differed between the two nights. Given an AHI inclusion criterion of five apneas per hour, the first PSG identified all but one patient with OSA. DISCUSSION: Respiratory parameters showed little variability between the first and second nights. Sleep architecture was mildly different between the first and second PSG night. Performing two consecutive baseline PSGs to diagnose OSA may not be routinely necessary in this population.", "year": "2008", "journal": "Epilepsia", "label": "clinical_trial_non_randomized"}, {"pmid": "15727025", "title": "[Placebo test in the diagnostics of pseudoepileptic seizures in children and adolescents].", "abstract": "THE AIM OF THE STUDY: The psychogenic pseudoepileptic seizures can be provoked by suggestion and by placebo test. This is the possibility that differentiates them with epileptic seizures, if there is a chance to record with video EEG. In the developmental age the intravenous placebo tests are willingly used, moreover the oral placebo has probably the same effectiveness. The Aim of the study was to determined the effectiveness of oral placebo in provoking psychogenic paroxysm and bioelectrical brain disorders in children with pseudoepileptic seizures. We also evaluated the effectiveness of placebo in provoking epileptic seizures in children with coexisting epilepsy. MATERIAL: The placebo was given to 30 among 40 children with pseudoseizures which was diagnosed with video EEG. There were 36 girls and 4 boys aged 8 to 18 years (average 13 years) hospitalised in the Department of Neurology in Kraków between 2002-2004. The most frequent type of paroxysm were syncope which needed to be diagnosed, fainting, headache, dizziness, paroxysmal abdominal pain and visual disorders. In 15/40 children with paroxysmal nonepileptic events the epileptic seizures were coexisting. METHODS: Pseudoepileptic seizures were provoked even by the video EEG monitoring, suggestion, hyperventilation and placebo probe. For deepening the assessment of the EEG pattern beside the hyperventilation reactions test of open and closed eye and photostimmulation were used. During the placebo probe video EEG was done with voice recording and analyses of the synchrony of clinic and EEG pattern. RESULTS: Among 30 children with pseudoepileptic seizures after placebo in 20 paroxysm during recording were observed. The character of the paroxysm was similar to the previous history. More frequently were observed behavioural and visual disorders and rare syncope. No epileptic seizures were developed by placebo. 19/30 children with clinically positive and negative placebo test, developed paroxysmal bioelectric activity. CONCLUSION: The oral placebo test was clinically effective in diagnosis of the pseudoepileptic events in 2/3 children. It developed paroxysmal EEG pattern in children with clinically positive and also with negative placebo test.", "year": "2004", "journal": "Przeglad lekarski", "label": "clinical_trial_non_randomized"}, {"pmid": "39887979", "title": "Comparison of efficacy of low glycemic index treatment and modified Atkins diet among children with drug-resistant epilepsy: A randomized non-inferiority trial.", "abstract": "OBJECTIVE: The ketogenic diet has been the mainstay of treatment of drug-resistant epilepsy (DRE). No comparative trials have been conducted to assess the efficacy of the two less strict ketogenic diets: modified Atkins diet (MAD) and low glycemic index treatment (LGIT). This study assesses the non-inferiority of LGIT compared with MAD. METHODS: This was an open-label randomized non-inferiority trial. Children with DRE were randomized to receive either MAD or LGIT as an add-on to anti-seizure medications. The primary endpoint was percentage seizure reduction at the end of 24 weeks of therapy compared to the baseline. The non-inferiority margin of -15% was predefined to calculate the sample size. RESULTS: Ninety-one children were enrolled and randomized to receive either MAD (n = 45) or LGIT (n = 46). Intention-to-treat analysis done at the end of 24 weeks of therapy showed a mean (±standard deviation [SD]) percentage seizure reduction of 60.7% (±41.3) in the MAD sub-group and 57% (±39.4) in the LGIT sub-group (p = 0.664). The absolute difference between the means of percentage seizure reduction was -3.7 (-20.5 to 13.2) and crossed the non-inferiority margin. Ten children in the MAD group and nine children in the LGIT group did not complete 24 weeks of therapy. Adverse effects were comparable between the arms (MAD, 66.6%; LGIT, 50%), although serious adverse effects were higher in the MAD arm. The most common adverse effect was decreased acceptance (24.2%) followed by decreased satiety (9.9%), vomiting (9.9%), weight loss (5.5%), constipation (5.5%), and diarrhea (3.3%). Dyslipidemia was more commonly seen in the MAD group (MAD, six; LGIT, one). One death in the LGIT arm was unrelated to therapy. Although there was no statistically significant difference in improvement in cognition, behavior, and quality of life scales, improvement was noted from baseline scores. SIGNIFICANCE: LGIT may be non-inferior to MAD in the treatment of children with DRE with the advantage of increased acceptance and fewer adverse effects.", "year": "2025", "journal": "Epilepsia", "label": "clinical_trial_non_randomized"}, {"pmid": "12899867", "title": "Cognitive-behavioral group treatment program for adults with epilepsy in Hong Kong.", "abstract": "A subjective sense of uncertainty is a common theme in the experience of patients with epilepsy. Lack of control has also been implicated as an etiologic factor in the development of psychosocial problems in epilepsy. Cognitive-behavioral interventions emphasizing the mediating role of thoughts and self-control appear to be particularly relevant for patients with epilepsy because anxiety and depression are the most common problems. Despite its apparent importance, very little systematic research has been published on the effectiveness of psychological treatment of epilepsy. The purpose of the present study was to conduct a seminal outcome evaluation of psychological intervention for adult patients in Hong Kong. Using a waitlist control group, the treatment program focused particularly on cognitive restructuring and seizure control. Results indicated significant gains by the treatment group in overall quality of life and self-efficacy. In particular, marked improvements were noted for emotional well-being, seizure, and stress management. The clinical implications are discussed in the context of developing specific intervention programs and outcome measures specific to the various needs of adult patients with epilepsy.", "year": "2003", "journal": "Epilepsy & behavior : E&B", "label": "clinical_trial_non_randomized"}, {"pmid": "37499583", "title": "Project CARPE Diem: Curriculum and Assessment for Residents on Pediatric Epilepsy.", "abstract": "BACKGROUND: Pediatric residencies are not preparing trainees well to manage patients with seizures and epilepsy. To address this, we implemented a six-session curriculum using active learning techniques with the goals of improving the knowledge and attitudes needed to effectively identify and treat seizures and epilepsy, and increase residents' comfort with counseling families about these topics. METHODS: A structured curriculum was implemented over the course of one month for the pediatric resident learner using andragogical methods such as didactic presentation, small-group sessions, role play, and simulation. A 15 multiple-choice question (MCQ) assessment and 13-statement attitudes inventory (AI) using Likert scales were given before the start of the curriculum and after its completion. Pretest and post-test scores were compared for the residents who attended at least three of the six sessions. RESULTS: Fifty residents completed the pretest, 34 residents completed the post-test, and 24 residents completed both. Of the 24, only 19 residents attended at least half the sessions. There was a significant improvement in scores for the MCQ assessment, for each grouped AI domain, and in the proportion of residents who reported comfort with 11 of 13 AI statements. CONCLUSION: The findings of this study demonstrate that given quality high-impact educational content, pediatric residents' knowledge about seizures and epilepsy improves significantly. It is feasible to implement active learning techniques during structured didactic time. The importance of closing the knowledge gap and improving pediatric comfort with seizures and epilepsy is essential and may translate to the much needed improvement in access to care for the patients with these disorders.", "year": "2023", "journal": "Pediatric neurology", "label": "clinical_trial_non_randomized"}, {"pmid": "1535100", "title": "The effect of a synthetic GnRH analogue on catamenial epilepsy: a study in ten patients.", "abstract": "Ten female patients suffering from catamenial epilepsy were treated with a synthetic analogue of the gonadotrophin releasing hormone (GnRH) in addition to antiepileptic drugs. Three of the patients became seizure free, in four patients seizure frequency decreased and in one patient seizures were of shorter duration. In only two of the patients was there no therapeutic effect. Adverse effects, including hot flushes, headache and increase in weight, were noticed in eight patients. These results support the hypothesis that treatment with a synthetic GnRH analogue might be helpful in patients with intractable catamenial epilepsies.", "year": "1992", "journal": "Journal of neurology", "label": "open_label_trial"}, {"pmid": "41175602", "title": "Fenfluramine for developmental and epileptic encephalopathy with spike-wave activation in sleep (DEE-SWAS): An exploratory study.", "abstract": "OBJECTIVE: To evaluate the safety and potential efficacy of fenfluramine (FFA) in patients with developmental and epileptic encephalopathy with spike-and-wave activation in sleep (DEE-SWAS). METHODS: We conducted an open-label, interventional, exploratory study of FFA in pediatric patients with DEE-SWAS. We assessed changes in seizure frequency, intensity, and spike-wave index (SWI), as well as non-seizure outcomes including a neuropsychological evaluation with BRIEF®-2 and Vineland-3 questionnaires, assessment of sleep habits, and caregiver-reported changes in cognitive, behavioral and motor symptoms. Adverse effects and changes in concomitant antiseizure medications (ASMs) were recorded. RESULTS: Six patients were included (2 females, median age 10 years, range 4-11 years), with a median follow-up of 12 months (9-13 months). FFA was well tolerated; only two patients experienced mild, transient adverse events, and all participants continued treatment throughout the study. SWI improved in 4/6 patients (66.7 %), with ≥ 50 % reduction in two (near-resolution in one). Seizures were reported as less severe, although their frequency remained unchanged. The total dose of concomitant corticosteroids and ASMs was reduced in 66.7 % of patients. Executive functioning showed a tendency to improvement in 4/6 patients (66.7 %) based on BRIEF®-2 scores, although Vineland-3 scores remained stable. Caregivers also reported perceived improvements in behavior, cognition, and sleep. CONCLUSION: FFA was a safe and potentially effective treatment in our cohort of patients with DEE-SWAS. We observed a reduction of SWI in most patients, along with modest improvements in executive function. These preliminary findings support the need for larger studies to confirm efficacy and explore long-term outcomes.", "year": "2025", "journal": "Epilepsy research", "label": "open_label_trial"}, {"pmid": "11422328", "title": "The regulation of serum sodium after replacing carbamazepine with oxcarbazepine.", "abstract": "PURPOSE: To evaluate changes in serum electrolyte balance and underlying regulatory mechanisms in 10 male patients with epilepsy 2 and 6 months after replacing long-term carbamazepine (CBZ) monotherapy with oxcarbazepine (OCBZ) monotherapy. Arginine vasopressin (AVP) is thought to be most important underlying mechanism of CBZ-related hyponatremia via direct or kidney tubular mechanisms. Furthermore, AVP is as well hormonally regulated by the renin-angiotensin-aldosterone system and atrial natriuretic peptide (ANP). METHODS: The medication of the patients was changed from CBZ to OCBZ. Serum electrolytes, creatinine, albumin, aldosterone, and the N-terminal fragment of ANP (NT-proANP) concentrations were measured before and 2 and 6 months after the change in the medication. RESULTS: The mean serum sodium level diminished after the medication was changed. Serum sodium levels decreased below the reference range in two (20%) patients during OCBZ medication. Serum sodium levels decreased altogether in four patients, and remained unaltered in six patients. Serum aldosterone levels increased in the six patients whose serum sodium concentrations did not decrease, but no increase was found in the patients with decreased sodium levels during OCBZ medication. Serum NT-proANP levels decreased in all patients. CONCLUSIONS: Serum sodium levels decrease after replacing CBZ with OCBZ. The low serum NT-proANP concentrations appear to reflect the decreased serum sodium levels, but a compensatory aldosterone response may prevent the development of hyponatremia in some patients during OCBZ medication.", "year": "2001", "journal": "Epilepsia", "label": "open_label_trial"}, {"pmid": "11277363", "title": "The long-term use of vigabatrin and lamotrigine in patients with severe childhood onset epilepsy.", "abstract": "Our purpose was to compare the initial efficacy and retention at 5 years of lamotrigine (LTG) and vigabatrin (VGB) in patients with severe childhood-onset epilepsies, especially with regard to loss of efficacy. Add-on therapy in 95 young patients with severe epilepsies in a neuropaediatric department was prospectively followed in open label studies for up to 5 years. VGB group: 56 patients (mean age: 11.1 years). LTG group: 39 patients (mean age: 13.6 years). Definition of initial responders: more than 50% reduction in seizure-frequency after 6 weeks of VGB treatment or after 4 months of LTG treatment. Definition of retention at 5 years: percentage of patients still taking LTG or VGB after 5 years. Definition of loss of efficacy: return to the baseline seizure frequency. The results were: VGB group: after 6 weeks 18 of 56 patients (32%) were initial responders. The retention at 5 years was five of 56 patients (8.9%). One patient (1.8%) was still seizure free. A loss of efficacy occurred in 10 of the 18 initial responders, usually within the first 9 months after the initial response. In the LTG group, after 4 months, 11 of 39 patients (28%) were initial responders. The retention at 5 years was 10 of 39 patients (25.6%). Five patients (12.8%) were still seizure free. The rate of adverse events was equal in both groups (41%). All but one occurred within the first 6 months of treatment. Our study in patients with difficult to treat childhood epilepsies suggests that in clinical practice patients were less likely to be discontinued from LTG than from VGB within 5 years, after similiar initial efficacy. This was mainly due to a loss of efficacy in VGB treatment early after initial response.", "year": "2001", "journal": "European journal of paediatric neurology : EJPN : official journal of the European Paediatric Neurology Society", "label": "open_label_trial"}, {"pmid": "15693805", "title": "Tiagabine as add-on therapy may be more effective with valproic acid--open label, multicentre study of patients with focal epilepsy.", "abstract": "The aim of the current study was to review the efficacy of tiagabine (TGB) as add-on therapy in patients with drug-resistant focal epilepsy under normal daily clinical practice, and try to identify those who had improvement. This was an open multicentre study conducted in Poland. A group of 330 patients were analysed. Patients received TGB up to 30-50 mg/day with adjustment within the therapeutic range and titration period. For statistical evaluation chi-square test and logistic analysis were used. At the 16-week follow-up visit, 71.4% patients were reported as responders, i.e. had a 50% or greater decrease in seizure frequency compared with baseline (P<0.001). One-third of patients were seizure-free at 16-week evaluation (P<0.001). The beneficial effect of TGB on seizure reduction was most marked in patients with partial seizures (P<0.001). Patients who used valproic acid (mean dose 1307 mg/day) had 61-85% higher chances for disappearance of seizures or reduction of their number by 50% or more. Patients who used carbamazepine (mean dose 800 mg/day) at a dose 1000 mg or higher mg/day had twice lower chance for reduction of seizures by 50% or more (OR=0.45; 95 CI 0.25-0.82). There was no statistical impact of sex, age and aetiology on probability of therapeutic effect.", "year": "2005", "journal": "European journal of neurology", "label": "open_label_trial"}, {"pmid": "24061295", "title": "Early child development and exposure to antiepileptic drugs prenatally and through breastfeeding: a prospective cohort study on children of women with epilepsy.", "abstract": "IMPORTANCE: Exposure to antiepileptic drugs during pregnancy is associated with adverse effects on psychomotor development. OBJECTIVES: To determine whether signs of impaired development appear already during the first months of life in children exposed prenatally to antiepileptic drugs, and to explore potential adverse effects of antiepileptic drug exposure through breastfeeding. DESIGN, SETTING, AND PARTICIPANTS: Mothers at 13 to 17 weeks of pregnancy were recruited in the population-based, prospective Norwegian Mother and Child Cohort Study from 1999 to 2009. The mothers reported on their child's motor and social skills, language, and behavior using items from standardized screening tools at 6 months (n = 78,744), 18 months (n = 61,351), and 36 months (n = 44,147) of age. The mothers also provided detailed information on breastfeeding during the first year. MAIN OUTCOMES AND MEASURES The risk of adverse development in children according to maternal or paternal epilepsy was estimated as the odds ratio with corresponding 95% confidence interval, adjusted for maternal age, parity, education, smoking, breastfeeding, depression/anxiety, folate supplementation, and congenital malformation in the child. RESULTS: At age 6 months, infants of mothers using antiepileptic drugs (n = 223) had a higher risk of impaired fine motor skills compared with the reference group (11.5% vs 4.8%, respectively; odds ratio = 2.1; 95% CI, 1.3-3.2). Use of multiple antiepileptic drugs compared with the reference group was associated with adverse outcome for both fine motor skills (25.0% vs 4.8%, respectively; odds ratio = 4.3; 95% CI, 2.0-9.1) and social skills (22.5% vs 10.2%, respectively; odds ratio = 2.6; 95% CI, 1.2-5.5). Continuous breastfeeding in children of women using antiepileptic drugs was associated with less impaired development at ages 6 and 18 months compared with those with no breastfeeding or breastfeeding for less than 6 months. At 36 months, prenatal antiepileptic drug exposure was associated with adverse development regardless of breastfeeding status during the first year. Children of women with epilepsy who did not use antiepileptic drugs and children of fathers with epilepsy had normal development at 6 months. CONCLUSIONS AND RELEVANCE: Prenatal exposure to antiepileptic drugs was associated with impaired fine motor skills already at age 6 months, especially when the child was exposed to multiple drugs. There were no harmful effects of breastfeeding. Women with epilepsy should be encouraged to breastfeed their children irrespective of antiepileptic drug treatment.", "year": "2013", "journal": "JAMA neurology", "label": "prospective_cohort_study"}, {"pmid": "24703903", "title": "Effects of ketogenic diet on vascular function.", "abstract": "BACKGROUND: Ketogenic diet is a well-established treatment in children with difficult to treat epilepsy. Very little is known about the long-term effects on vascular atherogenic and biochemical processes of this high-fat and low carbohydrate and protein diet. METHODS: We evaluated 26 children after one year and 13 children after two years of ketogenic diet. High resolution ultrasound-based assessment was used for carotid artery intima-media thickness (cIMT), carotid artery distensibility and carotid artery compliance. Blood lipids including high density lipoprotein cholesterol (HDL-C), low density lipoprotein cholesterol, (LDL-C), total cholesterol (TC), apolipoprotein A (apoA), apolipoprotein B (apoB) and high-sensitivity C-reactive protein (hsCRP) were analysed. RESULTS: A gradual decrease in carotid distensibility and an increase in LDL-C, apoB and the TC:LDL-C and LDL-C:HDL-C ratios were seen at three and 12 months of KD-treatment. These differences were not significant at 24 months. cIMT, BMI and hsCRP did not show any significant changes. CONCLUSIONS: The initial alterations in lipids, apoB and arterial function observed within the first year of KD-treatment appear to be reversible and not significant after 24 months of treatment.", "year": "2014", "journal": "European journal of paediatric neurology : EJPN : official journal of the European Paediatric Neurology Society", "label": "prospective_cohort_study"}, {"pmid": "38810172", "title": "Association of Prenatal Exposure to Antiseizure Medications With Creative and Executive Function at Age 4.5 Years.", "abstract": "BACKGROUND AND OBJECTIVES: Neurodevelopmental effects of fetal antiseizure medication (ASM) exposure on creativity and executive functions are poorly understood. We previously found fetal valproate exposure to adversely affect measures of creativity and executive functions. In this study, we examine fetal exposure of newer ASMs on these functions in children of women with epilepsy (WWE) compared with children of healthy women (HW). METHODS: The Maternal Outcomes and Neurodevelopmental Effects of Antiepileptic Drugs study is a multicenter NIH-funded prospective observational cohort study of WWE and HW enrolled in pregnancy and their offsprings. This report examines blindly assessed creativity and executive functions in 4.5-year-old children of WWE vs HW. In addition, exposure-dependent ASM effects during the third trimester were examined in children of WWE, using a ratio of maximum observed ASM concentrations and ratio of defined daily dose (ratio DDD). For polytherapy, ratios were summed across ASMs. Linear regression models adjusted for multiple potential confounding factors were conducted for all analyses. The primary outcome for 4.5-year-old children was the Torrance Test of Creative Thinking-Figural Creativity Index. Secondary outcomes included the Global Executive Composite Score from the Behavior Rating Inventory of Executive Function-Preschool Version and subscales and other indexes of both measures. RESULTS: The primary analysis included 251 children of WWE and 73 of HW. No differences in creativity or executive function were found between children of WWE vs HW. No ASM exposure-dependent effects were found for the creativity measures, but exposure-dependent effects for executive function were present for ratio ASM concentration and ratio DDD. DISCUSSION: Our findings at 4.5 years show no differences in creative thinking between children of WWE vs HW (-3.2 [-9.0 to 2.7], <i>p</i> = 0.286) or associations with fetal exposure to ASMs (-2.6 [-11.0 to 5.7], <i>p</i> = 0.530). Secondary analyses revealed fetal exposure-dependent effects for executive function in children of WWE (7.0 [2.9-11.2], <i>p</i> = 0.001), which are most marked for levetiracetam (12.9 [4.2-21.6], <i>p</i> = 0.004). Our findings suggest that even for relatively safe ASMs, dosing needs to be adjusted to concentrations that prevent seizures, but balance risks to the fetus that high concentrations may pose. TRIAL REGISTRATION INFORMATION: The study is registered at ClinicalTrials.gov as NCT01730170.", "year": "2024", "journal": "Neurology", "label": "prospective_cohort_study"}, {"pmid": "9118848", "title": "Outcome assessment in epilepsy: comparative responsiveness of quality of life and psychosocial instruments.", "abstract": "PURPOSE: Few data exist on the ability of instruments to detect within-patient change over time in epilepsy, a property referred to as responsiveness. Our aim was to compare the responsiveness of three instruments [i.e., Epilepsy Surgery Inventory-55 (ESI-55) and Washington Psychosocial Inventory (WPSI), both epilepsy specific, and Symptom Checklist-90-Revised (SCL-90-R), non-epilepsy specific]. METHODS: Instruments were administered at baseline and at 1 year in a prospective cohort of surgically (43) and medically (14) treated patients with temporal lobe epilepsy. Coefficient of Responsiveness and relative efficiency were computed for each scale and for the dimensions of mental health, physical health, and role function. RESULTS: The ESI-55 contained the most responsive scales, whereas SCL-90-R contained the largest number of scales with moderate responsiveness. The largest number of scales with low responsiveness belonged to the WPSI. Sensitivity to between-treatment differences in change was highest for ESI-55 and SCL-90-R. The most efficient scales in detecting differences between treatment groups in the mental, physical, and role-function dimensions were ESI-55 emotional well-being, ESI-55 health perceptions, and SCL-90-R hostility, respectively. CONCLUSIONS: Our results support the responsiveness of ESI-55 scales and suggest that SCL-90-R is a responsive tool for the assessment of psychologic function and distress in epilepsy. Comparatively, WPSI is relatively unresponsive to small or medium-size changes.", "year": "1997", "journal": "Epilepsia", "label": "prospective_cohort_study"}, {"pmid": "11301218", "title": "Language regression in childhood.", "abstract": "Language regression is observed both in autistic regression and as part of acquired epileptic aphasia (Landau-Kleffner Syndrome). We prospectively identified 177 children with language regression at four major medical centers, and their clinical characteristics were recorded. Their mean age at regression was 22.8 months. The mean time-to-specialist referral was 38 months of age. Most children (88%) met criteria for autism or manifested autistic features. Males (P = 0.02) and children less than 3 years of age who regressed (P = 0.016) had a higher probability of developing autistic behaviors. Seizures were more common in children who regressed after they reached 3 years of age (P < 0.001), and children with seizures were less likely to have associated autistic regression (P < 0.001). Electroencephalogram abnormalities were reported in 37% of patients and were more common in children with seizures (P < 0.001). At last follow-up, language function was impaired in 88% of the children, although some improvement was noted in 57%. We conclude that the loss of previously acquired language at any age, even if that language only includes a few words or communicative gestures, is often associated with a more global regression in cognition and/or behavior and has serious implications for future function. Early identification and referral of these children is necessary to allow for diagnosis and intervention.", "year": "2001", "journal": "Pediatric neurology", "label": "prospective_cohort_study"}, {"pmid": "33508749", "title": "Levetiracetam monotherapy in children with epilepsy: Experience from a tertiary pediatric neurology center.", "abstract": "OBJECTIVES: Levetiracetam (LEV) is a second-generation antiepileptic drug with high efficacy and tolerability in children and adults with epilepsy. We aimed to retrospectively assess the long-term efficacy, tolerability, and safety of LEV monotherapy in children with epilepsy. METHODS: All patients who received LEV monotherapy at the Ankara University Children Hospital between January 2010 and June 2020 were evaluated. This retrospective pediatric cohort study determined the efficacy and safety of LEV monotherapy in 281 outpatients with epilepsy. RESULTS: There were 281 patients, 50.5% female, aged 5 months to 18 years with a mean age of 9 years. Of these, 48% of patients had idiopathic epilepsy, 40.6% had symptomatic epilepsy, and 11,4% had cryptogenic/genetic epilepsy. Primary generalized seizures occurred in 61.6% of patients, focal seizures in 19.6%, both generalized and focal seizures in 15,3%, focal to bilateral tonic-clonic seizures in 2.5%, and undefined type of seizure in 1.1%. A total of 22.8% patients had an accompanying extra neurological disease, mostly cardiological and hematological. The range of final daily dose was 10-71 mg/kg/day, with mean 29.5 mg/kg/day. Duration of therapy ranged from 7 days to 96 months, with median 12 months (IQR: 6-22). For the all cohort, a 6th month retention rate was 81%, a 12th month retention rate was 71.4%, and a 24th month retention rate was 61.8%. Eighty five percent of the patients had a seizure reduction of at least 50% and 55.9% of patients remained seizure-free for median 12 months treatment duration with LEV monotherapy. Improvement of electroencephalography (EEG) findings was found in 42% of patients on control EEGs. A total of 67 adverse events were documented in 45 (16%) patients. The most common adverse events were behavioral problems such as aggression (n:18) and irritability (n:17). The discontinuation rate due to adverse events was 2.5%, and due to inefficacy was 5.3%. CONCLUSION: The present study suggests that the high retention rates, high percentage of seizure reduction, the low discontinuation rate due to adverse events and inefficacy, and the relatively benign and transient profile of adverse events make LEV preferable as monotherapy in the pediatric population.", "year": "2021", "journal": "Epilepsy & behavior : E&B", "label": "retrospective_cohort_study"}, {"pmid": "19424879", "title": "Assessing effort during neuropsychological evaluation with the TOMM in children and adolescents with epilepsy.", "abstract": "Effort assessment is of particular importance in pediatric epilepsy where neuropsychological findings may influence treatment decisions, especially if surgical interventions are being considered. The present investigation examines the Test of Memory Malingering (TOMM) in 60 children and adolescents with epilepsy. The overall pass rate for the sample was 90%. TOMM scores were unrelated to age, though there was a significant correlation between TOMM Trial 2 scores and intelligence estimates. Overall, the TOMM appears to be a valid measure of effort in young epilepsy patients, though caution should be used when interpreting scores for those with very low IQ, especially if behavioral problems are also evident. Caution should also be exercised in interpreting scores in children with ongoing interictal epileptiform activity that may disrupt attention.", "year": "2009", "journal": "Child neuropsychology : a journal on normal and abnormal development in childhood and adolescence", "label": "retrospective_cohort_study"}, {"pmid": "3926831", "title": "The effects of phenytoin and sodium valproate on the periodontal health of adult epileptic patients.", "abstract": "The periodontal health of 30 adult epileptic patients treated with either sodium valproate or phenytoin was compared with a control group (n = 15) of otherwise healthy patients. The 3 groups were matched for age and sex. Patients on phenytoin therapy showed significantly higher plaque scores (P less than 0.05), gingival index (P less than 0.05) and pocketing (P less than 0.05) than patients in the control group. The % of gingival hyperplasia was significantly higher (P less than 0.05) in the phenytoin-treated patients than those on sodium valproate or in the control group. However, patients on phenytoin therapy had significantly less bone loss than those on sodium valproate (P less than 0.05) or in the control group (P less than 0.01). No significant differences were observed between the sodium valproate group and the control group on any of the parameters assessed. The results from this study would suggest that sodium valproate has no unwanted effects on periodontal health and may be considered a safe alternative, regarding the periodontal aspects, to phenytoin for the treatment of adult onset epilepsy.", "year": "1985", "journal": "Journal of clinical periodontology", "label": "retrospective_cohort_study"}, {"pmid": "36864805", "title": "EPILEPTIC SEIZURES REVEALING STURGE WEBER'S DISEASE IN A TROPICAL ENVIRONMENT: STUDY OF EIGHT CASES.", "abstract": "In sub-Saharan Africa (SSA), the etiological factors of epilepsy are multiple and phacomatoses, in particular Sturge weber's disease, are rarely reported due to under-medicalization and insufficient multidisciplinary care. We carried out a retrospective study of 216 patients hospitalized for recurrent epileptic seizures between 2015 and 2022 in the neurology and pediatrics department of the University Hospital Center of Conakry, among whom eight (8) patients were identified for Sturge Weber's disease in order to reassess this pathology from a clinical and paraclinical point of view in a tropical environment. Sturge Weber's disease was retained in eight (8) on the presence of symptomatic partial epileptic seizures (age 6 months to 14 years) with frequency of status epilepticus, homonymous lateral hemiparesis linked to occipital involvement, piriform calcifications on imaging and ocular disorders. The delay in consultation and medical care revealed severe mental deterioration in our patients. This study shows a stereotyped clinical picture in a context of aggravation of signs related to a delay in multidisciplinary management. These results are important for the diagnostic, therapeutic and prognostic discussion.", "year": "2023", "journal": "Georgian medical news", "label": "retrospective_cohort_study"}, {"pmid": "38757475", "title": "Toxoplasma gondii and Neospora caninum infection in epileptic dogs.", "abstract": "OBJECTIVES: Studies in humans have demonstrated the role of Toxoplasma gondii, a protozoan parasite, in epileptic seizures. This study aimed to investigate the serological correlation between T. gondii and N. caninum and epilepsy in dogs. MATERIALS AND METHODS: The medical record database of the Veterinary Teaching Hospital, University of Perugia, was searched for dogs serologically tested by IFAT for T. gondii and N. caninum and following specific inclusion criteria. Dogs were stratified by having a clinical diagnosis of epilepsy or suffering different conditions. RESULTS: One-hundred and twenty-eight dogs were included, 64 with epilepsy and 64 without clinical signs of epilepsy. Seventeen of the 64 epileptic dogs (26.6%; 95% CI: 15.7% to 37.4%) and twenty-one of the 64 non-epileptic dogs (32.8%; 95% CI: 21.3% to 44.3%) tested positive for T. gondii. Eight of the epileptic dogs (12.5%; 95% CI: 4.4% to 20.6%) and three of the non-epileptic dogs (4.7%; 95% CI: 0% to 9.9%) tested positive for N. caninum. There was no statistically significant difference in the rate of T. gondii or N. caninum seroreactivity between epileptic and non-epileptic dogs. CLINICAL SIGNIFICANCE: The results obtained do not seem to support the role of T. gondii and N. caninum as causative agents of dog epilepsy.", "year": "2024", "journal": "The Journal of small animal practice", "label": "retrospective_cohort_study"}, {"pmid": "3729756", "title": "Depression in epilepsy. Significance and phenomenology.", "abstract": "Depression is common in epileptics, but few studies of this relationship exist. We investigated the prevalence of depression in comparably disabled outpatients and its phenomenology in psychiatrically hospitalized inpatients. Fifty-five percent of 175 outpatient epileptics and 30% of 70 matched controls reported depression; 30% of epileptics vs 7% of controls reported prior suicide attempts. Epileptics were four times more likely to have been hospitalized for depression than nonepileptics. Twenty depressed epileptic inpatients were characterized by \"endogenous\" rather than \"neurotic\" features with more psychotic traits, paranoia, and underlying chronic dysthymia. Sixteen patients had complex partial seizures, and ten of 11 patients had a lateralized electroencephalographic focus lateralized to the left hemisphere. These results suggest a specific epileptic psychosyndrome due to limbic dysfunction.", "year": "1986", "journal": "Archives of neurology", "label": "case_control_study"}, {"pmid": "23544394", "title": "Posttraumatic stress disorder in veterans: the utility of the MMPI-2-RF validity scales in detecting overreported symptoms.", "abstract": "The current investigation examined the utility of the overreporting validity scales of the Minnesota Multiphasic Personality Inventory-2-Restructured Form (MMPI-2-RF; Ben-Porath & Tellegen, 2008) in detecting noncredible reporting of symptoms of posttraumatic stress disorder (PTSD) in a sample of disability-seeking veterans. We also examined the effect of mental health knowledge on the utility of these scales by investigating the extent to which these scales differentiate between veterans with PTSD and individuals with mental health training who were asked to feign symptoms of PTSD on the test. Group differences on validity scale scores indicated that these scales were associated with large effect sizes for differentiating veterans who overreported from those with PTSD and for differentiating between mental health professionals and veterans with PTSD. Implications of these results in terms of clinical practice are discussed.", "year": "2013", "journal": "Psychological assessment", "label": "case_control_study"}, {"pmid": "40184993", "title": "Diagnostic value of serum miRNA-134-3p and miRNA-155-5p for monitoring seizure control in pediatric epilepsy.", "abstract": "OBJECTIVE: This study explored the potential of miRNA-134-3p and miRNA-155-5p as biomarkers for assessing seizure severity in children. METHODS: Healthy children and children with epilepsy from Fujian Provincial Hospital (Sept 2022 to July 2023) were grouped into the control group (n = 20), the well-controlled group (n = 22), and the poorly-controlled group (n = 18). Clinical data and serum samples were analyzed using quantitative real-time polymerase chain reaction to detect miRNA levels. Receiver operating characteristic curve analysis evaluated diagnostic potential. RESULTS: The poorly-controlled group showed increased seizure frequency (P < 0.001), medication dosage (P < 0.001), and intellectual disabilities (P = 0.041). MiRNA-134-3p and miRNA-155-5p levels were higher in epilepsy patients, especially in the poorly-controlled group (P < 0.001). When the critical value of miRNA-134-3p for diagnosing seizure control was 4.336, the specificity was 90.9 % and the sensitivity was 88.9 %. When the diagnostic threshold of miRNA-155-5p was 2.870, the specificity was 63.6 % and the sensitivity was 100 %. The sensitivity, specificity, and accuracy of the combined diagnosis of serum miRNA-134-3p and miRNA-155-5p for seizure control were 88.9 %, 100 %, and 94.45 %, respectively. CONCLUSION: The expressions of miRNA-134-3p and miRNA-155-5p were elevated in the serum of children with epilepsy, and were positively correlated with the severity of seizures. The serum miRNA-134-3p has high specificity in diagnosing the degree of seizure control in children, while miRNA-155-5p has high sensitivity. Their combination of the two can improve the specificity of predicting the degree of seizure control in children.", "year": "2025", "journal": "Brain & development", "label": "case_control_study"}, {"pmid": "26708062", "title": "Seizure-related injuries in children and adolescents with epilepsy.", "abstract": "BACKGROUND: Children with epilepsy are reported to be at a greater risk of injuries compared with their peers who do not have epilepsy. OBJECTIVES: We set out to determine the frequency and pattern of seizure-related injuries in children with epilepsy seen at the University College Hospital (UCH), Ibadan, Nigeria. METHODS: Consecutive cases of epilepsy seen at the pediatric neurology clinic of the UCH, Ibadan over a period of 6months were evaluated for injuries in the preceding 12months using a structured questionnaire. These were compared with age- and sex-matched controls. RESULTS: A total of 125 children with epilepsy and 125 age- and sex-matched controls were studied. Injuries occurred more frequently in children with epilepsy than in their peers (p=0.01, OR 1.935, 95% CI 1.142-3.280). Epilepsy was generalized in 80 (64.0%), and localization-related in 45 (36.0%). Idiopathic epilepsy accounted for 74 (59.2%), and the remaining 51 (40.8%) had remote symptomatic epilepsy. Fifty-seven (45.6%) children had suffered seizure-related injuries with multiple injuries in 31 (24.8%). The most frequent were skin/soft tissue lacerations (26.4%), injuries to the tongue and soft tissues of the mouth (19.2%), minor head injuries (15.2%), and dental injuries with tooth loss (8.0%). There was a statistically significant association between seizure frequency and seizure-related injuries (p=0.002). Children on polytherapy had a significantly higher frequency of seizure-related injuries (p<0.001). CONCLUSION: Epilepsy is a major risk factor for injuries in childhood. High seizure frequency increases the risk of multiple injuries in children with epilepsy.", "year": "2016", "journal": "Epilepsy & behavior : E&B", "label": "case_control_study"}, {"pmid": "10529759", "title": "Serum and hair trace element levels in patients with epilepsy and healthy subjects: does the antiepileptic therapy affect the element concentrations of hair?", "abstract": "In this study, hair magnesium (Mg), zinc (Zn), copper (Cu), and manganese (Mn) levels, and serum Zn and Mg levels were measured by atomic absorption spectrophotometer in patients with epilepsy (n = 33) and healthy subjects (n = 21), and results obtained were statistically compared. The mean hair Cu, Mg, and Zn levels of epileptic patients were significantly lower than the levels of control subjects. There was no significant difference between epileptic patients and control subjects in respect to the mean Mn levels. Mean serum Mg levels in epileptic patients showed significant difference, but serum Zn levels were similar among both groups. When the effects of anticonvulsant therapy on Cu, Zn, Mn, and Mg in the hair, and Mg and Zn in the serum were analyzed in epileptics, there was no significant difference between the patients with or without therapy. Likewise, the mean trace element levels in epileptics showed no significant difference according to the type of antiepileptic drug and seizure, and gender. We suggest that the changed element status (Zn, Mg, and Cu) in hair may play an indicator role in the diagnosis of epileptic patients.", "year": "1999", "journal": "European journal of neurology", "label": "case_control_study"}, {"pmid": "24012509", "title": "Investigating higher-order cognitive functions in temporal lobe epilepsy: cognitive estimation.", "abstract": "Cognitive estimation, an ability to attribute measurements to concrete things, is relevant to adaptive behavior. This study evaluated cognitive estimation in patients with temporal lobe epilepsy (TLE) with the goal of verifying its relationship to temporal lobe damage and age of seizure onset. One hundred and eight patients with drug-resistant TLE and 51 healthy controls were evaluated using the Cognitive Estimation Task (CET), which requires simple and complex estimations providing the Total and Bizarreness scores. Different tests assessed reasoning, attention, executive, visuospatial, and lexical-semantic abilities. Patients with right TLE had earlier age of seizure onset than patients with left TLE and lower education than controls. Compared with controls, both patient groups obtained worse CET Total and Bizarreness scores, but only patients with right TLE were significantly impaired. Patients with seizure onset before age 12 showed worse scores than patients with later seizure onset irrespective of the side of TLE. The CET Total and Bizarreness scores were predicted by age of seizure onset and semantic fluency; the Bizarreness score also related to education, chronological age, and visual attention. Results highlight the complexity of the cognitive pattern associated with TLE. Cognitive estimation deficit primarily reflects early age of seizure onset and semantic difficulties. An involvement of visual mental operations mediated by the right hemisphere may accentuate the deficit, while cognitive reserve may play a protective role.", "year": "2013", "journal": "Epilepsy & behavior : E&B", "label": "cross_sectional_study"}, {"pmid": "38788656", "title": "Differences in factors associated with insomnia symptoms between patients with epilepsy with and without depressive symptoms.", "abstract": "OBJECTIVE: To determine if insomnia-related factors differ depending on the presence of depression in patients with epilepsy. METHODS: This cross-sectional multicenter study collected data on depressive symptoms, insomnia symptoms, and excessive daytime sleepiness, which were defined as a Patient Health Questionnaire-9 (PHQ-9) score of ≥ 10, an Insomnia Severity Index (ISI) score of ≥ 15, and an Epworth Sleepiness Scale (ESS) of ≥ 11, respectively. Further, uncontrolled seizures were defined as one or more seizures per month during antiseizure medications treatment. A stepwise logistic regression analysis was conducted, with a logistic regression with interaction terms performed to identify differences in insomnia-related factors depending on depressive symptoms. RESULTS: Of 282 adults with epilepsy (men, 58 %; mean age, 40.4 ± 13.9 years), a PHQ-9 score ≥ 10, an ISI score ≥ 15, an ESS score ≥ 11 were noted in 23.4 % (n = 66), 20.2 % (n = 57), and 12.8 % (n = 36), respectively. More patients with depressive symptoms had an ISI score ≥ 15 (56.1 % vs. 9.3 %; p < 0.001) than those without. In multiple logistic regression, uncontrolled seizures (odds ratio [OR], 4.896; p < 0.01), daytime sleepiness (OR, 5.369; p < 0.05), and a history of psychiatric disorders (OR, 3.971; p < 0.05) were identified as significant factors that were more likely to be associated with an ISI score ≥ 15; however, this was only true in patients without depressive symptoms. In contrast, use of perampanel (OR, 0.282; p < 0.05) was less likely associated, while female sex (OR, 3.178; p < 0.05) was more likely associated with an ISI score ≥ 15 only in patients with depressive symptoms. CONCLUSIONS: Insomnia-related factors in patients with epilepsy may differ between patients with and without depression. Our findings of different insomnia-related factors based on the presence of depression may facilitate the management of patients with epilepsy.", "year": "2024", "journal": "Epilepsy & behavior : E&B", "label": "cross_sectional_study"}, {"pmid": "34256338", "title": "Epilepsy in schools: Views on educational and therapeutic provision, understanding of epilepsy and seizure management.", "abstract": "OBJECTIVE: To gain an understanding of the views of young people with epilepsy, their parents and school staff regarding educational and therapeutic provision, understanding of epilepsy and seizure management in schools. METHODS: School-aged children (n = 20) with 'active epilepsy' (taking Anti-Seizure Medications (ASMs) for epilepsy), their parents (n = 68), and school staff (n = 56) were interviewed or completed bespoke questionnaires. In addition, all participating children underwent psychological assessment including measures of behavior and cognition. RESULTS: Only 15% of participating children had received psychological support despite 60% scoring within the at-risk range on a measure of behavioral and emotional difficulties. More than half of the responding children reported that some of their teachers and friends did not know that they had epilepsy. A significant minority of parents (32%) did not feel that the child's transition from preschool to primary, or primary to secondary school was managed well. Knowledge of the child's epilepsy was felt to be significantly better in special schools than mainstream schools according to both parents and school staff. Staff in special schools perceived they were more knowledgeable about the child's ASMs and changes to ASMs than staff in mainstream schools. Staff in special schools were significantly more likely to have received training on general aspects of epilepsy, seizure management, and impacts on learning and/or behavior. Parental interviews indicated difficulties accessing educational and therapeutic supports. Parents often felt that they had to drive the process to gain supports themselves. They also reported limited professional support, and inadequate communication between themselves and the school and school staff and medical/therapeutic professionals regarding their child's needs. Parents would like more school staff to recognize the impacts of epilepsy on learning and behavior and to support their child more holistically. Many parents wanted more resources for assessment and therapeutic provision in relation to their child's learning, behavior, and emotions. CONCLUSION: Knowledge of epilepsy is felt by parents and staff to be significantly better in special schools compared with mainstream schools. Parents highlighted the need for increased knowledge of the impacts of epilepsy on learning and behavior and perceived a need for more resources for assessment of these difficulties.", "year": "2021", "journal": "Epilepsy & behavior : E&B", "label": "cross_sectional_study"}, {"pmid": "31325820", "title": "Burden in caregivers of adults with epilepsy in Asian families.", "abstract": "PURPOSE: The literature on caregiver burden tends to focus on children and teenagers with epilepsy and less on adults. As caregiving is a dynamic, complex process across the trajectories, this study aims to examine the factors associated with caregiving burden in those caring for adults with epilepsy. METHOD: This is a cross-sectional, survey-based study in which participants responded to questionnairesregarding perceived burden (ZBI), quality of life (IEQoL), psychological distress (DASS-21), family functioning (FAD) and perceived social support (MSPSS). Additional measures include socio-demographics and clinical characteristics of the care-recipient. RESULTS: A total of 111 caregivers participated, of whom 72.1% were females, 55% parents, 59.5% Chinese, 51.4% unemployed and 46.0% with tertiary education.Approximately half (42.3%) reported mild-to-moderate levels of burden (mean ZBI score 29.93, SD 16.09).Furthermore, multiple regression analysisidentified10 predictors of caregiver burden, namely family functioning, weekly caregiving hours, number of caregivers per family, attitude towards epilepsy, family support, caregivers' gender, personal income and as well as care-recipients' age of onset, seizure frequency and ADL dependency (F(10, 85) = 11.37, p < 0.001). Stepwise regression highlighted family functioning as the main predictor (β = 0.299, p < 0.001). The total ZBI score was positively correlated with caregivers' reported levels of depression (r = 0.549, p < 0.001), anxiety (r = 0.599, p < 0.001) and stress (r = 0.576, p < 0.001) subscales in DASS-21, and negatively correlated with IEQoL (r=-0.637, p < 0.001). CONCLUSION: This study shows that caregivers' burden is highly associated with the family system (family functioning, support and number of caregivers), besides demographics, psychosocial and clinical characteristics. Future research is required to learn how to support this sub-group of caregivers within the family system.", "year": "2019", "journal": "Seizure", "label": "cross_sectional_study"}, {"pmid": "23828532", "title": "Epilepsy and quality of life: socio-demographic and clinical aspects, and psychiatric co-morbidity.", "abstract": "Objective To study socio-demographic and clinical aspects, as well as psychiatric co-morbidity that influence the quality of life of adult epileptic patients. Methods One hundred and thirty-two individuals diagnosed with epilepsy were evaluated from neurological/clinical and psychiatric points of view and by the Quality of Life in Epilepsy Inventory (QOLIE-31). Predictive factors for the QOLIE-31 scores were studied. Results The regression analyses indicated the existenc
