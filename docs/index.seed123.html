1-month baseline with 3 months of VNS. Median seizure rate reduction was -46%. Sixteen of the 24 patients had better than a -30% reduction and 11 of the 24 patients had better than a -50% reduction in seizure rate. A mild cough during stimulation occurred in six patients. Patients with higher baseline seizure rates and later ages at epilepsy onset had the best responses to VNS. Our findings suggest VNS is an effective treatment for medication-resistant generalized epilepsy even in patients as young as 4 years.", "year": "1999", "journal": "Neurology", "label": "neuromodulation_study", "P": "Generalized epilepsy patients (medication-resistant, some as young as 4 years)", "I": "Vagus nerve stimulation (VNS)", "C": "1-month baseline seizure rate", "O": "Median seizure rate reduction; proportion of patients with >-30% or >-50% reduction", "N": "24"}, {"pmid": "61854", "title": "Conditioned EEG desynchronization and seizure occurrence in patients.", "abstract": "Five patients with seizures poorly controlled by standard anticonvulsant medication, underwent EEG operant conditioning. The operant paradigm reinforced the production of low voltage fast activity while decreasing frequencies below 10 c/sec. Seizure frequency decreased in 2 patients, seizure severity was attenuated in 2 others, and one patient who was only given reinforecement for scalp EMG suppression whowed no change in seizure parameters. Pseudoconditioning and control periods ruled out placebo effects. A rationale for this phenomenon is proposed.", "year": "1976", "journal": "Electroencephalography and clinical neurophysiology", "label": "neuromodulation_study", "P": "Patients with poorly controlled seizures by standard anticonvulsant medication", "I": "EEG operant conditioning reinforcing low voltage fast activity and decreasing frequencies below 10 c/sec", "C": "Pseudoconditioning and control periods", "O": "Seizure frequency and severity", "N": "5"}, {"pmid": "25799907", "title": "Cardiac-based vagus nerve stimulation reduced seizure duration in a patient with refractory epilepsy.", "abstract": "PURPOSE: A novel vagus nerve stimulation (VNS) device was recently approved in Europe which rapidly detects increases in heart rates (HR) and applies an additional stimulus if HR-increases exceed a given threshold. The effects of HR-triggered VNS-pulses on seizures were not reported yet under controlled conditions. Here, we quantified the effects of HR-triggered VNS-pulses on the seizure duration in one patient. METHODS: The novel VNS device was implanted in a 29-year old man with refractory epilepsy. After implantation, the patient underwent video-EEG telemetry for 68h with no changes in anticonvulsant drugs. On the first day the patient only received sham-stimulation. During the following 46h HR-related VNS-stimulation was set to 2mA. Seizure duration was determined based on clinical signs. RESULTS: Twelve stereotypical seizures were recorded (six during sham- and six during the active stimulation). The VNS device recognised a total of 139 events as a seizure and correctly identified 11 seizures. The HR-triggered VNS-stimulation significantly reduced the total seizure duration from 33.2±4.8s to 26.5±5s and the remaining seizure duration after the onset of the extra-stimulation from 27.8±4.3s to 16.2±3.2s. With the given configuration in this patient, sensitivity and specificity of HR-based seizure-detection amounted to 92% and 13.5%, respectively. CONCLUSIONS: This case illustrates that VNS-stimulation in response to seizure-related HR-increases is able to significantly reduce seizure duration. Despite the limitations of our case, its promising results should prompt larger studies to confirm the clinical benefit of this novel device.", "year": "2015", "journal": "Seizure", "label": "neuromodulation_study", "P": "29-year old man with refractory epilepsy", "I": "HR-triggered VNS-stimulation set to 2mA", "C": "Sham-stimulation", "O": "Seizure duration (total and remaining after extra-stimulation)", "N": "12 (six during sham-, six during active stimulation)"}, {"pmid": "37119434", "title": "Stimulation-induced respiratory enhancement in corticothalamic regions.", "abstract": "OBJECTIVE: We aimed to identify corticothalamic areas and electrical stimulation paradigms that optimally enhance breathing. METHODS: Twenty-nine patients with medically intractable epilepsy were prospectively recruited in an epilepsy monitoring unit while undergoing stereoelectroencephalographic evaluation. Direct electrical stimulation in cortical and thalamic regions was carried out using low (<1 Hz) and high (≥10 Hz) frequencies, and low (<5 mA) and high (≥5 mA) current intensities, with pulse width of .1 ms. Electrocardiography, arterial oxygen saturation (SpO<sub>2</sub> ), end-tidal carbon dioxide (ETCO<sub>2</sub> ), oronasal airflow, and abdominal and thoracic plethysmography were monitored continuously during stimulations. Airflow signal was used to estimate breathing rate, tidal volume, and minute ventilation (MV) changes during stimulation, compared to baseline. RESULTS: Electrical stimulation increased MV in the amygdala, anterior cingulate, anterior insula, temporal pole, and thalamus, with an average increase in MV of 20.8% ± 28.9% (range = 0.2%-165.6%) in 19 patients. MV changes were associated with SpO<sub>2</sub> and ETCO<sub>2</sub> changes (p < .001). Effects on respiration were parameter and site dependent. Within amygdala, low-frequency stimulation of the medial region produced 78.49% greater MV change (p < .001) compared to high-frequency stimulation. Longer stimulation produced greater MV changes (an increase of 4.47% in MV for every additional 10 s, p = .04). SIGNIFICANCE: Stimulation of amygdala, anterior cingulate gyrus, anterior insula, temporal pole, and thalamus, using certain stimulation paradigms, enhances respiration. Among tested paradigms, low-frequency, low-intensity, long-duration stimulation of the medial amygdala is the most effective breathing enhancement stimulation strategy. Such approaches may pave the way for the future development of neuromodulatory techniques that aid rescue from seizure-related apnea, potentially as a targeted sudden unexpected death in epilepsy prevention method.", "year": "2023", "journal": "Epilepsia", "label": "neuromodulation_study", "P": "Patients with medically intractable epilepsy undergoing stereoelectroencephalographic evaluation", "I": "Direct electrical stimulation in cortical and thalamic regions using low (<1 Hz) and high (>=10 Hz) frequencies, and low (<5 mA) and high (>=5 mA) current intensities, with pulse width of .1 ms", "C": "Baseline breathing parameters", "O": "Changes in minute ventilation (MV), arterial oxygen saturation (SpO2), and end-tidal carbon dioxide (ETCO2)", "N": "29"}, {"pmid": "12697145", "title": "Daytime vigilance and quality of life in epileptic patients treated with vagus nerve stimulation.", "abstract": "OBJECTIVES: The goal of this study was to determine if vagus nerve stimulation (VNS) has any effect on daytime vigilance and perceived sense of well-being. METHODS: Multiple Sleep Latency Tests (MSLTs) were performed and visual reaction times (VRTs) obtained in eight epileptic patients before and during treatment with VNS. Prior to VNS initiation patients' baseline MSLT and VRT scores were recorded. Six months after VNS was initiated, treatment MSLT and VRT scores were obtained. A group of 12 age-matched healthy subjects served as controls. In addition, there was a global evaluation of well-being at baseline and during a follow-up of 6 months. RESULTS: As expected, patients evaluated both at baseline and during VNS showed more sleepiness than controls. In this group, baseline sleep latencies on the MSLT were significantly shorter, while VRT latencies were significantly longer than those of controls. After 6 months of VNS, MSLT scores in the eight patients did not change significantly with respect to baseline. However, if the single patient treated with relatively high stimulus intensities (1.75 mA) was excluded from the group and only the seven patients treated with low stimulus intensities (<or=1.5 mA) were considered, a significant effect of chronic VNS on MSLT scores could be observed. In fact, the mean sleep latency (MSL) average of the seven subjects significantly improved from 9.9+/-2.5 minutes during baseline to 10.9+/-2.3 minutes after 6 months of VNS (P<0.05). Conversely, the only patient treated with high stimulus intensities showed increased sleepiness, with MSL decreasing from 14.4 to 9.8 minutes. On the other hand, VRT latencies did not significantly change during VNS. Patients considered as a whole had significant improvements on global evaluation scores of quality of life. CONCLUSION: VNS at low stimulus intensities promotes daytime vigilance in adult epileptic patients and has a positive effect on quality of life.", "year": "2003", "journal": "Epilepsy & behavior : E&B", "label": "neuromodulation_study", "P": "Adult epileptic patients", "I": "Vagus nerve stimulation (VNS) at low stimulus intensities (<=1.5 mA) for 6 months", "C": "Baseline (pre-VNS) and healthy controls", "O": "Daytime vigilance (Multiple Sleep Latency Tests, visual reaction times) and quality of life", "N": "8 (patients); 12 (controls)"}];

// ── State ──────────────────────────────────────────────────────────────────────
const ratings = { cls: {}, pico: {} };
let clsIdx  = 0;
let picoIdx = 0;
let activeTab = 'cls';

// ── Badge helper ───────────────────────────────────────────────────────────────
const TRIAL_LABELS = new Set([
  'randomized_controlled_trial','clinical_trial_non_randomized','open_label_trial',
  'surgical_outcomes_study','neuromodulation_study'
]);
const REVIEW_LABELS = new Set([
  'systematic_review','meta_analysis','narrative_review',
  'guidelines_consensus','editorial_letter_commentary'
]);
function badgeClass(label) {
  if (TRIAL_LABELS.has(label))  return 'badge-trial';
  if (REVIEW_LABELS.has(label)) return 'badge-review';
  return 'badge-other';
}
function labelText(label) {
  return label.replace(/_/g,' ');
}

// ── Build Classification cards ─────────────────────────────────────────────────
function buildClsCards() {
  const container = document.getElementById('cls-cards');
  CLS_DATA.forEach((rec, i) => {
    const div = document.createElement('div');
    div.className = 'card' + (i === 0 ? ' visible' : '');
    div.id = 'cls-card-' + i;
    div.innerHTML = `
      <div class="card-header">
        <span class="label-badge ${badgeClass(rec.label)}">${labelText(rec.label)}</span>
        <div class="card-meta">${rec.year} · ${escHtml(rec.journal)}</div>
      </div>
      <div class="pmid-tag">PMID: ${escHtml(rec.pmid)}</div>
      <div class="card-title">${escHtml(rec.title)}</div>
      <div class="abstract-wrap">
        <div class="abstract-text">${escHtml(rec.abstract)}</div>
      </div>
      <div class="divider"></div>
      <div class="rating-row">
        <button class="rate-btn approve" id="cls-approve-${i}" onclick="rate('cls',${i},'approve')">&#128077; <span class="rate-label">Approve</span><span class="key-hint">1</span></button>
        <button class="rate-btn reject"  id="cls-reject-${i}"  onclick="rate('cls',${i},'reject')">&#128078; <span class="rate-label">Reject</span><span class="key-hint">2</span></button>
      </div>
    `;
    container.appendChild(div);
  });
}

// ── Abstract highlighting ──────────────────────────────────────────────────────
const PICO_COLORS = {
  P: { bg: '#DBEAFE', border: '#93C5FD', label: 'Population' },
  I: { bg: '#DCFCE7', border: '#86EFAC', label: 'Intervention' },
  C: { bg: '#FEF9C3', border: '#FDE047', label: 'Comparator' },
  O: { bg: '#EDE9FE', border: '#C4B5FD', label: 'Outcome' },
  N: { bg: '#FFEDD5', border: '#FDBA74', label: 'Sample size' },
};

// Common words to skip when doing word-level matching
const STOP = new Set([
  'the','a','an','and','or','of','in','to','with','for','was','were','is',
  'are','be','been','had','has','have','that','this','these','those','by',
  'as','at','on','from','not','but','than','after','before','during',
  'between','into','through','within','without','also','both','each','such',
  'which','who','its','their','our','all','any','some','most','more','less',
  'only','well','no','they','them','then','when','where','what','how',
  'were','been','being','will','would','could','should','may','might',
  'patients','patient','study','studies','treatment','treated','effect',
  'effects','results','clinical','analysis','group','groups','data',
  'significant','significantly','compared','comparison','associated',
  'including','included','reported','using','used','based','mean','median',
  'rate','rates','total','number','case','cases','found','showed','show',
]);

function addMarks(marks, text, pattern, key, wholeWord) {
  const re = new RegExp(
    wholeWord ? `\\b${pattern}\\b` : pattern.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),
    'gi'
  );
  let m;
  while ((m = re.exec(text)) !== null) {
    marks.push({ start: m.index, end: m.index + m[0].length, key });
  }
}

function highlightAbstract(text, rec) {
  if (!text) return '';
  const marks = [];

  for (const key of ['P','I','C','O','N']) {
    const value = (rec[key] || '').trim();
    if (!value || value.toLowerCase() === 'not available') continue;

    if (key === 'N') {
      // Extract all numbers from the N field and match as whole words
      const nums = [...new Set((value.match(/\d+/g) || []))];
      for (const num of nums) addMarks(marks, text, num, key, true);
      continue;
    }

    // Pass 1: exact phrase (case-insensitive), minimum 6 chars to avoid noise
    if (value.length >= 6) addMarks(marks, text, value, key, false);

    // Pass 2: significant individual words (>= 5 chars, not stop words)
    for (const word of value.toLowerCase().split(/\W+/)) {
      if (word.length >= 5 && !STOP.has(word)) {
        addMarks(marks, text, word, key, true);
      }
    }
  }

  if (marks.length === 0) return escHtml(text);

  // Earlier start wins; on tie, longer match wins
  marks.sort((a, b) => a.start - b.start || b.end - a.end);
  const resolved = [];
  let lastEnd = 0;
  for (const m of marks) {
    if (m.start >= lastEnd) { resolved.push(m); lastEnd = m.end; }
  }

  let html = '';
  let pos = 0;
  for (const { start, end, key } of resolved) {
    const col = PICO_COLORS[key];
    html += escHtml(text.slice(pos, start));
    html += `<mark class="pico-${key}" title="${key} — ${col.label}">`
          + escHtml(text.slice(start, end)) + '</mark>';
    pos = end;
  }
  html += escHtml(text.slice(pos));
  return html;
}

// ── Build PICO cards ───────────────────────────────────────────────────────────
function picoRow(key, label, value, i) {
  const isNA = !value || value.toLowerCase() === 'not available';
  const buttons = isNA ? '' : `
      <button class="rate-btn approve sm" id="pico-${key}-approve-${i}" onclick="rate('pico',${i},'approve','${key}')">&#128077;</button>
      <button class="rate-btn reject  sm" id="pico-${key}-reject-${i}"  onclick="rate('pico',${i},'reject','${key}')">&#128078;</button>`;
  return `
    <div class="pico-row pico-${key}${isNA ? ' na-row' : ''}">
      <span class="pico-key">${key}</span>
      <span class="pico-val${isNA ? ' na' : ''}">${isNA ? 'Not available' : escHtml(value)}</span>
      ${buttons}
    </div>`;
}

function buildPicoCards() {
  const container = document.getElementById('pico-cards');
  PICO_DATA.forEach((rec, i) => {
    const div = document.createElement('div');
    div.className = 'card' + (i === 0 ? ' visible' : '');
    div.id = 'pico-card-' + i;
    div.innerHTML = `
      <div class="card-header">
        <span class="label-badge ${badgeClass(rec.label)}">${labelText(rec.label)}</span>
        <div class="card-meta">${rec.year} · ${escHtml(rec.journal)}</div>
      </div>
      <div class="pmid-tag">PMID: ${escHtml(rec.pmid)}</div>
      <div class="card-title">${escHtml(rec.title)}</div>
      <div class="abstract-wrap">
        <div class="abstract-text">${highlightAbstract(rec.abstract, rec)}</div>
      </div>
      <div class="divider"></div>
      <div class="pico-grid">
        ${picoRow('P','Population',   rec.P, i)}
        ${picoRow('I','Intervention', rec.I, i)}
        ${picoRow('C','Comparator',   rec.C, i)}
        ${picoRow('O','Outcome',      rec.O, i)}
        ${picoRow('N','Sample size',  rec.N, i)}
      </div>
    `;
    container.appendChild(div);
  });
}

// ── Rating ─────────────────────────────────────────────────────────────────────
function picoRateableKeys(rec) {
  return ['P','I','C','O','N'].filter(k => {
    const v = rec[k] || '';
    return v && v.toLowerCase() !== 'not available';
  });
}

function rate(arm, idx, verdict, picoKey) {
  const data = arm === 'cls' ? CLS_DATA : PICO_DATA;
  const rec  = data[idx];

  if (arm === 'cls') {
    const prev = ratings.cls[rec.pmid];
    if (prev && prev.rating === verdict) {
      delete ratings.cls[rec.pmid];
      document.getElementById(`cls-approve-${idx}`).classList.remove('selected');
      document.getElementById(`cls-reject-${idx}`).classList.remove('selected');
    } else {
      ratings.cls[rec.pmid] = { pmid: rec.pmid, label: rec.label, rating: verdict, rated_at: new Date().toISOString() };
      document.getElementById(`cls-approve-${idx}`).classList.toggle('selected', verdict === 'approve');
      document.getElementById(`cls-reject-${idx}`).classList.toggle('selected', verdict === 'reject');
      navigate(arm, 1);
    }
  } else {
    // PICO: per-element rating
    if (!ratings.pico[rec.pmid]) {
      ratings.pico[rec.pmid] = { pmid: rec.pmid, label: rec.label, P: null, I: null, C: null, O: null, N: null, rated_at: null };
    }
    const entry = ratings.pico[rec.pmid];
    if (entry[picoKey] === verdict) {
      // toggle off
      entry[picoKey] = null;
      document.getElementById(`pico-${picoKey}-approve-${idx}`).classList.remove('selected');
      document.getElementById(`pico-${picoKey}-reject-${idx}`).classList.remove('selected');
    } else {
      entry[picoKey] = verdict;
      entry.rated_at = new Date().toISOString();
      document.getElementById(`pico-${picoKey}-approve-${idx}`).classList.toggle('selected', verdict === 'approve');
      document.getElementById(`pico-${picoKey}-reject-${idx}`).classList.toggle('selected', verdict === 'reject');
      // Auto-advance when all rateable fields on this card are done
      if (picoRateableKeys(rec).every(k => entry[k] !== null)) navigate(arm, 1);
    }
  }
  updateProgress();
}

// ── Navigation ─────────────────────────────────────────────────────────────────
function showCard(arm, idx) {
  const total = arm === 'cls' ? CLS_DATA.length : PICO_DATA.length;
  document.querySelectorAll(`#${arm}-cards .card`).forEach(c => c.classList.remove('visible'));
  document.getElementById(`${arm}-card-${idx}`).classList.add('visible');
  document.getElementById(`${arm}-counter`).textContent = `${idx + 1} of ${total}`;
  document.getElementById(`${arm}-prev`).disabled = idx === 0;
  document.getElementById(`${arm}-next`).disabled = idx === total - 1;
}

function navigate(arm, dir) {
  if (arm === 'cls') {
    clsIdx = Math.max(0, Math.min(CLS_DATA.length - 1, clsIdx + dir));
    showCard('cls', clsIdx);
  } else {
    picoIdx = Math.max(0, Math.min(PICO_DATA.length - 1, picoIdx + dir));
    showCard('pico', picoIdx);
  }
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('cls-section').style.display  = tab === 'cls'  ? '' : 'none';
  document.getElementById('pico-section').style.display = tab === 'pico' ? '' : 'none';
  document.getElementById('tab-cls').classList.toggle('active',  tab === 'cls');
  document.getElementById('tab-pico').classList.toggle('active', tab === 'pico');
  showCard(tab, tab === 'cls' ? clsIdx : picoIdx);
}

// ── Progress ───────────────────────────────────────────────────────────────────
function updateProgress() {
  const clsDone  = Object.keys(ratings.cls).length;
  const picoDone = PICO_DATA.filter(rec => {
    const entry = ratings.pico[rec.pmid];
    return entry && picoRateableKeys(rec).every(k => entry[k] !== null);
  }).length;
  const total = CLS_DATA.length + PICO_DATA.length;
  const done  = clsDone + picoDone;
  document.getElementById('cls-progress-fill').style.width  = (clsDone  / CLS_DATA.length  * 100) + '%';
  document.getElementById('pico-progress-fill').style.width = (picoDone / PICO_DATA.length * 100) + '%';
  document.getElementById('cls-progress-label').textContent  = `${clsDone} / ${CLS_DATA.length}`;
  document.getElementById('pico-progress-label').textContent = `${picoDone} / ${PICO_DATA.length}`;
  document.getElementById('cls-count').textContent  = `${clsDone}/${CLS_DATA.length}`;
  document.getElementById('pico-count').textContent = `${picoDone}/${PICO_DATA.length}`;
  document.getElementById('dl-note').textContent = done === total ? '✓ All rated' : `${total - done} remaining`;
}

// ── Load saved ratings ─────────────────────────────────────────────────────────
const clsPmidToIdx  = Object.fromEntries(CLS_DATA.map((r, i)  => [r.pmid, i]));
const picoPmidToIdx = Object.fromEntries(PICO_DATA.map((r, i) => [r.pmid, i]));

function loadRatings(json) {
  for (const entry of (json.classification || [])) {
    const idx = clsPmidToIdx[entry.pmid];
    if (idx == null || !entry.rating) continue;
    ratings.cls[entry.pmid] = entry;
    document.getElementById(`cls-approve-${idx}`)?.classList.toggle('selected', entry.rating === 'approve');
    document.getElementById(`cls-reject-${idx}`)?.classList.toggle('selected',  entry.rating === 'reject');
  }
  for (const entry of (json.pico || [])) {
    const idx = picoPmidToIdx[entry.pmid];
    if (idx == null) continue;
    ratings.pico[entry.pmid] = { pmid: entry.pmid, label: entry.label,
      P: entry.P ?? null, I: entry.I ?? null, C: entry.C ?? null,
      O: entry.O ?? null, N: entry.N ?? null, rated_at: entry.rated_at ?? null };
    for (const key of ['P','I','C','O','N']) {
      if (!entry[key]) continue;
      document.getElementById(`pico-${key}-approve-${idx}`)?.classList.toggle('selected', entry[key] === 'approve');
      document.getElementById(`pico-${key}-reject-${idx}`)?.classList.toggle('selected',  entry[key] === 'reject');
    }
  }
  updateProgress();
}

function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      loadRatings(json);
      document.getElementById('dl-note').textContent = '✓ Ratings loaded';
    } catch {
      alert('Could not parse JSON file.');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // allow re-uploading same file
}

// ── Download JSON ──────────────────────────────────────────────────────────────
function downloadJSON(partial) {
  const clsRated  = Object.values(ratings.cls);
  const picoDone  = PICO_DATA.filter(rec => {
    const e = ratings.pico[rec.pmid];
    return e && picoRateableKeys(rec).every(k => e[k] !== null);
  }).length;
  if (!partial && (clsRated.length < CLS_DATA.length || picoDone < PICO_DATA.length)) {
    const rem = (CLS_DATA.length - clsRated.length) + (PICO_DATA.length - picoDone);
    if (!confirm(`${rem} record(s) not yet fully rated. Download anyway?`)) return;
  }
  const picoRated = Object.values(ratings.pico).map(e => ({
    pmid: e.pmid, label: e.label,
    P: e.P, I: e.I, C: e.C, O: e.O, N: e.N,
    rated_at: e.rated_at,
  }));
  const payload = {
    generated_at: new Date().toISOString(),
    seed: 123,
    classification: clsRated,
    pico: picoRated,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'validation_ratings.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Utility ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Dark mode ──────────────────────────────────────────────────────────────────
function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('dm-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('pico-dark', isDark ? '1' : '0');
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const arm = activeTab;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { navigate(arm, 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { navigate(arm,-1); e.preventDefault(); }

  // 1 = Approve, 2 = Reject (both tabs)
  if (e.key === '1' || e.key === '2') {
    const verdict = e.key === '1' ? 'approve' : 'reject';
    if (arm === 'cls') {
      rate('cls', clsIdx, verdict);
    } else {
      // Rate the first unrated rateable field in P→I→C→O→N order
      const rec = PICO_DATA[picoIdx];
      const entry = ratings.pico[rec.pmid] || {};
      const nextKey = picoRateableKeys(rec).find(k => entry[k] == null);
      if (nextKey) rate('pico', picoIdx, verdict, nextKey);
    }
    e.preventDefault();
  }
  // A/R also work for classification tab
  if (arm === 'cls') {
    if (e.key === 'a' || e.key === 'A') rate('cls', clsIdx, 'approve');
    if (e.key === 'r' || e.key === 'R') rate('cls', clsIdx, 'reject');
  }
});

// ── Init ───────────────────────────────────────────────────────────────────────
if (localStorage.getItem('pico-dark') === '1') {
  document.body.classList.add('dark');
  document.getElementById('dm-toggle').textContent = '☀️';
}
buildClsCards();
buildPicoCards();
showCard('cls', 0);
showCard('pico', 0);
updateProgress();
</script>
</body>
