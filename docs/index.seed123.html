= 175). The etiologic contribution of NC to each of the subgroups was examined with imaging studies. RESULTS: Neurocysticercosis was diagnosed on imaging studies in 34.6% of patients with seizure disorder of any type, 59.2% of those with a single seizure, 23.7% of those with recurrent seizure disorder, 92.0% of those with RASS, none of cases of incident epilepsy and 2.0% with prevalent epilepsy. A diagnosis of NC was significantly associated with single seizures (P < 0.001). CONCLUSIONS: Imaging abnormalities consistent with NC are frequently noted in persons presenting with a single seizure in neurologic care in NC-endemic countries like India. The probability of diagnosing NC diminishes with increasing numbers of seizures. Among samples of individuals with recurrent-unprovoked seizures, it is rare for imaging to demonstrate lesions of NC.", "year": "2006", "journal": "Acta neurologica Scandinavica", "label": "epidemiological_study"}, {"pmid": "10826538", "title": "Evidence for coupling between glucose metabolism and glutamate cycling using FDG PET and 1H magnetic resonance spectroscopy in patients with epilepsy.", "abstract": "The purpose of this study was to examine the relation between glucose metabolism and glutamate concentration in the human brain, in both the normal and diseased state. Regional values of glucose metabolism measured with 2-deoxy-2[F-18]fluoro-D-glucose positron emission tomography (FDG PET) studies and single-voxel proton magnetic resonance spectroscopy (1H MRS) measurements of the glutamate/ glutamine/gamma-aminobutyric acid (Glx) tissue concentration were determined in multiple brain regions in 11 patients (5 girls and 6 boys, mean age 7.5 years) with medically intractable partial epilepsy. FDG PET and 1H MRS studies were performed in the interictal state in seven patients and in the ictal/periictal state in four patients. Regions of interest were identified in epileptic cortex (determined by intracranial and/or scalp electroencephalography) and in contralateral normal brain regions. Lower glucose metabolism and lower Glx concentrations were found in the epileptic focus than in the contralateral normal cortex in all seven patients examined in the interictal state, whereas higher glucose metabolism and higher Glx concentrations were observed in the epileptic focus in the four patients who had ictal/periictal studies. Significant correlations were found between the values of cerebral glucose utilization and Glx concentration in epileptic brain region, in nonepileptic brain regions, and in epileptic and nonepileptic regions combined. These results demonstrate a significant relation between glucose metabolism and glutamate/glutamine concentration in normal and epileptic cerebral cortex. This relation is maintained in both the interictal and ictal states.", "year": "2000", "journal": "Journal of cerebral blood flow and metabolism : official journal of the International Society of Cerebral Blood Flow and Metabolism", "label": "epidemiological_study"}, {"pmid": "23739450", "title": "[A comparative study of the prevalence and risk factors of focal epilepsy in adults in the Republic of Kazakhstan and the Russian Federation].", "abstract": "The results of the comparative study of the prevalence and risk factors of epilepsy in adults in the Republic of Kazakhstan and the Russian Federation revealed that the consequences of perinatal pathology was the main risk factor in young patients while the consequences of brain injury or cerebrovascular disease predicted epilepsy in middle age and elderly people, respectively. These data may be used for prediction of course of epilepsy provided that long-term and careful studies on the dynamics of above-mentioned indicators will be carried out.", "year": "2013", "journal": "Zhurnal nevrologii i psikhiatrii imeni S.S. Korsakova", "label": "epidemiological_study"}, {"pmid": "30315514", "title": "Predicting state transitions in brain dynamics through spectral difference of phase-space graphs.", "abstract": "Networks are naturally occurring phenomena that are studied across many disciplines. The topological features of a network can provide insight into the dynamics of a system as it evolves, and can be used to predict changes in state. The brain is a complex network whose temporal and spatial behavior can be measured using electroencephalography (EEG). This data can be reconstructed to form a family of graphs that represent the state of the brain over time, and the evolution of these graphs can be used to predict changes in brain states, such as the transition from preictal to ictal in patients with epilepsy. This research proposes objective indications of seizure onset observed from minimally invasive scalp EEG. The approach considers the brain as a complex nonlinear dynamical system whose state can be derived through time-delay embedding of the EEG data and characterized to determine change in brain dynamics related to the preictal state. This method targets phase-space graph spectra as biomarkers for seizure prediction, correlates historical degrees of change in spectra, and makes accurate prediction of seizure onset. A significant trend of normalized dissimilarity over time indicates a departure from the norm, and thus a change in state. Our methods show high sensitivity (90-100%) and specificity (90%) on 241 h of scalp EEG training data, and sensitivity and specificity of 70%-90% on test data. Moreover, the algorithm was capable of processing 12.7 min of data per second on an Intel Core i3 CPU in Matlab, showing that real-time analysis is viable.", "year": "2019", "journal": "Journal of computational neuroscience", "label": "epidemiological_study"}, {"pmid": "37567865", "title": "Report of the ILAE SUDEP Task Force on national recommendations and practices around the world regarding the use of wearable seizure detection devices: A global survey.", "abstract": "Wearable seizure detection devices have the potential to address unmet needs of people with epilepsy. A recently published evidence-based international guideline recommends using such devices for safety indications in patients with tonic-clonic seizures (TCS). Our objective was to map existing guidelines and clinical practices at national level. We conducted a survey of the International League Against Epilepsy (ILAE) chapters regarding national recommendations and practical circumstances for prescribing seizure detection devices, and another survey of physicians in the ILAE constituency anywhere in the world, concerning their views and practices regarding recommendations for and prescription of such devices. Fifty-eight ILAE chapters (response rate 48%) and 157 physicians completed the surveys. More than two-thirds of responding countries do not have standards on wearables for seizure detection, although they indicated availability of such devices. The most often recognized indications were safety and objective seizure quantification. In nearly half of countries, devices are purchased by patients or caregivers, and either lack a uniform reimbursement scheme (41%) or patients pay the full cost for the device (48%). Tonic-clonic seizure frequency, nocturnal seizures, and previous injuries were the main factors that influenced the surveyed physicians to recommend wearable seizure detection devices. Our results document the need to implement international clinical practice guidelines at national level and to consider these when deciding upon reimbursement of seizure detection devices.", "year": "2023", "journal": "Epilepsia open", "label": "epidemiological_study"}, {"pmid": "33181892", "title": "Contributions of electrophysiology for identifying cortical language systems in patients with epilepsy.", "abstract": "A crucial element of the surgical treatment of medically refractory epilepsy is to delineate cortical areas that must be spared in order to avoid clinically relevant neurological and neuropsychological deficits postoperatively. For each patient, this typically necessitates determining the language lateralization between hemispheres and language localization within hemisphere. Understanding cortical language systems is complicated by two primary challenges: the extent of the neural tissue involved and the substantial variability across individuals, especially in pathological populations. We review the contributions made through the study of electrophysiological activity to address these challenges. These contributions are based on the techniques of magnetoencephalography (MEG), intracerebral recordings, electrical-cortical stimulation (ECS), and the electrovideo analyses of seizures and their semiology. We highlight why no single modality alone is adequate to identify cortical language systems and suggest avenues for improving current practice.", "year": "2020", "journal": "Epilepsy & behavior : E&B", "label": "surgical_outcomes_study"}, {"pmid": "22194240", "title": "Accurate localization of optic radiation during neurosurgery in an interventional MRI suite.", "abstract": "Accurate localization of the optic radiation is key to improving the surgical outcome for patients undergoing anterior temporal lobe resection for the treatment of refractory focal epilepsy. Current commercial interventional magnetic resonance imaging (MRI) scanners are capable of performing anatomical and diffusion weighted imaging and are used for guidance during various neurosurgical procedures. We present an interventional imaging workflow that can accurately localize the optic radiation during surgery. The workflow is driven by a near real-time multichannel nonrigid image registration algorithm that uses both anatomical and fractional anisotropy pre- and intra-operative images. The proposed workflow is implemented on graphical processing units and we perform a warping of the pre-operatively parcellated optic radiation to the intra-operative space in under 3 min making the proposed algorithm suitable for use under the stringent time constraints of neurosurgical procedures. The method was validated using both a numerical phantom and clinical data using pre- and post-operative images from patients who had undergone surgery for treatment of refractory focal epilepsy and shows strong correlation between the observed post-operative visual field deficit and the predicted damage to the optic radiation. We also validate the algorithm using interventional MRI datasets from a small cohort of patients. This work could be of significant utility in image guided interventions and facilitate effective surgical treatments.", "year": "2012", "journal": "IEEE transactions on medical imaging", "label": "surgical_outcomes_study"}, {"pmid": "32706922", "title": "Women with drug-resistant epilepsy: Surgery or pregnancy first?", "abstract": "OBJECTIVE: We compared women with drug-resistant focal epilepsy who had undergone surgery (WWE-S) with those who were managed medically (WWE-M) for maternal and fetal outcomes of their pregnancies. METHODS: We classified all WWE-S who were enrolled in a prospective registry of epilepsy and pregnancy (1998-2015) as those who underwent the surgery before pregnancy (WWE-SF) or after pregnancy (WWE-PF). The comparator group (WWE-M) was twice that number of age-matched women with focal epilepsy in this registry. Their clinical profile, anti-epileptic drug (AED) use, and pregnancy outcomes were extracted from the records of the registry. RESULTS: The number of completed pregnancies with known outcome was 74 for WWE-S (67 WWE-SF and 7 WWE-PF) and 134 for WWE-M. Seizures increased during pregnancy for fewer WWE-SF than for WWE-M (14.9% vs 39.6%, P = .001). Compared to WWE-M, fewer WWE-SF had dose escalation during pregnancy (28.4% vs 14.9%, P = .025). Preterm deliveries were more frequent in WWE-SF than WWE-M (24.6% vs 12.2%, P = .029). The differences between the WWE-SF and WWE-M regarding the rates of fetal loss (10.4% vs 6.7%, P = .255), major congenital malformations (8.5% vs. 11.1%, P = .395), and development quotient at 1 year of age <85 (42.5% vs 42.3%, P = .569) were not statistically significant. Compared to WWE-PF, fewer WWE-SF had AED dose escalation (14.9% vs 85.7%, P = .001) or increase in seizures (14.9% vs 100%, P = .001) during pregnancy. WWE-SF had fewer infants with development quotient <85 (41.0% vs 100%, P = .005). SIGNIFICANCE: WWE-SF can expect better control of seizures and decreased AED burden during pregnancy than WWE with focal epilepsies managed with medicines only. WWE who undergo surgery for epilepsy before their pregnancies can expect fewer seizures and lower AED burden during pregnancy.", "year": "2020", "journal": "Epilepsia", "label": "surgical_outcomes_study"}, {"pmid": "11162757", "title": "Ictal brain hemodynamics in the epileptic focus caused by a brain tumor using functional magnetic resonance imaging (fMRI).", "abstract": "Using functional magnetic resonance imaging (fMRI) we were able to observe, in detail, ictal brain hemodynamics during epileptic seizure caused by a brain tumor. A 53-year-old man was experencing partial motor seizures of the left side of his face and neck. In a brain MR image a mass lesion was found in the subcortical area of the right frontal lobe. We found focal spikes in his right hemisphere, though dominantly in C4 and T4 regions. fMRI investigations were carried out at 1.5 T (GE Signa Horizon) using gradient-echo echo-planar neuroimaging. We were able to perform the ictal examination twice. The activated regions were focalized and clearly found only on the lateral side of the tumor base. The region was in agreement with the epileptic focus examined using an electrocorticogram (ECOG). The signal intensity in the seizure focus rapidly increased 30 seconds before the convulsion was observed. After the end of the convulsion it also took 30 seconds to restore the signal intensity to the baseline value. fMRI is a very useful tool for various studies such as the identification of the epileptic focus, the mechanism of epileptic seizure, and so on.", "year": "2000", "journal": "Seizure", "label": "surgical_outcomes_study"}, {"pmid": "23965747", "title": "Interaction between akt1-positive neurons and age at surgery is associated with surgical outcome in children with isolated focal cortical dysplasia.", "abstract": "To identify pathologic characteristics that are associated with outcome, we performed a retrospective analysis of the clinical, radiologic, and pathologic features of 44 children with isolated focal cortical dysplasia (FCD) after epilepsy surgery. Based on the International League Against Epilepsy Classification, 16 patients had FCD Type I and 28 subjects had FCD Type II. A significantly higher percentage of subjects with FCD Type IIb versus Types I and IIa were seizure-free after surgery. Akt (also known as protein kinase B) is the main downstream target of phosphatidylinositol 3'-kinase and has been implicated in epilepsy pathogenesis. Semiquantitative analysis of cortical gliosis and quantitation of Akt1-immunoreactive neurons indicated that individuals with FCD Type II were more likely to have diffuse astrogliosis and higher counts of Akt1-positive neurons versus those with FCD Type I. A logistic regression model, including Akt1-positive neurons, age at surgery, and the interaction of these factors, was significantly associated with seizure-free outcome. This study provides evidence that astrogliosis and overexpression of neuronal Akt1 protein may be important factors in the pathogenesis of FCD and suggests that the pathogenesis of FCD Type I may differ from that of FCD Type II in children.", "year": "2013", "journal": "Journal of neuropathology and experimental neurology", "label": "surgical_outcomes_study"}, {"pmid": "23551457", "title": "Rehospitalization and emergency department use rates before and after vagus nerve stimulation for epilepsy: use of state databases to provide longitudinal data across multiple clinical settings.", "abstract": "OBJECTIVES: Data regarding rehospitalization and emergency department (ED) visits following vagus nerve stimulation (VNS) present data analysis challenges. We present a method that uses California's multiple databases to more completely assay VNS efficacy. MATERIALS AND METHODS: The Healthcare Cost and Utilization Project's California Inpatient and Ambulatory Surgery databases were assayed for all VNS surgeries from 2005 to 2009. Patients were selected by epilepsy diagnosis codes and VNS procedure codes. Patients (total N = 629) were tracked across multiple databases using unique identifiers. Thirty-day and one-year post-implantation rates of VNS complication and healthcare visits were abstracted, along with one-year preoperative hospital and ED use. Statistics included correction for multiple comparisons. RESULTS: The one-year reoperation rate for adult patients (N = 536) was 3.9%; during the second year, an additional 3.2% of patients had reoperations. Within the first 30 days, <2% of patients experienced a complication. Four percent of patients were readmitted to a hospital, and 11.6% of patients visited an ED. The most common reason for rehospitalization or ED visit was seizure. In the first year after VNS, total seizure-related visits (hospitalization and ED) were 17% lower (2.12 visits per year to 1.71; p = 0.03). In the second year following VNS, seizure-related visits were 42% lower (2.21 visits per year to 1.27, p = 0.01). Pediatric patients (N = 93) had comparable results. CONCLUSIONS: VNS surgery has low rates of complications and reoperations and is associated with reduced incidence of seizure-related ED visits and hospital admissions in the first and second postoperative years.", "year": "2014", "journal": "Neuromodulation : journal of the International Neuromodulation Society", "label": "neuromodulation_study"}, {"pmid": "29932417", "title": "Phase-tuned neuronal firing encodes human contextual representations for navigational goals.", "abstract": "We previously demonstrated that the phase of oscillations modulates neural activity representing categorical information using human intracranial recordings and high-frequency activity from local field potentials (Watrous et al., 2015b). We extend these findings here using human single-neuron recordings during a virtual navigation task. We identify neurons in the medial temporal lobe with firing-rate modulations for specific navigational goals, as well as for navigational planning and goal arrival. Going beyond this work, using a novel oscillation detection algorithm, we identify phase-locked neural firing that encodes information about a person's prospective navigational goal in the absence of firing rate changes. These results provide evidence for navigational planning and contextual accounts of human MTL function at the single-neuron level. More generally, our findings identify phase-coded neuronal firing as a component of the human neural code.", "year": "2018", "journal": "eLife", "label": "neuromodulation_study"}, {"pmid": "40674874", "title": "Efficacy of repetitive transcranial magnetic stimulation (rTMS) therapy in children with drug refractory focal epilepsy - A randomized trial.", "abstract": "BACKGROUND: Low frequency repetitive transcranial magnetic stimulation (rTMS) can suppress local neural circuits beyond the stimulation period and can be a potential treatment option for focal epilepsy. This study analysed the short-term effect of rTMS on seizure frequency, EEG, behavior, and cognition in children with drug refractory focal epilepsy (DRFE). METHODS: This is a single center, randomized double-blind sham controlled clinical trial (CTRI/2019/02/017,440). Children aged 5 to 18 years with DRFE with ≥ four focal seizures per month despite on ≥ two appropriately chosen antiseizure medications (ASMs) randomly received active or sham rTMS treatment along with the ongoing ASMs. Intervention comprised of 45 min rTMS sessions of 0.5 Hz (1200 pulses at 110 % of resting motor threshold (RMT) targeted over seizure focus using figure-of-8 coil for 10 consecutive days. The primary outcome was to compare the proportion of children who achieved >50 % seizure reduction in active and sham arm at 8-week post-therapy. RESULTS: Forty-nine children were enrolled in the trial (25 active and 24 sham). All randomized participants received the allocated treatment. No attrition occurred. Active rTMS therapy led to >50 % seizure reduction in 76 % (19/25) children versus 12.5 % (03/24) in sham arm (p < 0.0001) with absolute risk difference (95 % CI) between the groups was 0.68 (0.52, 0.84). Mean (SD) reduction in spike wave index (SWI) in sleep EEG was 34.4(29.9) with rTMS vs -1.89(22.5) in sham arm with absolute risk difference (95 % CI) -36.4(-51.7, -21.1). Between active and sham group mean (SD) change in Intelligence quotient (IQ) was 3.7(2.8) vs -0.91(3.1), p value 0.001; Child Behavior Checklist (CBCL) scores improved in behavioral domains of inattention (-5.5(3.8) vs 0.41(2.7), p < 0.001; hyperactivity -3.8(4.1) vs -0.5(2.8), p < 0.006 and aggression -4.1(2.4) vs 0.40(2.8), p < 0.001. Adverse effects were primarily limited to headache and scalp discomfort. CONCLUSION: Adjunctive low frequency rTMS may induce better short-term seizure control and electrographic improvement compared to sham stimulation in children with DRFE. These results will serve as a basis for a larger multicentric clinical trial.", "year": "2025", "journal": "Seizure", "label": "neuromodulation_study"}, {"pmid": "28494616", "title": "Breakdown of Thalamo-Cortical Connectivity Precedes Spike Generation in Focal Epilepsies.", "abstract": "Electroencephalography (EEG) spikes and focal epileptic seizures are generated in circumscribed cerebral networks that have been insufficiently described. For precise time and spatial domain network characterization, we applied in patients with focal epilepsy dense array 256-channel EEG recordings with causal connectivity estimation by using time-resolved partial directed coherence and 3T-magnetic resonance imaging-derived cortical and thalamus integrity reconstruction. Before spike generation, significant theta and alpha bands driven information flows alterations were noted from both temporal and frontal lobes to the thalamus and from the thalamus to the frontal lobe. Medial dorsal and ventral anterior nuclei of the thalamus were delimited as possible pacemakers. Markedly reduced thalamic volumes and impaired cortical integrity in widespread areas predicted the altered information flows. Our data reveal distinct patterns of connectivity involving the thalamus and frontal cortex that are both directly and causally involved in spike generation. These structures might play an essential role in epileptogenesis and could be targeted in future therapeutic approaches.", "year": "2017", "journal": "Brain connectivity", "label": "neuromodulation_study"}, {"pmid": "18790081", "title": "Power spectral density changes and language lateralization during covert object naming tasks measured with high-density EEG recordings.", "abstract": "Our objective was to study changes in EEG time-domain power spectral density (PSDt) and localization of language areas during covert object naming tasks in human subjects with epilepsy. EEG data for subjects with epilepsy were acquired during the covert object naming tasks using a net of 256 electrodes. The trials required each subject to provide the names of common objects presented every 4 seconds on slides. Each trial comprised the 1.0 second before and 3.0 seconds after initial object presentation. PSDt values at baseline and during tasks were calculated in the theta, alpha, beta, low gamma, and high gamma bands. The spatial contour plots reveal that PSDt values during object naming were 10-20% higher than the baseline values for different bands. Language was lateralized to left frontal or temporal areas. In all cases, the Wada test disclosed language lateralization to the left hemisphere as well.", "year": "2009", "journal": "Epilepsy & behavior : E&B", "label": "neuromodulation_study"}, {"pmid": "7582661", "title": "Supplementary motor area seizures presenting as stumbling episodes.", "abstract": "A healthy young boy presented with brief stumbling episodes of recent onset. Evaluation with prolonged EEG-video monitoring led to the diagnosis of supplementary motor area epilepsy. Focal seizures arising from the medial fronto-parietal cortex may present unusual diagnostic pitfalls in their clinical semeiology as well as their EEG characteristics.", "year": "1995", "journal": "Seizure", "label": "case_report"}, {"pmid": "31229970", "title": "Drug-resistant epilepsy, early-onset hypertension and white matter lesions: a hidden paraganglioma.", "abstract": "We describe the case of a 35-year-old man with focal epilepsy since age 16. Due to a refractory course, several treatments were tried over the years, including insertion of a deep brain stimulator. At the time of his first assessment at our unit, he had recently been diagnosed with hypertension. An MR scan of brain revealed multiple T2 hyperintense white matter lesions, and evidence of previous haemorrhage in the left basal ganglia and pons. On follow-up imaging, the changes were considered to be in keeping with hypertensive arteriopathy. He was referred for further assessment of his hypertension and was found to have a para-aortic paraganglioma. This was excised 16 months after his initial presentation to us. The surgery was associated with an improvement in his seizure control. This case serves as a reminder of the need to be vigilant about the possibility of coexisting conditions in people with epilepsy.", "year": "2019", "journal": "BMJ case reports", "label": "case_report"}, {"pmid": "32615293", "title": "First Report of Concomitant Pathogenic Mutations Within MGC4607/CCM2 and KRIT1/CCM1 in a Familial Cerebral Cavernous Malformation Patient.", "abstract": "BACKGROUND: Familial cerebral cavernous malformations (CCM) are among the most common vascular malformations of the central nervous system (CNS) and are linked to mutations on the specific genes CCM1/KRIT1, CCM2/MGC4607, and CCM3/PDCD10. We present the first report in the literature of a pharmaco-resistant epileptic patient harboring co-occurring pathogenic mutations within CCM2/MGC4607 and CCM1/KRIT1. CASE DESCRIPTION: A 51-year-old patient first presented at age of 33 years with episodes of seizures. Magnetic resonance imaging including a susceptibility-weighted imaging sequence had shown multiple cerebral cavernous malformation lesions. She had partial response of symptoms and remained in routine follow-up needing progressive pharmacological improvement. Direct sequencing allowed the detection of 1 nonsense pathogenic mutation in CCM2/MGC4607 (c.118C>T; p.Arg40Ter) and 1 unclassified frameshift insertion variant in CCM1/KRIT1 (c.1687_1688insT; p.Tyr563LeufsTer5). CONCLUSIONS: Although the CCM2/MGC460 variant seems to be the major contributor for the patient's CCM phenotype, the mutated CCM1/KRIT1 seems to act as a booster to CCM overall pathogenicity.", "year": "2020", "journal": "World neurosurgery", "label": "case_report"}, {"pmid": "26909536", "title": "EZOGABINE (POTIGA) MACULOPATHY.", "abstract": "PURPOSE: To present a case of partially reversible retinal toxicity related to a newer epilepsy medication, ezogabine (Potiga). METHODS: Case report with multimodal imaging. PATIENT: A patient presented 9 months after starting ezogabine for a screening eye examination with new retinal pigment abnormalities in the maculas of both eyes. RESULTS: These macular abnormalities are characterized for the first time with multimodal imaging. They were partially reversible after cessation of the drug. CONCLUSION: Ezogabine toxicity presents as pigmentary changes in the macula on fundus examination and has newly described characteristics on imaging that can guide ophthalmologists when they perform the FDA-recommended 6-month screening visits for ocular toxicity.", "year": "N/A", "journal": "Retinal cases & brief reports", "label": "case_report"}, {"pmid": "29171396", "title": "Sleep-related hypermotor epilepsy activated by rapid eye movement sleep.", "abstract": "Most sleep-related seizures occur during non-rapid eye movement (NREM) sleep, particularly during stage changes. Sleep-related hypermotor epilepsy (SHE) is a rare epileptic syndrome characterized by paroxysmal motor seizures, mainly arising from NREM sleep. Here, we report a patient with SHE who had seven seizures captured on video-EEG-polysomnography during REM sleep. Ictal semiology of this patient ranged from brief paroxysmal arousals to hypermotor seizures. On EEG-polysomnography, the spontaneous arousals were more frequent during REM than NREM sleep, with a considerably higher arousal index in REM sleep (20/hour). While the reason for seizures during REM sleep in this patient is unclear, we speculate that the threshold and mechanisms of arousal during different sleep stages may be related to the occurrence of seizures. [Published with video sequences on www.epilepticdisorders.com].", "year": "2018", "journal": "Epileptic disorders : international epilepsy journal with videotape", "label": "case_report"}, {"pmid": "30685520", "title": "Chewing induced reflex seizures (\"eating epilepsy\") and eye closure sensitivity as a common feature in pediatric patients with SYNGAP1 mutations: Review of literature and report of 8 cases.", "abstract": "PURPOSE: Heterozygous SYNGAP1 gene mutations have been associated with several forms of idiopathic generalized epilepsy, autism spectrum disorders and delay of psychomotor development. We report eight patients with a SYNGAP1 mutation and chewing/eating induced reflex seizures as new phenotype and compare them to other patients with eating epilepsy and genetic mutations. METHODS: Presentation of clinical and anamnestic features and retrospective analysis of Video-EEG data of a 4 year old index patient with SYNGAP1 mutation and chewing /eating induced seizures. Clinical and anamnestic features and home videos of seven additional patients (4 female; age: 4-14 years) with SYNGAP1 mutation and eating induced reflex seizures were compared. RESULTS: All reflex seizures of the index patient showed similar focal EEG pattern with 1-5 seconds high amplitude, irregular 3/sec spike-wave complexes with initiation from left temporo-occipital, right temporo-occipital or bi- occipital / temporo-occipital regions. Eyelid myoclonia, the most common seizure type in all 8 patients, were typically initiated by eating or other simple orofacial stimuli. In the index patient eye closure preceded eating induced-eyelid myoclonia in 30/38 seizures. CONCLUSION: The main clinical features of our patient (i.e. intellectual disability, epilepsy, autistic features) are compatible with previous reports on patients with SYNGAP1 mutations. This is the first complete description of eating induced seizures in association with SYNGAP1 mutations. Whether eye closure sensitivity (ECS) represents an independent reflex epileptic trait, as seen in other patients with idiopathic \"generalized\" epilepsies (IGE), or eye closure is part of a complex trigger mechanism in SYNGAP1 patients' remains to be elucidated.", "year": "2019", "journal": "Seizure", "label": "case_series"}, {"pmid": "10612522", "title": "Nystagmus mimicking spasmus nutans as the presenting sign of Bardet-Biedl syndrome.", "abstract": "PURPOSE: To investigate the nystagmus of twin brothers presenting with spasmus nutans later diagnosed as Bardet-Biedl syndrome. METHODS: The twins presented at the age of 14 months with a presumed diagnosis of spasmus nutans. They were followed clinically and with quantitative electro-oculographic eye movement recordings until the age of 6 years. RESULTS: Polydactyly, truncal obesity, mild delay in cognitive development, visual acuity of 20/100, attenuated retinal vessels and pale disks, and bilaterally almost extinguished scotopic and photopic electroretinograms were found in both brothers. They had fine, fast, pendular, disconjugate, intermittent, oblique nystagmus. No head nodding was observed. CONCLUSION: As described in patients with other retinal diseases such as achromatopsia and congenital stationary night blindness, nystagmus of patients with Bardet-Biedl syndrome can mimic spasmus nutans.", "year": "1999", "journal": "American journal of ophthalmology", "label": "case_series"}, {"pmid": "37308336", "title": "Two-year efficacy of lacosamide as adjunctive therapy for generalized tonic-clonic seizures in patients with juvenile myoclonic epilepsy.", "abstract": "OBJECTIVE: To report the long-term efficacy of adjunctive lacosamide therapy in patients with juvenile myoclonic epilepsy whose generalized tonic-clonic seizures were significantly reduced by treatment. METHODS: A retrospective study was conducted in patients who visited the Department of Child Neurology, National Hospital Organization Nishiniigata Chuo Hospital and the Department of Pediatrics, National Hospital Organization Nagasaki Medical Center. Among patients who had been diagnosed with juvenile myoclonic epilepsy, those who received lacosamide as adjunctive therapy for refractory generalized tonic-clonic seizures for at least 2 years from January 2017 to December 2022, and who achieved seizure freedom or >50% seizure reduction in tonic-clonic seizures were included. The medical records and neurophysiological data of the patients were reviewed retrospectively. RESULTS: Four patients met the inclusion criteria. The mean age at the onset of epilepsy was 11.3 years (range 10-12), and the mean age of starting lacosamide was 17.5 years (range 16-21). All patients received two or more antiseizure medications prior to lacosamide. Three of four patients had seizure freedom for more than 2 years, and the one remaining patient had >50% seizure reduction for more than one year. Only one patient had recurrent myoclonic seizures after starting lacosamide. The mean lacosamide dose at the last visit was 425 mg/day (range 300-600). CONCLUSION: Adjunctive lacosamide therapy might be a treatment option for juvenile myoclonic epilepsy with generalized tonic-clonic seizures, which are not responsive to standard antiseizure medications.", "year": "2023", "journal": "Brain & development", "label": "case_series"}, {"pmid": "7925045", "title": "Epilepsy: case report and analysis of clinical management problems.", "abstract": "Epilepsy is a major cause of morbidity and accounted for up to 40% of psychiatric outpatient attendances in the experience of the author in Transkei, South Africa. In many cases clinical diagnosis and management were easy. In this paper, the author analyses the clinical management problems presented by seven patients between January 1986 and May 1989. A detailed case report is presented to illustrate difficulties in management. It is suggested that ethosuximide might be effective in the control of probable partial seizure disorders. Underlying electrophysiological considerations are discussed. It is noted, however, that it may not be easy to differentiate between partial or generalised seizure disorders on clinical grounds.", "year": "1994", "journal": "East African medical journal", "label": "case_series"}, {"pmid": "40616444", "title": "Delineating the Cognitive Profile of ODLURO Syndrome: Emergent Clues on the Endophenotype Across KMT2 Disorders.", "abstract": "O'Donnell-Luria-Rodan syndrome (ODLURO) is a very rare disorder caused by heterozygous pathogenic variants in KMT2E. While intellectual disability is associated with this syndrome based on retrospective chart review, the neurocognitive phenotype remains unexplored. This case series provides insight into the cognitive profile of ODLURO and discusses these trends in the context of other better-characterized disorders in the KMT2 families. This study involved a retrospective chart review of psychological or neuropsychological assessment reports from 10 patients with a likely pathogenic or pathogenic variant in KMT2E. The majority of participants scored within normal limits in verbal abstract reasoning and expressive vocabulary. In contrast, most participants performed below average to very low ranges in non-verbal abstract reasoning, working memory, sight word reading, and math computation skills. Wilcoxon paired tests showed verbal reasoning was stronger than non-verbal reasoning skills (p = 0.04). Over half of respondents rated their children in the at-risk to clinically significant range for attention problems and hyperactivity. Our cohort of patients with ODLURO presented with greater difficulties in non-verbal reasoning, attention, working memory, sight word reasoning, and math computation skills, juxtaposed with relative strengths in verbal skills. Our resulting trends show some similarities to cognitive profiles of Wiedemann-Steiner syndrome and Kabuki syndrome type 1, disorders caused by variants in KMT2A and KMT2D, respectively. Emergent findings suggest possible endophenotypes related to haploinsufficiency of the histone methyltransferases in the KMT2 group.", "year": "2025", "journal": "American journal of medical genetics. Part A", "label": "case_series"}, {"pmid": "40048818", "title": "Genotype-phenotype correlation of ODLURO syndrome comorbid epilepsy associated with KMT2E variations: Report on a novel case and systematic literature review.", "abstract": "BACKGROUND: O'Donnell-Luria-Rodan (ODLURO) syndrome is a newly described neurodevelopmental disorder caused by a pathogenic KMT2E variant. The primary clinical phenotypes include developmental delay, intellectual disability (ID), and epilepsy. Epilepsy, observed in 29% of affected individuals, has not been thoroughly investigated. In this study, we describe the phenotypes and genetic profiles of patients with ODLURO syndrome and epilepsy. METHODS: We summarized and analyzed data from 30 patients with ODLURO syndrome and epilepsy from the systematic literature and DECIPHER database. Information regarding seizure classification, brain MRI findings, antiseizure medications, and genetics variations was collected and analyzed retrospectively. RESULTS: The risk factors associated with epilepsy in ODLURO syndrome remain unclear, and clinical heterogeneity exists. While focal seizures are most prevalent, various epilepsy classifications are observed. Brain MRI findings indicated that cerebral atrophy and cystic changes were common, though no correlation with epilepsy was established. Among ten individuals with a record of antiseizure medication, approximately 70% required two or more antiseizure medications. CONCLUSIONS: A clear genotype-phenotype correlation remains elusive even among individuals with the same KMT2E variation. The pathogenesis of epilepsy associated with KMT2E variation is complex and necessitates further molecular genetic studies to elucidate the mechanisms underlying these genetic disorders. This research provides essential evidence for specific and individualized treatment approaches.", "year": "2025", "journal": "Epilepsy & behavior : E&B", "label": "systematic_review"}, {"pmid": "41123096", "title": "Service delivery, behavioural, and self-management interventions for children with epilepsy.", "abstract": "BACKGROUND: In the UK, approximately one in 1000 children aged zero to four years have epilepsy, and one in 200 children between the ages of five and 19 have epilepsy. There is a need to focus on models of service delivery and therapies that target cognitive, psychological, and behavioural aspects to improve seizure control and quality of life. OBJECTIVES: To assess the effects of service delivery, behavioural, and self-management interventions on seizure control and health-related quality of life in children with epilepsy. SEARCH METHODS: We used the Cochrane Register of Studies, MEDLINE, and two other databases, together with reference checking and contact with study authors, to identify the studies included in the review. The latest search date was 21 August 2023. SELECTION CRITERIA: We included randomised controlled trials (RCTs) or quasi-RCTs of any design (double/single-blinded, unblinded; parallel, cross-over, or cluster). We included behavioural or self-management interventions aimed at improving seizure control in children with epilepsy (average age 18 years or under), and any service delivery interventions targeting children with epilepsy (average age 18 years or under), their parents/carers, or both. DATA COLLECTION AND ANALYSIS: Our primary outcome was seizure control (i.e. change in seizure frequency, seizure freedom). Our secondary outcomes were: seizure severity, overall quality of life and other aspects of quality of life (such as anxiety and depression), medication usage, knowledge, general health, social and psychological function, and adverse events. We classified outcomes as short-term (up to six months) or long-term (over six months). At least two review authors independently screened all papers, extracted data, and assessed the risk of bias. Data analysis was performed by one review author and checked by at least one other review author. We used GRADE to assess the certainty of the evidence for (1) seizure control and (2) participant-reported overall quality of life using validated scales. MAIN RESULTS: We included six studies with a total of 468 randomised participants: four behavioural studies (subcategorised into psycho-behavioural interventions investigated in three studies involving 205 children; and one mind-body intervention with 20 children) and two service delivery studies, involving 243 adult carers of children with epilepsy. Most studies had a high risk of performance bias, detection bias, or both (for lack of or inadequate blinding of participants, personnel, or outcome assessors). The risk of bias was low or unclear across all other domains. Due to the studies' heterogeneity, we were unable to conduct a meta-analysis for any intervention or outcome. We identified no eligible self-management interventions. Psycho-behavioural interventions Compared to usual care, there was a small important effect showing that systemic family therapy may reduce seizure frequency slightly per month at three months (mean difference (MD) in seizure frequency per month -1.98, 95% confidence interval (CI) -3.84 to -0.12; 1 study, 104 participants; low-certainty evidence). Evidence was lacking for differences in seizure frequency between behavioural interventions and control groups in the other two studies (94 participants; results reported descriptively at 10 weeks, three months, and 12 months). Compared to usual care, a manual-based psychosocial group intervention may result in little to no difference in quality of life at three months, but the evidence is very uncertain (Paediatric Quality of Life Inventory: MD -1.40, 95% CI -8.21 to 5.41; 1 study, 76 participants; very low-certainty evidence; Glasgow Epilepsy Outcome Scale for Young Persons: MD -0.33, 95% CI -5.68 to 5.02; P = 0.90; 1 study, 76 participants; very low-certainty evidence). The other two psycho-behavioural studies did not assess overall quality of life. Mind-body interventions It is uncertain whether a mind-body intervention (yoga) made a difference in the number of participants who were seizure-free at three months (seizure freedom MD 1.62, 95% CI 0.97 to 2.69; 1 study, 20 participants; low-certainty evidence). This study did not measure quality of life. Service delivery interventions One service delivery intervention (a clinical pharmacist-led education intervention) assessed seizure control and overall quality of life versus usual care. The evidence is very uncertain whether there were differences in seizure freedom (MD 1.32, 95% CI 0.86 to 2.00; 1 study, 71 participants; very low-certainty evidence) or overall quality of life at two months (MD 10.46, 95% CI 1.82 to 19.10; 1 study, 71 participants; very low-certainty evidence). Quality of life was assessed by adult carers, not the children themselves. The other service delivery intervention ('WeChat'-based remote follow-up after hospital discharge) did not evaluate seizure control and only measured aspects of quality of life (anxiety and depression, 162 participants), rather than overall quality of life. No adverse events were reported in any of the six included studies. AUTHORS' CONCLUSIONS: We included six studies in this review, each examining a different intervention, reporting on different outcomes, and involving varied populations. All studies had several limitations, including small sample sizes, lack of blinding, and inconsistent outcome measurement across studies. Overall, the available evidence was of low to very low certainty. Results for long-term (≥ six months) outcomes were very limited for any type of intervention. High-quality RCTs assessing service delivery, behavioural, and self-management interventions in children and adolescents with epilepsy are needed. Trials should assess short-term (≤ six months) and long-term (> six months) outcomes. The development of a core outcome set for children with epilepsy would help ensure trials use relevant, meaningful, and consistent outcomes for evaluating intervention effects.", "year": "2025", "journal": "The Cochrane database of systematic reviews", "label": "systematic_review"}, {"pmid": "37895044", "title": "MicroRNAs as Potential Biomarkers of Post-Traumatic Epileptogenesis: A Systematic Review.", "abstract": "Structural or post-traumatic epilepsy often develops after brain tissue damage caused by traumatic brain injury, stroke, infectious diseases of the brain, etc. Most often, between the initiating event and epilepsy, there is a period without seizures-a latent period. At this time, the process of restructuring of neural networks begins, leading to the formation of epileptiform activity, called epileptogenesis. The prediction of the development of the epileptogenic process is currently an urgent and difficult task. MicroRNAs are inexpensive and minimally invasive biomarkers of biological and pathological processes. The aim of this study is to evaluate the predictive ability of microRNAs to detect the risk of epileptogenesis. In this study, we conducted a systematic search on the MDPI, PubMed, ScienceDirect, and Web of Science platforms. We analyzed publications that studied the aberrant expression of circulating microRNAs in epilepsy, traumatic brain injury, and ischemic stroke in order to search for microRNAs-potential biomarkers for predicting epileptogenesis. Thus, 31 manuscripts examining biomarkers of epilepsy, 19 manuscripts examining biomarkers of traumatic brain injury, and 48 manuscripts examining biomarkers of ischemic stroke based on circulating miRNAs were analyzed. Three miRNAs were studied: miR-21, miR-181a, and miR-155. The findings showed that miR-21 and miR-155 are associated with cell proliferation and apoptosis, and miR-181a is associated with protein modifications. These miRNAs are not strictly specific, but they are involved in processes that may be indirectly associated with epileptogenesis. Also, these microRNAs may be of interest when they are studied in a cohort with each other and with other microRNAs. To further study the microRNA-based biomarkers of epileptogenesis, many factors must be taken into account: the time of sampling, the type of biological fluid, and other nuances. Currently, there is a need for more in-depth and prolonged studies of epileptogenesis.", "year": "2023", "journal": "International journal of molecular sciences", "label": "systematic_review"}, {"pmid": "36401156", "title": "Effects of the international economic sanctions on access to medicine of the Iranian people: A systematic review.", "abstract": "OBJECTIVE: We hypothesized that the international economic sanctions have affected various groups of Iranian people and have compromised their right to access medicines. METHODS: Scopus and MEDLINE from their inception to 15 May 2022 were systematically searched for related published original manuscripts. The following keywords were used (title/abstract): \"sanction(s)\" AND \"Iran\". The inclusion criteria were all human studies and articles written in English. RESULTS: We could identify 24 articles. Sanctions have severely restricted patients with thalassemia, haemophilia, epilepsy, and multiple sclerosis from receiving their medical needs. Surveys and interviews of patients, healthcare professionals, and policy-makers have repeatedly shown that sanctions have greatly affected the health system in Iran. CONCLUSION: International economic sanctions have limited access of the Iranian people to medicines and are associated with the suffering of Iranians. This situation should provide a lesson for policymakers in other similar instances worldwide.", "year": "2022", "journal": "Journal of clinical pharmacy and therapeutics", "label": "systematic_review"}, {"pmid": "40782772", "title": "Artificial intelligence in forensic neuropathology: A systematic review.", "abstract": "BACKGROUND AND OBJECTIVES: In recent years, Artificial Intelligence (AI) has gained prominence as a robust tool for clinical decision-making and diagnostics, owing to its capacity to process and analyze large datasets with high accuracy. More specifically, Deep Learning, and its subclasses, have shown significant potential in image processing, including medical imaging and histological analysis. In forensic pathology, AI has been employed for the interpretation of histopathological data, identifying conditions such as myocardial infarction, traumatic injuries, and heart rhythm abnormalities. This review aims to highlight key advances in AI's role, particularly machine learning (ML) and deep learning (DL) techniques, in forensic neuropathology, with a focus on its ability to interpret instrumental and histopathological data to support professional diagnostics. MATERIALS AND METHODS: A systematic review of the literature regarding applications of Artificial Intelligence in forensic neuropathology was carried out according to the Preferred Reporting Item for Systematic Review (PRISMA) standards. We selected 34 articles regarding the main applications of AI in this field, dividing them into two categories: those addressing traumatic brain injury (TBI), including intracranial hemorrhage or cerebral microbleeds, and those focusing on epilepsy and SUDEP, including brain disorders and central nervous system neoplasms capable of inducing seizure activity. RESULTS: In both cases, the application of AI techniques demonstrated promising results in the forensic investigation of cerebral pathology, providing a valuable computer-assisted diagnostic tool to aid in post-mortem computed tomography (PMCT) assessments of cause of death and histopathological analyses. CONCLUSIONS: In conclusion, this paper presents a comprehensive overview of the key neuropathology areas where the application of artificial intelligence can be valuable in investigating causes of death.", "year": "2025", "journal": "Journal of forensic and legal medicine", "label": "systematic_review"}, {"pmid": "16164588", "title": "An overview of methods and empirical comparison of aggregate data and individual patient data results for investigating heterogeneity in meta-analysis of time-to-event outcomes.", "abstract": "Combining the results of individual studies using meta-analysis may be undertaken using either aggregate data (AD) or individual patient data (IPD). In any meta-analysis it is important to consider statistical heterogeneity between studies. Potential sources of heterogeneity can be explored using regression models with either AD or IPD. An overview of approaches and empirical assessment of how the results and conclusions differ from these analyses is undertaken using a meta-analysis of five randomized controlled trials comparing two antiepileptic drugs with time-to-event outcomes. Alternative meta-regression models using AD are compared to stratified Cox regression models using IPD. Age as a potential cause of heterogeneity is detected by both AD and IPD regression models. Time from first ever seizure to randomization is only identified by some AD models. A more thorough explanation of heterogeneity is obtained from the model using IPD but further empirical evidence comparing IPD and AD results are needed.", "year": "2005", "journal": "Journal of evaluation in clinical practice", "label": "meta_analysis"}, {"pmid": "28112710", "title": "Are cannabinoids effective for epilepsy?", "abstract": "Several beneficial effects have been proposed for cannabinoids in different clinical conditions, including epilepsy. However, their clinical role is controversial. Searching in Epistemonikos database, which is maintained by screening multiple databases, we identified five systematic reviews including four randomized trials addressing the question of this article. We extracted data and generated a summary of findings following the GRADE approach. We concluded it is not clear whether cannabinoids reduce the frequency of seizures in epilepsy because the certainty of the evidence is very low, and they probably increase adverse effects.", "year": "2017", "journal": "Medwave", "label": "meta_analysis"}, {"pmid": "22402188", "title": "A meta-analysis of pro-inflammatory cytokines in the plasma of epileptic patients with recent seizure.", "abstract": "This review was to assess the concentration changing trends of various cytokines in plasma of epilepsy patients after recent seizure, as well as to assess the differences between temporal lobe epilepsy (TLE) and extra-TLE (XLE) patients. We performed a meta-analysis of studies measuring cytokine concentration in plasma of patients suffering from epilepsy after recent seizure, by searches of the English literature in Pubmed and Embase databases (to July 1st 2010) and a manual search of references. A random-effects model was used to do accumulative analysis for the included studies by RevMan 5.0 software. Eight studies were included and analyzed. We found the plasma concentrations of interleukin-6 (IL-6) within 72h after seizure were significantly increased in epileptic patients compared with control subjects (211 epilepsy patients vs. 564 controls, overall weighted mean difference 1.27pg/ml, 95% confidence interval 0.72-1.82, P<0.0001). There were no significant differences for IL-1 beta and, IL-1 receptor antagonist (IL-1RA) between the two groups. The concentration changes of IL-6 and IL-1RA were not significantly different between TLE patients and XLE patients. The result of this meta-analysis revealed significantly higher concentrations of the pro-inflammatory cytokines IL-6 in epileptic seizure patients compared with control subjects. Further rigorous studies are needed to clarify the precise role of cytokines in epilepsy.", "year": "2012", "journal": "Neuroscience letters", "label": "meta_analysis"}, {"pmid": "38879275", "title": "Cognitive performance in functional seizures compared with epilepsy and healthy controls: a systematic review and meta analysis.", "abstract": "BACKGROUND: Cognition is a core component of functional seizures, but the literature on cognition in this disorder has been heterogeneous, with no clear unifying profile emerging from individual studies. The aim of this study was to do a systematic review and meta-analysis of cognitive performance in adults with functional seizures compared with epilepsy (including left temporal lobe epilepsy) and compared with healthy non-seizure cohorts. METHODS: In this systematic review and meta-analysis, starting Feb 6, 2023, replicated and updated on Oct 31, 2023, a medical librarian searched MEDLINE, Embase, PsycINFO, and Web of Science. Inclusion criteria were full reports documenting raw or standardised cognitive test data in adults with functional seizures compared with adults with epilepsy, prospectively recruited healthy comparisons, or published norms. Grey literature was retained and there were no language or date restrictions. We excluded studies only reporting on mixed functional seizures and epilepsy, or mixed functional neurological samples, with no pure functional seizures group. Risk of bias was evaluated using a modified version of the Newcastle-Ottawa Scale. People with lived experiences were not involved in the design or execution of this study. This study is registered as CRD42023392385 in PROSPERO. FINDINGS: Of 3834 records initially identified, 84 articles were retained, including 8654 participants (functional seizures 4193, epilepsy 3638, and healthy comparisons 823). Mean age was 36 years (SD 12) for functional seizures, 36 years (12) for epilepsy, and 34 years (10) for healthy comparisons, and the proportion of women per group was 72% (range 18-100) for functional seizures, 59% (range 15-100) for epilepsy, and 69% (range 34-100) for healthy comparisons. Data on race or ethnicity were rarely reported in the individual studies. Risk of bias was moderate. Cognitive performance was better in people with functional seizures than those with epilepsy (Hedges' g=0·17 [95% CI 0·10-0·25)], p<0·0001), with moderate-to-high heterogeneity (Q[56]=128·91, p=0·0001, I<sup>2</sup>=57%). The functional seizures group performed better than the epilepsy group on global cognition and intelligence quotient (g=0·15 [0·02-0·28], p=0·022) and language (g=0·28 [0·14-0·43], p=0·0001), but not other cognitive domains. A larger effect was noted in language tests when comparing functional seizures with left temporal lobe epilepsy (k=5; g=0·51 [0·10 to 0·91], p=0·015). The functional seizures group underperformed relative to healthy comparisons (g=-0·61 [-0·78 to -0·44], p<0·0001), with significant differences in all cognitive domains. Meta regressions examining effects of multiple covariates on global cognition were not significant. INTERPRETATION: Patients with functional seizures have widespread cognitive impairments that are likely to be clinically meaningful on the basis of moderate effect sizes in multiple domains. These deficits might be slightly less severe than those seen in many patients with epilepsy but nevertheless argue for consideration of clinical assessment and treatment. FUNDING: Department of Veterans Affairs, Veterans Health Administration.", "year": "2024", "journal": "The lancet. Psychiatry", "label": "meta_analysis"}, {"pmid": "31423575", "title": "Method of invasive monitoring in epilepsy surgery and seizure freedom and morbidity: A systematic review.", "abstract": "OBJECTIVE: Invasive monitoring is sometimes necessary to guide resective surgery in epilepsy patients, but the ideal method is unknown. In this systematic review, we assess the association of postresection seizure freedom and adverse events in stereoelectroencephalography (SEEG) and subdural electrodes (SDE). METHODS: We searched three electronic databases (MEDLINE, Embase, and CENTRAL [Cochrane Central Register of Controlled Trials]) from their inception to January 2018 with the keywords \"electroencephalography,\" \"intracranial grid,\" and \"epilepsy.\" Studies that presented primary quantitative patient data for postresection seizure freedom with at least 1 year of follow-up or complication rates of SEEG- or SDE-monitored patients were included. Two trained investigators independently collected data from eligible studies. Weighted mean differences (WMDs) with 95% confidence interval (CIs) were used as a measure of the association of SEEG or SDE with seizure freedom and with adverse event outcomes. RESULTS: Of 11 462 screened records, 48 studies met inclusion criteria. These studies reported on 1973 SEEG patients and 2036 SDE patients. Our systematic review revealed SEEG was associated with 61.0% and SDE was associated with 56.4% seizure freedom after resection (WMD = +5.8%, 95% CI = 4.7-6.9%, P = .001). Furthermore, SEEG was associated with 4.8% and SDE was associated with 15.5% morbidity (WMD = -10.6%, 95% CI = -11.6 to -9.6%, P = .001). SEEG was associated with 0.2% mortality and SDE was associated with 0.4% mortality (WMD = -0.2%, 95% CI = -0.3 to -0.1%, P = .001). SIGNIFICANCE: In this systematic review of SEEG and SDE invasive monitoring techniques, SEEG was associated with fewer surgical resections yet better seizure freedom outcomes in those undergoing resections. SEEG was also associated with lower mortality and morbidity than SDE. Clinical studies directly comparing these modalities are necessary to understand the relative rates of seizure freedom, morbidity, and mortality associated with these techniques.", "year": "2019", "journal": "Epilepsia", "label": "meta_analysis"}, {"pmid": "17525019", "title": "Non-invasive alternatives to the Wada test in the presurgical evaluation of language and memory functions in epilepsy patients.", "abstract": "The cognitive outcome of the surgical removal of an epileptic focus depends on the assessment of the localisation and functional capacity of language and memory areas which need to be spared by the neurosurgeon. Traditionally, presurgical evaluation of epileptic patients has been achieved by means of the intracarotid amobarbital test assisted by neuropsychological measures. However, the advent of neuroimaging techniques has provided new ways of assessing these functions by means of non-invasive or minimally invasive methods, such as anatomical and functional magnetic resonance imaging, positron emission tomography, single-photon emission computed tomography, transcranial magnetic stimulation, functional transcranial Doppler monitoring, magnetoencephalography and near infrared spectroscopy. This paper aims at comparing and evaluating the traditional and recent preoperative approaches from a neuropsychological perspective.", "year": "2007", "journal": "Epileptic disorders : international epilepsy journal with videotape", "label": "narrative_review"}, {"pmid": "23809033", "title": "Seizures and the neurosurgical intensive care unit.", "abstract": "The cause of seizures in the neurosurgical intensive care unit (NICU) can be categorized as emanating from either a primary brain pathology or from physiologic derangements of critical care illness. Patients are typically treated with parenteral antiepileptic drugs. For early onset ICU seizures that are easily controlled, data support limited treatment. Late seizures have a more ominous risk for subsequent epilepsy and should be treated for extended periods of time or indefinitely. This review ends by examining the treatment algorithms for simple seizures and status epilepticus and the role newer antiepileptic use can play in the NICU.", "year": "2013", "journal": "Neurosurgery clinics of North America", "label": "narrative_review"}, {"pmid": "23909853", "title": "Issues related to symptomatic and disease-modifying treatments affecting cognitive and neuropsychiatric comorbidities of epilepsy.", "abstract": "Many symptoms of neurologic or psychiatric illness--such as cognitive impairment, depression, anxiety, attention deficits, and migraine--occur more frequently in people with epilepsy than in the general population. These diverse comorbidities present an underappreciated problem for people with epilepsy and their caregivers because they decrease quality of life, complicate treatment, and increase mortality. In fact, it has been suggested that comorbidities can have a greater effect on quality of life in people with epilepsy than the seizures themselves. There is increasing recognition of the frequency and impact of cognitive and behavioral comorbidities of epilepsy, highlighted in the 2012 Institute of Medicine report on epilepsy. Comorbidities have also been acknowledged, as a National Institutes of Health (NIH) Benchmark area for research in epilepsy. However, relatively little progress has been made in developing new therapies directed specifically at comorbidities. On the other hand, there have been many advances in understanding underlying mechanisms. These advances have made it possible to identify novel targets for therapy and prevention. As part of the International League Against Epilepsy/American Epilepsy Society workshop on preclinical therapy development for epilepsy, our working group considered the current state of understanding related to terminology, models, and strategies for therapy development for the comorbidities of epilepsy. Herein we summarize our findings and suggest ways to accelerate development of new therapies. We also consider important issues to improve research including those related to methodology, nonpharmacologic therapies, biomarkers, and infrastructure.", "year": "2013", "journal": "Epilepsia", "label": "narrative_review"}, {"pmid": "33746629", "title": "Use of Innovative SPECT Techniques in the Presurgical Evaluation of Patients with Nonlesional Extratemporal Drug-Resistant Epilepsy.", "abstract": "Up to 30% of patients with epilepsy may not respond to antiepileptic drugs. Patients with drug-resistant epilepsy (DRE) should undergo evaluation for seizure onset zone (SOZ) localization to consider surgical treatment. Cases of drug-resistant nonlesional extratemporal lobe epilepsy (ETLE) pose the biggest challenge in localizing the SOZ and require multiple noninvasive diagnostic investigations before planning the intracranial monitoring (ICM) or direct resection. Ictal Single Photon Emission Computed Tomography (i-SPECT) is a unique functional diagnostic tool that assesses the SOZ using the localized hyperperfusion that occurs early in the seizure. Subtraction ictal SPECT coregistered to MRI (SISCOM), statistical ictal SPECT coregistered to MRI (STATISCOM), and PET interictal subtracted ictal SPECT coregistered with MRI (PISCOM) are innovative SPECT methods for the determination of the SOZ. This article comprehensively reviews SPECT and sheds light on its vital role in the presurgical evaluation of the nonlesional extratemporal DRE.", "year": "2021", "journal": "Molecular imaging", "label": "narrative_review"}, {"pmid": "26337111", "title": "Mechanisms Responsible for Cognitive Impairment in Epilepsy.", "abstract": "Epilepsy is often associated with cognitive and behavioral impairments that can have profound impact on the quality of life of patients. Although the mechanisms of cognitive impairment are not completely understood, we make an attempt to describe, from a systems perspective, how information processing is affected in epilepsy disorders. The aim of this review is to (1) define the nature of cognitive deficits associated with epilepsy, (2) review fundamental systems-level mechanisms underlying information processing, and (3) describe how information processing is dysfunctional in epilepsy and investigate the relative contributions of etiology, seizures, and interictal discharges (IDs). We conclude that these mechanisms are likely to be important and deserve more detailed scrutiny in the future.", "year": "2015", "journal": "Cold Spring Harbor perspectives in medicine", "label": "narrative_review"}, {"pmid": "16822650", "title": "ILAE classification of epilepsy syndromes.", "abstract": "The efforts of the International League against Epilepsy (ILAE) to devise classifications of the epilepsies has greatly improved communication among epileptologists and influenced both basic and clinical research. Several classifications have been proposed since 1970; the most recent classification of epilepsy syndromes and epilepsies was published in 1989. Since 1997, the ILAE Task Force on Classification and Terminology has been evaluating this classification and some modifications have been recommended. Although the 1989 classification can be criticized and needs to be updated, it has been widely accepted and is universally employed. Consequently, the Task Force has agreed not to propose a replacement until a clearly better classification can be created.", "year": "2006", "journal": "Epilepsy research", "label": "guidelines_consensus"}, {"pmid": "39899105", "title": "Implementing Guidelines and Measures in Epilepsy Care.", "abstract": "People with epilepsy must receive up-to-date, high-quality care that aligns with current understanding of basic disease mechanisms, improved diagnostic testing, and evolving medical and surgical treatments. Varying progress has been made in identifying, measuring, and mitigating epilepsy care gaps. Epilepsy guidelines and quality measures should be developed using rigorous processes informed by systematic reviews of best evidence in conjunction with prioritization of need. Epilepsy measures help operationalize guidelines and practice parameters. Most epilepsy quality indicators are process-based metrics defined by delivering care to the patient. Systematic and reliable tracking and documentation of seizure frequency using consistent language is required as a patient-reported outcome within individuals over time and across populations. Emerging literature has demonstrated gaps in epilepsy care, perhaps highlighting limitations in the dissemination and implementation of guidelines and quality measures in clinical practice. Quality improvement methods applied to clinical data registries and learning health systems may afford new opportunities to iteratively, collaboratively, and feasibly disseminate guidelines and quality measures, measure epilepsy care quality, allow for the testing of interventions to mitigate identified care gaps, and, ultimately, improve care for patients with epilepsy.", "year": "2025", "journal": "Continuum (Minneapolis, Minn.)", "label": "guidelines_consensus"}, {"pmid": "35981474", "title": "An Italian consensus on the management of Lennox-Gastaut syndrome.", "abstract": "PURPOSE: Although international guidelines exist, the clinical heterogeneity of Lennox-Gastaut syndrome (LGS) and the increasing availability of new and repurposed drugs (e.g., fenfluramine and cannabidiol) requires a practical guide to patient management in the clinical context. We report the results of a consensus survey among 42 Italian experts in the diagnosis and treatment of LGS. METHODS: The consensus procedure followed a modified Delphi approach. Statements were formulated, based on the most recent published evidence and the clinicians' personal experience, then discussed, and agreed upon by the experts through a two-round voting procedure. Approval of a statement was reached with an average score ≥7. RESULTS: Thirteen statements dealing with three main topics (i.e., clinical diagnosis and prognosis, impact on the Quality of Life (QoL), and treatment strategies) were generated. Six statements achieved a level of agreement sufficient for approval on the first voting round. Following the discussion and a few consequent amendments, most of the statements increased their level of agreement and all 13 were approved. CONCLUSIONS: Overall, the statements draw a slightly more benign picture of this rare and severe disease, highlighting the possibility of remission - albeit modest -, an apparent trend towards lower mortality, and the availability of several effective drugs, to which greater accessibility would be hoped for. Valproate remains a major therapeutic option in LGS patients although lamotrigine, rufinamide, topiramate, cannabidiol, and clobazam are popular therapeutic options in Italy, allowing for a tailor-made antiseizure therapy.", "year": "2022", "journal": "Seizure", "label": "guidelines_consensus"}, {"pmid": "33418162", "title": "Alternatives to valproate in girls and women of childbearing potential with Idiopathic Generalized Epilepsies: state of the art and guidance for the clinician proposed by the Epilepsy and Gender Commission of the Italian League Against Epilepsy (LICE).", "abstract": "Following recent European Medication Agency restrictions on valproate (VPA) use in girls and women of childbearing potential (WOCP), the Commission on Epilepsy and Gender of the Italian League against Epilepsy integrated current literature and legislative data in order to provide clinicians with guidance on antiseizure medication (ASM) prescription for Idiopathic Generalized Epilepsies (IGEs) in this population, avoiding VPA. We reviewed the updated literature on ASMs and examined the teratogenicity of those showing efficacy in IGEs. For all relevant ASMs, we considered the indications for use and the pregnancy and contraception-related recommendations given in the Italian Summary of Product Characteristics (SmPC) and on the websites of the European Medicines Agency (EMA) and other European Union (EU) countries' regulatory agencies. With the exception of absence seizures, the literature lacks high quality studies on ASMs in IGEs. In girls and WOCP, levetiracetam and lamotrigine should be considered the first-choice drugs in Generalized Tonic-Clonic Seizures Alone and in Juvenile Myoclonic Epilepsy, lamotrigine in Juvenile Absence Epilepsy, and ethosuximide in Childhood Absence Epilepsy. Although supported by the literature, several ASMs are off label, contraindicated or burdened by special warnings in pregnancy. Some discrepancies emerged between the various SmPC warnings for different brands of the same active principle. We provided a therapeutic algorithm for each IGE syndrome and highlighted the need for revised prescription rules, consistent with the latest literature data, uniformity of SmPC warnings for the same active principle, and more data on the efficacy of new ASMs in IGEs and their safety in pregnancy.", "year": "2021", "journal": "Seizure", "label": "guidelines_consensus"}, {"pmid": "12067321", "title": "Guidelines for the use of EEG methodology in the diagnosis of epilepsy. International League Against Epilepsy: commission report. Commission on European Affairs: Subcommission on European Guidelines.", "abstract": "The Commission of European Affairs of the International League Against Epilepsy published 'Appropriate Standards for Epilepsy Care Across Europe' which contained recommendations for the use of electroencephalography (EEG) in the diagnosis of epilepsy (Brodie et al. Epilepsia 1997; 38:1245). The need for a more specific basic document of EEG methodology was recognized and the Subcommission on European Affairs was asked to produce more detailed guidelines to be used across Europe recognizing the range of practices in EEG laboratories. There are many general guidelines published on EEG methodology but this document focuses on the diagnosis of epilepsy. Details from previously published guidelines are included in references and in an appendix. These guidelines are not meant to be used as minimal standards but recommendations that can be applied to all EEG laboratories despite variations in equipment.", "year": "2002", "journal": "Acta neurologica Scandinavica", "label": "guidelines_consensus"}, {"pmid": "21561810", "title": "Antiepileptic drug discovery: does mechanism of action matter?", "abstract": "This commentary discusses briefly the role of the mechanism of antiepileptic action in discovery of drugs for the treatment of epilepsy. More specifically, two questions are addressed. (1) Has mechanism-driven antiepileptic drug discovery brought us better epilepsy treatment? Although this question is difficult to answer, the short answer is \"not yet.\" Modern antiepileptic drugs with new or modified mechanisms of action do not seem to have substantially improved the efficacy or the safety of epilepsy treatment. In fact, some modern antiepileptic drugs such as progabide, tiagabine, and vigabatrin have been associated with a number of safety issues. (2) Why do drugs with new mechanisms seem to have failed to deliver better treatment? Although it is always difficult to know why something did not occur, one putative explanation may be worthwhile to consider. The past development of new antiepileptic drugs targeted putative mechanisms of seizure generation. As seizures are only symptoms of the underlying epilepsy, blocking seizure generation can provide at best only symptomatic treatment. It may be that the failure in treating drug-resistant seizures is related, at least in part, to the failure of current drugs in targeting the mechanisms underlying epilepsy. In conclusion, continuing to develop new antiepileptic drugs for drug-resistant epilepsy by targeting seizure generation may be futile and one possible explanation of why we do not seem to make substantial progress in the treatment of drug-resistant epilepsy. Developing antiepileptic drugs with antiepileptogenic activity may be a clue to better treatment of presently drug-resistant epilepsy.", "year": "2011", "journal": "Epilepsy & behavior : E&B", "label": "editorial_letter_commentary"}, {"pmid": "8206009", "title": "Commentary: how has neuroimaging improved patient care?", "abstract": "Neuroimaging has significantly altered the management of patients with partial epilepsy. Magnetic resonance imaging (MRI) has been demonstrated to be a reliable and accurate indicator of the common pathologic findings underlying a partial seizure disorder. Intracranial mass lesions have been shown to be highly coherent with the localization of the epileptogenic zone. An MRI-identified epileptogenic lesion affects the selection of patients for epilepsy surgery and alters the diagnostic evaluation and the operative strategy. The results of the MRI preoperatively have prognostic importance in patients undergoing surgical treatment for partial epilepsy. Patients with lesional epileptic syndromes are considered favorable candidates for surgical ablative treatment. Hippocampal volume studies may predict the neurocognitive outcome in patients undergoing temporal lobe surgery. The use of MRI has resulted in a reduction in chronic intracranial EEG monitoring at most epilepsy centers, especially in patients with lesional pathology. MRI may be a reasonable initial \"screening\" procedure in selected patients with intractable partial epilepsy before consideration of a presurgical evaluation. A classification of partial epilepsy is proposed, based on the results of MRI, that may be useful for patients being considered for surgical treatment. Importantly, preoperative MRI must be correlated with the electrophysiologic studies and ictal semiology before decision-making regarding surgical therapy.", "year": "1994", "journal": "Epilepsia", "label": "editorial_letter_commentary"}, {"pmid": "17144026", "title": "On cross-cultural conflict and pediatric intervention.", "abstract": "A critical examination of Richard Miller's position in his recent Children, Ethics, and Modern Medicine on how to handle pediatric interventions in cases of cross-cultural conflict between parents and doctors with respect to treating young children. Particular emphasis is placed on Miller's interpretation of and arguments about a Hmong case extensively researched by Anne Fadiman in her The Spirit Catches You and You Fall Down. The conclusion drawn is that Miller's position requires further nuance and development, and some recommendations are made toward that end.", "year": "2006", "journal": "The Journal of religious ethics", "label": "editorial_letter_commentary"}, {"pmid": "3049063", "title": "William G. Lennox: a remembrance.", "abstract": "William G. Lennox, author of Epilepsy and Related Disorders, had a lasting effect on our understanding of this illness. He postulated that epilepsy was not a unitary condition and that neuronal chemistries differed from one form of the disease to another. A leader in the use of electroencephalography in epilepsy, he described the first nearly pathognomonic EEG pattern and demonstrated specific features for each of the three most common types of seizure. His pioneering investigations into the biochemical basis of epilepsy helped to identify pathological mechanisms in epileptic
