<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Output Validation — Epilepsy PubMed Study</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-light: #eef2ff;
    --approve: #22c55e;
    --approve-bg: #f0fdf4;
    --reject: #ef4444;
    --reject-bg: #fef2f2;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.12);
  }
  .dark {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #818cf8;
    --accent-light: #1e1b4b;
    --approve: #4ade80;
    --approve-bg: #052e16;
    --reject: #f87171;
    --reject-bg: #450a0a;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header-top h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .header-top span.subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-left: 10px;
  }

  /* ── Progress ── */
  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-row-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
  }
  .progress-bar-bg {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .3s ease;
  }
  .progress-bar-fill.pico-fill { background: #22c55e; }
  .progress-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
    border: 1px solid var(--border);
    width: fit-content;
  }
  .tab-btn {
    padding: 7px 18px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: var(--shadow);
  }
  .tab-btn .count {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    border-radius: 99px;
    font-size: 11px;
    padding: 1px 6px;
    margin-left: 4px;
    font-weight: 600;
  }
  .tab-btn.active .count { background: var(--accent-light); color: var(--accent); }

  /* ── Main layout ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 120px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    display: none;
  }
  .card.visible { display: block; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .label-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-trial   { background: #dcfce7; color: #166534; }
  .badge-review  { background: #dbeafe; color: #1e40af; }
  .badge-other   { background: #f1f5f9; color: #475569; }

  .card-meta {
    font-size: 13px;
    color: var(--muted);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 12px;
  }
  .pmid-tag {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── Abstract ── */
  .abstract-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .abstract-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
  }

  /* ── PICO chips ── */
  .pico-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .pico-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .pico-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pico-P .pico-key { background: #dbeafe; color: #1e40af; }
  .pico-I .pico-key { background: #dcfce7; color: #166534; }
  .pico-C .pico-key { background: #fef9c3; color: #854d0e; }
  .pico-O .pico-key { background: #ede9fe; color: #5b21b6; }
  .pico-N .pico-key { background: #ffedd5; color: #9a3412; }
  .pico-val {
    font-size: 14px;
    line-height: 1.5;
    padding: 3px 10px;
    border-radius: 8px;
    flex: 1;
  }
  .pico-P .pico-val { background: #dbeafe22; }
  .pico-I .pico-val { background: #dcfce722; }
  .pico-C .pico-val { background: #fef9c322; }
  .pico-O .pico-val { background: #ede9fe22; }
  .pico-N .pico-val { background: #ffedd522; }
  .pico-val.na { color: var(--muted); font-style: italic; }

  /* Dark mode: PICO badges */
  .dark .badge-trial  { background: #14532d; color: #86efac; }
  .dark .badge-review { background: #1e3a5f; color: #93c5fd; }
  .dark .badge-other  { background: #1e293b; color: #94a3b8; }
  /* Dark mode: PICO key badges */
  .dark .pico-P .pico-key { background: #1e3a5f; color: #93c5fd; }
  .dark .pico-I .pico-key { background: #14532d; color: #86efac; }
  .dark .pico-C .pico-key { background: #422006; color: #fde047; }
  .dark .pico-O .pico-key { background: #2e1065; color: #c4b5fd; }
  .dark .pico-N .pico-key { background: #431407; color: #fdba74; }
  /* Dark mode: PICO val tints */
  .dark .pico-P .pico-val { background: #1e3a5f44; }
  .dark .pico-I .pico-val { background: #14532d44; }
  .dark .pico-C .pico-val { background: #42200644; }
  .dark .pico-O .pico-val { background: #2e106544; }
  .dark .pico-N .pico-val { background: #43140744; }

  /* ── Abstract highlights (mark) ── */
  mark.pico-P { background: #dbeafe; border-radius: 3px; padding: 1px 2px; outline: 1px solid #93c5fd; color: inherit; }
  mark.pico-I { background: #dcfce7; border-radius: 3px; padding: 1px 2px; outline: 1px solid #86efac; color: inherit; }
  mark.pico-C { background: #fef9c3; border-radius: 3px; padding: 1px 2px; outline: 1px solid #fde047; color: inherit; }
  mark.pico-O { background: #ede9fe; border-radius: 3px; padding: 1px 2px; outline: 1px solid #c4b5fd; color: inherit; }
  mark.pico-N { background: #ffedd5; border-radius: 3px; padding: 1px 2px; outline: 1px solid #fdba74; color: inherit; }
  .dark mark.pico-P { background: #1e3a5f; outline-color: #3b82f6; }
  .dark mark.pico-I { background: #14532d; outline-color: #22c55e; }
  .dark mark.pico-C { background: #422006; outline-color: #ca8a04; }
  .dark mark.pico-O { background: #2e1065; outline-color: #7c3aed; }
  .dark mark.pico-N { background: #431407; outline-color: #ea580c; }

  /* ── Dark mode toggle button ── */
  .dm-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    transition: background .15s;
    flex-shrink: 0;
  }
  .dm-btn:hover { background: var(--bg); }

  /* ── Rating buttons ── */
  .rating-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  .rate-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    color: var(--muted);
    position: relative;
  }
  .key-hint {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    opacity: 0.45;
    font-family: monospace;
  }
  .rate-btn:hover { border-color: var(--muted); }
  .rate-btn.approve.selected {
    border-color: var(--approve);
    background: var(--approve-bg);
    color: var(--approve);
  }
  .rate-btn.reject.selected {
    border-color: var(--reject);
    background: var(--reject-bg);
    color: var(--reject);
  }
  .rate-label { font-size: 13px; }

  .pico-row.na-row { opacity: 0.45; }
  .rate-btn.sm {
    padding: 5px 11px;
    font-size: 14px;
    flex-shrink: 0;
  }

  /* ── Navigation ── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: all .15s;
    box-shadow: var(--shadow);
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .card-counter {
    font-size: 13px;
    color: var(--muted);
  }

  /* ── Download button ── */
  .download-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .dl-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    transition: all .15s;
  }
  .dl-btn.primary {
    background: var(--accent);
    color: #fff;
  }
  .dl-btn.primary:hover { background: #4f46e5; }
  .dl-btn.primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .dl-btn.secondary {
    background: var(--surface);
    color: var(--accent);
    border: 1.5px solid var(--accent);
    font-size: 13px;
    padding: 9px 16px;
  }
  .dl-btn.secondary:hover { background: var(--accent-light); }
  .dl-complete-note {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-right: 4px;
  }

  /* ── Empty / section headers ── */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>LLM Output Validation</h1>
      <span class="subtitle">Epilepsy PubMed study · seed=123</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cls')" id="tab-cls">
          Classification <span class="count" id="cls-count">0/105</span>
        </button>
        <button class="tab-btn" onclick="switchTab('pico')" id="tab-pico">
          PICO Extraction <span class="count" id="pico-count">0/25</span>
        </button>
      </div>
      <button class="dm-btn" id="dm-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-row-label">Classification</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="cls-progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="cls-progress-label">0 / 105</span>
    </div>
    <div class="progress-row">
      <span class="progress-row-label">PICO</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill pico-fill" id="pico-progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="pico-progress-label">0 / 25</span>
    </div>
  </div>
</header>

<main>
  <div id="cls-section">
    <div class="section-title">Classification validation — 21 labels × 5 records</div>
    <div id="cls-cards"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="cls-prev" onclick="navigate('cls',-1)">&#8592; Prev</button>
      <span class="card-counter" id="cls-counter"></span>
      <button class="nav-btn" id="cls-next" onclick="navigate('cls',1)">Next &#8594;</button>
    </div>
  </div>

  <div id="pico-section" style="display:none">
    <div class="section-title">PICO extraction (highlighted text in abstract just for help with screening!)</div>
    <div id="pico-cards"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="pico-prev" onclick="navigate('pico',-1)">&#8592; Prev</button>
      <span class="card-counter" id="pico-counter"></span>
      <button class="nav-btn" id="pico-next" onclick="navigate('pico',1)">Next &#8594;</button>
    </div>
  </div>
</main>

<input type="file" id="upload-input" accept=".json" style="display:none" onchange="handleUpload(event)">
<div class="download-fab">
  <div class="dl-complete-note" id="dl-note"></div>
  <button class="dl-btn secondary" onclick="document.getElementById('upload-input').click()">&#11014; Load saved ratings</button>
  <button class="dl-btn secondary" onclick="downloadJSON(true)">Download partial JSON</button>
  <button class="dl-btn primary" id="dl-full" onclick="downloadJSON(false)">&#11015; Download ratings (JSON)</button>
</div>

<script>
// ── Embedded data ──────────────────────────────────────────────────────────────
const CLS_DATA   = [{"pmid": "11945097", "title": "Remacemide hydrochloride as an add-on therapy in epilepsy: a randomized, placebo-controlled trial of three dose levels (300, 600 and 800 mg/day) in a B.I.D. regimen.", "abstract": "Remacemide hydrochloride is a low-affinity, non-competitive NMDA receptor channel blocker under investigation for the treatment of epilepsy. This double-blind, placebo-controlled, multicentre study assessed the safety and efficacy of adjunctive remacemide hydrochloride or placebo, in adult patients with refractory epilepsy who were already taking up to three antiepileptic drugs (including an enzyme-inducer). Patients (n= 262) were randomized to one of three doses of remacemide hydrochloride (300, 600 or 800 mg/day) or placebo, in a B.I.D. regimen, for up to 14 weeks. Plasma concentrations of carbamazepine (CBZ) and phenytoin (PHT) were controlled throughout. Patients recorded their seizures on a diary card. There was an increase in the percentage of responders (defined as a reduction in seizure frequency from baseline > or = 50 %), from 15 % (9/60) with placebo, to 30 % (18/60) in the 800 mg/day group. A pairwise comparison between remacemide hydrochloride 800 mg/day and placebo was statistically significant (P = 0.049). Most reported adverse events (mainly CNS and gastrointestinal) were mild or moderate in severity and dose-dependent. Adjunctive remacemide hydrochloride treatment was associated with a higher, dose-related responder rate compared with placebo. The difference reached significance at the highest dose tested (800 mg/day). Remacemide hydrochloride was well tolerated.", "year": "2002", "journal": "Seizure", "label": "randomized_controlled_trial"}, {"pmid": "23227575", "title": "lennox-Gastaut syndrome: an updateon treatment.", "abstract": "Lennox-Gastaut syndrome (LGS) is a severe epileptic encephalopathy. Few current treatment options are effective in improving seizure control. This paper reviews the available treatments of LGS and discusses a new option in Canada, rufinamide. It is a wide spectrum anticonvulsant, approved in a number of countries for the treatment of LGS. In a randomized controlled trial in the LGS population, adjunctive rufinamide therapy has been shown to offer significantly greater reduction in total seizure frequency and tonic-atonic seizure frequency in comparison to placebo. Efficacy has been assessed over three years and appears to be sustained. Most adverse events were cognitive (e.g. somnolence) or gastrointestinal in nature and in many cases transient or mild. based on the efficacy and safety data on rufinamide obtained to date, this medication will provide additional benefits to patients with LGS in Canada and is an important consideration for our patients in the adjunctive treatment setting.", "year": "2012", "journal": "The Canadian journal of neurological sciences. Le journal canadien des sciences neurologiques", "label": "randomized_controlled_trial"}, {"pmid": "15144425", "title": "Randomized, controlled clinical trial of zonisamide as adjunctive treatment for refractory partial seizures.", "abstract": "PURPOSE: This study was designed to evaluate efficacy and safety of zonisamide (ZNS) as adjunctive treatment for patients with refractory partial seizures. METHODS: This randomized, double-blind, placebo-controlled study was conducted at four epilepsy treatment centers. It included a baseline phase (8 to 12 weeks) and a double-blind treatment phase (12 weeks). Initially, patients randomized to ZNS treatment were given a 7-mg/kg/d dosage. When investigators found that adverse effects could be reduced by gradually introducing ZNS, patients were allowed to begin treatment at lower doses (100 mg or approximately 1.5 mg/kg/d) titrated over several weeks to a maximum of 400 to 600 mg/d. Primary and secondary efficacy measures were the median percentage reduction from baseline in seizure frequency and the proportion of patients achieving a > or =50% reduction from baseline (responder rate). Patient and physician global assessments also served as indicators of efficacy. Safety was assessed primarily by treatment-emergent adverse events. RESULTS: ZNS-treated patients had a 28.9% reduction in seizure frequency, which differed significantly from the 4.7% increase in placebo-treated patients. The responder rate for ZNS-treated patients was 26.9%, compared with 16.2% for placebo-treated patients. At study's end, 66.2% of ZNS-treated patients and 12.3% of placebo-treated patients considered their condition improved; similarly, physicians assessed 63.6% of ZNS-treated patients and 10.8% of placebo-treated patients as improved. The most frequently reported adverse events with ZNS treatment included somnolence, irritability, dizziness, nausea, and fatigue. CONCLUSIONS: As adjunctive treatment, ZNS was generally well tolerated and significantly improved seizure control among patients with refractory partial seizures.", "year": "2004", "journal": "Epilepsia", "label": "randomized_controlled_trial"}, {"pmid": "30060984", "title": "Everolimus for epilepsy and autism spectrum disorder in tuberous sclerosis complex: EXIST-3 substudy in Japan.", "abstract": "BACKGROUND: Epilepsy and autism spectrum disorder (ASD) are the common neurological manifestations of tuberous sclerosis complex (TSC). EXIST-3 study has recently demonstrated that everolimus reduces seizures in patients with TSC and refractory epilepsy. Here we report the efficacy and safety of everolimus for treatment-refractory seizures in Japanese patients of EXIST-3, along with the exploratory analysis evaluating the everolimus effect on comorbid ASD symptoms in these patients. METHODS: Primary endpoint was change in seizure frequency from baseline defined as response rate (≥50% reduction) and median percentage reduction in the seizure frequency. Pervasive Developmental Disorders Autism Society Japan Rating Scale (PARS) scores were assessed at baseline and at week-18 for ASD symptoms. RESULTS: Overall, 35 Japanese patients were randomized to everolimus low-exposure (LE; n = 10), everolimus high-exposure (HE; n = 14), or placebo (n = 11). The response rate was 30.0% and 28.6% versus 0% with the everolimus LE and HE versus placebo arm, respectively. Similarly, the median percentage reduction in seizure frequency was 6.88% and 38.06% versus -6.67%. Stomatitis was the most frequently reported adverse event (everolimus LE, 100%; HE, 78.6%; placebo, 9.1%). Four of 11 patients with ASD in the everolimus arms and 1 of 8 patients with ASD in the placebo arm showed ≥5 point decrease in PARS scores. CONCLUSIONS: Adjunctive everolimus treatment improved seizure frequency with a tolerable safety relative to placebo among 35 Japanese patients with TSC-associated refractory seizures, consistent with the results of overall EXIST-3 study involving 366 patients. A favorable trend towards the improvement of ASD symptoms was observed.", "year": "2019", "journal": "Brain & development", "label": "randomized_controlled_trial"}, {"pmid": "23167925", "title": "Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy: initial monotherapy outcomes at 12 months.", "abstract": "PURPOSE: Determine the optimal initial monotherapy for children with newly diagnosed childhood absence epilepsy (CAE) based on 12 months of double-blind therapy. METHODS: A double-blind, randomized controlled clinical trial compared the efficacy, tolerability, and neuropsychological effects of ethosuximide, valproic acid, and lamotrigine in children with newly diagnosed CAE. Study medications were titrated to clinical response, and subjects remained in the trial unless they reached a treatment failure criterion. Maximal target doses were ethosuximide 60 mg/kg/day or 2,000 mg/day, valproic acid 60 mg/kg/day or 3,000 mg/day, and lamotrigine 12 mg/kg/day or 600 mg/day. Original primary outcome was at 16-20 weeks and included a video-electroencephalography (EEG) assessment. For this report, the main effectiveness outcome was the freedom from failure rate 12 months after randomization and included a video-EEG assessment; differential drug effects were determined by pairwise comparisons. The main cognitive outcome was the percentage of subjects experiencing attentional dysfunction at the month 12 visit. KEY FINDINGS: A total of 453 children were enrolled and randomized; 7 were deemed ineligible and 446 subjects comprised the overall efficacy cohort. There were no demographic differences between the three cohorts. By 12 months after starting therapy, only 37% of all enrolled subjects were free from treatment failure on their first medication. At the month 12 visit, the freedom-from-failure rates for ethosuximide and valproic acid were similar (45% and 44%, respectively; odds ratio [OR]with valproic acid vs. ethosuximide 0.94; 95% confidence interval [CI] 0.58-1.52; p = 0.82) and were higher than the rate for lamotrigine (21%; OR with ethosuximide vs. lamotrigine 3.08; 95% CI 1.81-5.33; OR with valproic acid vs. lamotrigine 2.88; 95% CI 1.68-5.02; p < 0.001 for both comparisons). The frequency of treatment failures due to lack of seizure control (p < 0.001) and intolerable adverse events (p < 0.037) was significantly different among the treatment groups. Almost two thirds of the 125 subjects with treatment failure due to lack of seizure control were in the lamotrigine cohort. The largest subgroup (42%) of the 115 subjects discontinuing due to adverse events was in the valproic acid group. The previously reported higher rate of attentional dysfunction seen at 16-20 weeks in the valproic acid group compared with the ethosuximide or lamotrigine groups persisted at 12 months (p < 0.01). SIGNIFICANCE: As initial monotherapy, the superior effectiveness of ethosuximide and valproic acid compared to lamotrigine in controlling seizures without intolerable adverse events noted at 16-20 weeks persisted at 12 months. The valproic acid cohort experienced a higher rate of adverse events leading to drug discontinuation as well as significant negative effects on attentional measures that were not seen in the ethosuximide cohort. These 12-month outcome data coupled with the study's prespecified decision-making algorithm indicate that ethosuximide is the optimal initial empirical monotherapy for CAE. This is the first randomized controlled trial meeting International League Against Epilepsy (ILAE) criteria for class I evidence for CAE (or for any type of generalized seizure in adults or children). (NCT00088452.).", "year": "2013", "journal": "Epilepsia", "label": "randomized_controlled_trial"}, {"pmid": "1414227", "title": "Effects of withdrawal of phenytoin on cognitive and psychomotor functions in hospitalized epileptic patients on polytherapy.", "abstract": "The effects of the withdrawal of phenytoin (PT) on cognitive and psychomotor functions of long-term patients in an epilepsy centre were studied. The patients had been treated for many years (31.1 +/- 10.8 yrs.) with PT in combination with other antiepileptic drugs. The serum concentration of PT was in the lower to middle therapeutic range (6.8 +/- 3.1 mg/l). Only patients in which the efficacy of PT was questionable were included in the study. PT was withdrawn in 17 patients. The PT dose was not changed in 12 patients (control group). Psychological tests were carried out immediately before the withdrawal of PT and about 10 weeks later. Tests were also carried out with the control group at the same time. A significantly improved performance (using a composite score) was noted after the withdrawal of PT. The statistical evaluation of the different tests showed an significant improvement in one test of concentration and two tests of psychomotor function (tapping and pursuit rotor with the dominant hand). There was no significant change in the frequency of seizures.", "year": "1992", "journal": "Acta neurologica Scandinavica", "label": "clinical_trial_non_randomized"}, {"pmid": "7140665", "title": "Anticonvulsant drugs and cognitive functions.", "abstract": "Thirty-five patients with epilepsy were seen before and 3 and 6 months following changes in their anticonvulsant regimes. Patients either underwent a reduction in the number of different drugs prescribed (n = 20) or had at least one drug changed to carbamazepine (n = 15). A third group of patients was seen at the same time intervals but remained on stable anticonvulsant therapy (n = 10). On each assessment session patients performed a series of specially designed tests of cognitive and motor functions, completed rating scales of mood, had a blood sample taken for the analysis of anticonvulsant serum levels, and had their seizure frequency for the previous 3 months documented. In addition, 24 patients had a routine EEG recording made. The overall results obtained suggested that a reduction in polypharmacy and the use of carbamazepine both had beneficial effects on cognitive functioning and mood.", "year": "1982", "journal": "Epilepsia", "label": "clinical_trial_non_randomized"}, {"pmid": "8269914", "title": "Thiamine and folate treatment of chronic epileptic patients: a controlled study with the Wechsler IQ scale.", "abstract": "Seventy-two epileptic patients receiving phenytoin (PHT) alone or in combination with phenobarbital for more than 4 years were divided into four groups, the first taking two placebo tablets per day; the second folate (5 mg/day) and placebo; the third placebo and thiamine (50 mg/day); and the fourth both vitamins. The clinical trial lasted 6 months. At baseline assessment, 31% of the patients had subnormal blood thiamine levels and 30% had low folate. The vitamin deficiencies were independent phenomena. It was found that thiamine improved neuropsychological functions in both verbal and non-verbal IQ testing. In particular, higher scores were recorded on the block design, digit symbol, similarities and digit span subtests. Folate treatment was ineffective. These results indicate that, in epileptics chronically treated with PHT, thiamine improves neuropsychological functions, such as visuo-spatial analysis, visuo-motor speed and verbal abstracting ability.", "year": "1993", "journal": "Epilepsy research", "label": "clinical_trial_non_randomized"}, {"pmid": "8039474", "title": "Felbamate in the treatment of partial-onset seizures.", "abstract": "Felbamate (FBM, Felbatol/Taloxa) has been the object of several trials that are innovative and unique. First, FBM is the first antiepileptic drug (AED) to have been submitted to a controlled efficacy study in patients with the Lennox-Gastaut syndrome (LGS) before being submitted for regulatory approval. Second, FBM was tested in patients discontinued from other AEDs for presurgical monitoring. Third, FBM was the first experimental AED to have been tested in controlled monotherapy trials. Overall, these studies succeeded in demonstrating that FBM is relatively safe and effective against both partial-onset seizures and the generalized seizures occurring in the LGS. The results of some of these studies could not always be expressed by using the more familiar concept of percent seizure reduction because, for ethical reasons, the efficacy variable had to be defined in terms of time to the nth seizure or in terms of escape criteria. This may make it more difficult to evaluate just how effective FBM is in comparison with other AEDs. Another reason why the efficacy of FBM cannot yet be fully assessed is that in all the studies the FBM dosage was limited to a maximum of 3,600 mg/day or 45 mg/kg/day. At this dosage, FBM produced no toxicity in the majority of patients, and its full therapeutic toxicity in the majority of patients, and its full therapeutic effect may have to be re-evaluated in the future at higher dosages.", "year": "1994", "journal": "Epilepsia", "label": "clinical_trial_non_randomized"}, {"pmid": "10897156", "title": "Rectal absorption of lamotrigine compressed tablets.", "abstract": "PURPOSE: Interruption of oral drug administration poses a significant clinical problem for antiepileptic drugs that have no parenteral formulation. If a drug is absorbed rectally, rectal administration can be a useful alternative when the oral route of administration is not possible. The purpose of this study was to compare the single-dose pharmacokinetics of lamotrigine (LTG) compressed tablets after rectal and oral administration in healthy volunteers. METHODS: A single LTG compressed tablet (100 mg) was administered orally and rectally to 12 volunteers in this single-dose, two-period, crossover study with a 2-week washout between doses. For rectal administration, tablets were crushed and suspended in 10 mL of water. Plasma samples were collected from 0 to 120 hr after each dose and analyzed for LTG by an HPLC method developed for this investigation. RESULTS: LTG plasma concentrations were lower after rectal administration versus oral administration. The average area under the curve was 28.90 +/- 9.5 microg/mL/hr after rectal administration and 51.71 +/- 19.2 microg/mL/hr after oral administration. The average maximum LTG concentration was 0.53 +/- 0.14 microg/mL after rectal administration and 1.45 +/- 0.35 microg/mL after oral administration. The relative bioavailability for LTG compressed tablets was 0.63 +/- 0.33 for rectal administration. There were no drug-related rashes or serious side effects. CONCLUSIONS: LTG suspension prepared from LTG compressed tablets is absorbed rectally, although not to the same extent or rate as when given orally.", "year": "2000", "journal": "Epilepsia", "label": "clinical_trial_non_randomized"}, {"pmid": "36780774", "title": "Project ECHO telementoring program in epilepsy for school nurses.", "abstract": "OBJECTIVES: Many children with epilepsy experience seizures at school. School nurses must have the clinical expertise to deliver high-quality, safe care for students with epilepsy. However, in some regions of the U.S. access to interactive, epilepsy evidence-based education programs is limited. The objective of this project was to assess the feasibility of adapting the Epilepsy Foundation's (EFs) school nurse education program to the ECHO model and evaluate its impact on school nurse knowledge and self-efficacy in managing epilepsy in students with seizures and program satisfaction. METHODS: The EFs educational program for school nurses was adapted to the ECHO model and delivered by a team of interdisciplinary epilepsy specialists via videoconferencing. Retrospective post-program surveys were administered at program completion. Data from 32 participants with complete post-program surveys were used for the analysis of knowledge and confidence. Descriptive statistics and the sign test were conducted. RESULTS: Participants were 166 school nurses from 13 states. The majority had > 15 years of school nurse experience and served schools in suburban or rural areas. Improvements in knowledge and confidence were reported on most survey items. The highest improvements in self-reported knowledge and confidence were in psychosocial aspects of care, comorbidities, and recognition of nonepileptic events. Program satisfaction was rated as high by over 90% of participants. CONCLUSIONS: Telementoring using the ECHO methodology is a feasible modality to educate and link epilepsy specialists and providers with school nurses nationwide. Findings suggest that attending the MSS ECHO provided an educational and meaningful learning experience. The gains in knowledge and confidence in psychosocial aspects of epilepsy care and comorbidities highlight the importance of the inclusion of this content in educational programs.", "year": "2023", "journal": "Epilepsy & behavior : E&B", "label": "open_label_trial"}, {"pmid": "9860068", "title": "A pilot study of topiramate in the treatment of infantile spasms.", "abstract": "PURPOSE: West syndrome is a rare epileptic syndrome associated with infantile spasms, a specific abnormal electroencephalographic pattern (termed hypsarrhythmia), and mental retardation. Management of this disorder is difficult because current treatment regimens, including many anticonvulsants and hormones, are often ineffective. Topiramate (TPM) is a new antiepileptic drug that may be effective in pediatric epilepsies. We conducted a pilot study to test the effects of rapid TPM dosing in patients with refractory infantile spasms. METHODS: Eleven children with refractory infantile spasms were given an initial dose of 25 mg TPM per day in addition to their current therapy. Dosage was increased by 25 mg every 2-3 days until spasms were controlled, the maximal tolerated dose was reached, or the maximal dose of 24 mg/kg/day was achieved. Efficacy was primarily assessed by video EEG and secondarily by parental count of spasm frequency. RESULTS: Five (45%) subjects became spasm free during the study, with absence of infantile spasms and hypsarrhythmia (either classic or modified) proven by video EEG. Nine subjects, including the five spasm free, achieved a spasm reduction of > or =50%. Spasm frequency decreased from 25.6+/-19.3 to 6.9+/-5.9 spasms/day. Sixty-four percent of the subjects were able to achieve TPM monotherapy. CONCLUSIONS: Results in this cohort of 11 patients with refractory disease show TPM to be a promising new agent for the treatment of infantile spasms.", "year": "1998", "journal": "Epilepsia", "label": "open_label_trial"}, {"pmid": "32713661", "title": "Cannabidiol-enriched oil in children and adults with treatment-resistant epilepsy-does tolerance exist?", "abstract": "AIM: To evaluate the long-term effectiveness of cannabidiol (CBD)-enriched oil for the treatment of refractory epilepsy and to assess the development of tolerance to its anti-seizure effect. METHODS: A prospective study of 92 consecutive patients (age 1-37 years, mean-11.8 years) with treatment resistant epilepsy who were treated with cannabis oil extract (CBD/tetrahydrocannabinol [THC] ratio of 20:1). Mean monthly seizure frequency was reported by the patients/their parents during monthly clinic visits. Tolerance was defined as either the need to increase the dose by ≥30% due to reduced treatment efficacy or as an increase of ≥30% in mean monthly seizure frequency in patients treated for at least 3 months with no change in other anti-seizure medications. RESULTS: Mean follow-up time was 19.8 ± 12.5 months (range 3-45). Mean CBD dose was 11.3 (4-38) mg/kg/day. Twenty-nine (31%) patients discontinued treatment due to lack of effect or adverse reactions, which were reported in 51% (47/87) of the patients. Overall responder rate (>50% seizures reduction) was 54%, whereas 8 patients (9%) became seizure-free. Eighty-four patients were included in the tolerance analysis. Tolerance was observed in 21 (25%) patients after a mean duration of 7.3 ± 5.4 months of CBD-enriched oil treatment. There was a negative correlation between epilepsy duration and tolerance development (p = 0.038). CONCLUSIONS: We report for the first time the plausible appearance of tolerance to cannabidiol-enriched oil. This may limit treatment efficacy in the long-term clinical management of refractory epilepsy in both pediatric and adult population. Further studies are needed to investigate potential mechanisms.", "year": "2021", "journal": "Brain & development", "label": "open_label_trial"}, {"pmid": "33415915", "title": "Topiramate Effectiveness as Add-on Therapy in Bulgarian Patients with Drug-resistant Epilepsy.", "abstract": "INTRODUCTION: There are no reliable prospective studies on the effectiveness of topiramate in Bulgarian adult patients with drug-resistant epilepsy. AIM: The aim of the study was to conduct an open, prospective study on various aspects of topiramate (TPM) effectiveness in Bulgarian patients with drug-resistant epilepsy. PATIENTS AND METHODS: The study included patients with epilepsy who attended the Clinic of Neurology at the University Hospital in Plovdiv, Bulgaria. Patients completed diaries for seizure frequency, seizure severity, and adverse events. There were regular documented visits at 3 or 6 months during the first year of TPM treatment and at 6 months afterwards, with a dynamic assessment of seizure fre-quency, severity, adverse events, and EEG recordings. RESULTS: TPM was used as an add-on treatment in 120 patients (69 males, mean age 37 years). There was a relatively mild and stable dynamic improvement of seizure severity, a satisfactory seizure frequency reduction in 37% of participants, a stable mean seizure fre-quency reduction (47%) from month 6 to month 24 of treatment and a stable responder rate (48-51%) during the same period. New seizure types (focal with impaired awareness with/without evolution to bilateral tonic-clonic seizures) occurred in 5 patients. There were adverse events (dizziness/vertigo, irritability, speech disturbances, memory impairment, concentration problems, tremor, loss of appe-tite and weight, weakness, numbness, bradypsychia, confusion, visual hallucinations, sleepiness, insomnia, headache, itching, unstable gait, nausea, and vomiting) in 20% of patients. CONCLUSIONS: TPM treatment is associated with low and stable improvement of seizure severity, good and stable improvement of sei-zure frequency, possible worsening of seizure control and appearance of new seizure types, good safety and tolerability.", "year": "2020", "journal": "Folia medica", "label": "open_label_trial"}, {"pmid": "1222742", "title": "A single-dose study of mexiletine (Kö 1173).", "abstract": "Serum concentrations of mexiletine after a single dose were determined in 8 adult Caucasian males with complex partial seizures who were continuing to receive other antiepileptic drugs. Two patients each received a single dose of either 100, 200, 300, or 400 mg mexiletine. Serum concentrations were determined by two gas chromatographic methods. Serum concentrations ranged up to 795 ng/ml. Peak concentrations occurred 1 to 3 hr after administration of the drug and were significantly different between the 100- and 300-mg, 100- and 400-mg, 200- and 300-mg, and 200- and 400-mg doses. Differences between the other doses were not significant. Serum concentrations declined monoexponentially. Half-life ranged from 2.7 to 7.2 hr. Numerous papers have appeared in the European literature on the use of mexiletine to treat cardiac arrhythmias. Preliminary studies in the United States suggest the use of mexiletine as an adjunct for therapy of epilepsy.", "year": "1975", "journal": "Epilepsia", "label": "open_label_trial"}, {"pmid": "20688544", "title": "Long term outcome of benign childhood epilepsy with centrotemporal spikes: Dutch Study of Epilepsy in Childhood.", "abstract": "PURPOSE: To determine long-term outcome in a cohort of children with newly diagnosed benign childhood epilepsy with centrotemporal spikes (BECTS). METHODS: 29 children with BECTS were included in the Dutch Study of Epilepsy in Childhood. Each child was followed for 5 years, and subsequently contacted 12-17 years after enrolment to complete a structured questionnaire. Twenty children had typical BECTS, nine had atypical BECTS (age at onset <4 years, developmental delay or learning difficulties at inclusion, other seizure types, atypical EEG abnormalities). RESULTS: Mean age at onset of epilepsy was 8.0 years with slight male preponderance. Most common seizure-types before enrolment were generalized tonic-clonic seizures (GTCS) and simple partial seizures; in 86% of the children seizures occurred during sleep. After 12-17 years, 96% had a terminal remission (TR(F)) of more than 5 years and 89% of more than 10 years. Mean duration of epilepsy was 2.7 years; mean age at reaching TR(F) was 10.6 years. Many children (63%) had experienced one or more (secondary) GTCS. Antiepileptic drugs were used by 79% of the children with a mean duration of 3.0 years. None of the children seemed to have developed learning problems or an arrest of cognitive development during follow-up. No significant differences were observed in patient characteristics or outcome between children with typical BECTS and children with atypical BECTS. CONCLUSIONS: All children in our cohort, both those with typical and atypical BECTS, had a very good prognosis with high remission rates after 12-17 years. None of the predictive factors for disease course and outcome observed in earlier studies (other seizure types, age at onset, multiple seizures at onset) were prognostic in our cohort.", "year": "2010", "journal": "Seizure", "label": "prospective_cohort_study"}, {"pmid": "19279502", "title": "A prospective study on the cost-effective utilization of long-term inpatient video-EEG monitoring in a developing country.", "abstract": "To investigate diagnostic value, therapeutic benefit and cost-effective utilization of video-EEG monitoring (VEM) in a comprehensive epilepsy program in a developing country. The authors prospectively recruited all patients who underwent long-term (> or =3 hours) inpatient VEM during a 10-month period. The cohort was followed to gather information about the proportion of patients in whom long-term management was altered by VEM and resultant impact on direct health care costs. Out of 143 study subjects (median age 22 years), 102 (71.3%) were referred for presurgical evaluation. The median duration of VEM was 61 hours, and median number of events recorded per patient was 3. Video-EEG monitoring helped to clarify the epilepsy syndromic diagnosis in 123 of 132 (93.2%) patients referred with the diagnosis of epileptic seizures. Video-EEG monitoring confirmed coexistent complex partial seizures in 4 of 11 (36.4%) patients with a referral diagnosis of psychogenic nonepileptic events. During mean follow-up period of 2.2 years, 48 patients (33.6%) underwent epilepsy surgery. A significant decrease in antiepileptic drug polytherapy, and minimization in recurring direct medical and nonmedical costs occurred. In addition to immediate diagnostic usefulness, VEM contributes significantly to long-term therapeutic and economic benefits for patients with difficult to diagnose and treat paroxysmal events.", "year": "2009", "journal": "Journal of clinical neurophysiology : official publication of the American Electroencephalographic Society", "label": "prospective_cohort_study"}, {"pmid": "30154057", "title": "The epilepsy transition care gap in young adults with childhood-onset epilepsy.", "abstract": "INTRODUCTION: A substantial proportion of young adults with childhood-onset epilepsy may require ongoing long-term epilepsy care as adults. OBJECTIVE: The objective of the study was to assess the extent to which epilepsy transition discussions occurred in adolescents with childhood-onset epilepsy prior to the age of attaining majority (prior to their 18th birthday) in a community-based cohort of individuals with childhood-onset epilepsy followed longitudinally. METHODS: The Connecticut Study of Epilepsy is a prospective, community-based study of newly diagnosed childhood-onset epilepsy with 613 children (onset < 16 years old; year recruited: 1993-97). During the final exit interview, 308 young adults ≥18 years old (or parent-proxies) were asked, \"Before you turned 18 years old, did your doctors or other epilepsy care providers talk with you about how your epilepsy care needs might change as you get older?\" ('transition discussion'). We examined whether or not sociodemographic and clinical characteristics were associated with epilepsy transition discussions. RESULTS: For young adults with childhood-onset epilepsy (N = 308; mean age: 24 years, SD = 4.0; mean age of epilepsy onset: 5.4 years, SD = 3.7), only 15% responded \"Yes\" to having had a \"transition discussion\". Of those with \"active epilepsy\" (N = 130; seizure-free < 5 years or on an antiseizure medication within 2 years of their 18th birthday) upon attaining the age of majority (18 years), 40/130 (~31%) young adults had \"transition\" discussions, compared with 7/178 (4%) of those with \"inactive epilepsy\" (p < 0.0001). Self- (N = 95 active epilepsy) and proxy-reports (N = 35 active epilepsy) of \"transition\" discussions were comparable (31%). Having a transition discussion was associated with neurodevelopmental comorbidity and type of epilepsy care provider at time of last contact (p < 0.05). Having a \"transition\" discussion was not associated with gender, race/ethnicity, high school graduation, parent insurance, epilepsy syndrome, psychiatric disorder, or intellectual disability (intelligence quotient [IQ] < 70) for those with \"active epilepsy\". In assessing transfer of care, we found that only 50% of cases (who had active epilepsy at transition) were being seen by an adult or general neurologist at the time of the exit interview. CONCLUSIONS: Only one-third of young adults with active epilepsy at transition in this community-based study reported having epilepsy care transition discussions with healthcare providers before the age of 18 years. Identifying barriers to successful delivery of effective epilepsy transition care is critical to remediating treatment care gaps and building effective future care models.", "year": "2018", "journal": "Epilepsy & behavior : E&B", "label": "prospective_cohort_study"}, {"pmid": "5006294", "title": "A prospective study of mental and motoric development in premature children with a birth weight less than 2000 grammes. The prognostic value of pathological neurological signs.", "abstract": "As a conclusion I will say that a careful and repeated neurological examination enables us to make an early diagnosis of brain damage in premature children, but neither the history of the neonatal period, the separate clinical signs, nor the study of the psycho-motoric development is conclusive for the diagnosis. The prognosis seems to be good if the neonatal period is without abnormalities.", "year": "1970", "journal": "Psychiatrie, Neurologie und medizinische Psychologie. Beihefte", "label": "prospective_cohort_study"}, {"pmid": "30035016", "title": "Psychomotor slowing is associated with anomalies in baseline and prospective large scale neural networks in youth with epilepsy.", "abstract": "PURPOSE: Psychomotor slowing is a common but understudied cognitive impairment in epilepsy. Here we test the hypothesis that psychomotor slowing is associated with alterations in brain status reflected through analysis of large scale structural networks. We test the hypothesis that children with epilepsy with cognitive slowing at diagnosis will exhibit a cross-sectional and prospective pattern of altered brain development. METHODS: A total of 78 children (age 8-18) with new/recent onset idiopathic epilepsies underwent 1.5 T MRI with network analysis of cortical, subcortical and cerebellar volumes. Children with epilepsy were divided into slow and fast psychomotor speed groups (adjusted for age, intelligence and epilepsy syndrome). RESULTS: At baseline, slow-speed performers (SSP) presented lower modularity, lower global efficiency, higher transitivity, and lower number of hubs than fast-speed performers (FSP). Community structure in SSP exhibited poor association between cortical regions and both subcortical structures and the cerebellum while FSP presented well-defined communities. Prospectively, SSP displayed lower modularity but higher global efficiency and transitivity compared to FSP. Modules in FSP showed higher integration between and within themselves compared to SSP. SSP showed hubs mainly from frontal and temporal regions while in FSP were spread among frontal, temporal, parietal, subcortical areas and the left cerebellum. IMPLICATIONS: Results suggest the presence of widespread alterations in large scale networks between fast- and slow-speed children with recent onset epilepsies both at baseline and 2 years later. Slower processing speed appears to be a marker of abnormal brain development antecedent to epilepsy onset as well as brain development over the 2 years following diagnosis.", "year": "2018", "journal": "NeuroImage. Clinical", "label": "prospective_cohort_study"}, {"pmid": "38768551", "title": "Early focal electroencephalogram and neuroimaging findings predict epilepsy development after aneurysmal subarachnoid hemorrhage.", "abstract": "INTRODUCTION: Seizures are a common complication of subarachnoid hemorrhage (SAH) in both acute and late stages: 10-20 % acute symptomatic seizures, 12-25 % epilepsy rate at five years. Our aim was to identify early electroencephalogram (EEG) and computed tomography (CT) findings that could predict long-term epilepsy after SAH. MATERIAL AND METHODS: This is a multicenter, retrospective, longitudinal study of adult patients with aneurysmal SAH admitted to two tertiary care hospitals between January 2011 to December 2022. Routine 30-minute EEG recording was performed in all subjects during admission period. Exclusion criteria were the presence of prior structural brain lesions and/or known epilepsy. We documented the presence of SAH-related cortical involvement in brain CT and focal electrographic abnormalities (epileptiform and non-epileptiform). Post-SAH epilepsy was defined as the occurrence of remote unprovoked seizures ≥ 7 days from the bleeding. RESULTS: We included 278 patients with a median follow-up of 2.4 years. The mean age was 57 (+/-12) years, 188 (68 %) were female and 49 (17.6 %) developed epilepsy with a median latency of 174 days (IQR 49-479). Cortical brain lesions were present in 189 (68 %) and focal EEG abnormalities were detected in 158 patients (39 epileptiform discharges, 119 non-epileptiform abnormalities). The median delay to the first EEG recording was 6 days (IQR 2-12). Multiple Cox regression analysis showed higher risk of long-term epilepsy in those patients with CT cortical involvement (HR 2.6 [1.3-5.2], p 0.009), EEG focal non-epileptiform abnormalities (HR 3.7 [1.6-8.2], p 0.002) and epileptiform discharges (HR 6.7 [2.8-15.8], p < 0.001). Concomitant use of anesthetics and/or antiseizure medication during EEG recording had no influence over its predictive capacity. ROC-curve analysis of the model showed good predictive capability at 5 years (AUC 0.80, 95 %CI 0.74-0.87). CONCLUSIONS: Focal electrographic abnormalities (both epileptiform and non-epileptiform abnormalities) and cortical involvement in neuroimaging predict the development of long-term epilepsy. In-patient EEG and CT findings could allow an early risk stratification and facilitate a personalized follow-up and management of SAH patients.", "year": "2024", "journal": "Epilepsy & behavior : E&B", "label": "retrospective_cohort_study"}, {"pmid": "21326599", "title": "Detection of epileptogenic cortical malformations with surface-based MRI morphometry.", "abstract": "Magnetic resonance imaging has revolutionized the detection of structural abnormalities in patients with epilepsy. However, many focal abnormalities remain undetected in routine visual inspection. Here we use an automated, surface-based method for quantifying morphometric features related to epileptogenic cortical malformations to detect abnormal cortical thickness and blurred gray-white matter boundaries. Using MRI morphometry at 3T with surface-based spherical averaging techniques that precisely align anatomical structures between individual brains, we compared single patients with known lesions to a large normal control group to detect clusters of abnormal cortical thickness, gray-white matter contrast, local gyrification, sulcal depth, jacobian distance and curvature. To assess the effects of threshold and smoothing on detection sensitivity and specificity, we systematically varied these parameters with different thresholds and smoothing levels. To test the effectiveness of the technique to detect lesions of epileptogenic character, we compared the detected structural abnormalities to expert-tracings, intracranial EEG, pathology and surgical outcome in a homogeneous patient sample. With optimal parameters and by combining thickness and GWC, the surface-based detection method identified 92% of cortical lesions (sensitivity) with few false positives (96% specificity), successfully discriminating patients from controls 94% of the time. The detected structural abnormalities were related to the seizure onset zones, abnormal histology and positive outcome in all surgical patients. However, the method failed to adequately describe lesion extent in most cases. Automated surface-based MRI morphometry, if used with optimized parameters, may be a valuable additional clinical tool to improve the detection of subtle or previously occult malformations and therefore could improve identification of patients with intractable focal epilepsy who may benefit from surgery.", "year": "2011", "journal": "PloS one", "label": "retrospective_cohort_study"}, {"pmid": "17925172", "title": "[Overexpression of the Cdc42 in the brain tissue of human with intractable temporal epilepsy].", "abstract": "OBJECTIVE: To investigate the expression of cell division cycle 42 GTP-binding protein (Cdc42) in the brain tissue of patients with intractable temporal epilepsy and discuss its effect on epileptogenesis. METHODS: Twenty samples brain tissues were collected from the brain tissue bank of intractable temporal epilepsy established by Epilepsy Preventive and Therapeutic Center of Chongqing. The expression of Cdc42 was determined by immunohistochemistry and fluoroimmunoassay. Twenty brain tissue samples were collected from autopsy on 20 sex and age-matched persons who died from accident were used as controls. RESULTS: The absorption values of Cdc42 in the temporal lobe of the patients was 0.038 +/- 0.016, significantly higher than that of the controls (0.020 +/- 0.005, t = 14.59, P < 0.01). The absorption values of Cdc42 in the hippocampus of the patients was 0.049 +/- 0.009, t = 12.01, P < 0.01). Fluoroimmunoassay showed that the fluorescence intensity of Cdc42 in the temporal lobe of the patients was 18.3 +/- 2.5, significantly higher than that of the controls (11.8 +/- 2.9, t = 33.77, P < 0.01), and the Fluorescence intensity of Cdc42 in the hippocampus of the patients was and control hippocampus were 23.8 +/- 3.3, significantly higher than that of the controls (10.1 +/- 2.6, t = 12.01, P < 0.01). CONCLUSION: The overexpression of Cdc42 in the cortex of temporal lobe and hippocampus may play an important role in the epileptogenic mechanisms of intractable epilepsy.", "year": "2007", "journal": "Zhonghua yi xue za zhi", "label": "retrospective_cohort_study"}, {"pmid": "1011015", "title": "Epilepsy after two different neurosurgical approaches to the treatment of ruptured intracranial aneurysm.", "abstract": "One-hundred-and-fifty-two patients who underwent surgery for intracranial aneurysm were studied to determine the incidence of postoperative epilepsy in relation to the site of the aneurysm and the type of surgical approach. The overall incidence of epilepsy was 22%. Of the 116 patients treated by the intracranial approach 27.5% developed epilepsy, in contrast with only 5% of the 36 patients who had carotid artery ligation in the neck. Epilepsy occurred most frequently (35%) with middle cerebral artery aneurysms, especially if moderate or severe operative trauma was sustained and there was postoperative dysphasia.", "year": "1976", "journal": "Journal of neurology, neurosurgery, and psychiatry", "label": "retrospective_cohort_study"}, {"pmid": "2900404", "title": "Reduced felodipine bioavailability in patients taking anticonvulsants.", "abstract": "Felodipine is a dihydropyridine calcium antagonist, structurally related to nifedipine, which undergoes extensive first-pass hepatic metabolism and normally has an oral bioavailability of 15%. Felodipine disposition was studied in 10 patients who had microsomal enzyme induction due to chronic anticonvulsant therapy, and in 12 normal volunteers matched for age and sex. Plasma felodipine concentrations after a 5 mg oral dose were grossly reduced in the epileptic patients: the mean peak concentration was 1.6 (vs 8.9) nmol/l, and the area under the curve was only 2.0 (vs 30.0) nmol.h/l. The relative bioavailability of felodipine in the epileptic patients was thus only 6.6% of that in the normal subjects, and less than 1% of the oral dose was systemically available. Patients on anticonvulsant treatment will require substantially higher doses of felodipine to achieve plasma concentrations equivalent to those in non-induced subjects.", "year": "1988", "journal": "Lancet (London, England)", "label": "retrospective_cohort_study"}, {"pmid": "16352471", "title": "Excessive daytime sleepiness and sleep complaints among children with epilepsy.", "abstract": "OBJECTIVE: Excessive daytime sleepiness (EDS) and sleep complaints are common among adults with epilepsy. We hypothesized that children with epilepsy have worse daytime sleepiness compared with controls. METHODS: Children with and without epilepsy between ages 8 and 18 were recruited for the study. Parents and children were asked to fill out the Pediatric Sleep Questionnaire (PSQ) and Pediatric Daytime Sleepiness Scale (PDSS), respectively. The Mann-Whitney U test was used for group comparisons, with the Fischer exact or chi2 test for categorical variables. Regression analysis was used to identify predictors of EDS. RESULTS: Twenty-six patients and matched controls were recruited for the study. Parents of children with epilepsy more often reported EDS (P < 0.001), symptoms of sleep-disordered breathing (P < 0.001), and parasomnias (P < 0.001) compared with controls. On the PDSS, children with epilepsy reported worse daytime sleepiness scores compared with controls (15.48 +/- 6.4 vs 11.88 +/- 5.25, P = 0.037). Based on conditional logistic regression modeling, symptoms of excessive daytime sleepiness [corrected] (OR = 15.3, 95% CI = 1.4-166.6) and parasomnias (OR = 12.4, 95% CI = 1.01-151.6) were significantly associated with having epilepsy when adjusted for duration of nightime sleep. Further, 10 children (38.5%) with epilepsy reported positive sleep-disordered breathing, whereas no one in the control group reported SDB (P < 0.001) [corrected] Epilepsy syndrome, anticonvulsants used, and presence or absence of seizure freedom, however, were not significant predictors of EDS among patients. CONCLUSIONS: Daytime sleepiness appears to be common in children with epilepsy, and may be due to underlying sleep disorders. Further confirmatory studies are needed using screening questionnaires and formal sleep studies to systematically study the prevalence of sleep complaints and role of sleep disorders in these patients.", "year": "2006", "journal": "Epilepsy & behavior : E&B", "label": "case_control_study"}, {"pmid": "33734434", "title": "Social outcome and psychiatric comorbidity of generalized epilepsies - A case-control study.", "abstract": "OBJECTIVE: To investigate social outcome and psychiatric comorbidity of patients with idiopathic/genetic generalized epilepsies (IGEs) and its subtypes (epilepsy with generalized tonic-clonic seizures alone [EGTCS], juvenile absence epilepsy [JAE], and juvenile myoclonic epilepsy [JME]). METHODS: A cohort of 402 adult patients with IGE from the Danish island Funen was matched with 4020 randomly selected geography-, age-, and sex-matched controls via the Danish Civil Registration System. Based on register data, we compared social status measured by cohabitant status, educational attainment, income, affiliation to labor market, and psychiatric comorbidity. RESULTS: As compared to controls, patients with IGE had similar cohabitant status but fewer children (no children: 59.0% vs 50.9%), and lower educational level (primary school only: 46.0% vs 37.3%), employment rate (outside of workforce: 56.7% vs 46.5%), and income (low income: 32.6% vs 24.9%) (P < 0.001 for all comparisons). Having IGE was associated with higher a proportion of psychiatric comorbidity (IGE, 22.6%; controls, 13.0%) (P < 0.001). Seizure-free patients did not differ from controls; patients with persistent seizures had lower incomes and employment rates. In the IGE subgroup analyses, JME was associated with worse social status in all parameters studied (eg, 65.9% of JME patients were outside the workforce vs 44.5% of matched controls; P < 0.001), whereas no adverse social status was identified in patients with EGTCS and JAE. SIGNIFICANCE: Patients with IGE in general and JME in particular have poorer social status and more psychiatric comorbidity than matched population controls without epilepsy. Poor seizure control was associated with social status and may contribute to negative socioeconomic consequences associated with IGE.", "year": "2021", "journal": "Epilepsia", "label": "case_control_study"}, {"pmid": "15490286", "title": "Convulsive disorder and genetic polymorphism. Association of idiopathic generalized epilepsy with haptoglobin polymorphism.", "abstract": "Haptoglobin is a polymorphic protein that is well known for its hemoglobin (Hb)-binding property. The protein shows gross differences in molecular size among genotypes, resulting in different degrees of diffusion in central nervous system tissue. Since the breakdown of erythrocytes in the intracerebral fluid results in Hb-mediated free OH radical formation, lipid peroxidation, and increased neuronal excitability, a differential diffusion of haptoglobin phenotypes in the intracerebral fluid might result in a different degree of protection from oxidative damage. We have studied two samples of children with idiopathic generalized epilepsy from two different Italian populations. In both samples the haptoglobin *1/*1 genotype is much less represented in epileptic children than in controls. These observations suggest that subjects carrying the Hp*1/*1 genotype, that has the lowest molecular size and diffuses more readily in the interstitial cerebral fluid, are more protected against idiopathic generalized epilepsy than those with other haptoglobin genotypes.", "year": "2004", "journal": "Neurogenetics", "label": "case_control_study"}, {"pmid": "10536810", "title": "[The use of the clinical biochemical Epitest kit in children with epilepsy].", "abstract": "57 children aged 3-15 years were examined: children with epilepsy (n = 26), children with epileptic syndrome (n = 16) and children with other neurologic pathology (n = 15). Control group included 25 healthy children. Diagnostic efficiency of the epileptic test was investigated on the basis of the detection of autoantibodies (aAb) to glutamate receptor of AMPA type in blood serum of the patients. It was shown that children with epilepsy had elevated level of aAb to AMPA receptors in blood in comparison with that of the healthy children. The level of aAb to AMPA receptors correlated with severity of the disease and location of the epileptic focus. The authors recommend the \"Epitest\" as an additional biochemical tool for differential diagnosis of children's epilepsy.", "year": "1999", "journal": "Zhurnal nevrologii i psikhiatrii imeni S.S. Korsakova", "label": "case_control_study"}, {"pmid": "29309954", "title": "Impaired theory of mind in Chinese children and adolescents with idiopathic generalized epilepsy: Association with behavioral manifestations of executive dysfunction.", "abstract": "BACKGROUND: Epilepsy is a common neurological disorder with a core feature of cognitive impairments. Previous studies showed that patients with focal epilepsy have deficits in both theory of mind (ToM) and executive function (EF). However, there are few studies of ToM in patients with idiopathic generalized epilepsy (IGE), especially in populations with pediatric epilepsy. The aim of this study was to examine the characteristics of ToM and EF, including some of their subcomponents, and explore the relationship between them in Chinese children with IGE. MATERIALS AND METHODS: We recruited 54 children and adolescents with IGE as the experimental subjects and 37 typically developing children and adolescents as control subjects. Both groups completed ToM tests, namely, second-order false belief tasks (FBTs) and faux pas tasks (FPTs). Their caregivers completed the Behavior Rating Inventory of Executive Function (BRIEF) at the same time. RESULTS: Children and adolescents with IGE displayed worse performance on some of the FBTs and FPTs than healthy controls (p<0.01). They also exhibited widespread EF deficits, comprising eight subcomponents (p<0.05). Pearson's correlation analysis revealed that several subcomponents of EF (inhibition, emotional control, initiation, working memory, and monitoring) were unequally correlated with FBT and FPT. Regression analysis showed that ToM had associations with inhibition, working memory, and duration of seizures. Analysis of variance (ANOVA) indicated that children with newly diagnosed epilepsy displayed significant deficits in FBT, FPT, and distinct subscales of EF. CONCLUSIONS: Our results revealed significant impairments in ToM and EF in children and adolescents with IGE compared with healthy controls. We found significant correlations between ToM and two subcomponents of EF (inhibition and working memory) in children with IGE. Additionally, the duration of seizures affected ToM in patients but was a less powerful predictor than the two subcomponents of EF. Even for children with new-onset seizures and without medication, the deficits in ToM and some distinct subscales of EF were apparent. This result has clinical implications for both nonpharmaceutical therapies and cognitive rehabilitation.", "year": "2018", "journal": "Epilepsy & behavior : E&B", "label": "case_control_study"}, {"pmid": "39990250", "title": "Understanding Public Knowledge, Attitudes, and Awareness Toward Seizure Episodes Among Residents of Madinah: A Saudi Cross-Sectional Study.", "abstract": "<b>Background:</b> Epilepsy is a prevalent condition that affects a large population. However, a lack of knowledge and misconceptions about seizures can lead to inappropriate reactions and negative attitudes toward people with epilepsy, who are more likely to experience stigma because of their illness. This study explored public knowledge, attitudes, and awareness of epilepsy and seizures among residents of Madinah, Saudi Arabia. <b>Methods:</b> A descriptive, cross-sectional study was conducted between September and November 2023 involving 2626 random adult residents of the Madinah Region in Saudi Arabia. Data were collected through an online survey consisting of 27 questions concerning epilepsy. <b>Results:</b> Regarding participants' awareness of epilepsy, 92.2% reported having heard or read about it, and 12.8% had attended a course on controlling epileptic seizures. The results showed an acceptable level of understanding about epilepsy. The mean knowledge and attitude scores about epilepsy for the sample were 22 (SD ± 3.2) and 27.1 (SD ± 3.1), respectively, indicating moderate knowledge and positive attitudes toward epilepsy. Among demographic characteristics, knowledge about epilepsy was significantly associated with gender, age, marital status, educational level, occupation, household monthly income, having heard about epilepsy, having a family member diagnosed with epilepsy, and course attendance. However, attitudes toward epilepsy were only significantly associated with gender, having heard about epilepsy, having a family member diagnosed with epilepsy, and course attendance. Similarly, actions toward seizure attacks were significantly associated with all demographic characteristics except education. <b>Conclusions:</b> The residents of Madinah have generally positive attitudes regarding epilepsy, although their knowledge levels could be enhanced by education. Therefore, more educational awareness campaigns are required to improve public understanding of epilepsy and appropriate actions to take when witnessing a seizure. The results of this study provide a foundation for worldwide comparisons of general levels of knowledge and attitudes concerning epilepsy in Saudi Arabia.", "year": "2025", "journal": "Behavioural neurology", "label": "cross_sectional_study"}, {"pmid": "20053588", "title": "Knowledge, attitudes, and practice toward epilepsy (KAPE): a survey of Chinese and Vietnamese adults in the United States.", "abstract": "We conducted, in four languages, the first national cross-sectional survey of the knowledge, attitudes, and practice with respect to epilepsy of Chinese- and Vietnamese-American adults. We used a convenience sampling method to recruit 2831 adults in seven states. Eighty-four percent had heard or read of epilepsy and 58% had seen a seizure, whereas only 34% knew someone with epilepsy. Forty-two percent would object to their children marrying a person with epilepsy, and 43% would not knowingly hire someone with epilepsy. We examined bivariate associations for questions of knowledge, attitudes, and practice with age, gender, ethnicity, nativity, language, and education. chi(2) analyses showed differences in knowledge of and attitudes toward epilepsy by age group, gender, ethnicity, and education. Although misconceptions and negative views about epilepsy are held by Chinese and Vietnamese populations living in the United States, our results show noteworthy differences in attitudes and practice in relation to previous studies in Asian countries.", "year": "2010", "journal": "Epilepsy & behavior : E&B", "label": "cross_sectional_study"}, {"pmid": "15621851", "title": "The cognitive impact of epileptiform EEG-discharges; relationship with type of cognitive task.", "abstract": "In this study we analyzed the effect of differing task dimensions (high vs. low information demand; short vs. long testing duration) on the occurrence of epileptiform EEG-discharges and the cognitive impact of such discharges. We performed this study only in patients with focal discharges as this appears to be the most complicated group to assess any relationship between epileptiform EEG-discharges and cognitive impairment. Seventeen patients with focal discharges in the EEG and an established diagnosis of localization-related (partial) epilepsy were included. The following tasks were used: Low information demand: auditory and visual RT; high information demand: BCRT and CVST. Short testing duration: Arithmetic and Reading; long testing duration: Vocabulary and Block Design. The percentage of patients with epileptiform EEG-discharge and EEG-related cognitive impact were compared using Chi-square testing. The occurrence of epileptiform EEG-discharges was not associated with one of the experimental conditions introduced in our study, that is, high/low information demand or short/long testing period. Also the difference between computerized reaction-time measurement and more traditional 'paper and pencil tasks' such as reading was not statistically significant. The only statistical significant difference was the more frequent occurrence of epileptiform EEG-discharges during tasks that used the visual input mode. In addition, we could identify one test that appeared to be particularly sensitive to direct cognitive effects of epileptiform EEG-discharges. Only for the CVST, the computerized visual searching task, the relationship with epilepsy-related cognitive impact is statistically significant. This test is the most mentally demanding test of the tests presented in our study and measures speed of visual information processing, using complex stimulus patterns and has a long testing duration. Our results do not confirm that any of the investigated task dimensions (high vs. low information demand; short vs. long testing duration) have a dominant effect on the occurrence of epileptiform EEG-discharges and the cognitive impact of such discharges. The effect found for the CVST suggest that three factors combined are necessary to assess the impact of epileptiform EEG-discharges on cognition: visual input mode, longer testing duration and high information processing demand.", "year": "2004", "journal": "Child neuropsychology : a journal on normal and abnormal development in childhood and adolescence", "label": "cross_sectional_study"}, {"pmid": "19289738", "title": "Suicidality, depression screening, and antiepileptic drugs: reaction to the FDA alert.", "abstract": "OBJECTIVE: To determine the reaction of neurology practitioners to the Food and Drug Administration (FDA) alert concerning suicidality (suicidal ideation or behavior) and antiepileptic drugs. METHODS: We designed a 21-question survey asking about the participants' approach to suicidality and depression in patients with epilepsy (PWE), and their reaction to the FDA alert and its impact on their clinical practices. Participants (n = 780) were invited via e-mail to respond to a Zoomerang survey. Two reminders were sent to increase the response. RESULTS: The survey was completed by 175 participants (22%). Most were epilepsy specialists practicing in academic settings. Almost 62% did not use any scale to routinely screen for depression in PWE. For those who used a scale, the Beck Depression Inventory was the most used one. About 42% did not feel comfortable initiating treatment for depression. Although 98% warn about behavioral side effects when starting antiepileptic drugs, only 44% warn specifically about suicidal ideations or behavior. More than half were not aware of patients who attempted to commit suicide or who had committed suicide. The mean scores for the FDA alert clarity, appropriateness, and impact on clinical practice (on a scale from 1 to 10) were low, at 5.3, 4.1, and 3.6. Almost 46% did not feel the alert is going to change their practice. CONCLUSION: The Food and Drug Administration alert did not get a favorable score from the surveyed responders. Participants actively alert patients about behavioral side effects of antiepileptic drugs, but are not specific about suicide.", "year": "2009", "journal": "Neurology", "label": "cross_sectional_study"}, {"pmid": "23127264", "title": "What is the worst part about having epilepsy? A children's and parents' perspective.", "abstract": "Do children and parents view epilepsy similarly? Children and their parents at an epilepsy camp received a voluntary survey. Twenty children (aged 9-15 years) and their parents responded. Fifty percent of children and 27% of parents thought social stigmatization comprised the worst part of having epilepsy, whereas 38% and 40%, respectively, chose physical seizures. Over half of children and parents would want to have fewer or no seizures if they could change one thing. Sixty-seven percent of children and 93% of parents agreed that epilepsy camp was fun, and the other third of children considered it a place where they felt normal. Overall, children with epilepsy and their parents agreed. Despite the morbidities and potential risks of seizures and of the treatments themselves, the majority of children were most concerned with the stigma attached to having epilepsy.", "year": "2012", "journal": "Pediatric neurology", "label": "cross_sectional_study"}, {"pmid": "16542162", "title": "Epidemiologic classification of seizures associated with neurocysticercosis: observations from a sample of seizure disorders in neurologic care in India.", "abstract": "AIMS: To determine the etiologic role of neurocysticercosis (NC) in a hospital-based sample of epilepsies divided according to International League Against Epilepsy (ILAE) epidemiological criteria and number of seizures prior to presentation. METHODS: A sample comprising 1026 consecutive patients with either definite seizures or epilepsy attending a Neurology Outpatient Service was divided into four subgroups: single seizure (n = 314), incident epilepsy (n = 127), prevalent epilepsy (n = 398) and recurrent acute symptomatic seizures (RASS) (n
