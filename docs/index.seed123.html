attacks. Lennox stood alone in his belief, now generally accepted, that the genetics of epilepsy could be understood only through a multifactorial mode of inheritance. The author presents an affectionate portrait of the physician, the teacher and the man, the founder of the Seizure Unit and the unifying force in the study of epilepsy by both professionals and lay persons.", "year": "1988", "journal": "Epilepsia", "label": "editorial_letter_commentary"}, {"pmid": "11181104", "title": "Epilepsy--doctor's dilemma, lawyer's delight? Medico-legal consequences of practising in the field of epilepsy report of an International League Against Epilepsy British Branch meeting--Edinburgh, April 2000.", "abstract": "Six cases are described where the medical management of a person's epilepsy was brought under legal scrutiny. Lessons learnt from this educational exercise include improving doctor patient communication, the function of a Coroner's Court, when is misdiagnosis negligent, the vagaries of expert witnesses, should failure to diagnose a tumour be blamed on the physician or the service when facilities are inadequate, is failure to recognise a rare drug interaction, failure to warn against an interaction, or failure to take a proper history, negligent? The conference also examined the legal ramifications of the nurse/doctor relationship in epilepsy care, the place of epilepsy guidelines and, due to its interactive nature, reflected on the audience's epilepsy knowledge, which, in places seemed significantly deficient. It was a gripping educational exercise.", "year": "2001", "journal": "Seizure", "label": "editorial_letter_commentary"}, {"pmid": "24235109", "title": "Detection of seizure and epilepsy using higher order statistics in the EMD domain.", "abstract": "In this paper, a method using higher order statistical moments of EEG signals calculated in the empirical mode decomposition (EMD) domain is proposed for detecting seizure and epilepsy. The appropriateness of these moments in distinguishing the EEG signals is investigated through an extensive analysis in the EMD domain. An artificial neural network is employed as the classifier of the EEG signals wherein these moments are used as features. The performance of the proposed method is studied using a publicly available benchmark database for various classification cases that include healthy, interictal (seizure-free interval) and ictal (seizure), healthy and seizure, nonseizure and seizure, and interictal and ictal, and compared with that of several recent methods based on time-frequency analysis and statistical moments. It is shown that the proposed method can provide, in almost all the cases, 100% accuracy, sensitivity, and specificity, especially in the case of discriminating seizure activities from the nonseizure ones for patients with epilepsy while being much faster as compared to the time-frequency analysis-based techniques.", "year": "2013", "journal": "IEEE journal of biomedical and health informatics", "label": "animal_experimental_study"}, {"pmid": "1929206", "title": "Antiepileptogenic effects of conventional anticonvulsants in the kindling model of epilespy.", "abstract": "We sought to determine whether the clinically effective anticonvulsant drug valproate exhibited antiepileptogenic properties in the kindling model (we use the term anticonvulsant to mean suppression of seizure, and antiepileptogenic to mean suppression of development of epilepsy). We compared and contrasted valproate with two other anticonvulsant drugs, phenobarbital and carbamazepine. We investigated the effects of these drugs on the development of kindling, that is, the number of stimulation-induced afterdischarges required to induce enhanced seizure susceptibility in rats. Valproate exhibited powerful antiepileptogenic effects as evident in a dose-dependent increase in the number of afterdischarges required to induce kindling. These effects were not due to retained valproate or an active metabolite merely masking the expression of kindled seizures. By contrast, carbamazepine was devoid of any antiepieptogenic effects despite exhibiting marked anticonvulsant effects. Like valproate, phenobarbital exhibited both antiepileptogenic and anticonvulsant properties, but its antiepileptogenic properties were significantly less pronounced. The antiepileptogenic effects of valproate and phenobarbital strengthen the candidacy of these agents for the clinical studies needed to investigate pharmacological prevention of the development of epilepsy in high-risk groups.", "year": "1991", "journal": "Annals of neurology", "label": "animal_experimental_study"}, {"pmid": "26561946", "title": "Distinctive effects of nicotinic receptor intracellular-loop mutations associated with nocturnal frontal lobe epilepsy.", "abstract": "Previously characterized nicotinic acetylcholine receptor (nAChR) autosomal dominant nocturnal frontal lobe epilepsy (ADNFLE)-associated mutations are found in α2, α4 and β2 subunit transmembrane (TM) domains. They predominantly increase ACh potency and, for β2-subunit mutants, increase macroscopic currents. Two recently-identified mutations, α4(R336H) and β2(V337G), located in the intracellular cytoplasmic loop (C2) have been associated with non-familial NFLE. Effects of these mutations on α4β2-nAChR function and expression were studied for the first time, using two-electrode voltage clamp recordings in Xenopus laevis oocytes. Biased-ratio preparations elucidated the mutations' effects at alternate isoforms: high-sensitivity [HS; (α4)2(β2)3] or low-sensitivity [LS; (α4)3(β2)2] via 1:10 or 30:1 [α4:β2] cRNA injection ratios, respectively. An unbiased (1:1 [α4:β2] cRNA) injection ratio was also used to study potential shifts in isoform expression. α4(R336H)-containing receptors showed significant increases in maximal ACh-induced currents (Imax) in all preparations (140% increase compared to wild type control). β2(V337G)-containing receptors significantly increased Imax in the LS-favoring preparation (20% increase compared to control). Expression of either mutation consistently produced enrichment of HS-isoform expression in all preparations. α4β2-nAChR harboring either NFLE mutant subunit showed unchanged ACh, sazetidine-A, nicotine, cytisine and mecamylamine potency. However, both mutant subunits enhanced partial agonist efficacies in the LS-biased preparation. Using β2-subunit-specific [(125)I]mAb 295 immunolabeling, nAChR cell-surface expression was determined. Antibody binding studies revealed that the β2(V337G) mutation tended to reduce cell-surface expression, and function per receptor was significantly increased by either NFLE mutant subunit in HS-favoring preparations. These findings identify both common and differing features between TM- and C2-domain AD/NFLE-associated mutations. As we discuss, the shared features may be particularly salient to AD/NFLE etiology.", "year": "2016", "journal": "Neuropharmacology", "label": "animal_experimental_study"}, {"pmid": "31608439", "title": "Long-term chemogenetic suppression of spontaneous seizures in a mouse model for temporal lobe epilepsy.", "abstract": "OBJECTIVE: More than one-third of patients with temporal lobe epilepsy (TLE) continue to have seizures despite treatment with antiepileptic drugs, and many experience severe drug-related side effects, illustrating the need for novel therapies. Selective expression of inhibitory Designer Receptors Exclusively Activated by Designer Drugs (DREADDs) allows cell-type-specific reduction of neuronal excitability. In this study, we evaluated the effect of chemogenetic suppression of excitatory pyramidal and granule cell neurons of the sclerotic hippocampus in the intrahippocampal mouse model (IHKA) for temporal lobe epilepsy. METHODS: Intrahippocampal IHKA mice were injected with an adeno-associated viral vector carrying the genes for an inhibitory DREADD hM4Di in the sclerotic hippocampus or control vector. Next, animals were treated systemically with different single doses of clozapine-N-oxide (CNO) (1, 3, and 10 mg/kg) and clozapine (0.03 and 0.1 mg/kg) and the effect on spontaneous hippocampal seizures, hippocampal electroencephalography (EEG) power, fast ripples (FRs) and behavior in the open field test was evaluated. Finally, animals received prolonged treatment with clozapine for 3 days and the effect on seizures was monitored. RESULTS: Treatment with both CNO and clozapine resulted in a robust suppression of hippocampal seizures for at least 15 hours only in DREADD-expressing animals. Moreover, total EEG power and the number of FRs were significantly reduced. CNO and/or clozapine had no effects on interictal hippocampal EEG, seizures, or locomotion/anxiety in the open field test in non-DREADD epileptic IHKA mice. Repeated clozapine treatment every 8 hours for 3 days resulted in almost complete seizure suppression in DREADD animals. SIGNIFICANCE: This study shows the potency of chemogenetics to robustly and sustainably suppress spontaneous epileptic seizures and pave the way for an epilepsy therapy in which a systemically administered exogenous drug selectively modulates specific cell types in a seizure network, leading to a potent seizure suppression devoid of the typical drug-related side effects.", "year": "2019", "journal": "Epilepsia", "label": "animal_experimental_study"}, {"pmid": "30446533", "title": "A Proposed Mechanism for Spontaneous Transitions between Interictal and Ictal Activity.", "abstract": "Epileptic networks are characterized by two outputs: brief interictal spikes and rarer, more prolonged seizures. Although either output state is readily modeled <i>in silico</i> and induced experimentally, the transition mechanisms are unknown, in part because no models exhibit both output states spontaneously. <i>In silico</i> small-world neural networks were built using single-compartment neurons whose physiological parameters were derived from dual whole-cell recordings of pyramidal cells in organotypic hippocampal slice cultures that were generating spontaneous seizure-like activity. <i>In silico</i>, neurons were connected by abundant local synapses and rare long-distance synapses. Activity-dependent synaptic depression and gradual recovery delimited synchronous activity. Full synaptic recovery engendered interictal population spikes that spread via long-distance synapses. When synaptic recovery was incomplete, postsynaptic neurons required coincident activation of multiple presynaptic terminals to reach firing threshold. Only local connections were sufficiently dense to spread activity under these conditions. This coalesced network activity into traveling waves whose velocity varied with synaptic recovery. Seizures were comprised of sustained traveling waves that were similar to those recorded during experimental and human neocortical seizures. Sustained traveling waves occurred only when wave velocity, network dimensions, and the rate of synaptic recovery enabled wave reentry into previously depressed areas at precisely ictogenic levels of synaptic recovery. Wide-field, cellular-resolution GCamP7b calcium imaging demonstrated similar initial patterns of activation in the hippocampus, although the anatomical distribution of traveling waves of synaptic activation was altered by the pattern of synaptic connectivity in the organotypic hippocampal cultures.<b>SIGNIFICANCE STATEMENT</b> When computerized distributed neural network models are required to generate both features of epileptic networks (i.e., spontaneous interictal population spikes and seizures), the network structure is substantially constrained. These constraints provide important new hypotheses regarding the nature of epileptic networks and mechanisms of seizure onset.", "year": "2019", "journal": "The Journal of neuroscience : the official journal of the Society for Neuroscience", "label": "animal_experimental_study"}, {"pmid": "3757938", "title": "Spontaneous rhythmic synchronous activity in epileptic human and normal monkey temporal lobe.", "abstract": "Intracellular recordings were obtained from neurons in tissue taken from human epileptic temporal lobe and normal monkey hippocampus. Using the in vitro slice preparation, we confirmed that spontaneous rhythmic synchronous events (SRSEs) were predominantly found in cells of mesial temporal lobe. These synaptic-like events appeared to be mediated by a GABAergic mechanism, since they were blocked by bicuculline. An interneuron-like cell type was found which discharged in a burst pattern in parallel with SRSE occurrence in pyramidal neurons. Burst discharges were graded and excitatory postsynaptic potential (EPSP)-triggered; all-or-none paroxysmal depolarizations were extremely rare. These features of SRSE activity suggest that population synchrony in this tissue is largely dependent on local inhibitory interneuronal circuitry. SRSEs were found in normal monkey hippocampus as well as in mesial tissue from human epileptic temporal lobe. This result indicates that SRSEs are not a direct reflection of tissue epileptogenicity. However, the circuitry underlying SRSEs may be important in the determination of tissue seizure susceptibility, since it provides a substrate for cell synchronization.", "year": "1986", "journal": "Epilepsia", "label": "in_vitro_study"}, {"pmid": "7458760", "title": "Dynamic study of the acoustico-facial reflex by impedance measurement.", "abstract": "Dynamic study of the acoustic reflex has brought into evidence that 1. age has a significant influence on various reflex response parameters 2. study of dynamic parameters of the acoustic reflex enables changes in the reflex arc to be objectified. This is therefore an objective measurement of recruitment in impedance measurement. The author proposes to study the following parameters: rise time, recovery time, and the variations of maximum amplitude as function of sound stimulation intensity. Study of these three parameters provides a highly sensitive test of change in the dynamics of the acoustic reflex, for indeed this test reveals pathology well before the Reflex Decay Test does so.", "year": "1980", "journal": "Archives of oto-rhino-laryngology", "label": "in_vitro_study"}, {"pmid": "920749", "title": "Comparison of six procedures for the simultaneous determination of antiepileptic drugs.", "abstract": "A comparison of six gas-chromatographic procedures for the simultaneous analysis of antiepileptic drugs was made. Methylation with 0.2M trimethylanilinium hydroxide was superior to other derivatizing procedures evaluated. The methylated derivatives of phenobarbital, carba-mazepine, primidone, and diphenyl-hydantoin were separated on the chromatogram, and the peaks were sharp and symmetrical. The four drugs gave linear curves to twice their toxic levels.", "year": "1977", "journal": "The American journal of medical technology", "label": "in_vitro_study"}, {"pmid": "11168573", "title": "Lowering the extracellular potassium concentration elicits epileptic activity in neocortical tissue of epileptic patients.", "abstract": "The increase in the extracellular potassium concentration ([K(+)](o)) is a well-established model of epilepsy (the so-called high potassium model). Therefore, it is generally accepted that for the prevention of abnormal excitability and seizure generation, increases of [K(+)](o) must be avoided. In this paper, however, we show that on the contrary, a reduction of [K(+)](o) also elicits epileptic activity in brain slices of man.", "year": "2001", "journal": "The European journal of neuroscience", "label": "in_vitro_study"}, {"pmid": "3367658", "title": "Validation of a neocortical slice preparation for the study of epileptiform activity.", "abstract": "A simple slice chamber was designed to achieve easy manipulations of temperature, ionic composition and drug concentrations. Spontaneous and evoked extracellular potentials could be recorded with glass microelectrodes from 500 micron thick slices of rat frontal neocortex. In the absence of magnesium ions in the superfusing medium or in the presence of convulsant agents, epileptiform activity was seen. The amplitude of this activity was greatest in layer II/III, each burst consisting of a long-lasting negative potential on the decay phase of which were superimposed many afterpotentials. There were multiple foci from which spontaneous epileptiform bursts spread to other ipsi- and contralateral parts of the cortex via both the grey and white matter. Although such bursts were observed between 23 and 37 degrees C, optimal recording of discrete epileptiform activity was achieved at 29 +/- 1 degrees C. Decreasing extracellular calcium or increasing extracellular concentrations of potassium enhanced burst discharges. Proconvulsant agents initiated both interictal and ictal epileptiform events. This, together with the reduction of epileptiform activity by standard anticonvulsant drugs such as carbamazepine and phenobarbitone suggested that this in vitro model may be useful for studying the pharmacology of epileptogenesis and for developing new therapeutic strategies for epilepsy.", "year": "1988", "journal": "Journal of neuroscience methods", "label": "in_vitro_study"}, {"pmid": "26280213", "title": "Expression Patterns of TRPC1 in Cortical Lesions from Patients with Focal Cortical Dysplasia.", "abstract": "Focal cortical dysplasia (FCD) is known as a common cause of chronic refractory epilepsy, but the underlying mechanisms of the factors that lead to FCD-related epilepsy are unclear. Previous studies have shown that canonical transient receptor potential channels (TRPCs) might be involved in the process of epileptogenesis. Canonical transient receptor potential channel 1 (TRPC1), which is ubiquitously expressed in the brain, has been shown to be involved in epileptiform bust firing in knockout mice. In this study, we examined the expression of TRPC1 in FCD type Ia (FCDIa), FCD type IIa (FCDIIa), and FCD type IIb (FCDIIb) surgical specimens from patients and age-matched autopsy control samples. Real-time quantitative PCR and western blotting indicated that TRPC1 mRNA and protein levels were increased in FCDIa, FCDIIa, and FCDIIb samples compared to control samples. Immunohistochemistry results revealed that TRPC1 was mainly distributed in microcolumns, dysmorphic neurons, and balloon cells. Further double immunofluorescent staining showed that TRPC1 was co-localized with glutamatergic and GABAergic markers. Taken together, our results demonstrate that the overexpression and specific cellular location of TRPC1 might be related to the epileptogenesis of FCD.", "year": "2015", "journal": "Journal of molecular neuroscience : MN", "label": "genetic_molecular_study"}, {"pmid": "36894399", "title": "MED12 variants associated with X-linked recessive partial epilepsy without intellectual disability.", "abstract": "OBJECTIVES: The MED12 gene encodes mediator complex subunit 12, which is a component of the mediator complex involved in the transcriptional regulation of nearly all RNA polymerase II-dependent genes. MED12 variants have previously been associated with developmental disorders with or without nonspecific intellectual disability. This study aims to explore the association between MED12 variants and epilepsy. MATERIALS AND METHODS: Trios-based whole-exome sequencing was performed in a cohort of 349 unrelated cases with partial (focal) epilepsy without acquired causes. The genotype-phenotype correlations of MED12 variants were analyzed. RESULTS: Five hemizygous missense MED12 variants, including c.958A>G/p.Ile320Val, c.1757G>A/p.Ser586Asn, c.2138C>T/p.Pro713Leu, c.3379T>C/p.Ser1127Pro, and c.4219A>C/p.Met1407Leu were identified in five unrelated males with partial epilepsy. All patients showed infrequent focal seizures and achieved seizure free without developmental abnormalities or intellectual disability. All the hemizygous variants were inherited from asymptomatic mothers (consistent with the X-linked recessive inheritance pattern) and were absent in the general population. The two variants with damaging hydrogen bonds were associated with early-onset seizures. Further genotype-phenotype analysis revealed that congenital anomaly disorder (Hardikar syndrome) was associated with (de novo) destructive variants in an X-linked dominant inheritance pattern, whereas epilepsy was associated with missense variants in an X-linked recessive inheritance pattern. Phenotypic features of intellectual disability appeared as the intermediate phenotype in terms of both genotype and inheritance. Epilepsy-related variants were located at the MED12-LCEWAV domain and the regions between MED12-LCEWAV and MED12-POL. CONCLUSION: MED12 is a potentially causative gene for X-linked recessive partial epilepsy without developmental or intellectual abnormalities. The genotype-phenotype correlation of MED12 variants explains the phenotypic variations and can help the genetic diagnosis.", "year": "2024", "journal": "Seizure", "label": "genetic_molecular_study"}, {"pmid": "23756483", "title": "Genome wide association studies (GWAS) and common forms of human epilepsy.", "abstract": "Several GWAS focused on common forms of epilepsy are underway. Currently, only one locus has been published that reached genome wide statistical significance. Two other loci that also reach genome wide statistical significance have been reported as preliminary data and are awaiting publication. Several additional loci identified in these studies fall just short of statistical significance, and it is hoped that future large scale meta-analyses will confirm these early findings and identify new loci that influence common forms of human epilepsy. Next generation DNA sequencing (NGS) studies are also underway and in the future will identify rare DNA variations of large effect that also contribute to the final epilepsy phenotypes under study. Finally, these studies have the potential to identify biomarkers of antiepileptic drug (AED) response as epilepsy patient GWAS and NGS data are stratified based on AED efficacy and tolerability.", "year": "2013", "journal": "Epilepsy & behavior : E&B", "label": "genetic_molecular_study"}, {"pmid": "39930056", "title": "Identification and validation of diagnostic biomarkers for temporal lobe epilepsy related to ferroptosis and potential therapeutic targets.", "abstract": "Ferroptosis pathway activation is potentially correlated with temporal lobe epilepsy (TLE). However, the diagnostic significance and mechanism of ferroptosis-related genes (FRGs) in TLE require further investigation. A comprehensive analysis of the GSE134697 dataset from the Gene Expression Omnibus (GEO) database using Weighted gene co-expression network analysis (WGCNA) identified 3,212 differentially expressed genes (DEGs) between temporal lobe epilepsy (TLE) and control groups, with a critical focus on the turquoise module. Through intersection of DEGs and key module genes, correlation analyses with functional-related genes (FRG), protein-protein interactions (PPI), least absolute shrinkage and selection operator (LASSO), and machine learning methods, five potential biomarkers of ferroptosis (CBS, SHMT1, RIN3, QDPR, and PLPP4) were isolated. A nomogram was constructed using these markers, and enrichment analyses revealed their links to T-cell activation, allograft rejection, and glial differentiation. Variations in 13 immune cell types were also noted. Upregulation of CBS, RIN3, QDPR, and PLPP4 in TLE was confirmed through RT-qPCR and Western blot assays. Additionally, five SHMT1-targeting and one CBS-targeting drugs were predicted using the Drug-Gene Interaction Database (DGIdb). These findings provide new insights into the potential pathogenesis of TLE and suggest new targets for future research.", "year": "2025", "journal": "Scientific reports", "label": "genetic_molecular_study"}, {"pmid": "36257979", "title": "A novel de novo KCNB1 variant altering channel characteristics in a patient with periventricular heterotopia, abnormal corpus callosum, and mild seizure outcome.", "abstract": "KCNB1 encodes the α-subunit of Kv2.1, the main contributor to neuronal delayed rectifier potassium currents. The subunit consists of six transmembrane α helices (S1-S6), comprising the voltage-sensing domain (S1-S4) and the pore domain (S5-P-S6). Heterozygous KCNB1 pathogenic variants are associated with developmental and epileptic encephalopathy. Here we report an individual who shows the milder phenotype compared to the previously reported cases, including delayed language development, mild intellectual disability, attention deficit hyperactivity disorder, late-onset epilepsy responsive to an antiepileptic drug, elevation of serum creatine kinase, and peripheral axonal neuropathy. On the other hand, his brain MRI showed characteristic findings including periventricular heterotopia, polymicrogyria, and abnormal corpus callosum. Exome sequencing identified a novel de novo KCNB1 variant c.574G>A, p.(Ala192Thr) located in the S1 segment of the voltage-sensing domain. Functional analysis using the whole-cell patch-clamp technique in Neuro2a cells showed that the Ala192Thr mutant reduces both activation and inactivation of the channel at membrane voltages in the range of -50 to -30 mV. Our case could expand the phenotypic spectrum of patients with KCNB1 variants, and suggested that variants located in the S1 segment might be associated with a milder outcome of seizures.", "year": "2023", "journal": "Journal of human genetics", "label": "genetic_molecular_study"}, {"pmid": "1743170", "title": "Localization of lesions by neuropsychological testing.", "abstract": "Neuropsychological evaluation differs from other methods used to localize cerebral lesions in that it analyzes cognitive function. Tests sample widely among cognitive abilities, contrasting language proficiency with visuospatial skills. A thorough assessment of memory is crucial in the investigation because of the prominence of the temporal lobes in epileptogenesis and their importance in memory. Different aspects of learning and memory are tested, and measures sensitive to hippocampal function should be included. Patients who will undergo elective surgery may also undergo intracarotid sodium amobarbital tests, which provide additional information about the integrity of each hippocampal region. Appraisal of frontal-lobe function is another important part of neuropsychological evaluation. A growing number and variety of neuropsychological tests have proven to be sensitive to lesions in this large and complex cortical area. Frontal-lobe function could be expected to vary according to the function of subregions within the frontal lobes, and some tests appear to be sensitive to specific regions.", "year": "1991", "journal": "Epilepsia", "label": "uncertain"}, {"pmid": "16630747", "title": "Simultaneous electroencephalography and functional magnetic resonance imaging applied to epilepsy.", "abstract": "Among the recent advances in neuroimaging and clinical neurophysiology, simultaneous electroencephalography (EEG) and functional magnetic resonance imaging (fMRI), that is SEM, stands apart as a challenging integration of techniques with great potential to provide unique information. The benefit of this integration is the utilization of each technique's strengths: the high temporal resolution and sensitivity to epileptic abnormalities of EEG and the high spatial resolution and noninvasive localization of cerebral metabolic change of fMRI. With SEM, electroencephalographic events that occur during fMRI may be identified and subsequently mapped with high resolution according to the hemodynamic changes that accompany them. Reaching the point of technically reliable SEM has required solutions to the many safety and electrical noise problems inherent to this technique. Recording an electroencephalogram during MRI requires special, MRI-compatible EEG equipment and a means to identify the low-amplitude electroencephalographic signal within an electrically noisy environment. With the results obtained at several institutions, SEM is now at a point in its development where the understanding of its validity as an indicator of the epileptic irritative and ictal-onset zones can be expanded. Because of its integration of both electrophysiologic and metabolic information, SEM also may be used to gain a greater understanding of cerebral physiology, in general, and fundamental aspects of epilepsy, in particular.", "year": "2006", "journal": "Epilepsy & behavior : E&B", "label": "uncertain"}, {"pmid": "39298757", "title": "A Digital Intervention for Capturing the Real-Time Health Data Needed for Epilepsy Seizure Forecasting: Protocol for a Formative Co-Design and Usability Study (The ATMOSPHERE Study).", "abstract": "BACKGROUND: Epilepsy is a chronic neurological disorder affecting individuals globally, marked by recurrent and apparently unpredictable seizures that pose significant challenges, including increased mortality, injuries, and diminished quality of life. Despite advancements in treatments, a significant proportion of people with epilepsy continue to experience uncontrolled seizures. The apparent unpredictability of these events has been identified as a major concern for people with epilepsy, highlighting the need for innovative seizure forecasting technologies. OBJECTIVE: The ATMOSPHERE study aimed to develop and evaluate a digital intervention, using wearable technology and data science, that provides real-time, individualized seizure forecasting for individuals living with epilepsy. This paper reports the protocol for one of the workstreams focusing on the design and testing of a prototype to capture real-time input data needed for predictive modeling. The first aim was to collaboratively design the prototype (work completed). The second aim is to conduct an \"in-the-wild\" study to assess usability and refine the prototype (planned research). METHODS: This study uses a person-based approach to design and test the usability of a prototype for real-time seizure precipitant data capture. Phase 1 (work completed) involved co-design with individuals living with epilepsy and health care professionals. Sessions explored users' requirements for the prototype, followed by iterative design of low-fidelity, static prototypes. Phase 2 (planned research) will be an \"in-the-wild\" usability study involving the deployment of a mid-fidelity, functional prototype for 4 weeks, with the collection of mixed methods usability data to assess the prototype's real-world application, feasibility, acceptability, and engagement. This phase involves primary participants (adults diagnosed with epilepsy) and, optionally, their nominated significant other. The usability study will run in 3 rounds of deployment and data collection, aiming to recruit 5 participants per round, with prototype refinement between rounds. RESULTS: The phase-1 co-design study engaged 22 individuals, resulting in the development of a mid-fidelity, functional prototype based on identified requirements, including the tracking of evidence-based and personalized seizure precipitants. The upcoming phase-2 usability study is expected to provide insights into the prototype's real-world usability, identify areas for improvement, and refine the technology for future development. The estimated completion date of phase 2 is the last quarter of 2024. CONCLUSIONS: The ATMOSPHERE study aims to make a significant step forward in epilepsy management, focusing on the development of a user-centered, noninvasive wearable device for seizure forecasting. Through a collaborative design process and comprehensive usability testing, this research aims to address the critical need for predictive seizure forecasting technologies, offering a promising approach to improving the lives of individuals with epilepsy. By leveraging predictive analytics and personalized machine learning models, this technology seeks to offer a novel approach to managing epilepsy, potentially improving clinical outcomes, including quality of life, through increased predictability and seizure management. INTERNATIONAL REGISTERED REPORT IDENTIFIER (IRRID): DERR1-10.2196/60129.", "year": "2024", "journal": "JMIR research protocols", "label": "uncertain"}, {"pmid": "31946715", "title": "Estimating Intracranial EEG Signals at Missing Electrodes in Epileptic Networks.", "abstract": "Epilepsy can be controlled by targeted treatment of the epileptogenic zone (EZ), the region in the brain where seizures originate. Identification of the EZ often requires visual inspection of invasive EEG recordings and thus relies heavily on placement of electrodes, such that they cover the EZ. A dense brain coverage would be ideal to obtain accurate boundaries of the EZ but is not possible due to surgical limitations. This gives rise to the \"missing electrode problem\", where clinicians desire to know what neural activity looks like between implanted electrodes. In this paper, we compare two methods for time series estimation of missing stereotactic EEG (SEEG) recordings. Specifically, we represent SEEG data as a sequence of Linear Time-Invariant (LTI) models. We then remove one signal from the data set and apply two different algorithms to simultaneously estimate the LTI models and the \"missing\" signal: (i) a Reduced-Order Observer in combination with Least Squares Estimation and (ii) an Expectation Maximization based Kalman Filter. The performance of each approach is evaluated in terms of (i) estimation error, (ii) sensitivity to initial conditions, and (iii) algorithm run-time. We found that the EM approach has smaller estimation errors and is less sensitive to initial conditions. However, the reduced-order observer has a run-time that is orders of magnitude faster.", "year": "2019", "journal": "Annual International Conference of the IEEE Engineering in Medicine and Biology Society. IEEE Engineering in Medicine and Biology Society. Annual International Conference", "label": "uncertain"}, {"pmid": "27379172", "title": "Automatic Identification of Interictal Epileptiform Discharges in Secondary Generalized Epilepsy.", "abstract": "Ictal epileptiform discharges (EDs) are characteristic signal patterns of scalp electroencephalogram (EEG) or intracranial EEG (iEEG) recorded from patients with epilepsy, which assist with the diagnosis and characterization of various types of epilepsy. The EEG signal, however, is often recorded from patients with epilepsy for a long period of time, and thus detection and identification of EDs have been a burden on medical doctors. This paper proposes a new method for automatic identification of two types of EDs, repeated sharp-waves (sharps), and runs of sharp-and-slow-waves (SSWs), which helps to pinpoint epileptogenic foci in secondary generalized epilepsy such as Lennox-Gastaut syndrome (LGS). In the experiments with iEEG data acquired from a patient with LGS, our proposed method detected EDs with an accuracy of 93.76% and classified three different signal patterns with a mean classification accuracy of 87.69%, which was significantly higher than that of a conventional wavelet-based method. Our study shows that it is possible to successfully detect and discriminate sharps and SSWs from background EEG activity using our proposed method.", "year": "2016", "journal": "Computational and mathematical methods in medicine", "label": "uncertain"}];
const PICO_DATA  = [{"pmid": "12500711", "title": "Randomized evaluation of adverse events and length-of-stay with routine emergency department use of phenytoin or fosphenytoin.", "abstract": "Intravenous phenytoin has come under increased scrutiny with the introduction of the prodrug, fosphenytoin. We evaluated adverse events and length-of-stay using parenteral the two drugs in routine emergency department use. Open-label randomization of phenytoin or fosphenytoin in 256 Emergency Department patients prescribed 279 parenteral doses of a phenytoin-equivalent. All phenytoin was administered intravenously, and fosphenytoin was given intravenously or intramuscularly (physician preference). Adverse events and Emergency Department length-of-stay were recorded; re-presentation to the Emergency Department within three months was reviewed for evidence of the purple glove syndrome. Nonparametric statistics were used to analyze the data. Seventy-seven patients received phenytoin and 202 fosphenytoin; 28 (10.0%) received intramuscular fosphenytoin. The mean phenytoin-equivalent dose was similar between the groups. Eighteen patients required reduction in infusion rates because of an adverse event (phenytoin = 6.5%, fosphenytoin = 6.4%; OR 0.9, 95% CI 0.4 2.6; p = 1.0). Adverse events occurred with similar frequency (phenytoin 9.1%, fosphenytoin 15.8%; OR 0.7, 95% CI 0.3 1.4; p = 0.3). The most common events were: pruritus, pain on infusion, and paresthesias. One patient developed hypotension (fosphenytoin); there were no other serious adverse events, including phlebitis. Median Emergency Department length-of-stay was 6.7 h for phenytoin and 5.7 h for fosphenytoin (p = 0.6). In routine Emergency Department use, our data do not support formulary conversion from phenytoin to fosphenytoin, based on the incidence of adverse events or Emergency Department length-of-stay.", "year": "2002", "journal": "Neurological research", "label": "randomized_controlled_trial", "P": "Emergency Department patients prescribed parenteral doses of a phenytoin-equivalent", "I": "Fosphenytoin (intravenous or intramuscular)", "C": "Phenytoin (intravenous)", "O": "Adverse events, Emergency Department length-of-stay, re-presentation for purple glove syndrome", "N": "256 (phenytoin=77, fosphenytoin=202)"}, {"pmid": "26592200", "title": "Favorable change of lipid profile after carbamazepine withdrawal.", "abstract": "OBJECTIVE: Patients treated with carbamazepine (CBZ) have increased serum levels of total cholesterol (TC), high-density lipoproteins (HDL), and low-density lipoproteins (LDL). We aimed to investigate whether these changes of serum lipids are reversible after CBZ withdrawal. MATERIAL AND METHODS: We used a prospective, randomized double-blinded design. A total of 160 patients who had been seizure free on anti-epileptic drug monotherapy for more than 2 years were included and randomized to withdrawal or not. The intervention was completed by 150 (80 females, 53%) patients. Serum samples from before and 4 months after completed withdrawal or no withdrawal were obtained from 130 patients (63 females, 48%). Of these, 84 were treated with CBZ, 28 with valproate, nine with phenytoin, four with phenobarbital, and five with lamotrigine. Of the patients who had been treated with CBZ, 47 were randomized to the withdrawal group, and 37 were randomized to the non-withdrawal group. RESULTS: Among the CBZ-treated patients, a significant decrease in serum levels of TC, LDL, and apolipoprotein B (ApoB) were found in the withdrawal group compared with the non-withdrawal group. Mean differences in change were as follows: TC 0.68 mmol/l (P = 0.005, CL - 1.15 to -0.21); LDL - 0.67 mmol/l (P = 0.001, CL - 1.03 to -0.29); ApoB - 0.13 g/l (P = 0.02, CL - 0.23 to -0.03). No significant changes in HDL, apolipoprotein A, and C-reactive protein were detected. CONCLUSION: Our results indicate that CBZ may have unfavorable effects on serum levels of TC, LDL, and ApoB. However, these changes seem to be reversible even after years of treatment.", "year": "2016", "journal": "Acta neurologica Scandinavica", "label": "randomized_controlled_trial", "P": "Patients treated with carbamazepine (CBZ) who had been seizure free on anti-epileptic drug monotherapy for more than 2 years", "I": "Carbamazepine (CBZ) withdrawal", "C": "Continued carbamazepine (CBZ) treatment (non-withdrawal group)", "O": "Change in serum levels of total cholesterol (TC), LDL, and apolipoprotein B (ApoB)", "N": "84 (CBZ-treated patients: 47 withdrawal, 37 non-withdrawal)"}, {"pmid": "15799802", "title": "Waterjet dissection versus ultrasonic aspiration in epilepsy surgery.", "abstract": "OBJECTIVE: Waterjet dissection is currently under close investigation in neurosurgery. Experimentally, precise brain parenchyma dissection with vessel preservation has been demonstrated. Clinically, the safety of the instrument has already been proved. However, precise data demonstrating that waterjet dissection indeed reduces surgical blood loss are still missing. METHODS: The authors applied the waterjet device in a prospective randomized study in comparison with the ultrasonic aspirator. Because there is little variability in the procedure, 30 patients with temporal lobe epilepsy receiving a tailored temporal lobe resection between December 1999 and October 2002 were selected for this study. Intraoperative vessel preservation, intraoperative blood loss, surgical complications, and epilepsy outcome were evaluated. All patients were followed at 3-month intervals. RESULTS: During surgery, both instruments were easy to handle. Only with the waterjet dissector, however, were even small intraparenchymal blood vessels preserved. Intraoperative blood loss was significantly reduced with the waterjet (mean, 70 +/- 46 ml) compared with the ultrasonic aspirator (mean, 121 +/- 48 ml). However, no difference in the necessity for blood transfusion occurred. No difference was observed with respect to operation time (238.6 +/- 37.0 min with the waterjet, 247.5 +/- 41.5 min with the ultrasonic aspirator), surgical complications, and outcome. CONCLUSION: The waterjet dissector enables a significant reduction of intraoperative blood loss in the investigated setting. However, further studies are needed to confirm these results with a larger number of patients. Studies also are needed to prove that the reduction of blood loss is of clinical relevance for the outcome of the patients.", "year": "2005", "journal": "Neurosurgery", "label": "randomized_controlled_trial", "P": "Patients with temporal lobe epilepsy receiving a tailored temporal lobe resection", "I": "Waterjet dissection", "C": "Ultrasonic aspiration", "O": "Intraoperative vessel preservation, intraoperative blood loss, surgical complications, and epilepsy outcome", "N": "30 (waterjet=15, ultrasonic aspirator=15)"}, {"pmid": "34118609", "title": "Randomized trial of high-dose pyridoxine in combination with standard hormonal therapy in West syndrome.", "abstract": "OBJECTIVE: To determine whether high-dose, oral pyridoxine in combination with standard adrenocorticotropic hormone (ACTH) therapy has superior effectiveness than ACTH therapy alone in increasing cessation of epileptic spasms for children with West syndrome. METHODS: This study was an open-label, randomized controlled trial with masked endpoint assessments. Eligible children with West syndrome, age ranged 3-18 months, were randomized into the intervention (n = 43) and the standard arm (n = 37) of therapy. The intervention group received oral pyridoxine at 100-300 mg/kg/day in addition to standard therapy of intramuscular ACTH at 150 IU/m<sup>2</sup>/day. Primary effectiveness outcome was a complete cessation of spasms at two weeks and sustained till six weeks. RESULTS: Comparison of effectiveness measures between intervention and standard groups were : complete cessation of epileptic spasms (48.8% vs 58.3%; group difference -9.6%; 95% confidence interval [CI] -30% to 12.3%; p = 0.4), median EEG scores (Q1-Q3) by Jeavons Score at six weeks [3 (1-5) vs 3 (1-5); p = 0.6], median motor scores (Q1-Q3) by DASII (Development Assessment Scales for Indian Infants) at 12 weeks [35 (29-49) vs 42 (34.3-63.8), p = 0.04], and median mental scores (Q1-Q3) by DASII at 12 weeks [35 (29.5-46) vs 41.5 (31.3-60), p = 0.02]. Adverse events were comparable in both arms. CONCLUSIONS: There was no evidence to suggest the superiority of high-dose pyridoxine in combination with ACTH versus ACTH alone for the treatment of West syndrome, considering the limitations of the study design.", "year": "2021", "journal": "Seizure", "label": "randomized_controlled_trial", "P": "Children with West syndrome, age 3-18 months", "I": "Oral pyridoxine (100-300 mg/kg/day) in addition to intramuscular ACTH (150 IU/m²/day)", "C": "Intramuscular ACTH (150 IU/m²/day) alone", "O": "Complete cessation of epileptic spasms at two weeks and sustained till six weeks; EEG scores; motor scores; mental scores", "N": "80 (intervention=43, standard arm=37)"}, {"pmid": "26503021", "title": "Cognitive consequences of early versus late antiepileptic drug withdrawal after pediatric epilepsy surgery, the TimeToStop (TTS) trial: study protocol for a randomized controlled trial.", "abstract": "BACKGROUND: The goals of intentional curative pediatric epilepsy surgery are to achieve seizure-freedom and antiepileptic drug (AED) freedom. Retrospective cohort studies have indicated that early postoperative AED withdrawal unmasks incomplete surgical success and AED dependency sooner, but not at the cost of long-term seizure outcome. Moreover, AED withdrawal seemed to improve cognitive outcome. A randomized trial is needed to confirm these findings. We hypothesized that early AED withdrawal in children is not only safe, but also beneficial with respect to cognitive functioning. DESIGN: This is a multi-center pragmatic randomized clinical trial to investigate whether early AED withdrawal improves cognitive function, in terms of attention, executive function and intelligence, quality of life and behavior, and to confirm safety in terms of eventual seizure freedom, seizure recurrences and \"seizure and AED freedom.\" Patients will be randomly allocated in parallel groups (1:1) to either early or late AED withdrawal. Randomization will be concealed and stratified for preoperative IQ and medical center. In the early withdrawal arm reduction of AEDs will start 4 months after surgery, while in the late withdrawal arm reduction starts 12 months after surgery, with intended complete cessation of drugs after 12 and 20 months respectively. Cognitive outcome measurements will be performed preoperatively, and at 1 and 2 years following surgery, and consist of assessment of attention and executive functioning using the EpiTrack Junior test and intelligence expressed as IQ (Wechsler Intelligence Scales). Seizure outcomes will be assessed at 24 months after surgery, and at 20 months following start of AED reduction. We aim to randomize 180 patients who underwent anticipated curative epilepsy surgery below 16 years of age, were able to perform the EpiTrack Junior test preoperatively, and have no predictors of poor postoperative seizure prognosis (multifocal magnetic resonance imaging (MRI) abnormalities, incomplete resection of the lesion, epileptic postoperative electroencephalogram (EEG) abnormalities, or more than three AEDs at the time of surgery). DISCUSSION: Growing experience with epilepsy surgery has changed the view towards postoperative medication policy. In a European collaboration, we designed a multi-center pragmatic randomized clinical trial comparing early with late AED withdrawal to investigate benefits and safety of early AED withdrawal. The TTS trial is supported by the Dutch Epilepsy Fund (NL 08-10) ISRCTN88423240/ 08/05/2013.", "year": "2015", "journal": "Trials", "label": "randomized_controlled_trial", "P": "Pediatric patients (<16 years) who underwent anticipated curative epilepsy surgery, able to perform EpiTrack Junior preoperatively, and with no predictors of poor postoperative seizure prognosis (multifocal MRI abnormalities, incomplete resection, epileptic postoperative EEG abnormalities, or >3 AEDs at surgery)", "I": "Early antiepileptic drug (AED) withdrawal (reduction starts 4 months post-surgery, complete cessation intended after 12 months)", "C": "Late AED withdrawal (reduction starts 12 months post-surgery, complete cessation intended after 20 months)", "O": "Cognitive function (attention, executive function, intelligence), quality of life, behavior, seizure freedom, seizure recurrences, and seizure and AED freedom", "N": "180 (early withdrawal=90, late withdrawal=90)"}, {"pmid": "16981874", "title": "Increased apparent oral clearance of valproic acid during intake of combined contraceptive steroids in women with epilepsy.", "abstract": "PURPOSE: To determine potential changes in total and unbound serum valproic acid (VPA) concentrations at steady-state during a cycle of intake of combined hormonal contraceptive (HC) steroids. METHODS: Blood samples were collected from nine women stabilized on VPA monotherapy on two separate randomized occasions: (i) at the end of the 4- to 7-day HC-free interval, and (ii) on the last day of the HC intake period. Trough concentrations of VPA in serum and serum ultrafiltrates were determined by fluorescence polarization immunoassay. RESULTS: In all women, total and unbound VPA concentrations were higher during the HC-free interval than during HC intake (means +/- SD: 425 +/- 184 vs. 350 +/- 145 micromol/L, respectively, for total VPA, p = 0.002, and 55 +/- 37 vs. 39 +/- 25 micromol/L, respectively, for unbound VPA, p = 0.005). Compared with the HC-free interval, HC intake was associated with a mean 21.5% increase in VPA total apparent oral clearance (from 8.0 +/- 5.2 to 9.7 +/- 6.4 ml/h/kg, p = 0.01) and a 45.2 % increase in VPA unbound apparent oral clearance (from 79 +/- 81 to 115 +/- 121 ml/h/kg, p = 0.029). CONCLUSIONS: The apparent oral clearance of total and unbound VPA increases during the HC intake period compared with the HC-free interval, probably due to induction of glucuronosyltransferase by ethinylestradiol. The magnitude of the change varies across individuals, being potentially clinically relevant in some cases. Serum VPA concentrations should be monitored when adding or discontinuing HC steroids, and possibly during the on-off intervals of a HC cycle.", "year": "2006", "journal": "Epilepsia", "label": "clinical_trial_non_randomized", "P": "Women with epilepsy on VPA monotherapy", "I": "Combined hormonal contraceptive (HC) steroids intake", "C": "HC-free interval", "O": "Total and unbound serum valproic acid (VPA) concentrations at steady-state; VPA total and unbound apparent oral clearance", "N": "9"}, {"pmid": "11402398", "title": "A clinical comparative study evaluating the effect of epilepsy versus ADHD on timed cognitive tasks in children.", "abstract": "Both children with epilepsy and children with ADHD may be characterized by slowing on reaction-time measurement. This is of particular interest, as neuropsychological assessment is often requested in the differential diagnosis between children with short non-convulsive epileptic seizures and children with ADHD. In this study we attempt to identify patterns of impairment on timed tasks that are specific for epilepsy, relative to ADHD. This study was an open, controlled parallel-group clinical investigation which included two groups of patients: 60 children with ADHD and 60 children with epilepsy. These children were compared with a control group (n=30) on two types of timed cognitive tasks: tasks with low information load (simple reaction-time measurement) and tasks with high information load (multiple decision reaction-time measurement). The simple reaction-time measurements show significant differences between ADHD and controls (all except for visual RT non-dominant hand) and between epilepsy and controls (only one test). No significant differences were found between epilepsy and ADHD. The two tests with high information load show significant slowing compared with the controls for epilepsy on the Binary Choice Reaction-Time Test and for ADHD on the Visual Searching Test. On both tests also the differences between epilepsy and ADHD are significant. The two tests in combination have a relatively satisfactory potential to classify the children with ADHD (75% correct classification) and the children with epilepsy (55% correct classification). We may conclude that complex reaction-time tests (i.e., timed tasks with high information load) have potential for assessing the differential impact of ADHD and epilepsy on attentional function. These tasks specifically reveal general slowing for children with epilepsy and slowing as an effect of failures of inhibitory self control on unstructured tasks for ADHD.", "year": "2000", "journal": "Child neuropsychology : a journal on normal and abnormal development in childhood and adolescence", "label": "clinical_trial_non_randomized", "P": "Children with ADHD and children with epilepsy", "I": "Timed cognitive tasks (low and high information load)", "C": "Control group", "O": "Patterns of impairment on timed tasks specific for epilepsy vs. ADHD, classification accuracy", "N": "150 (ADHD=60, epilepsy=60, control=30)"}, {"pmid": "35381454", "title": "Validating an SVM-based neonatal seizure detection algorithm for generalizability, non-inferiority and clinical efficacy.", "abstract": "Neonatal seizure detection algorithms (SDA) are approaching the benchmark of human expert annotation. Measures of algorithm generalizability and non-inferiority as well as measures of clinical efficacy are needed to assess the full scope of neonatal SDA performance. We validated our neonatal SDA on an independent data set of 28 neonates. Generalizability was tested by comparing the performance of the original training set (cross-validation) to its performance on the validation set. Non-inferiority was tested by assessing inter-observer agreement between combinations of SDA and two human expert annotations. Clinical efficacy was tested by comparing how the SDA and human experts quantified seizure burden and identified clinically significant periods of seizure activity in the EEG. Algorithm performance was consistent between training and validation sets with no significant worsening in AUC (p > 0.05, n = 28). SDA output was inferior to the annotation of the human expert, however, re-training with an increased diversity of data resulted in non-inferior performance (Δκ = 0.077, 95% CI: -0.002-0.232, n = 18). The SDA assessment of seizure burden had an accuracy ranging from 89 to 93%, and 87% for identifying periods of clinical interest. The proposed SDA is approaching human equivalence and provides a clinically relevant interpretation of the EEG.", "year": "2022", "journal": "Computers in biology and medicine", "label": "clinical_trial_non_randomized", "P": "Neonates", "I": "Support Vector Machine (SVM)-based neonatal seizure detection algorithm (SDA)", "C": "Human expert annotation", "O": "Generalizability (AUC, p > 0.05), non-inferiority (inter-observer agreement, Δκ), clinical efficacy (seizure burden accuracy, identification of clinically significant periods)", "N": "28 (training/validation), 18 (re-training)"}, {"pmid": "8471681", "title": "Does ECT permanently alter seizure threshold?", "abstract": "Recent research has raised the possibility that electroconvulsive therapy (ECT) results in a persistent elevation of seizure threshold among males. In this study, seizure threshold, quantified by the method of limits procedure, was assessed at the first and last treatments of 148 consecutive depressed patients. Patients with and without a prior history of ECT did not differ in seizure threshold at the first treatment, seizure duration at the first treatment or averaged across all treatments, or in the magnitude of the seizure threshold increase over the ECT course. No evidence was obtained that history of ECT was associated with alterations of seizure threshold or seizure duration.", "year": "1993", "journal": "Biological psychiatry", "label": "clinical_trial_non_randomized", "P": "Consecutive depressed patients", "I": "Electroconvulsive therapy (ECT)", "C": "Prior history of ECT vs. no prior history of ECT", "O": "Seizure threshold at first treatment, seizure duration at first treatment or averaged across all treatments, magnitude of seizure threshold increase over ECT course", "N": "148"}, {"pmid": "973549", "title": "The influence of prostaglandin E2 on the electroencephalogram of normal subjects and epileptic patients.", "abstract": "In 1973 R.C. Lyneham and others warned against the possible epileptogenic effect of prostaglandins. We studied the influence of this substance on the electroencephalogram of 53 subject (31 non-epileptics and 22 epileptics) before and during the administration of PG E2. Forty-eight tracings remained unchanged, four showed a slight improvement and one showed some worsening during infusion of PG E2. One patient, suffering from daily psychomotor attacks had, accidentally a fit during the trial. It can be concluded that PG E2 does not alter the electroencephalogram in a significant way and that it does not induce epileptic seizures.", "year": "1976", "journal": "Acta neurologica Belgica", "label": "clinical_trial_non_randomized", "P": "53 subjects (31 non-epileptics and 22 epileptics)", "I": "Prostaglandin E2 (PG E2) infusion", "C": "Baseline EEG (before administration)", "O": "Changes in electroencephalogram (EEG) and induction of epileptic seizures", "N": "53 (non-epileptics=31, epileptics=22)"}, {"pmid": "2369880", "title": "Pharmacokinetic profile of a 300-mg extended phenytoin sodium capsule (Dilantin) formulation.", "abstract": "The pharmacokinetic profile of a newly developed Dilantin 300-mg Kapseal formulation was compared with that of currently marketed Dilantin 100-mg Kapseals in both a 300-mg single-dose bioequivalence study in nine healthy volunteers and a once-daily 300-mg multiple-dose study in 18 patients with seizures. Results of these studies indicate the rate and extent of absorption of the 300-mg extended phenytoin (PHT) sodium capsule formulation are similar to that of 100-mg extended PHT sodium capsules based on PHT plasma maximum concentrations and time to achieve them (Cmax, tmax), and area under the curve (AUC) values and the urinary excretion of total hydroxy phenylhydantoin (HPPH) in the single-dose study and steady-state PHT plasma Cmax, tmax, minimum plasma concentrations (Cmin), and AUC values and urinary excretion of total HPPH in the multiple-dose study. Control of seizures in patients was equally maintained on a once-daily 300-mg multiple-dosing regimen administered as either one 300-mg extended PHT sodium capsule daily or three 100-mg extended PHT sodium capsules daily. Therefore, 300-mg extended PHT sodium capsules can be safely and effectively interchanged with three 100-mg extended PHT sodium capsules in patients requiring a once-daily 300-mg PHT sodium dosing regimen.", "year": "1990", "journal": "Epilepsia", "label": "open_label_trial", "P": "Healthy volunteers (single-dose study) and patients with seizures (multiple-dose study)", "I": "Dilantin 300-mg Kapseal formulation (single-dose and once-daily 300-mg multiple-dose)", "C": "Dilantin 100-mg Kapseals (single-dose study) and three 100-mg Kapseals daily (multiple-dose study)", "O": "Pharmacokinetic parameters (Cmax, tmax, AUC, Cmin) and urinary excretion of HPPH; seizure control maintenance", "N": "9 (single-dose study); 18 (multiple-dose study)"}, {"pmid": "2396305", "title": "A study of the interaction between omeprazole and phenytoin in epileptic patients.", "abstract": "This study was performed to determine the effect of omeprazole, given in therapeutically recommended doses, on the steady-state plasma levels of phenytoin in epileptic patients. Five men and three women of median age 34 years participated in the study. Steady-state plasma levels of phenytoin were measured once a week for 2 weeks before and after, respectively, and during 3 weeks of concomitant omeprazole treatment with 20 mg daily. Urinary excretion of phenytoin and its metabolite [5-(p-hydroxyphenyl)-5-phenyl-hydantoin] were determined before and at the end of the omeprazole treatment period. The steady-state plasma phenytoin levels as well as urinary excretion of phenytoin and its main metabolite were unchanged during omeprazole treatment. The results from this study suggest that concomitant omeprazole treatment in therapeutically recommended doses (20 mg daily) will not significantly affect the steady-state plasma levels of phenytoin in epileptic patients.", "year": "1990", "journal": "Therapeutic drug monitoring", "label": "open_label_trial", "P": "Epileptic patients (5 men, 3 women, median age 34 years)", "I": "Omeprazole 20 mg daily for 3 weeks", "C": "Baseline phenytoin levels and excretion (before and during omeprazole treatment)", "O": "Steady-state plasma phenytoin levels and urinary excretion of phenytoin and its metabolite", "N": "8"}, {"pmid": "11520324", "title": "Tiagabine (gabitril) experience in children.", "abstract": "Tiagabine (TGB) is indicated as adjunctive therapy for partial seizures in adults and children aged 12 years and older. Double-blind, placebo-controlled studies of TGB treatment are under way in younger children with various forms of epilepsy. The results of pediatric pharmacokinetic trials indicate patterns similar to those seen in adults. An open-label study was conducted in the United States in 31 children with refractory complex partial seizures, with doses escalated every 2 weeks by 0.25 mg/kg up to a maximal daily dose of 1 mg/kg. Twenty-nine patients were treated with TGB for >1 year; 26 completed the study, of whom 18 were receiving monotherapy at study completion. A European dose-escalation study evaluated TGB (0.25-1.5 mg/kg/day) as add-on therapy in 52 children aged 2-15 years. TGB appeared to be more effective in localization-related epilepsy syndromes, with 17 of 23 patients with localization-related epilepsy having a 33% median reduction of seizure rate compared with baseline in the fourth month of treatment, and six patients having > or =50% seizure rate reduction. In this study, myoclonic seizures and spasms showed a poor response as opposed to encouraging findings reported by other groups with these seizure types. The adverse effect profile of TGB in children with epilepsy is similar to that in adults. In the U.S. study, most common adverse events were related to the central nervous system (CNS) and decreased over time. In the European study, mostly mild to moderate adverse events, including asthenia (19%), nervousness (19%), dizziness (17%), and somnolence (17%), were reported by 83% of TGB-treated children (39% of children reported adverse events during the single-blind placebo period). In summary, preliminary pediatric data with TGB suggest particular efficacy against epilepsy characterized by partial seizures or other syndromes, and further investigation is warranted.", "year": "2001", "journal": "Epilepsia", "label": "open_label_trial", "P": "Children aged 2-15 years with refractory complex partial seizures or other forms of epilepsy", "I": "Tiagabine (TGB) dose-escalated up to a maximal daily dose of 1 mg/kg (US study) or 0.25-1.5 mg/kg/day (European study) as add-on therapy", "C": "Placebo (mentioned in context of ongoing studies and European study single-blind placebo period)", "O": "Median reduction of seizure rate compared with baseline in the fourth month of treatment; adverse events", "N": "83 (US study=31, European study=52)"}, {"pmid": "16406697", "title": "Evidence for a rapid action of levetiracetam compared to topiramate in refractory partial epilepsy.", "abstract": "The objective of this observational study was to compare the efficacy of levetiracetam and topiramate during the first 15 days of add-on treatment in adults with refractory partial epilepsy. Two cohorts of patients with > or =3 simple or complex partial seizures with or without secondary generalisation per month over an 8-week baseline period received levetiracetam or topiramate in two distinct phases, in addition to standard antiepileptic treatment. During the first 15 days of the therapy, levetiracetam was added at the dosage of 250 mg b.i.d. or topiramate at 25mg o.i.d. Efficacy parameters included number of seizure-free days (SFDs), mean and percent reduction in seizure frequency (in general and by type), and number of seizure-free patients in the first 15 days of treatment compared to last 15 days of the baseline period. Sixty-one patients received levetiracetam and 61 topiramate. The general characteristics of the two treatment groups were similar. The total number of SFDs during 15 days before treatment was 637 with levetiracetam and 621 with topiramate; in the 15-day evaluation period the SFDs increased to 748 (17.4%) and 668 (7.6%), respectively (ANOVA, p<0.05). Twenty-six patients (42.6%) taking levetiracetam were seizure free compared to 10 (16.4%) receiving topiramate (chi-square, p=0.003). This open-label non-controlled study suggests an early efficacy of levetiracetam as add-on therapy in patients with refractory partial epilepsy: these results appear to confirm previous indications of a rapid onset of action and seem to suggest first evaluation of the patient at the dose of 500 mg/day before increasing to the considered minimum standard dose of 1000 mg/day, as some patients could respond to the starting dose.", "year": "2006", "journal": "Seizure", "label": "open_label_trial", "P": "Adults with refractory partial epilepsy (> or =3 simple or complex partial seizures with or without secondary generalisation per month over an 8-week baseline period)", "I": "Levetiracetam 250 mg b.i.d. add-on therapy", "C": "Topiramate 25mg o.i.d. add-on therapy", "O": "Number of seizure-free days (SFDs), mean and percent reduction in seizure frequency, and number of seizure-free patients during the first 15 days of treatment", "N": "122 (levetiracetam=61, topiramate=61)"}, {"pmid": "15551800", "title": "Antiepileptic, behavioral, and antidepressant effects of adjuvant lamotrigine therapy in drug-resistant epilepsy.", "abstract": "AIM: To evaluate the behavioral effects of lamotrigine as add-on therapy in treatment-resistant epilepsy. METHODS: An open, prospective, long-term study of lamotrigine as adjuvant therapy was performed in 56 patients with drug-resistant epilepsy (female/male ratio 35/21, age range 16-51 years). All the patients kept seizure diaries, and electroencephalograms were recorded at baseline and during 24 months of the treatment. Quality of life questionnaire, Hamilton depression scale (HMD), Beck depression scale (BDI), and Hamilton anxiety scale (HMA) were used before and during lamotrigine therapy. Comparative assessments were made in an age- and sex-matched control group treated with other antiepileptic drugs. RESULTS: Overall, seizure control was improved in 55.3% of the patients, remained unchanged in 39.3%, and deteriorated in 5.4%. Improvement in some quality of life measures occurred in 50% of the patients. The HMD subscales and BDI scale showed significant improvement in lamotrigine treated patients compared to the control group (ANOVA, p < 0.01). Negative behavioral effects occurred in 10.7% of the patients. CONCLUSION: Lamotrigine demonstrated significant antiepileptic long-term efficacy, and its positive effects on the mood and quality of life, which surpassed the negative behavioral effects, and contributed highly to the favorable treatment outcome.", "year": "2004", "journal": "Vojnosanitetski pregled", "label": "open_label_trial", "P": "Drug-resistant epilepsy patients (female/male ratio 35/21, age range 16-51 years)", "I": "Lamotrigine as adjuvant therapy for 24 months", "C": "Control group treated with other antiepileptic drugs", "O": "Seizure control, quality of life measures, Hamilton depression scale (HMD), Beck depression scale (BDI), Hamilton anxiety scale (HMA), and behavioral effects", "N": "56 (lamotrigine treated)"}, {"pmid": "27821279", "title": "Differentiating epileptic from non-epileptic high frequency intracerebral EEG signals with measures of wavelet entropy.", "abstract": "OBJECTIVE: To assess whether there is a difference in the background activity in the ripple band (80-200Hz) between epileptic and non-epileptic channels, and to assess whether this difference is sufficient for their reliable separation. METHODS: We calculated mean and standard deviation of wavelet entropy in 303 non-epileptic and 334 epileptic channels from 50 patients with intracerebral depth electrodes and used these measures as predictors in a multivariable logistic regression model. We assessed sensitivity, positive predictive value (PPV) and negative predictive value (NPV) based on a probability threshold corresponding to 90% specificity. RESULTS: The probability of a channel being epileptic increased with higher mean (p=0.004) and particularly with higher standard deviation (p<0.0001). The performance of the model was however not sufficient for fully classifying the channels. With a threshold corresponding to 90% specificity, sensitivity was 37%, PPV was 80%, and NPV was 56%. CONCLUSIONS: A channel with a high standard deviation of entropy is likely to be epileptic; with a threshold corresponding to 90% specificity our model can reliably select a subset of epileptic channels. SIGNIFICANCE: Most studies have concentrated on brief ripple events. We showed that background activity in the ripple band also has some ability to discriminate epileptic channels.", "year": "2016", "journal": "Clinical neurophysiology : official journal of the International Federation of Clinical Neurophysiology", "label": "surgical_outcomes_study", "P": "Channels from patients with intracerebral depth electrodes (303 non-epileptic and 334 epileptic)", "I": "Calculation of mean and standard deviation of wavelet entropy in the ripple band (80-200Hz)", "C": "Multivariable logistic regression model using entropy measures as predictors", "O": "Sensitivity, positive predictive value (PPV), and negative predictive value (NPV) at 90% specificity", "N": "637 (non-epileptic=303, epileptic=334)"}, {"pmid": "4076060", "title": "Nuclear magnetic resonance imaging, a new approach to the investigation of refractory temporal lobe epilepsy.", "abstract": "Nuclear magnetic resonance is a noninvasive technique of imaging the brain using signals produced by magnetic fields and radiowaves. Sixteen patients with refractory temporal lobe epilepsy (TLE) had magnetic resonance imaging (MRI) during investigation for possible surgical management. These images plus those of 10 normal controls, were interpreted blind and the results from the TLE patients compared to the EEG and computerized tomographic (CT) scan findings. Fourteen patients compared with one normal control had one or more of the following: small temporal lobe, small mesial temporal structures, small hemisphere, and focal mesial temporal prolonged spin-spin relaxation time. These findings correlated with the electrographically determined seizure focus in 11 patients. Enlarged or asymmetrical temporal horns were seen with equal frequency in patients and controls and did not correlate with the seizure focus. CT scans were less likely to show these changes than MRI. Correlation of the MRI changes with histopathology of resected temporal lobes was poor. MRI reveals structural and possibly functional alterations which may aid in the localization of the seizure focus in the temporal lobes of patients with refractory complex partial seizures.", "year": "1985", "journal": "Epilepsia", "label": "surgical_outcomes_study", "P": "Sixteen patients with refractory temporal lobe epilepsy (TLE) investigated for possible surgical management", "I": "Nuclear magnetic resonance imaging (MRI)", "C": "10 normal controls (for imaging interpretation) and CT scan findings", "O": "Correlation of MRI findings (small temporal lobe, small mesial temporal structures, small hemisphere, focal mesial temporal prolonged spin-spin relaxation time) with electrographically determined seizure focus and histopathology", "N": "16 (patients with TLE)"}, {"pmid": "27653870", "title": "Usage of SWI (susceptibility weighted imaging) acquired at 7T for qualitative evaluation of temporal lobe epilepsy patients with histopathological and clinical correlation: An initial pilot study.", "abstract": "OBJECTIVES: Ultra high field MRI at 7T is able to provide much improved spatial and contrast resolution which may aid in the diagnosis of hippocampal abnormalities. This paper presents a preliminary experience on qualitative evaluation of 7T MRI in temporal lobe epilepsy patients with a focus on comparison to histopathology. METHODS: 7T ultra high field MRI data, using T1-weighted, T2*-weighted and susceptibility-weighted images (SWI), were acquired for 13 patients with drug resistant temporal lobe epilepsy (TLE) during evaluation for potential epilepsy surgery. Qualitative evaluation of the imaging data for scan quality and presence of hippocampal and temporal lobe abnormalities were scored while blinded to the clinical data. Correlation of imaging findings with the clinical data was performed. Blinded evaluation of 1.5T scans was also performed. RESULTS: On the 7T MRI findings, eight out of 13 cases demonstrated concordance with the clinically suspected TLE. Among these concordant cases, three exhibited supportive abnormal 7T MRI findings which were not detected by the clinical 1.5T MRI. Of the ten cases that progressed to epilepsy surgery, seven showed concordance between 7T MRI findings and histopathology; of these, four cases had hippocampal sclerosis. SWI had the highest concordance with the clinical and histopathological findings. Similar clinical and histopathological concordance was found with 1.5T MRI. CONCLUSIONS: There was moderate and high concordance between the 7T imaging findings with the clinical data and histopathology respectively.", "year": "2016", "journal": "Journal of the neurological sciences", "label": "surgical_outcomes_study", "P": "Patients with drug-resistant temporal lobe epilepsy (TLE) undergoing evaluation for potential epilepsy surgery", "I": "7T ultra high field MRI (T1-weighted, T2*-weighted, and susceptibility-weighted images)", "C": "1.5T MRI", "O": "Qualitative evaluation of scan quality and presence of hippocampal and temporal lobe abnormalities; concordance of 7T MRI findings with clinical data and histopathology", "N": "13"}, {"pmid": "22905734", "title": "Resection of ictal high-frequency oscillations leads to favorable surgical outcome in pediatric epilepsy.", "abstract": "PURPOSE: Intracranial electroencephalography (EEG) is performed as part of an epilepsy surgery evaluation when noninvasive tests are incongruent or the putative seizure-onset zone is near eloquent cortex. Determining the seizure-onset zone using intracranial EEG has been conventionally based on identification of specific ictal patterns with visual inspection. High-frequency oscillations (HFOs, >80 Hz) have been recognized recently as highly correlated with the epileptogenic zone. However, HFOs can be difficult to detect because of their low amplitude. Therefore, the prevalence of ictal HFOs and their role in localization of epileptogenic zone on intracranial EEG are unknown. METHODS: We identified 48 patients who underwent surgical treatment after the surgical evaluation with intracranial EEG, and 44 patients met criteria for this retrospective study. Results were not used in surgical decision making. Intracranial EEG recordings were collected with a sampling rate of 2,000 Hz. Recordings were first inspected visually to determine ictal onset and then analyzed further with time-frequency analysis. Forty-one (93%) of 44 patients had ictal HFOs determined with time-frequency analysis of intracranial EEG. KEY FINDINGS: Twenty-two (54%) of the 41 patients with ictal HFOs had complete resection of HFO regions, regardless of frequency bands. Complete resection of HFOs (n = 22) resulted in a seizure-free outcome in 18 (82%) of 22 patients, significantly higher than the seizure-free outcome with incomplete HFO resection (4/19, 21%). SIGNIFICANCE: Our study shows that ictal HFOs are commonly found with intracranial EEG in our population largely of children with cortical dysplasia, and have localizing value. The use of ictal HFOs may add more promising information compared to interictal HFOs because of the evidence of ictal propagation and followed by clinical aspect of seizures. Complete resection of HFOs is a favorable prognostic indicator for surgical outcome.", "year": "2012", "journal": "Epilepsia", "label": "surgical_outcomes_study", "P": "Pediatric epilepsy patients undergoing surgical treatment after intracranial EEG evaluation (largely children with cortical dysplasia)", "I": "Complete resection of ictal high-frequency oscillation (HFO) regions", "C": "Incomplete HFO resection", "O": "Seizure-free outcome", "N": "41 (complete resection=22, incomplete resection=19)"}, {"pmid": "18717708", "title": "Source localization of scalp-EEG interictal spikes in posterior cortex epilepsies investigated by HR-EEG and SEEG.", "abstract": "PURPOSE: To determine the validity of scalp-electroencephalography (EEG)-interictal spike (IIS) source localization in posterior cortex epilepsies (PCE). METHODS: Eleven patients with drug-resistant PCE were studied with high-resolution EEG (HR-EEG) and stereoelectroencephalography (SEEG). Sixty-four scalp channels, a realistic head model, and different algorithms [multiple signal classification (MUSIC) and equivalent current dipoles] were used. Results were compared to intracerebral SEEG recordings. For SEEG, a semiautomatic detection of intracerebral IIS was used, allowing a classification of intracerebral IIS into one of three groups: Medial, lateral, and mediolateral. RESULTS: In the medial group (two patients), scalp-EEG IIS were usually absent for one patient whereas for the other, scalp-EEG was misleading. Indeed, scalp-EEG IIS had a posterior projection, predominantly contralateral to the source. In the lateral group (two patients), scalp-EEG IIS were subcontinuous and accurately localized. In the mediolateral group (seven patients), intracerebral interictal distribution was complex and bilateral for four of seven patients. Source localizations were able to determine only a part, whether lateral or medial, of the intracerebral interictal distribution. DISCUSSION: The accuracy of scalp-EEG IIS source localization is dependant on the type of intracerebral interictal distribution. In the most frequent type of PCE, patients proved to have a complex interictal distribution between both medial and lateral cortices, and source localizations always underestimated intracerebral IIS. In cases where intracranial sources were quite focal, surface EEG sources were localized with accuracy, even in medial occipital lobe structures.", "year": "2009", "journal": "Epilepsia", "label": "surgical_outcomes_study", "P": "Eleven patients with drug-resistant posterior cortex epilepsies (PCE)", "I": "High-resolution EEG (HR-EEG) with multiple signal classification (MUSIC) and equivalent current dipoles algorithms", "C": "Stereoelectroencephalography (SEEG) recordings", "O": "Accuracy of scalp-EEG IIS source localization compared to SEEG", "N": "11"}, {"pmid": "10227649", "title": "Vagus nerve stimulation for medication-resistant generalized epilepsy. E04 VNS Study Group.", "abstract": "We treated 24 generalized epilepsy patients with vagus nerve stimulation (VNS), comparing seizure rates during a
